<body>
  <div class="pb-app" id="pb-app" data-pane="list">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn pb-narrow" id="pb-side-btn" aria-label="Visa listan med klipp" data-i18n="paste.app.pastes" data-i18n-attr="aria-label:paste.app.show_list">Klipp</button>
      <span class="pb-save" id="pb-save" role="status" aria-live="polite"></span>
      <button type="button" class="sui-btn sui-primary" id="pb-new" title="Nytt textklipp (Ctrl+Alt+N)" data-i18n="paste.app.new" data-i18n-attr="title:paste.app.new_title">Nytt klipp</button>
      <button type="button" class="sui-btn" id="pb-cmd" aria-label="Kommandon (sök bland alla kommandon)" data-i18n="paste.app.commands" data-i18n-attr="aria-label:paste.app.commands_label">Kommandon</button>
    </div>

    <section class="pb-list" aria-label="Klipp" data-i18n-attr="aria-label:paste.app.pastes">
      <div class="pb-search">
        <input type="search" id="pb-q" placeholder="Sök i rubriker och text" aria-label="Sök klipp" data-i18n-attr="placeholder:paste.app.search_ph;aria-label:paste.app.search_label">
        <button type="button" class="sui-btn" id="pb-add-img" title="Lägg till ett bildklipp" data-i18n="paste.app.image" data-i18n-attr="title:paste.app.image_title">Bild</button>
      </div>
      <div class="pb-items" id="pb-items"></div>
      <p class="pb-none" id="pb-none" hidden></p>
    </section>

    <main class="pb-main" id="pb-main">
      <p class="pb-empty" id="pb-empty" data-i18n="paste.app.empty">Klistra in text, kod eller en bild här, eller använd Nytt klipp. Varje klipp sparas i Slop Drive medan du arbetar.</p>
      <div class="pb-editor" id="pb-editor" hidden>
        <div class="pb-bar">
          <button type="button" class="sui-btn pb-narrow" id="pb-back" data-i18n="paste.app.back">Tillbaka</button>
          <button type="button" class="sui-btn" id="pb-copy" data-i18n="paste.app.copy">Kopiera</button>
          <button type="button" class="sui-btn" id="pb-download" data-i18n="paste.app.download">Ladda ned</button>
          <button type="button" class="sui-btn" id="pb-share" data-i18n="paste.app.share">Delningslänk</button>
          <button type="button" class="sui-btn pb-danger" id="pb-del" data-i18n="paste.app.trash">Släng</button>
        </div>
        <div class="pb-fields">
          <input type="text" id="pb-title" placeholder="Rubrik (valfri)" aria-label="Klippets rubrik" data-i18n-attr="placeholder:paste.app.title_ph;aria-label:paste.app.title_label">
          <label class="pb-field"><span data-i18n="paste.app.language">Språk</span><select id="pb-lang" aria-label="Språk" data-i18n-attr="aria-label:paste.app.language"></select></label>
          <label class="pb-field"><span data-i18n="paste.app.expires">Upphör</span><select id="pb-expiry" aria-label="Etikett för upphörande" data-i18n-attr="aria-label:paste.app.expiry_label"></select></label>
        </div>
        <p class="pb-meta" id="pb-meta"></p>
        <div class="pb-share" id="pb-share-box" hidden>
          <label class="pb-field"><span data-i18n="paste.app.share_local">Delningslänk (bara den här webbläsaren)</span>
            <span class="pb-linkrow"><input type="text" id="pb-link" readonly aria-label="Delningslänk" data-i18n-attr="aria-label:paste.app.share"><button type="button" class="sui-btn" id="pb-link-copy" data-i18n="paste.app.copy">Kopiera</button></span>
          </label>
        </div>
        <div class="pb-text" id="pb-text-wrap">
          <textarea id="pb-src" class="paste-catcher" spellcheck="false" aria-label="Klippets text" data-i18n-attr="aria-label:paste.app.paste_text"></textarea>
          <pre class="pb-code" data-lang="plain" id="pb-pre" aria-label="Markerad text" data-i18n-attr="aria-label:paste.app.highlighted"><code id="pb-code" class="language-plain"></code></pre>
        </div>
        <figure class="pb-image" id="pb-image-wrap" hidden>
          <img id="pb-img" alt="Inklistrad bild" data-i18n-attr="alt:paste.app.pasted_image">
        </figure>
      </div>
    </main>
  </div>
