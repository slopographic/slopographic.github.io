<body>
  <header class="ck-top">
    <a class="brand" href="/sv/" title="Slopographic start" aria-label="Slopographic start" data-i18n-attr="title:checksum.app.home;aria-label:checksum.app.home"></a>
    <h1>Checksum</h1>
  </header>
  <!-- View · Panel (shared/frame): the file and its hash; the algorithm, the hash to check and Copy hash on the right -->
  <div class="ck-frame" id="ck-frame">
  <main class="ck" id="ck-view">
    <p class="ck-lede" data-i18n="checksum.app.lede">Beräkna en fils hash, eller kontrollera den mot den hash som utgivaren har angett. Filen läses på den här enheten och laddas aldrig upp.</p>

    <section class="ck-card" aria-labelledby="ck-pick">
      <h2 id="ck-pick" data-i18n="checksum.app.step_choose">1. Välj en fil</h2>
      <button type="button" class="ck-drop" id="ck-drop" aria-describedby="ck-status">
        <span data-i18n="checksum.app.drop">Välj en fil eller släpp den här</span>
      </button>
      <p id="ck-status" class="ck-status" role="status" aria-live="polite"></p>
    </section>

    <section class="ck-card" aria-labelledby="ck-out">
      <h2 id="ck-out" data-i18n="checksum.app.step_hash">2. Hash</h2>
      <output id="ck-hash" class="ck-hash" aria-label="Filens hash" data-i18n-attr="aria-label:checksum.app.hash_label"></output>
      <p id="ck-verdict" class="ck-verdict" role="status" aria-live="polite"></p>
    </section>
  </main>
  <aside class="ck-side" id="ck-side" aria-label="Hashinställningar" data-i18n-attr="aria-label:checksum.app.settings_label">
    <div class="ck-group" data-title="Algorithm" data-key="checksum.app.algorithm">
      <label class="sf-field"><select id="ck-alg" aria-label="Algoritm" data-i18n-attr="aria-label:checksum.app.algorithm">
          <option value="SHA-256" selected>SHA-256</option>
          <option value="SHA-1">SHA-1</option>
          <option value="SHA-384">SHA-384</option>
          <option value="SHA-512">SHA-512</option>
        </select></label>
      <p class="sf-note" data-i18n="checksum.app.sha1_note">SHA-1 finns bara kvar för att matcha äldre publicerade hashar. Använd SHA-256 för nya kontroller.</p>
    </div>
    <div class="ck-group" data-title="Check against a published hash" data-key="checksum.app.check_against">
      <label class="sf-field"><span class="sf-lab" data-i18n="checksum.app.expected">Förväntad hash</span>
        <input type="text" id="ck-expect" autocomplete="off" spellcheck="false" placeholder="Klistra in hashen från nedladdningssidan" data-i18n-attr="placeholder:checksum.app.expected_ph">
      </label>
    </div>
    <button type="button" id="ck-copy" class="sui-btn sui-primary" disabled data-i18n="checksum.app.copy">Kopiera hash</button>
  </aside>
  </div>
