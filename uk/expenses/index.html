<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <button type="button" class="tb-btn" id="xMenuNew" data-cmd="expenses.new" data-i18n="expenses.page.new">Нова витрата</button>
      <button type="button" class="tb-btn" id="xMenuCsv" data-cmd="expenses.csv" data-i18n="expenses.page.csv">Завантажити CSV</button>
      <a id="xAbout" href="/uk/expenses/about/" data-i18n="biz.app.about">About</a>
      <button type="button" class="tb-btn" id="xCmd" data-cmd="cmd.palette" aria-label="Пошук команд" title="Search commands (Ctrl+K)" data-i18n-attr="aria-label:ui.cmd.search;title:biz.app.cmd_tip">⌘K</button>
    </div>

    <nav class="tabs" role="tablist" aria-label="Розділи витрат" data-i18n-attr="aria-label:expenses.page.sections">
      <button type="button" role="tab" class="tab" id="tab-list" data-view="list" aria-controls="view-list" aria-selected="true" data-i18n="expenses.app.name">Витрати</button>
      <button type="button" role="tab" class="tab" id="tab-edit" data-view="edit" aria-controls="view-edit" aria-selected="false" hidden data-i18n="expenses.page.expense">Витрата</button>
      <button type="button" role="tab" class="tab" id="tab-summary" data-view="summary" aria-controls="view-summary" aria-selected="false" data-i18n="expenses.page.summary">Підсумки</button>
    </nav>

    <main class="main" id="main">
      <span class="local-badge" title="Витрати й облік зберігаються в цьому браузері. Нічого не передається в мережу." data-i18n-attr="title:expenses.page.local_tip"><span data-i18n="biz.app.local">100% local</span></span>
      <div id="boot" class="boot" role="status" data-i18n="expenses.page.opening">Відкриваємо ваші витрати…</div>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="toolbar">
          <label class="search"><span class="sr" data-i18n="expenses.page.search">Пошук витрат</span>
            <input id="xSearch" type="search" placeholder="Пошук за постачальником, описом або примітками" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:expenses.page.search_ph"></label>
          <label><span data-i18n="expenses.page.period">Період</span> <select id="xPeriod">
            <option value="all" data-i18n="expenses.page.all_dates">Усі дати</option><option value="month" data-i18n="expenses.page.this_month">Цей місяць</option><option value="last" data-i18n="expenses.page.last_month">Минулий місяць</option><option value="year" data-i18n="expenses.page.this_year">Цей рік</option>
          </select></label>
          <label><span data-i18n="expenses.page.status">Статус</span> <select id="xStatus"><option value="all" data-i18n="expenses.page.all">Усі</option><option value="posted" data-i18n="expenses.page.recorded">Записано</option><option value="owed" data-i18n="expenses.page.to_pay">До сплати</option><option value="void" data-i18n="expenses.page.void">Анульовано</option></select></label>
          <button type="button" class="btn primary" id="xNew" data-i18n="expenses.page.new">Нова витрата</button>
          <button type="button" class="btn" id="xMileage" data-i18n="expenses.page.mileage">Пробіг…</button>
        </div>
        <div class="toolbar"><p class="note" id="xSummary" role="status"></p><span class="total" id="xTotal"></span></div>
        <div class="table" id="xRows"></div>
      </section>

      <section class="view" id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
        <div class="head-row">
          <button type="button" class="btn small" id="eBack" data-i18n="expenses.page.back">← Витрати</button>
          <h2 class="h2" id="eTitle">New expense</h2> <!-- i18n-ignore -->
        </div>
        <p class="msg" id="eMsg" role="status"></p>
        <form class="card" id="eForm" novalidate>
          <div class="toolbar receipt-row"><button type="button" class="btn" id="eReceipt" data-i18n="expenses.page.receipt">З чека…</button><span class="note" data-i18n="expenses.page.receipt_note">Сфотографуйте чек або виберіть його фото: його прочитають на цьому пристрої й збережуть у Slop Drive.</span></div>
          <div class="form-grid">
            <label><span data-i18n="expenses.page.date">Дата</span> <input id="eDate" type="date" required></label>
            <label><span data-i18n="expenses.page.supplier">Постачальник</span> <input id="eSupplier" list="eSuppliers" maxlength="200" required autocomplete="off"></label>
            <datalist id="eSuppliers"></datalist>
            <label class="wide"><span data-i18n="expenses.page.description">Опис</span> <input id="eDescription" maxlength="300" placeholder="На що витрачено" data-i18n-attr="placeholder:expenses.page.what_for"></label>
            <label><span data-i18n="expenses.page.category">Категорія</span> <select id="eAccount"></select></label>
            <label><span data-i18n="expenses.page.paid_by">Оплачено</span> <select id="eMethod"><option value="bank" data-i18n="expenses.page.bank">Банківський переказ</option><option value="card" data-i18n="expenses.page.card">Картка</option><option value="cash" data-i18n="expenses.page.cash">Готівка</option><option value="other" data-i18n="expenses.page.other">Інше</option><option value="later" data-i18n="expenses.page.later">Ще не оплачено: рахунок до сплати</option></select></label>
            <label id="eDueRow" hidden><span data-i18n="expenses.page.due">Термін оплати</span> <input id="eDue" type="date"></label>
            <label><span data-i18n="expenses.page.amount">Сплачена сума (з податком)</span> <input id="eAmount" inputmode="decimal" placeholder="24.00" required></label>
            <label><span data-i18n="expenses.page.currency">Валюта</span> <input id="eCurrency" maxlength="3" autocomplete="off" spellcheck="false"></label>
            <label><span data-i18n="expenses.page.rate">Ставка податку %</span> <input id="eRate" type="text" inputmode="decimal" maxlength="6" autocomplete="off"></label>
            <label><span data-i18n="expenses.page.tax">Податок до відшкодування</span> <input id="eTax" inputmode="decimal" placeholder="0.00"></label>
            <label class="wide"><span data-i18n="expenses.page.notes">Примітки</span> <textarea id="eNotes" rows="2" maxlength="5000"></textarea></label>
          </div>
        </form>
        <div class="card" id="eView" hidden></div>
        <div class="toolbar actions">
          <button type="button" class="btn primary" id="eRecord" data-i18n="expenses.page.record">Записати витрату</button>
          <button type="button" class="btn" id="eCopy" hidden data-i18n="expenses.page.copy">Записати копію</button>
          <button type="button" class="btn primary" id="ePay" hidden data-i18n="expenses.page.pay">Позначити як оплачене…</button>
          <button type="button" class="btn danger" id="eVoid" hidden data-i18n="expenses.page.void_dots">Анулювати…</button>
        </div>
      </section>

      <section class="view" id="view-summary" role="tabpanel" aria-labelledby="tab-summary" hidden>
        <div class="stats" id="sStats"></div>
        <div class="card table-wrap">
          <table class="months"><caption class="sr" data-i18n="expenses.page.by_month">Витрати за місяцями</caption>
            <thead><tr><th scope="col" data-i18n="expenses.page.month">Місяць</th><th scope="col" class="num" data-i18n="expenses.app.name">Витрати</th><th scope="col" class="num" data-i18n="expenses.page.total">Разом</th><th scope="col" class="num" data-i18n="expenses.page.tax_col">Податок</th><th scope="col" data-i18n="expenses.page.biggest">Найбільші категорії</th></tr></thead>
            <tbody id="sMonths"></tbody>
          </table>
          <p class="note" id="sEmpty" hidden data-i18n="expenses.page.nothing">Ще нічого не записано.</p>
          <p class="note" id="sOther"></p>
        </div>
        <div class="toolbar"><button type="button" class="btn" id="sCsv" data-i18n="expenses.page.csv_all">Завантажити CSV з усіма витратами</button></div>
      </section>
    </main>
