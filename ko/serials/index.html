<body>
  <main class="sr-app">
    <span class="local-badge" title="사진은 이 기기에서 읽습니다. 아무것도 업로드되지 않습니다." data-i18n-attr="title:serials.app.local_tip" data-i18n="serials.app.local">100% 로컬</span>
    <h1 data-i18n="serials.app.title">일련번호 카운터</h1>
    <p class="sr-lede" data-i18n="serials.app.lede">라벨 사진을 여러 장 추가하세요. 각 일련번호는 이 기기에서 읽고 한 번씩만 셉니다. 고유 일련번호 표와 합계 표가 함께 표시됩니다.</p>

    <div id="gate" class="sr-gate" aria-live="polite"></div>

    <!-- View · Panel (shared/frame): the photos and the counts; the pattern, the downloads and Read photos on the right -->
    <section id="ui" class="sr-ui" hidden>
      <div class="sr-main" id="srView">
      <button type="button" id="drop" class="sr-drop">
        <span><span data-i18n="serials.app.drop">사진을 여기에 놓거나, </span><u data-i18n="serials.app.choose">사진 선택</u></span>
      </button>

      <div id="work" class="sr-work" hidden>
        <div class="sr-bar">
          <progress id="prog" max="1" value="0" hidden></progress>
        </div>
        <p id="msg" class="sr-msg" role="status" aria-live="polite"></p>

        <h2 data-i18n="serials.app.photos">사진</h2>
        <ol id="photos" class="sr-photos"></ol>

        <h2 data-i18n="serials.app.unique">고유 일련번호</h2>
        <div class="sr-table-wrap">
          <table class="sr-table">
            <thead><tr><th data-i18n="serials.app.serial">일련번호</th><th data-i18n="serials.app.count">개수</th><th data-i18n="serials.app.photos">사진</th></tr></thead>
            <tbody id="unique"></tbody>
          </table>
        </div>
        <p id="unique-empty" class="sr-none" data-i18n="serials.app.unique_empty">아직 일련번호가 없습니다. 사진을 읽거나 사진 아래에 일련번호를 입력하세요.</p>

        <h2 data-i18n="serials.app.totals">합계</h2>
        <dl id="totals" class="sr-totals"></dl>

      </div>
      </div>
      <aside class="sr-side" id="srSide" aria-label="패턴 및 다운로드" data-i18n-attr="aria-label:serials.app.side">
        <label class="sr-pattern" id="srPattern"><span data-i18n="serials.app.pattern_label">일련번호 패턴</span>
          <input id="pattern" type="text" value="\b[A-Z]{3}\d{4}[A-Z0-9]{4}\b" spellcheck="false" autocomplete="off">
        </label>
        <button id="export-serials" type="button" data-i18n="serials.app.export_serials">일련번호 다운로드(CSV)</button>
        <button id="export-photos" type="button" data-i18n="serials.app.export_photos">사진 다운로드(CSV)</button>
        <button id="clear" type="button" data-i18n="serials.app.clear">지우기</button>
        <button id="read" type="button" data-i18n="serials.app.read">사진 읽기</button>
      </aside>
    </section>
