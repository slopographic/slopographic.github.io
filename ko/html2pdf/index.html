<body>
  <div class="h2p-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn" id="h2p-open" data-i18n="html2pdf.app.open">HTML 열기…</button>
    </div>
    <span class="local-badge" title="HTML은 이 브라우저에서 읽고 인쇄됩니다. 아무것도 업로드되지 않습니다." data-i18n-attr="title:html2pdf.app.local_tip" data-i18n="html2pdf.app.local">100% 로컬</span>

    <!-- View · Panel (shared/frame): the preview, and the options with Print at the foot of the panel on the right -->
    <div class="h2p-main" id="h2p-main">
      <aside class="h2p-side" id="h2p-side" aria-label="옵션" data-i18n-attr="aria-label:html2pdf.app.options">
        <button type="button" class="sui-btn sui-primary" id="h2p-print" disabled data-i18n="html2pdf.app.print">인쇄 또는 PDF로 저장…</button>
        <section class="h2p-group" data-title="Source" data-key="html2pdf.group.source">
          <p class="h2p-note" data-i18n="html2pdf.source.note">외부 이미지와 글꼴은 불러오지 않습니다. 파일 안의 이미지(data: 및 blob:)는 불러옵니다. 파일 옆에 있는 그림은 아래에서 파일 이름으로 첨부하세요.</p>
          <label class="h2p-field"><span data-i18n="html2pdf.source.paste">HTML 붙여넣기</span>
            <textarea class="h2p-input" id="h2p-paste" rows="5" spellcheck="false" placeholder="<h1>Paste HTML here</h1>" data-i18n-attr="placeholder:html2pdf.source.paste_ph"></textarea>
          </label>
          <button type="button" class="sui-btn" id="h2p-use-paste" data-i18n="html2pdf.source.use_paste">붙여넣은 HTML 사용</button>
          <button type="button" class="sui-btn" id="h2p-images" data-i18n="html2pdf.source.attach">로컬 이미지 첨부…</button>
          <p class="h2p-note" id="h2p-image-list">No local images attached.</p>
        </section>

        <section class="h2p-group" data-title="Paper" data-key="html2pdf.group.paper">
          <label class="h2p-field"><span data-i18n="html2pdf.paper.size">용지 크기</span>
            <select class="h2p-input" id="h2p-paper">
              <option value="A4" selected>A4</option>
              <option value="Letter">Letter</option>
              <option value="A5">A5</option>
              <option value="Legal">Legal</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.orientation">방향</span>
            <select class="h2p-input" id="h2p-orient">
              <option value="portrait" selected data-i18n="html2pdf.paper.portrait">세로</option>
              <option value="landscape" data-i18n="html2pdf.paper.landscape">가로</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.margins">여백</span>
            <select class="h2p-input" id="h2p-margin">
              <option value="normal" selected data-i18n="html2pdf.paper.normal">보통 (15mm)</option>
              <option value="narrow" data-i18n="html2pdf.paper.narrow">좁게 (6mm)</option>
              <option value="none" data-i18n="html2pdf.paper.none">없음</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.scale">배율</span>
            <select class="h2p-input" id="h2p-scale">
              <option value="fit" selected data-i18n="html2pdf.paper.fit">너비에 맞추기</option>
              <option value="100" data-i18n="html2pdf.paper.full">100%</option>
            </select>
          </label>
          <label class="h2p-check"><input type="checkbox" id="h2p-bg"> <span data-i18n="html2pdf.paper.bg">배경 그래픽</span></label>
        </section>

        <section class="h2p-group" data-title="Page header" data-key="html2pdf.group.header">
          <label class="h2p-check"><input type="checkbox" id="h2p-header" checked> <span data-i18n="html2pdf.header.show">모든 페이지에 표시</span></label>
          <label class="h2p-field"><span data-i18n="html2pdf.header.qr">QR 코드 내용</span>
            <select class="h2p-input" id="h2p-qr-mode">
              <option value="file" selected data-i18n="html2pdf.header.qr_file">파일 이름</option>
              <option value="url" data-i18n="html2pdf.header.qr_url">직접 입력한 URL</option>
              <option value="text" data-i18n="html2pdf.header.qr_text">사용자 지정 텍스트</option>
            </select>
          </label>
          <label class="h2p-field"><span id="h2p-qr-label">Custom text</span>
            <input type="text" class="h2p-input" id="h2p-qr-text" autocomplete="off" disabled>
          </label>
        </section>
      </aside>

      <main class="h2p-stage" id="h2p-stage" aria-label="미리 보기" data-i18n-attr="aria-label:html2pdf.app.preview">
        <div class="h2p-empty" id="h2p-empty">
          <h2 data-i18n="html2pdf.app.drop_title">여기에 HTML 파일을 놓으세요</h2>
          <p data-i18n="html2pdf.app.drop_text">또는 파일을 열거나 원본 아래에 HTML을 붙여넣으세요. 파일은 이 브라우저에서 읽으며 업로드되지 않습니다.</p>
          <button type="button" class="sui-btn sui-primary" id="h2p-open-empty" data-i18n="html2pdf.app.open">HTML 열기…</button>
        </div>
        <div class="h2p-paper-box" id="h2p-paper-box" hidden>
          <iframe class="h2p-paper" id="h2p-paper-frame" title="인쇄 미리 보기" data-i18n-attr="title:html2pdf.app.preview_title" sandbox="allow-same-origin"></iframe>
        </div>
      </main>
    </div>

    <p class="h2p-status" id="h2p-status" role="status" aria-live="polite"></p>
  </div>
