  <div class="wm-bar" id="wm-bar"></div>
  <main class="wm-main" id="wm-main">
    <section class="wm-files" id="wm-files" aria-label="파일" data-i18n-attr="aria-label:watermark.app.files">
      <div class="wm-list-wrap" id="wm-list-wrap" hidden>
        <p class="wm-count" id="wm-count" aria-live="polite"></p>
        <ol class="wm-list" id="wm-list" aria-label="파일" data-i18n-attr="aria-label:watermark.app.files"></ol>
      </div>
      <section class="wm-groups" id="wm-groups" aria-label="모양별 그룹" data-i18n-attr="aria-label:watermark.app.groups_label" hidden>
        <p class="wm-count" data-i18n="watermark.app.groups_intro">모양별로 묶습니다. 각 그룹은 따로 설정을 켜지 않으면 공용 워터마크를 사용합니다.</p>
        <ol class="wm-group-list" id="wm-group-list"></ol>
      </section>
    </section>

    <section class="wm-work" id="wm-work" aria-label="미리 보기" data-i18n-attr="aria-label:watermark.app.preview">
      <button type="button" class="sui-btn wm-back" id="wm-back" data-i18n="watermark.app.back">‹ 모든 파일</button>
      <div class="wm-stage" id="wm-preview-box">
        <p class="wm-preview-name" id="wm-preview-name"></p>
        <div class="wm-preview" id="wm-preview" aria-label="고른 파일의 워터마크 미리 보기" data-i18n-attr="aria-label:watermark.app.preview_label" hidden></div>
        <p class="wm-off" id="wm-off" data-i18n="watermark.app.first_here">첫 번째 파일이 워터마크와 함께 여기에 표시됩니다.</p>
      </div>
      <p class="wm-note" id="wm-preview-note" aria-live="polite"></p>
      <button type="button" class="sui-btn sui-primary wm-panel-open" id="wm-panel-open" aria-controls="wm-panel" data-i18n="watermark.app.settings_open">워터마크 설정</button>
      <div class="wm-progress" id="wm-progress" hidden>
        <progress id="wm-prog-bar" max="1" value="0"></progress>
        <span id="wm-prog-text" role="status"></span>
        <button type="button" class="sui-btn" id="wm-cancel" data-i18n="watermark.app.stop">중지</button>
      </div>
      <p class="wm-note" id="wm-run-note" role="status" aria-live="polite"></p>
      <div class="wm-drop" id="wm-drop"></div>
    </section>

    <aside class="wm-panel" id="wm-panel" aria-label="워터마크 설정" data-i18n-attr="aria-label:watermark.app.settings_open"></aside>
  </main>
  <div hidden>
    <div class="wm-settings-box" id="wm-settings-box">

      <p class="wm-fine" id="wm-saved" role="status"></p>
