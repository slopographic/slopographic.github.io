  <div class="rc-bar" id="rc-bar"></div>
  <main class="rc-main" id="rc-main">
    <section class="rc-view" id="rc-view" aria-label="녹화" data-i18n-attr="aria-label:recorder.app.view_aria">
      <div class="rc-stage" id="rc-stage">
        <video class="rc-live" id="rc-live" muted playsinline aria-label="녹화 중인 내용" data-i18n-attr="aria-label:recorder.app.live_aria" hidden></video>
        <video class="rc-play" id="rc-play" controls playsinline aria-label="녹화 파일" data-i18n-attr="aria-label:recorder.app.play_aria" hidden></video>
        <div class="rc-empty" id="rc-empty">
          <svg class="rc-empty-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="9" width="38" height="26" rx="3"/><path d="M17 41h14M24 35v6"/><circle cx="24" cy="22" r="6"/></svg>
          <p class="rc-empty-title" data-i18n="recorder.app.empty_title">화면, 웹캠 또는 마이크를 녹화하세요</p>
          <p class="rc-empty-text" data-i18n="recorder.app.empty_text">오른쪽에서 녹화할 대상을 고르고 녹화를 누르세요. 저장하기 전까지 녹화 파일은 이 기기에 남습니다.</p>
        </div>
        <div class="rc-count" id="rc-count" role="status" aria-live="assertive" hidden></div>
        <div class="rc-badge" id="rc-badge" role="timer" aria-live="off" hidden><span class="rc-dot" aria-hidden="true"></span><span id="rc-time">00:00:00</span></div>
      </div>
      <section class="rc-trim" id="rc-trim" aria-labelledby="rc-trim-h" hidden>
        <h2 id="rc-trim-h" data-i18n="recorder.app.trim">자르기</h2>
        <div class="rc-bar-wrap"><div class="rc-range" id="rc-trimbar" aria-hidden="true"></div></div>
        <div class="rc-trim-row">
          <label class="rc-trim-field"><span><span data-i18n="recorder.app.start">시작</span> <output id="rc-start-out">0:00.0</output></span>
            <input type="range" id="rc-start" min="0" max="1" step="0.1" value="0"></label>
          <label class="rc-trim-field"><span><span data-i18n="recorder.app.end">끝</span> <output id="rc-end-out">0:00.0</output></span>
            <input type="range" id="rc-end" min="0" max="1" step="0.1" value="1"></label>
        </div>
        <div class="rc-trim-acts">
          <button type="button" class="sui-btn" id="rc-start-here" data-i18n="recorder.app.start_here">재생 위치에서 시작</button>
          <button type="button" class="sui-btn" id="rc-end-here" data-i18n="recorder.app.end_here">재생 위치에서 끝</button>
          <button type="button" class="sui-btn" id="rc-trim-reset" data-i18n="recorder.app.keep_all">모두 유지</button>
          <span class="rc-kept" id="rc-kept" aria-live="polite"></span>
        </div>
      </section>
      <p class="rc-note" id="rc-note" role="status" aria-live="polite"></p>
      <button type="button" class="sui-btn sui-primary rc-panel-open" id="rc-panel-open" aria-controls="rc-panel" data-i18n="recorder.app.settings">녹화기 설정</button>
      <section class="rc-support" id="rc-support" aria-labelledby="rc-support-who">
        <h2 id="rc-support-who">What this browser can record</h2>
        <table class="rc-table"><tbody id="rc-support-rows"></tbody></table>
        <details class="rc-other">
          <summary data-i18n="recorder.support.other">다른 브라우저</summary>
          <table class="rc-table rc-grid">
            <thead><tr><th scope="col" data-i18n="recorder.support.col_browser">브라우저</th><th scope="col" data-i18n="recorder.support.col_screen">화면</th><th scope="col" data-i18n="recorder.support.col_system">화면의 소리</th><th scope="col" data-i18n="recorder.support.col_camera">웹캠과 마이크</th></tr></thead>
            <tbody id="rc-other-rows"></tbody>
          </table>
          <p class="rc-fine" data-i18n="recorder.support.fine">브라우저는 화면, 카메라 또는 마이크를 공유하기 전에 항상 묻고, 녹화 중임을 표시합니다. 아무것도 업로드되지 않습니다. 녹화는 이 기기에서 만들어져 저장됩니다.</p>
        </details>
      </section>
    </section>
    <aside class="rc-panel" id="rc-panel" aria-label="녹화기 설정" data-i18n-attr="aria-label:recorder.app.settings"></aside>
  </main>
  <div hidden>
    <div id="rc-settings">
      <div class="rc-group" data-title="Record" data-key="recorder.set.g_record">
        <div class="sf-seg rc-source" id="rc-source" role="group" aria-label="녹화 대상" data-i18n-attr="aria-label:recorder.set.source_aria">
          <button type="button" class="sui-btn" data-v="screen" aria-pressed="true" data-i18n="recorder.set.src_screen">화면</button>
          <button type="button" class="sui-btn" data-v="camera" aria-pressed="false" data-i18n="recorder.set.src_camera">웹캠</button>
          <button type="button" class="sui-btn" data-v="pip" aria-pressed="false" data-i18n="recorder.set.src_pip">화면 + 웹캠</button>
          <button type="button" class="sui-btn" data-v="mic" aria-pressed="false" data-i18n="recorder.set.src_mic">마이크</button>
        </div>
        <p class="sf-note" id="rc-source-note"></p>
      </div>
      <div class="rc-group" data-title="Sound" data-key="recorder.set.g_sound" id="rc-sound-group">
        <label class="rc-check" id="rc-sys-row"><input type="checkbox" id="rc-sys" checked> <span data-i18n="recorder.set.sys">화면이나 탭의 소리</span></label>
        <label class="rc-check" id="rc-mic-row"><input type="checkbox" id="rc-mic" checked> <span data-i18n="recorder.set.mic">마이크</span></label>
      </div>
      <div class="rc-group" data-title="Webcam" data-key="recorder.set.g_webcam" id="rc-pip">
        <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.corner">모서리</span><select id="rc-corner">
          <option value="br" data-i18n="recorder.set.br">오른쪽 아래</option><option value="bl" data-i18n="recorder.set.bl">왼쪽 아래</option><option value="tr" data-i18n="recorder.set.tr">오른쪽 위</option><option value="tl" data-i18n="recorder.set.tl">왼쪽 위</option></select></label>
        <label class="sf-field"><span class="sf-lab"><span data-i18n="recorder.set.size">크기</span> <output id="rc-size-out">25%</output></span><input type="range" id="rc-size" min="10" max="50" step="1" value="25"></label>
      </div>
      <div class="rc-group" data-title="Countdown" data-key="recorder.set.g_countdown">
        <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.before">녹화 전</span><select id="rc-countdown">
          <option value="0" data-i18n="recorder.set.cd_none">카운트다운 없음</option><option value="3" data-i18n="recorder.set.cd_3">3초</option><option value="5" data-i18n="recorder.set.cd_5">5초</option><option value="10" data-i18n="recorder.set.cd_10">10초</option></select></label>
      </div>
      <div class="rc-group" data-title="Save as" data-key="recorder.set.g_save" id="rc-save-group">
        <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.format">파일 형식</span><select id="rc-format">
          <option value="webm" data-i18n="recorder.set.fmt_webm">WebM (녹화된 그대로)</option><option value="mp4" data-i18n="recorder.set.fmt_mp4">MP4 (H.264)</option><option value="gif" data-i18n="recorder.set.fmt_gif">GIF (소리 없음)</option><option value="wav" data-i18n="recorder.set.fmt_wav">WAV (소리)</option></select></label>
        <div id="rc-gif" class="rc-gif">
          <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.gif_w">GIF 너비 (px)</span><input type="number" id="rc-gif-w" min="160" max="1920" step="10" value="640"></label>
          <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.fps">초당 프레임 수</span><input type="number" id="rc-gif-fps" min="2" max="30" step="1" value="10"></label>
        </div>
        <p class="sf-note" data-i18n="recorder.set.engine_note">MP4와 GIF는 영상 엔진으로 이 기기에서 만들며, 처음 한 번 약 32MB를 다운로드합니다.</p>
      </div>
    </div>
  </div>
