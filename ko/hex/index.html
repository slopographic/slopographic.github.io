<body>
  <div class="hx-app" id="hx-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn sui-primary" id="hx-open" title="이 컴퓨터에서 파일 열기 (Ctrl+O)" data-i18n-attr="title:hex.app.open_tip" data-i18n="hex.app.open">열기</button>
      <button type="button" class="sui-btn" id="hx-drive" title="Slop Drive에서 파일 열기" data-i18n-attr="title:hex.app.drive_tip" data-i18n="hex.app.drive">Slop Drive에서 열기</button>
      <button type="button" class="sui-btn" id="hx-save" title="Slop Drive에 새 버전 저장 (Ctrl+S)" data-i18n-attr="title:hex.app.save_tip" data-i18n="hex.app.save">버전 저장</button>
      <button type="button" class="sui-btn" id="hx-saveas" title="Slop Drive에 새 파일로 저장" data-i18n-attr="title:hex.app.saveas_tip" data-i18n="hex.app.saveas">새 파일로 저장</button>
      <button type="button" class="sui-btn" id="hx-dl" title="이 컴퓨터로 다운로드" data-i18n-attr="title:hex.app.dl_tip" data-i18n="ui.download">다운로드</button>
      <button type="button" class="sui-btn" id="hx-cmd" aria-label="명령 (모든 명령 검색)" data-i18n-attr="aria-label:hex.app.cmd_aria" data-i18n="hex.app.cmd">명령</button>
      <button type="button" class="sui-btn" id="hx-menu" aria-haspopup="menu" data-i18n="hex.app.menu">메뉴</button>
    </div>

    <div id="hx-tabs" class="doctabs-host"></div>
    <div id="hx-drop" class="hx-dropstrip"></div>

    <div class="hx-bar" role="toolbar" aria-label="이동 및 찾기" data-i18n-attr="aria-label:hex.app.bar_aria">
      <form class="hx-go" id="hx-goform">
        <input type="text" id="hx-goto" placeholder="오프셋, 예: 0x4D2" aria-label="오프셋으로 이동" data-i18n-attr="placeholder:hex.app.goto_ph;aria-label:hex.app.goto_aria" autocomplete="off" spellcheck="false">
        <button type="submit" class="sui-btn" data-i18n="hex.app.go">이동</button>
      </form>
      <form class="hx-find" id="hx-findform">
        <select id="hx-mode" aria-label="찾을 형식" data-i18n-attr="aria-label:hex.app.find_as">
          <option value="hex" data-i18n="hex.app.mode_hex">16진수 바이트</option>
          <option value="text" data-i18n="hex.app.mode_text">텍스트</option>
        </select>
        <input type="text" id="hx-q" placeholder="4D 5A 또는 텍스트" aria-label="찾기" data-i18n-attr="placeholder:hex.app.find_ph;aria-label:hex.app.find_aria" autocomplete="off" spellcheck="false">
        <button type="button" class="sui-btn" id="hx-prev" title="이전 항목 찾기 (Shift+F3)" data-i18n-attr="title:hex.app.prev_tip" data-i18n="hex.app.prev">이전</button>
        <button type="submit" class="sui-btn" id="hx-next" title="다음 항목 찾기 (F3)" data-i18n-attr="title:hex.app.next_tip" data-i18n="hex.app.next">다음</button>
      </form>
      <span class="hx-status" id="hx-status" role="status" aria-live="polite"></span>
    </div>

    <dl class="hx-info" id="hx-info" hidden>
      <div class="hx-file"><dt data-i18n="hex.app.i_file">파일</dt><dd class="hx-name" id="hx-name" aria-live="polite"></dd></div>
      <div><dt data-i18n="hex.app.i_size">크기</dt><dd id="hx-size"></dd></div>
      <div><dt data-i18n="hex.app.i_type">종류</dt><dd id="hx-type"></dd></div>
      <div class="hx-wide"><dt>SHA-256</dt><dd><span id="hx-sha" class="hx-mono"></span> <button type="button" class="sui-btn hx-mini" id="hx-sha-btn" hidden data-i18n="hex.app.recalc">다시 계산</button></dd></div>
      <div><dt data-i18n="hex.app.i_sel">선택 영역</dt><dd id="hx-sel"></dd></div>
    </dl>

    <div class="hx-body" id="hx-body">
    <main class="hx-main" id="hx-main">
      <div class="hx-empty" id="hx-empty">
        <p class="hx-empty-t" data-i18n="hex.app.empty_t">바이트를 보려면 파일을 여세요.</p>
        <p class="hx-empty-s" data-i18n="hex.app.empty_s">여기에 파일을 놓거나, 이 컴퓨터에서 열거나, Slop Drive에서 고르세요. 아무것도 업로드되지 않습니다.</p>
        <div class="hx-empty-b">
          <button type="button" class="sui-btn sui-primary" id="hx-open2" data-i18n="hex.app.open2">파일 열기</button>
          <button type="button" class="sui-btn" id="hx-drive2" data-i18n="hex.app.drive2">Slop Drive에서 열기</button>
        </div>
      </div>
      <div class="hx-scroll" id="hx-scroll" tabindex="0" role="region" aria-label="파일 바이트" data-i18n-attr="aria-label:hex.app.bytes_aria" hidden>
        <div class="hx-spacer" id="hx-spacer"></div>
        <div class="hx-rows" id="hx-rows"></div>
      </div>
    </main>
    <aside class="hx-side" id="hx-side" aria-label="검사기" data-i18n-attr="aria-label:hex.app.inspector"></aside>
    </div>
  </div>
