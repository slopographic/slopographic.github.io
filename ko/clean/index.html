  <header class="cl-top">

      <h1>SlopClean</h1><span class="cl-tag" data-i18n="clean.app.tag">메타데이터 제거 도구. 아무것도 업로드되지 않습니다.</span>

  <div class="cl-main-wrap" id="cl-frame">
    <main class="cl-view" id="cl-view">
    <section class="cl-empty" id="cl-empty" aria-label="사진 열기" data-i18n-attr="aria-label:clean.app.open_label">
      <div class="cl-drop">
        <h2 data-i18n="clean.app.drop_title">여기에 사진을 놓으세요</h2>
        <p data-i18n="clean.app.drop_formats">JPEG, PNG, WebP 또는 TIFF. 여러 장을 한꺼번에 놓을 수 있습니다. 각 사진은 이 브라우저에서 읽으며 업로드되지 않습니다.</p>
        <p class="cl-fine" data-i18n="clean.app.drop_fine">사본을 만들어 정리합니다. 원본은 절대 바뀌지 않습니다. 다운로드와 Drive 저장은 “(clean)”이라는 이름의 사본입니다. HEIC, HEIF, RAW는 지원되지 않습니다.</p>
        <button type="button" class="sui-btn sui-primary" id="cl-open-empty" data-i18n="clean.app.open">사진 열기…</button>
      </div>
    </section>
    <section class="cl-list" id="cl-list" aria-label="사진과 들어 있는 정보" data-i18n-attr="aria-label:clean.app.list_label"></section>

      <button type="button" class="sui-btn" id="cl-save-all" disabled title="사본을 만들어 정리합니다. 원본은 그대로 둡니다." data-i18n-attr="title:clean.app.copy_tip" data-i18n="clean.app.save_all">사본을 만들어 정리: Slop Drive에 저장…</button>
