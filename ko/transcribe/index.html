<body>
  <div class="smb-hold" hidden>
    <span class="local-badge" title="녹음과 파일은 이 기기에서 받아쓰기됩니다. 아무것도 업로드되지 않습니다." data-i18n-attr="title:transcribe.app.local_tip"><span data-i18n="transcribe.app.local">100% 로컬</span></span>
  </div>
  <main class="tr-app">
    <section class="tr-intro">
      <div>
        <h1 data-i18n="transcribe.app.title">음성과 오디오를 텍스트로</h1>
        <p class="tr-lede" data-i18n="transcribe.app.lede">목소리를 녹음하거나 MP3, WAV, M4A 또는 동영상 파일을 추가하세요. Whisper가 음성을 이 기기에서 텍스트로 바꿉니다. 고친 다음 텍스트, Word 또는 자막으로 저장하세요.</p>
        <div id="trSteps" class="tr-steps"></div>
      </div>
      <div id="trFlow" class="tr-flow"></div>
    </section>

    <div id="gate" class="tr-gate" aria-live="polite"></div>

    <!-- View · Panel (shared/frame): the files and the transcript; recording, the language, saving and Transcribe on the right -->
    <section id="trUi" class="tr-ui" hidden>
      <div class="tr-main" id="trView">
      <div class="tr-add">
        <div id="trDrop" class="tr-drop"></div>
        <p id="trMsg" class="tr-msg" role="status" aria-live="polite"></p>
      </div>

      <div class="tr-work">
        <section class="tr-list" aria-labelledby="trListHead">
          <div class="tr-head"><h2 id="trListHead" data-i18n="transcribe.app.files">파일</h2><span id="trCount" class="tr-count"></span><button type="button" id="trClear" data-i18n="transcribe.app.clear">지우기</button></div>
          <ol id="trFiles" class="tr-files" aria-label="받아쓸 파일" data-i18n-attr="aria-label:transcribe.app.files_aria"></ol>
          <p id="trEmpty" class="tr-empty" data-i18n="transcribe.app.empty">아직 파일이 없습니다. 위에 파일을 놓거나 녹음을 누르세요.</p>
        </section>
        <section class="tr-pane" aria-labelledby="trPaneTitle">
          <div class="tr-head"><h2 id="trPaneTitle">Transcript</h2></div>
          <p id="trPaneMeta" class="tr-meta"></p>
          <div class="tr-tools" role="toolbar" aria-label="받아쓰기" data-i18n-attr="aria-label:transcribe.app.transcript">
            <label class="tr-check"><input type="checkbox" id="trTimes"><span data-i18n="transcribe.app.times"> 시간 표시</span></label>
          </div>
          <div id="trSuggest" class="tr-suggest" aria-live="polite" hidden></div>
          <p id="trEdited" class="tr-edited" hidden><span data-i18n="transcribe.app.edited">수정한 내용은 텍스트와 Word에 유지됩니다. </span><button type="button" id="trRevert" data-i18n="transcribe.app.revert">수정 실행 취소</button></p>
          <textarea id="trText" class="tr-text" spellcheck="true" aria-label="받아쓰기 텍스트" placeholder="받아쓰기 결과가 여기에 표시됩니다." data-i18n-attr="aria-label:transcribe.app.text_aria;placeholder:transcribe.app.text_ph"></textarea>
        </section>
      </div>
      </div>
      <aside class="tr-side" id="trSide" aria-label="녹음, 언어 및 저장" data-i18n-attr="aria-label:transcribe.app.side">
        <div class="tr-controls" id="trRecGroup">
          <button type="button" id="trRecord" class="tr-rec" data-i18n="transcribe.app.record">녹음</button>
          <span id="trRecTime" class="tr-rectime" hidden>00:00:00</span>
        </div>
        <div class="tr-lang" id="trLangGroup"><span id="trLangHead" data-i18n="transcribe.app.lang">언어 및 모델</span>
          <button type="button" id="trModel" class="tr-modelbtn" aria-haspopup="dialog" aria-describedby="trLangHead">Detect automatically · Whisper tiny</button>
        </div>
        <label class="sf-field" id="trFormatField"><span class="sf-lab" data-i18n="transcribe.app.format">파일 형식</span><select id="trFormat"></select></label>
        <button type="button" id="trDownload" data-i18n="transcribe.app.download">다운로드</button>
        <button type="button" id="trCopy" data-i18n="transcribe.app.copy">복사</button>
        <button type="button" id="trDrive" data-i18n="transcribe.app.drive">Slop Drive에 저장</button>
        <button type="button" id="trDocs" data-i18n="transcribe.app.docs">Slop Docs에서 열기</button>
        <button type="button" id="trRun" class="ai-pri">Transcribe</button>
        <button type="button" id="trStop" hidden data-i18n="transcribe.app.stop">중지</button>
      </aside>
    </section>
  </main>
