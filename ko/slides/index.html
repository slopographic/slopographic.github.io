<body>
  <div class="app" id="app">
    <header class="top">
      <a class="brand" href="/ko/" title="Slopographic 홈" aria-label="Slopographic 홈" data-i18n-attr="title:slides.app.home;aria-label:slides.app.home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg>
      </a>
      <div class="appname"><b data-app-name="slides">Slop Slides</b></div>
      <label class="doc-title"><span class="sr" data-i18n="slides.app.doc_title">프레젠테이션 제목</span><input id="title" type="text" spellcheck="false" autocomplete="off" value="Untitled presentation"></label>
      <div class="tb-group">
        <button type="button" class="tb-btn" id="btnFile" aria-haspopup="menu" data-i18n="menu.file">파일</button>
        <button type="button" class="tb-btn icon" id="btnUndo" aria-label="실행 취소" data-i18n-attr="aria-label:ui.undo" disabled>&#8630;</button>
        <button type="button" class="tb-btn icon" id="btnRedo" aria-label="다시 실행" data-i18n-attr="aria-label:ui.redo" disabled>&#8631;</button>
      </div>
      <div class="tb-group tb-tools" role="toolbar" aria-label="삽입" data-i18n-attr="aria-label:slides.app.insert">
        <button type="button" class="tb-btn" id="insText" data-i18n="slides.app.ins_text">텍스트</button>
        <button type="button" class="tb-btn" id="insRect" data-i18n="slides.app.ins_rect">사각형</button>
        <button type="button" class="tb-btn" id="insEllipse" data-i18n="slides.app.ins_ellipse">타원</button>
        <button type="button" class="tb-btn" id="insImage" data-i18n="slides.app.ins_image">그림</button>
      </div>
      <div class="tb-group tb-tools">
        <label class="sel"><span data-i18n="slides.app.layout">레이아웃</span> <select id="selLayout" aria-label="이 슬라이드의 레이아웃" data-i18n-attr="aria-label:slides.app.layout_label"></select></label>
        <label class="sel"><span data-i18n="slides.app.theme">테마</span> <select id="selTheme" aria-label="테마" data-i18n-attr="aria-label:slides.app.theme"></select></label>
      </div>
      <span class="tb-flex"></span>
      <span class="save-state" id="saveState" aria-live="polite"></span>
      <button type="button" class="tb-btn primary" id="btnSave" data-i18n="menu.save">저장</button>
      <button type="button" class="tb-btn" id="btnPresent" data-i18n="slides.app.present">슬라이드쇼</button>
      <button type="button" class="tb-btn sl-phone" id="btnInspector" aria-expanded="false" data-i18n="slides.app.properties">속성</button>
      <button type="button" class="tb-btn icon" id="btnPalette" aria-label="명령 검색" title="명령 검색" data-i18n-attr="aria-label:slides.app.search_cmds;title:slides.app.search_cmds" hidden>&#8984;K</button>
    </header>
    <div id="tabs" class="doctabs-host"></div>

    <div class="body">
      <aside class="slides-pane" aria-label="슬라이드" data-i18n-attr="aria-label:slides.app.slides">
        <ul class="slides-list" id="slides-list" aria-label="슬라이드" data-i18n-attr="aria-label:slides.app.slides"></ul>
        <div class="slide-tools" role="toolbar" aria-label="슬라이드 작업" data-i18n-attr="aria-label:slides.app.slide_actions">
          <button type="button" id="slNew" title="새 슬라이드" data-i18n-attr="title:slides.app.new_slide" data-i18n="slides.app.new_slide_short">+ 슬라이드</button>
          <button type="button" id="slDup" title="슬라이드 복제" data-i18n-attr="title:slides.app.dup_slide" data-i18n="ui.duplicate">복제</button>
          <button type="button" id="slDel" title="슬라이드 삭제" data-i18n-attr="title:slides.app.del_slide" data-i18n="ui.delete">삭제</button>
          <button type="button" id="slUp" title="슬라이드를 위로 이동" aria-label="슬라이드를 위로 이동" data-i18n-attr="title:slides.app.slide_up;aria-label:slides.app.slide_up">&#8593;</button>
          <button type="button" id="slDown" title="슬라이드를 아래로 이동" aria-label="슬라이드를 아래로 이동" data-i18n-attr="title:slides.app.slide_down;aria-label:slides.app.slide_down">&#8595;</button>
        </div>
      </aside>

      <main class="stage" id="stage" aria-label="슬라이드" data-i18n-attr="aria-label:slides.app.slide">
        <canvas id="canvas" tabindex="0" role="img" aria-label="현재 슬라이드" data-i18n-attr="aria-label:slides.app.current_slide"></canvas>
        <textarea id="editor" class="editor" hidden aria-label="텍스트 편집" data-i18n-attr="aria-label:slides.app.edit_text" spellcheck="true"></textarea>
        <div class="ss-drop" id="ssDrop"></div>
      </main>

      <aside class="inspector" id="inspector" aria-label="속성" data-i18n-attr="aria-label:slides.app.properties"></aside>
    </div>

    <footer class="status">
      <span id="statusSlide"></span>
      <span id="statusSel"></span>
      <span class="tb-flex"></span>
      <span class="local" data-i18n="slides.app.local">이 브라우저에만 저장됩니다. 아무것도 업로드되지 않습니다.</span>
    </footer>
  </div>
