<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="/ko/" title="Slopographic 홈" aria-label="Slopographic 홈" data-i18n-attr="title:img3d.app.home;aria-label:img3d.app.home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a>
      <span class="appname"><b data-app-name="img3d">Slop Image to 3D</b></span>
      <div class="actions">
        <button type="button" class="tb-btn" id="btnOpen" title="디스크에서 사진 열기" data-i18n-attr="title:img3d.app.open_tip" data-i18n="img3d.app.open">이미지 열기…</button>
        <button type="button" class="tb-btn" id="btnDrive" data-i18n="img3d.app.drive">Slop Drive에서…</button>
      </div>
    </header>
    <!-- View · Panel (shared/frame): the 3D view, and the settings with Open in Slop 3D at the panel's foot on the right -->
    <div class="work" id="work">
      <aside class="panel" id="panel" aria-label="설정" data-i18n-attr="aria-label:img3d.app.settings">
        <section class="i3-group" data-title="Picture" data-key="img3d.group.picture">
          <p class="meta" id="picName">No picture yet. Open one, drop one here, or take one from Slop Drive.</p>
        </section>
        <section class="i3-group" data-title="Depth" data-key="img3d.group.depth">
          <p class="meta" id="depthNote"></p>
          <label class="row"><input type="checkbox" id="invert"> <span data-i18n="img3d.depth.invert">깊이 반전 (먼 곳이 가까워짐)</span></label>
          <button type="button" class="sui-btn i3-more" id="btnMore" data-i18n="img3d.depth.more">더 받기…</button>
        </section>
        <section class="i3-group" data-title="Subject" data-key="img3d.group.subject">
          <label class="row"><input type="checkbox" id="subject"> <span data-i18n="img3d.subject.only">피사체만 (배경 제거)</span></label>
          <p class="meta" id="subjectNote" data-i18n="img3d.subject.note">배경 제거 도구(SlopIsolate의 고품질 모델, 기기에서 실행)를 사용합니다.</p>
        </section>
        <section class="i3-group" data-title="Output" data-key="img3d.group.output">
          <label class="row"><span data-i18n="img3d.out.show_as">표시 방식</span>
            <select id="mode">
              <option value="mesh" data-i18n="img3d.out.mesh">높이 필드 메시</option>
              <option value="points" data-i18n="img3d.out.points">점 구름</option>
              <option value="splats" data-i18n="img3d.out.splats">스플랫</option>
            </select>
          </label>
          <label class="row"><span data-i18n="img3d.out.resolution">해상도</span>
            <select id="grid">
              <option value="64">64</option><option value="128" selected>128</option><option value="192">192</option><option value="256">256</option>
            </select>
          </label>
          <label class="row"><span data-i18n="img3d.out.scale">깊이 배율</span> <output id="scaleVal">0.30</output>
            <input type="range" id="scale" min="0" max="1" step="0.01" value="0.3"></label>
          <label class="row"><span data-i18n="img3d.out.smoothing">매끄럽게</span> <output id="smoothVal">2</output>
            <input type="range" id="smooth" min="0" max="8" step="1" value="2"></label>
          <label class="row"><span data-i18n="img3d.out.size">점 크기</span> <output id="sizeVal">1.0</output>
            <input type="range" id="size" min="0.3" max="3" step="0.1" value="1"></label>
        </section>
        <button type="button" class="tb-btn" id="btnObj" disabled data-i18n="img3d.btn.obj">OBJ 내보내기</button>
        <button type="button" class="tb-btn" id="btnGlb" disabled data-i18n="img3d.btn.glb">GLB 내보내기</button>
        <button type="button" class="btn primary" id="btnSend" disabled data-i18n="img3d.btn.send">Slop 3D에서 열기</button>
        <section class="i3-group" data-title="Controls" data-key="img3d.group.controls">
          <p class="meta" data-i18n="img3d.controls.help">드래그하면 회전합니다. 오른쪽 드래그 또는 Shift 드래그로 이동합니다. 휠로 확대하거나 축소합니다. 더블클릭하면 화면에 맞춥니다.</p>
        </section>
      </aside>
      <main class="stage" id="stage">
        <div id="vp" class="vp"><p class="hint" id="hint" data-i18n="img3d.stage.hint">여기에 사진을 놓거나 사진을 여세요.</p></div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </main>
