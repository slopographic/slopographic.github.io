<body>
  <div class="nt-app" id="nt-app" data-pane="list">
    <div class="nt-top">
    <div id="nt-tabs" class="doctabs-host"></div>
    <span class="nt-save" id="nt-save" role="status" aria-live="polite"></span>
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn nt-narrow" id="nt-side-btn" aria-label="노트북 보기" data-i18n-attr="aria-label:notes.app.show_books" data-i18n="notes.app.notebooks">노트북</button>
      <button type="button" class="sui-btn sui-primary" id="nt-new" title="새 메모(Ctrl+Alt+N)" data-i18n-attr="title:notes.app.new_tip" data-i18n="notes.app.new_note">새 메모</button>
      <button type="button" class="sui-btn nt-cmd" id="nt-cmd" aria-label="명령(모든 명령 검색)" data-i18n-attr="aria-label:notes.app.cmd_aria" data-i18n="notes.app.cmd">명령</button>
    </div>
    </div>


    <aside class="nt-side" id="nt-side" aria-label="노트북" data-i18n-attr="aria-label:notes.app.notebooks">
      <div class="nt-head"><span data-i18n="notes.app.notebooks">노트북</span><button type="button" class="sui-btn nt-mini" id="nt-nb-new" data-i18n="notes.app.new">새로 만들기</button></div>
      <div class="nt-books" id="nt-books"></div>
      <div class="nt-head"><span data-i18n="notes.app.folders">폴더</span><button type="button" class="sui-btn nt-mini" id="nt-fd-new" data-i18n="notes.app.new">새로 만들기</button></div>
      <div class="nt-folders" id="nt-folders"></div>
      <div class="nt-head"><span data-i18n="notes.app.tags">태그</span></div>
      <div class="nt-tags" id="nt-tags"></div>
    </aside>

    <section class="nt-list" id="nt-list" aria-label="메모" data-i18n-attr="aria-label:notes.app.notes">
      <div class="nt-search"><input type="search" id="nt-q" placeholder="제목, 본문, 태그 검색" aria-label="메모 검색" data-i18n-attr="placeholder:notes.app.search_ph;aria-label:notes.app.search_aria"></div>
      <p class="nt-crumb" id="nt-crumb"></p>
      <div class="nt-notes" id="nt-notes"></div>
      <p class="nt-none" id="nt-none" hidden></p>
    </section>

    <main class="nt-main" id="nt-main">
      <p class="nt-empty" id="nt-empty-note" data-i18n="notes.app.empty">메모를 고르거나 새 메모로 시작하세요.</p>
      <div class="nt-editor" id="nt-note" hidden>
        <div class="nt-bar">
          <button type="button" class="sui-btn nt-narrow" id="nt-back" data-i18n="ui.back">뒤로</button>
          <button type="button" class="sui-btn" id="nt-pin">Pin</button><!-- i18n-ignore: js/editor.js writes Pin or Unpin -->
          <div class="nt-seg" role="group" aria-label="보기" data-i18n-attr="aria-label:menu.view">
            <button type="button" class="sui-btn" data-mode="write" data-i18n="notes.app.write">쓰기</button>
            <button type="button" class="sui-btn" data-mode="split" data-i18n="notes.app.split">나누어 보기</button>
            <button type="button" class="sui-btn" data-mode="preview" data-i18n="notes.app.preview">미리 보기</button>
          </div>
          <button type="button" class="sui-btn" id="nt-insert" aria-haspopup="menu" title="제목, 표, 동영상 링크, 사진, 코드 블록, 체크리스트, 인용, 구분선, 강조 상자 또는 링크 삽입" data-i18n-attr="title:notes.app.insert_tip" data-i18n="notes.app.insert">블록 삽입</button>
          <button type="button" class="sui-btn" id="nt-export" aria-haspopup="menu" data-i18n="menu.export">내보내기</button>
          <button type="button" class="sui-btn nt-danger" id="nt-del" data-i18n="notes.app.trash">휴지통</button>
        </div>
        <input type="text" class="nt-title" id="nt-title" placeholder="제목 없음" aria-label="메모 제목" data-i18n-attr="placeholder:ui.untitled;aria-label:notes.app.title_aria">
        <input type="text" class="nt-tagsin" id="nt-tags-in" placeholder="쉼표로 구분한 태그" aria-label="태그" data-i18n-attr="placeholder:notes.app.tags_ph;aria-label:notes.app.tags">
        <div class="nt-panes" id="nt-panes" data-mode="split">
          <textarea class="nt-body" id="nt-body" spellcheck="true" aria-label="Markdown 원본" data-i18n-attr="aria-label:notes.app.source_aria"></textarea>
          <article class="nt-preview md" id="nt-preview" aria-label="미리 보기" data-i18n-attr="aria-label:notes.app.preview"></article>
        </div>
      </div>
    </main>
  </div>
