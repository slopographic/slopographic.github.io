<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Transcribe: transcript formats, the queue, the exports and the recorder</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="../../shared/profile/profile.js"></script>
  <script src="../../shared/i18n/i18n.js"></script>
  <script src="../../aitools/transcript.js"></script>
  <script type="module">
  // Covers: aitools/transcript.js, transcribe/js/languages.js, transcribe/js/queue.js, transcribe/js/exports.js, transcribe/js/record.js
  import { createQueue, isMedia, MAX_SECONDS } from '../../transcribe/js/queue.js';
  import { fileOf, textOf, stem, FORMATS } from '../../transcribe/js/exports.js';
  import { createRecorder, recordingName, micReason } from '../../transcribe/js/record.js';
  import { LANGUAGES, languageName, fillLanguages } from '../../transcribe/js/languages.js';
  import { readZip, readText } from '../../shared/office/zip.js';
  const { describe, it, expect, waitFor, run } = SlopTest;
  const X = window.SlopTranscript;
  const SEGS = [{ start: 0, end: 2.5, text: ' Hello there.' }, { start: 3, end: 5.25, text: 'This is a test.' }, { start: 9, end: 61.5, text: 'After a pause. ' }, { start: 62, end: 63, text: '  ' }];
  const file = (name, type, size = 10) => new File([new Uint8Array(size)], name, { type });

  describe('transcript formats (aitools/transcript.js)', () => {
    it('stamps times for SRT and WebVTT, and a clock for reading', () => {
      expect(X.stamp(3725.5)).toBe('01:02:05,500');
      expect(X.stamp(1.0004, '.')).toBe('00:00:01.000');
      expect(X.stamp(-3)).toBe('00:00:00,000');
      expect(X.clock(61.9)).toBe('00:01:01');
    });
    it('text, SRT and WebVTT leave empty segments out and trim the text', () => {
      expect(X.txt(SEGS)).toBe('Hello there.\nThis is a test.\nAfter a pause.');
      expect(X.txt(SEGS, { times: true }).split('\n')[2]).toBe('[00:00:09] After a pause.');
      expect(X.srt(SEGS).split('\n').slice(0, 4)).toEqual(['1', '00:00:00,000 --> 00:00:02,500', 'Hello there.', '']);
      expect(X.vtt(SEGS).startsWith('WEBVTT\n\n00:00:00.000 --> 00:00:02.500\nHello there.\n')).toBe(true);
    });
    it('joins segments into paragraphs at pauses longer than two seconds, and counts words', () => {
      expect(X.paragraphs(SEGS).map((p) => p.text)).toEqual(['Hello there. This is a test.', 'After a pause.']);
      expect(X.words(' one two\nthree ')).toBe(3);
      const blocks = X.docxBlocks('Call', SEGS, { meta: 'call.mp3', times: true });
      expect(blocks[0]).toEqual({ type: 'heading', level: 1, text: 'Call' });
      expect(blocks[2].runs[0].text).toBe('[00:00:00] ');
    });
  });

  describe('the queue (queue.js, with a fake engine)', () => {
    const fake = (over = {}) => ({ prepare: async () => {}, samples: async (f) => new Float32Array(f.size), transcribe: async (s, lang, prog) => { prog({ done: 1, total: 1 }); return { segments: [{ start: 0, end: 1, text: `${s.length} at ${lang}` }], language: lang === 'auto' ? 'en' : lang }; }, ...over });
    it('takes audio and video by type or by name, not other files', () => {
      expect(isMedia(file('a.mp3', 'audio/mpeg'))).toBe(true);
      expect(isMedia(file('clip.mov', ''))).toBe(true);
      expect(isMedia(file('notes.txt', 'text/plain'))).toBe(false);
      const q = createQueue({ engine: fake() });
      expect(q.add([file('a.mp3', 'audio/mpeg'), file('b.pdf', 'application/pdf'), file('c.webm', 'video/webm')]).map((x) => x.name)).toEqual(['a.mp3', 'c.webm']);
    });
    it('reads every file in turn; a file that fails says why and the rest go on; a second run retries only it', async () => {
      const q = createQueue({ engine: fake() });
      q.add([file('a.mp3', 'audio/mpeg', 32000), file('tiny.wav', 'audio/wav', 100), file('b.mp3', 'audio/mpeg', 48000)]);
      await q.run({ language: 'sv' });
      expect(q.items.map((x) => x.status)).toEqual(['done', 'error', 'done']);
      expect(q.items[0].segments[0].text).toBe('32000 at sv');
      expect([q.items[0].seconds, q.items[0].language]).toEqual([2, 'sv']);
      expect(q.items[1].error).toContain('too short');
      let calls = 0;
      const q2 = createQueue({ engine: fake({ samples: async () => { calls++; return new Float32Array(MAX_SECONDS * 16000 + 16000); } }) });
      q2.add([file('long.mp3', 'audio/mpeg')]);
      await q2.run({});
      expect(q2.items[0].error).toContain('longer than 2 hours');
      await q2.run({});
      expect(calls).toBe(2);
    });
    it('stop ends after the current file; edits are kept and cleared; clear waits until it is idle', async () => {
      let release;
      const gate = new Promise((r) => { release = r; });
      const q = createQueue({ engine: fake({ transcribe: async () => { await gate; return { segments: [{ start: 0, end: 1, text: 'x' }], language: 'en' }; } }) });
      q.add([file('a.mp3', 'audio/mpeg', 16000), file('b.mp3', 'audio/mpeg', 16000)]);
      const running = q.run({});
      await waitFor(() => q.items[0].status === 'reading');
      expect(q.busy).toBe(true);
      expect(q.clear()).toBe(false);
      expect(q.remove(q.items[0].id)).toBe(false);
      q.stop(); release(); await running;
      expect(q.items.map((x) => x.status)).toEqual(['done', 'waiting']);
      q.edit(q.items[0].id, 'Fixed text');
      expect(textOf(q.items[0])).toBe('Fixed text');
      q.edit(q.items[0].id, null);
      expect(textOf(q.items[0])).toBe('x');
      expect(q.clear()).toBe(true);
    });
  });

  describe('exports (exports.js)', () => {
    const item = { name: 'Board call.mp3', segments: SEGS, seconds: 63, language: 'en', text: null };
    it('names each file after its source, in every format', async () => {
      expect(FORMATS.map((f) => f.id)).toEqual(['txt', 'docx', 'srt', 'vtt']);
      expect(stem('a.b.mp3')).toBe('a.b');
      const srt = await fileOf(item, 'srt');
      expect(srt.name).toBe('Board call.srt');
      expect((await srt.blob.text()).startsWith('1\n00:00:00,000')).toBe(true);
      expect((await (await fileOf(item, 'vtt')).blob.text()).startsWith('WEBVTT')).toBe(true);
      expect(await (await fileOf(item, 'txt', { times: true })).blob.text()).toBe(X.txt(SEGS, { times: true }));
    });
    it('Text and Word take the corrections; Word is a real .docx with the paragraphs', async () => {
      const fixed = { ...item, text: 'Hello, everyone.\n\nThis is the fixed line.' };
      expect(await (await fileOf(fixed, 'txt')).blob.text()).toBe(fixed.text);
      const d = await fileOf(fixed, 'docx');
      expect(d.name).toBe('Board call.docx');
      const doc = readText(await readZip(new Uint8Array(await d.blob.arrayBuffer())), 'word/document.xml');
      expect(doc.includes('This is the fixed line.')).toBe(true);
      const plain = readText(await readZip(new Uint8Array(await (await fileOf(item, 'docx')).blob.arrayBuffer())), 'word/document.xml');
      expect(plain.includes('Hello there. This is a test.')).toBe(true);
    });
  });

  describe('the recorder (record.js, with a fake microphone)', () => {
    class FakeRec { constructor() { this.mimeType = 'audio/webm;codecs=opus'; } start() { setTimeout(() => this.ondataavailable({ data: new Blob(['abc']) }), 5); } stop() { setTimeout(() => this.onstop(), 10); } }
    const tracks = [];
    const media = { getUserMedia: async () => ({ getTracks: () => [{ stop: () => tracks.push('stopped') }] }) };
    it('records to a named .webm file and lets the microphone go', async () => {
      const r = createRecorder({ media, Recorder: FakeRec });
      await r.start();
      expect(r.recording).toBe(true);
      await new Promise((res) => setTimeout(res, 20));
      const f = await r.stop();
      expect(f.type).toBe('audio/webm');
      expect(/^Recording \d{4}-\d{2}-\d{2} \d{2}\.\d{2}\.webm$/.test(f.name)).toBe(true);
      expect(f.size).toBe(3);
      expect(tracks).toEqual(['stopped']);
      expect(r.recording).toBe(false);
    });
    it('says plainly why the microphone did not start', async () => {
      const r = createRecorder({ media: { getUserMedia: async () => { throw Object.assign(new Error('x'), { name: 'NotAllowedError' }); } }, Recorder: FakeRec });
      let msg = '';
      try { await r.start(); } catch (e) { msg = e.message; }
      expect(msg).toContain('blocked');
      expect(micReason({ name: 'NotFoundError' })).toBe('No microphone was found.');
      expect(recordingName(new Date(2026, 9, 24, 9, 5), 'ogg')).toBe('Recording 2026-10-24 09.05.ogg');
    });
  });
  describe('the spoken languages (languages.js)', () => {
    it('lists all 99 Whisper languages once, sorted by English name, each a Whisper token code', () => {
      expect(LANGUAGES.length).toBe(99);
      expect(new Set(LANGUAGES.map((l) => l.code)).size).toBe(99);
      const names = LANGUAGES.map((l) => l.name);
      expect(names).toEqual([...names].sort((a, b) => a.localeCompare(b, 'en')));
      // speech-engine.js finds the language tokens as <|xx|> or <|xxx|> between <|startoftranscript|> and <|transcribe|>
      expect(LANGUAGES.every((l) => /^[a-z]{2,3}$/.test(l.code))).toBe(true);
      const codes = LANGUAGES.map((l) => l.code);
      for (const c of ['en', 'sv', 'haw', 'jw', 'yo', 'ln', 'su']) expect(codes.includes(c)).toBe(true);
      expect(codes.includes('jv')).toBe(false);   // Whisper's Javanese token is jw
    });
    it('names a code in English; Detect is auto; the menu has Detect first and keeps a known choice', () => {
      expect([languageName('sv'), languageName('haw'), languageName('auto'), languageName('xx')]).toEqual(['Swedish', 'Hawaiian', 'Detect automatically', 'xx']);
      const sel = fillLanguages(document.createElement('select'));
      expect(sel.options.length).toBe(100);
      expect([sel.options[0].value, sel.options[0].textContent, sel.value]).toEqual(['auto', 'Detect automatically', 'auto']);
      expect(sel.options[1].textContent).toBe('Afrikaans');
      expect(fillLanguages(sel, 'fo').value).toBe('fo');
      expect(fillLanguages(sel, 'nope').value).toBe('auto');
    });
  });
  run();
  </script>
</body>
</html>
