<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Docs outline on a phone (390 px): a SlopSheet drawer</title>
  <style>body { margin: 0; } iframe { width: 390px; height: 844px; border: 0; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  // Covers: docs/js/ui/outline.js (the phone drawer), shared/ui/sheet.js
  const { describe, it, expect, waitFor } = SlopTest;
  let win, doc;
  const $ = (sel) => doc.querySelector(sel);
  const open = () => $('.ol-panel').classList.contains('ssh-on');
  const esc = () => doc.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));

  describe('Slop Docs outline at 390 px', () => {
    it('the rail button opens the outline as a drawer from the left, and closes it again', async () => {
      const frame = document.createElement('iframe');
      const loaded = new Promise((res) => frame.addEventListener('load', res, { once: true }));
      frame.src = '../../docs/index.html';
      document.body.append(frame);
      await loaded;
      win = frame.contentWindow; doc = frame.contentDocument;
      await waitFor(() => win.SlopDocs && win.SlopDocs.ready && $('.ol-show') && $('.ol-panel .ssh-x'), { timeout: 15000 });
      doc.head.append(Object.assign(doc.createElement('style'), { textContent: '* { transition: none !important; }' }));   // an offscreen frame stalls them
      const btn = $('.ol-show');
      expect([open(), btn.getBoundingClientRect().width > 0, doc.documentElement.scrollWidth <= 390]).toEqual([false, true, true]);
      btn.click();
      const r = $('.ol-panel').getBoundingClientRect();
      expect([open(), btn.getAttribute('aria-expanded'), Math.round(r.left), r.width <= 320]).toEqual([true, 'true', 0, true]);
      expect(win.getComputedStyle($('.ol-hide')).display).toBe('none');   // the × is the one close
      btn.click();
      expect([open(), btn.getAttribute('aria-expanded')]).toEqual([false, 'false']);
    });
    it('the × closes it and gives focus back to the rail button; Escape and a tap outside close it', async () => {
      const btn = $('.ol-show');
      btn.focus(); btn.click();
      const x = $('.ol-panel > .ssh-x');
      expect(x.getAttribute('aria-label')).toBe('Close outline');
      x.click();
      expect([open(), doc.activeElement]).toEqual([false, btn]);
      btn.click(); esc();
      expect(open()).toBe(false);
      btn.click(); $('#stage').dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true }));
      expect(open()).toBe(false);
    });
    it('Ctrl+Shift+O (the outline command) opens and closes the drawer too', async () => {
      win.SlopCmd.run('outline.toggle');
      expect(open()).toBe(true);
      win.SlopCmd.run('outline.toggle');
      expect(open()).toBe(false);
    });
  });
  SlopTest.run({ name: 'Slop Docs outline: phone' });
  </script>
</body>
</html>
