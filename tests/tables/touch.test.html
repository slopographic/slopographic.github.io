<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="slop-test-touch">
  <title>Slop Tables touch</title>
  <style>body { margin: 0; background: #111; } iframe { width: 100vw; height: 100vh; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script src="../shared/touch-kit.js"></script>
  <script src="tables.helpers.js"></script>
  <script>
  /* Slop Tables with a finger, as a phone's spreadsheet: a tap selects a cell, a double tap edits it, a drag on the
     cells scrolls them (and never moves the selection), the knob at the selection's corner extends it, a long press
     opens the cell menu.
     Covers: tables/js/ui/pointer.js, tables/js/ui/ctxmenu.js (a long press or right-click on the drawn cells finds the cell), tables/js/ui/grid.js, tables/js/ui/charts.js (chart boxes are touch surfaces) */
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  let T, D;
  const sel = () => T.S.sel;

  describe('Slop Tables on touch', () => {
    it('boots with the touch layer', async () => {
      await TB.boot();
      T = TB.T; D = TB.doc;
      await waitFor(() => TB.win.SlopTouch && TB.win.SlopTouch.ready, { timeout: 15000 });
      for (let r = 1; r <= 60; r++) for (const c of 'ABCDEF') T.setCell(c + r, c + r); // every cell drawn, so each has an element
      T.select('A1');
      await sleep(300);
    });
    it('a tap selects a cell', async () => {
      await TouchKit.tap(T.el('C3'));
      await waitFor(() => sel().r === 2 && sel().c === 2 && sel().er === 2 && sel().ec === 2, { timeout: 3000 });
      await sleep(500);
    });
    it('a double tap edits the cell', async () => {
      await TouchKit.doubleTap(T.el('D4'));
      await waitFor(() => !!T.S.edit, { timeout: 3000 });
      expect(sel().r).toBe(3);
      expect(D.getElementById('editor').hidden).toBe(false);
      D.getElementById('editor').dispatchEvent(new TB.win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await waitFor(() => !T.S.edit, { timeout: 3000 });
      await sleep(500);
    });
    it('a drag on the cells does not move the selection (it is a scroll; a real finger scrolls the grid)', async () => {
      T.select('B2');
      const vp = D.getElementById('vp'), top0 = vp.scrollTop;
      await TouchKit.drag(T.el('C8'), 0, -160, 10);
      await sleep(300);
      expect([sel().r, sel().c, sel().er, sel().ec]).toEqual([1, 1, 1, 1]);
      if (TouchKit.real) expect(vp.scrollTop).toBeGreaterThan(top0);
      vp.scrollTop = 0;
      await sleep(300);
    });
    it('the knob at the selection\'s corner extends it, and takes a finger (a touch surface, 44 px)', async () => {
      T.select('B2');
      const knob = D.getElementById('selknob');
      D.querySelector('.grid') && D.querySelector('.grid').classList.add('touching');
      await sleep(100);
      expect(TB.win.getComputedStyle(knob).touchAction).toBe('none');
      const k = knob.getBoundingClientRect(), target = T.el('D5').getBoundingClientRect();
      await TouchKit.drag(knob, target.left + target.width / 2 - (k.left + k.width / 2), target.top + target.height / 2 - (k.top + k.height / 2), 10);
      await waitFor(() => sel().er === 4 && sel().ec === 3, { timeout: 3000 });
      expect([sel().r, sel().c]).toEqual([1, 1]);
      await sleep(500);
    });
    it('a long press opens the cell menu, and the lift picks nothing', async () => {
      const v = T.value('A5');
      await TouchKit.longPress(T.el('A5'));
      await waitFor(() => D.querySelector('.sui-menu'), { timeout: 3000 });
      await sleep(250);
      expect(!!D.querySelector('.sui-menu')).toBe(true);
      expect(T.value('A5')).toBe(v);
      TB.win.SlopUI.closeMenu();
    });
  });
  SlopTest.run({ name: 'Slop Tables touch' });
  </script>
</body>
</html>
