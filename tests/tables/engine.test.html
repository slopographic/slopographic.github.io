<!doctype html>
<html><head><meta charset="utf-8"><title>Slop Tables engine</title></head>
<body>
<script src="../harness.js"></script>
<script type="module">
import { Workbook, format, fnNames } from '../../tables/js/engine/index.js';
const { describe, it, expect } = SlopTest;
const calc = (f, setup) => { const wb = new Workbook(); const s = wb.sheets[0]; if (setup) setup(wb, s); wb.input(s, 50, 50, f); return s.value(50, 50); };
const code = (v) => (v && v.code) || v;
describe('parser and operators', () => {
  it('precedence', () => { expect(calc('=1+2*3')).toBe(7); expect(calc('=-2^2')).toBe(4); expect(calc('=2^3^2')).toBe(64); expect(calc('=50%*2')).toBe(1); expect(calc('="a"&1+1')).toBe('a2'); expect(calc('=1+2>2')).toBe(true); });
  it('errors', () => { expect(code(calc('=1/0'))).toBe('#DIV/0!'); expect(code(calc('=FOO(1)'))).toBe('#NAME?'); expect(code(calc('="a"+1'))).toBe('#VALUE!'); });
  it('array literals spill', () => { const wb = new Workbook(), s = wb.sheets[0]; wb.input(s, 0, 0, '={1,2;3,4}'); expect(s.value(1, 1)).toBe(4); });
});
describe('recalc', () => {
  it('incremental and cycles', () => {
    const wb = new Workbook(), s = wb.sheets[0];
    wb.input(s, 0, 0, '5'); wb.input(s, 1, 0, '=A1*2'); wb.input(s, 2, 0, '=SUM(A1:A2)');
    expect(s.value(2, 0)).toBe(15); wb.input(s, 0, 0, '10'); expect(s.value(2, 0)).toBe(30);
    wb.input(s, 0, 1, '=B2'); wb.input(s, 1, 1, '=B1'); expect(code(s.value(0, 1))).toBe('#CIRC!');
  });
  it('spill blocked', () => { const wb = new Workbook(), s = wb.sheets[0]; wb.input(s, 0, 0, '={1;2}'); wb.input(s, 1, 0, 'x'); expect(code(s.value(0, 0))).toBe('#SPILL!'); });
});
describe('functions', () => {
  it('has a large library', () => expect(fnNames().length).toBeGreaterThan(300));
  it('math/stats', () => { expect(calc('=ROUND(2.345,2)')).toBe(2.35); expect(calc('=MEDIAN(1,3,2,4)')).toBe(2.5); expect(calc('=STDEV(2,4,4,4,5,5,7,9)')).toBeCloseTo(2.13809, 1e-5); expect(calc('=PERCENTILE({1,2,3,4},0.25)')).toBe(1.75); });
  it('logic/text', () => { expect(calc('=IF(1>2,"a","b")')).toBe('b'); expect(calc('=LET(x,2,x*3)')).toBe(6); expect(calc('=LAMBDA(x,x+1)(4)')).toBe(5); expect(calc('=TEXTJOIN("-",TRUE,"a","","b")')).toBe('a-b'); expect(calc('=TEXT(1234.5,"#,##0.00")')).toBe('1,234.50'); });
  it('dates', () => { expect(calc('=DATE(2024,1,31)')).toBe(45322); expect(calc('=EOMONTH(DATE(2024,1,15),1)')).toBe(45351); expect(calc('=DATEDIF(DATE(2020,1,1),DATE(2024,6,1),"Y")')).toBe(4); });
  it('lookup', () => {
    const setup = (wb, s) => { ['a', 'b', 'c'].forEach((k, i) => { wb.input(s, i, 0, k); wb.input(s, i, 1, String(i * 10)); }); };
    expect(calc('=VLOOKUP("b",A1:B3,2,FALSE)', setup)).toBe(10); expect(calc('=XLOOKUP("c",A1:A3,B1:B3)', setup)).toBe(20); expect(calc('=INDEX(B1:B3,MATCH("c",A1:A3,0))', setup)).toBe(20);
  });
});
describe('number formats', () => {
  it('formats', () => { expect(format(1234.567, '#,##0.00').text).toBe('1,234.57'); expect(format(0.256, '0.0%').text).toBe('25.6%'); expect(format(45292, 'yyyy-mm-dd').text).toBe('2024-01-01'); expect(format(-5, '0;(0)').text).toBe('(5)'); });
});
SlopTest.run({ name: 'Slop Tables engine' });
</script>
</body></html>
