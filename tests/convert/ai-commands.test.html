<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>File convert: assistant commands</title></head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:convert', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script src="../../shared/apps.js"></script>
  <script src="../../shared/hub.js"></script>
  <script>
  // Covers: convert/js/ui/ai-commands.js, convert/js/ui/mount.js, convert/index.html
  // The hub page loads SlopCmd; prepare() imports the commands. new_conversion, add_files (a text and a Slop Drive
  // picture), list_targets, set_target with options, run_conversion and export_results drive the page's ConvertTool;
  // state() lists the files and the checkpoint puts their choices back.
  const { describe, it, expect, waitFor } = SlopTest;
  let W, C, T;
  const run = async (tool, args) => { const r = await C.exec('cv.ai.' + tool.replace(/_/g, '-'), args); if (!r.ok) throw new Error(tool + ': ' + r.error); return r.value; };
  const png = () => new Promise((r) => { const c = document.createElement('canvas'); c.width = 20; c.height = 10; const g = c.getContext('2d'); g.fillStyle = '#f80'; g.fillRect(0, 0, 20, 10); c.toBlob(r, 'image/png'); });

  describe('File convert: assistant commands', () => {
    it('the hub page has SlopCmd and its own state once prepared', async () => {
      const f = document.createElement('iframe');
      f.style.cssText = 'width:1280px;height:900px;border:0';
      f.src = '../../convert/index.html';
      document.body.append(f);
      await waitFor(() => f.contentWindow && f.contentWindow.SlopCmd && f.contentDocument.querySelector('[data-convert-root]') && f.contentDocument.querySelector('[data-convert-root]').convertTool, { timeout: 20000 });
      W = f.contentWindow; C = W.SlopCmd; T = f.contentDocument.querySelector('[data-convert-root]').convertTool;
      expect(C.app).toBe('convert');
      await C.prepare();
      expect(C.ownState()).toBe(true);
      expect(C.state().total).toBe(0);
    }, { timeout: 30000 });

    it('add_files takes a text; set_target with options; run_conversion makes the file', async () => {
      const v = await run('add_files', { text: 'name,age\nAda,36\nBob,41\n', name: 'people.csv' });
      expect(v).toMatch(/people\.csv/);
      const list = await run('list_targets', {});
      expect(list.byKind[0].targets.some((t) => t.id === 'csv-to-json')).toBe(true);
      await run('set_target', { to: 'json', options: { numbers: true } });
      const s = C.state();
      expect(s.files[0].target).toBe('csv-to-json');
      expect(s.files[0].options.numbers).toBe(true);
      const bad = await C.exec('cv.ai.set-target', { to: 'json', options: { colour: 'red' } });
      expect(bad.ok).toBe(false);
      expect(bad.error).toMatch(/no option/);
      await run('run_conversion', {});
      expect(T.outputs.length).toBe(1);
      const data = JSON.parse(await T.outputs[0].blob.text());
      expect(data[0].age).toBe(36);
    }, { timeout: 30000 });

    it('add_files from Slop Drive, set_target on one file, export_results saves to Slop Drive', async () => {
      await window.SlopHub.put(await png(), { name: 'dot-ai-test.png', from: 'upload' });
      await run('add_files', { files: ['dot-ai-test.png'] });
      expect(T.items.length).toBe(2);
      await run('set_target', { to: 'jpg', files: ['dot-ai-test'], options: { quality: 50 } });
      expect(C.state().files.find((x) => x.name === 'dot-ai-test.png').target).toBe('to-jpg');
      const no = await C.exec('cv.ai.set-target', { to: 'mp3', files: ['people'] });
      expect(no.ok).toBe(false);
      const v = await run('export_results', { to: 'drive' });   // converts first: the new file has no result yet
      expect(v).toMatch(/dot-ai-test\.jpg/);
      const rec = (await window.SlopHub.list()).find((x) => x.name === 'dot-ai-test.jpg');
      expect(!!rec).toBe(true);
      expect((await window.SlopHub.get(rec.id)).blob.type).toBe('image/jpeg');
    }, { timeout: 60000 });

    it('the checkpoint puts the targets back; new_conversion clears the list', async () => {
      const back = C.checkpoint();
      await run('set_target', { to: 'webp', files: ['dot-ai-test'] });
      expect(C.state().files.find((x) => x.name === 'dot-ai-test.png').target).toBe('to-webp');
      expect(back()).toBe(true);
      expect(C.state().files.find((x) => x.name === 'dot-ai-test.png').target).toBe('to-jpg');
      await run('new_conversion', { to: 'pdf' });
      expect(C.state().total).toBe(0);
      expect(C.state().startsOn).toBe('pdf');
      expect((await C.exec('cv.ai.export-results', { to: 'drive' })).ok).toBe(false);
    }, { timeout: 30000 });
  });
  SlopTest.run({ name: 'File convert: assistant commands' });
  </script>
</body>
</html>
