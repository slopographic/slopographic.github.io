<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="slop-test-needs" content="seoIndex=true"><title>File convert: SEO pages, sitemap, robots</title></head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:convert', '1'); } catch (e) { /* private window */ }</script>
<script src="../harness.js"></script>
<script type="module">
import { PAGES } from '../../convert/js/core/pages.js';
import { FACTS as TASKS } from '../../shared/seo/tasks/facts.mjs';
import { FACTS as GUIDES } from '../../shared/seo/guides/facts.mjs';
const { describe, it, expect } = SlopTest;
const SITE = 'https://slopographic.com';
const text = async (url) => { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(`${url} returned ${r.status}`); return r.text(); };
const pageUrl = (slug) => `${SITE}/convert/${slug}/`;
const parse = (html) => new DOMParser().parseFromString(html, 'text/html');
const htmlOf = {};
// The English page: a build whose root language is another has it under /en/ (shared/seo/HANDOFF.md, "Languages").
const EN_DIR = window.BRAND_FACTS && window.BRAND_FACTS.defaultLang !== 'en' ? 'en/' : '';
const enUrl = (slug) => `${SITE}/${EN_DIR}convert/${slug}/`;
const load = async (slug) => (htmlOf[slug] ??= await text(`../../${EN_DIR}convert/${slug}/index.html`));

describe('sitemap and robots', () => {
  it('sitemap.xml lists the hub and every converter page', async () => {
    const xml = await text('../../sitemap.xml');
    expect(xml).toContain(`${SITE}/convert/</loc>`);
    for (const p of PAGES) expect(xml).toContain(`<loc>${pageUrl(p.slug)}</loc>`);
  });
  it('sitemap.xml lists only URLs that exist', async () => {
    const xml = await text('../../sitemap.xml');
    const locs = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)].map((m) => m[1]);
    // The hub, every converter page, the task pages (shared/seo/tasks/, app convert, such as convert/pdf-to-word/) and the
    // guides (shared/seo/guides/, such as convert/getting-started/).
    const tasks = TASKS.filter((t) => t.app === 'convert').length, guides = GUIDES.filter((g) => g.app === 'convert').length;
    expect(locs.filter((l) => l.startsWith(`${SITE}/convert/`)).length).toBe(PAGES.length + 1 + tasks + guides);
    for (const loc of locs) {
      const path = loc.replace(SITE, '');
      const r = await fetch(`../..${path}`);
      expect(r.status).toBe(200);
    }
  });
  it('robots.txt allows crawling and names the sitemap', async () => {
    const t = await text('../../robots.txt');
    expect(t).toContain('User-agent: *');
    expect(t).toContain('Allow: /');
    expect(t).toContain(`Sitemap: ${SITE}/sitemap.xml`);
    expect(t).not.toContain('Disallow: /');
  });
});

describe('each converter page', () => {
  for (const p of PAGES) {
    it(`${p.slug}: exists, one h1, canonical, meta, JSON-LD, embedded tool`, async () => {
      const html = await load(p.slug);
      const doc = parse(html);
      expect(doc.querySelectorAll('h1').length).toBe(1);
      expect(doc.querySelector('h1').textContent.trim()).toBe(p.h1);
      expect(doc.querySelector('link[rel="canonical"]').getAttribute('href')).toBe(enUrl(p.slug));
      expect(doc.title.length).toBeGreaterThan(20);
      expect(doc.querySelector('meta[name="description"]').getAttribute('content').length).toBeGreaterThan(60);
      expect(doc.querySelector('meta[property="og:title"]')).toBeTruthy();
      const ld = [...doc.querySelectorAll('script[type="application/ld+json"]')].map((s) => JSON.parse(s.textContent));
      expect(ld.some((o) => o['@type'] === 'SoftwareApplication' && o.url === enUrl(p.slug))).toBeTruthy();
      expect(doc.querySelector('[data-convert-root]')).toBeTruthy();
      expect(doc.querySelector('[data-convert-root]').dataset.preset).toBe(p.conv);
      expect(html).toContain('Your files stay on this device');
      expect(html).toContain('../../convert/js/ui/mount.js');
    });
  }
});

describe('the hub', () => {
  it('has one h1, a canonical and the mount script', async () => {
    const doc = parse(await text('../../convert/index.html'));
    expect(doc.querySelectorAll('h1').length).toBe(1);
    expect(doc.querySelector('link[rel="canonical"]').getAttribute('href')).toBe(`${SITE}/convert/`);
    expect(doc.querySelectorAll('[data-convert-root]').length).toBe(1);
  });
});

SlopTest.run({ name: 'File convert: SEO' });
</script>
</body>
</html>
