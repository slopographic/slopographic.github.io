<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>File convert: PDF conversions</title></head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:convert', '1'); } catch (e) { /* private window */ }</script>
<script src="../harness.js"></script>
<script type="module">
import { imagesToPdf } from '../../convert/js/core/pdf-images.js';
import { imageForPdf, makeCanvas, canvasToBlob } from '../../convert/js/core/image.js';
import { mergePdfs, extractPages, splitPages } from '../../convert/js/core/pdf-ops.js';
import { pdfToImages } from '../../convert/js/core/pdf-raster.js';
import { parseRange } from '../../convert/js/core/range.js';
const { describe, it, expect } = SlopTest;

const ascii = (u8) => new TextDecoder('latin1').decode(u8);
/** Count real page objects: "/Type /Page" but not "/Type /Pages". */
const pageCount = (u8) => (ascii(u8).match(/\/Type\s*\/Page(?!s)/g) || []).length;
const isPdf = (u8) => ascii(u8.subarray(0, 8)).startsWith('%PDF-');

async function pngOf(w, h, colour) {
  const c = makeCanvas(w, h), x = c.getContext('2d');
  x.fillStyle = colour; x.fillRect(0, 0, w, h);
  return new Uint8Array(await (await canvasToBlob(c, 'image/png')).arrayBuffer());
}
async function items(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const c = makeCanvas(60 + i * 10, 80), x = c.getContext('2d');
    x.fillStyle = `hsl(${i * 90} 80% 50%)`; x.fillRect(0, 0, c.width, c.height);
    const jpg = await canvasToBlob(c, 'image/jpeg', 0.9);
    out.push(await imageForPdf(jpg, 'jpg'));
  }
  return out;
}

describe('images to PDF', () => {
  it('makes a PDF with one page per image', async () => {
    const pdf = await imagesToPdf(await items(3), { page: 'a4', margin: 36 });
    expect(isPdf(pdf)).toBeTruthy();
    expect(pageCount(pdf)).toBe(3);
  });
  it('uses A4 and Letter media boxes', async () => {
    const a4 = ascii(await imagesToPdf(await items(1), { page: 'a4' }));
    expect(a4).toContain('595.28');
    const letter = ascii(await imagesToPdf(await items(1), { page: 'letter' }));
    expect(letter).toContain('612');
  });
  it('makes one page per PNG as well, flattened', async () => {
    const png = await imageForPdf(new Blob([await pngOf(20, 20, '#123456')], { type: 'image/png' }), 'png');
    const pdf = await imagesToPdf([png, png], { page: 'fit', margin: 0 });
    expect(pageCount(pdf)).toBe(2);
  });
  it('rejects an empty list', async () => {
    await SlopTest.expect(imagesToPdf([])).rejects(/at least one image/);
  });
});

describe('PDF pages and ranges', () => {
  it('merges PDFs in order', async () => {
    const a = await imagesToPdf(await items(2));
    const b = await imagesToPdf(await items(1));
    const m = await mergePdfs([a, b]);
    expect(pageCount(m)).toBe(3);
  });
  it('extracts a page range', async () => {
    const src = await imagesToPdf(await items(4));
    const one = await extractPages(src, '2-3');
    expect(pageCount(one)).toBe(2);
  });
  it('splits every page into its own PDF', async () => {
    const src = await imagesToPdf(await items(3));
    const parts = await splitPages(src);
    expect(parts.length).toBe(3);
    expect(pageCount(parts[1].bytes)).toBe(1);
    expect(parts[1].pageNo).toBe(2);
  });
  it('parses page ranges and rejects bad ones', () => {
    expect(parseRange('1-3, 5, 8-', 9)).toEqual([1, 2, 3, 5, 8, 9]);
    expect(parseRange('', 3)).toEqual([1, 2, 3]);
    expect(() => parseRange('4', 3)).toThrow(/past the end/);
    expect(() => parseRange('x', 3)).toThrow(/not a page number/);
    expect(() => parseRange('3-1', 5)).toThrow(/backwards/);
  });
});

describe('PDF to images', () => {
  it('renders each page to PNG', async () => {
    const src = await imagesToPdf(await items(2));
    const pages = await pdfToImages(src, { scale: 1, format: 'png' });
    expect(pages.length).toBe(2);
    const head = new Uint8Array(await pages[0].blob.slice(0, 4).arrayBuffer());
    expect([head[0], head[1], head[2], head[3]]).toEqual([0x89, 0x50, 0x4e, 0x47]);
    expect(pages[0].blob.type).toBe('image/png');
  });
  it('honours the page range and JPG format', async () => {
    const src = await imagesToPdf(await items(3));
    const pages = await pdfToImages(src, { pages: '3', scale: 1, format: 'jpg' });
    expect(pages.length).toBe(1);
    expect(pages[0].pageNo).toBe(3);
    expect(pages[0].blob.type).toBe('image/jpeg');
  });
});

SlopTest.run({ name: 'File convert: PDF conversions' });
</script>
</body>
</html>
