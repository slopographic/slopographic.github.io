<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop EML: the empty page shows a read email and three steps; the sample email opens with its attachments</title>
  <style>body { margin: 0; background: #111; } iframe { border: 0; display: block; height: 860px; }</style>
</head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:convert', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script>
  // Covers: eml/js/main.js, eml/index.html, eml/css/eml.css, assets/shots/eml.jpg, shared/samples/docs.js
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D;
  /** The app in a fresh iframe of this width, once the app is ready. */
  async function boot(width) {
    for (const old of document.querySelectorAll('iframe')) old.remove();
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../eml/index.html';
    document.body.append(f);
    await waitFor(() => { const w = f.contentWindow; return w && w.document.readyState === 'complete' && !!(w.document.body.classList.contains('ready') && w.EmlApp); }, { timeout: 30000 });
    W = f.contentWindow; D = W.document;
  }
  const $ = (sel) => D.querySelector(sel);

  describe('Slop EML: the first visit', () => {
    it('the empty page shows what it makes and how, and Try it with a sample email fills it', async () => {
      await boot(1280);
      expect(D.querySelectorAll('#em-empty .sd-steps li').length).toBe(3);
      const img = $('#em-empty .sd-pic img');
      SlopTest.shot(img, '../assets/shots/eml.jpg');   // a build without media has no picture
      if (img) {
        expect(img.alt.length > 10).toBe(true);
        await waitFor(() => img.complete && img.naturalWidth > 300);
      }
      $('#em-sample').click();
      await waitFor(() => { return !!W.EmlApp.current(); }, { timeout: 20000 });
      await waitFor(() => $('#em-subject').textContent === 'Kickoff on Thursday: agenda and invoice');
      expect(W.EmlApp.current().name).toBe('Kickoff on Thursday.eml');
      expect($('#em-empty').hidden).toBe(true);
      expect($('#em-msg').hidden).toBe(false);
      expect($('#em-atts-chip').textContent).toBe('2 attachments');
      expect($('#em-side').textContent).toContain('Invoice 2026-118.pdf');
    }, { timeout: 60000 });
    it('at 390 px the preview fits: no sideways scroll', async () => {
      await boot(390);
      const p = $('#em-empty .sd-preview').getBoundingClientRect();
      expect(p.width > 200 && p.right <= 391).toBe(true);
      expect(D.documentElement.scrollWidth <= 390).toBe(true);
    }, { timeout: 40000 });
  });
  run();
  </script>
</body>
</html>
