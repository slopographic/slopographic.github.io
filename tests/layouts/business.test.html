<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workspace layouts in the business apps</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  const f = document.getElementById('app');
  /** Load a business app in the iframe (a fresh document each time) and wait until its router has booted. */
  async function open(src, ns) {
    const want = new URL(src, location.href).pathname;
    const prev = f.contentWindow && f.contentWindow.document;
    const [base, hash] = src.split('#');
    f.src = base + (base.includes('?') ? '&' : '?') + 'run=' + Math.random().toString(36).slice(2) + (hash ? '#' + hash : '');
    await waitFor(() => {
      const w = f.contentWindow, d = w && w.document;
      return d && d !== prev && w.location.pathname === want && d.readyState === 'complete' && d.getElementById('main') && w[ns] && w[ns].state;
    }, { timeout: 30000 });
    await sleep(150);
    return f.contentWindow;
  }
  const hid = (W, id) => W.document.getElementById(id).hidden;
  const box = (W, id) => W.document.getElementById(id).getBoundingClientRect();

  describe('Business workspace layouts', () => {
    it('Invoices: with an invoice open, the list sits left and the document right', async () => {
      let W = await open('../../invoices/index.html?layout=business#new', 'SlopInvoices');
      await waitFor(() => W.document.getElementById('main').dataset.slopLayout === 'business-document', { timeout: 10000 });
      expect(hid(W, 'view-list')).toBe(false);
      expect(hid(W, 'view-edit')).toBe(false);
      expect(box(W, 'view-list').right).toBeLessThanOrEqual(box(W, 'view-edit').left + 1);
      expect(box(W, 'view-list').width).toBeLessThan(box(W, 'view-edit').width);
    }, { timeout: 60000 });

    it('Invoices: on the list route the layout steps aside and the list fills the page', async () => {
      const W = await open('../../invoices/index.html#list', 'SlopInvoices');
      await sleep(100);
      expect(W.document.getElementById('main').dataset.slopLayout === undefined).toBe(true);
      expect(hid(W, 'view-list')).toBe(false);
      expect(hid(W, 'view-edit')).toBe(true);
    }, { timeout: 60000 });

    it('CRM: the layout is kept to the list and detail split, and the other screens are unchanged', async () => {
      const W = await open('../../crm/index.html#customers', 'SlopCrm');
      await sleep(100);
      expect(W.document.getElementById('main').dataset.slopLayout === undefined).toBe(true);
      expect(hid(W, 'view-customers')).toBe(false);
      expect(hid(W, 'view-pipeline')).toBe(true);
    }, { timeout: 60000 });
  });
  run({ name: 'Business · workspace layouts' });
  </script>
</body>
</html>
