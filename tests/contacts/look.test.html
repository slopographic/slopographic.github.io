<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Contacts: the look (one header with labels at 1440, the list title in full, 1024 and 390 wide)</title>
<style>body { margin: 0; } iframe { border: 0; display: block; height: 800px; }</style></head>
<body>
  <!-- Covers: contacts/css/contacts.css -->
  <!-- Covers: contacts/css/contacts-list.css -->
  <!-- Covers: contacts/js/app/layout.js -->
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  /** The page in a fresh iframe of this width, once it and the shell's header buttons are in. */
  async function open(width, src = '../../contacts/index.html') {
    for (const old of document.querySelectorAll('iframe')) old.remove();
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = src;
    document.body.append(f);
    await waitFor(() => { const D = f.contentDocument; return D && D.readyState === 'complete' && D.querySelector('header .sh-hdr .slop-hbtn') && D.defaultView.SlopContacts && D.defaultView.SlopContacts.ready; }, { timeout: 30000 });
    await sleep(400);   // the header fit (shared/ui/hbtn.js) runs on the next frame
    return f.contentDocument;
  }
  const box = (n) => n.getBoundingClientRect();
  const shown = (n) => !!n && box(n).width > 0 && box(n).height > 0;
  /** Every header on screen (the menu bar is a header too). */
  const headers = (D) => [...D.querySelectorAll('header')].filter((n) => shown(n) && !n.parentElement.closest('header'));
  /** The heights of the shared header buttons on screen. */
  const hbtnHeights = (D) => [...D.querySelectorAll('header .slop-hbtn')].filter(shown).map((n) => Math.round(box(n).height));
  /** The page's own buttons (selectors) are as tall as the shared ones. */
  function sameHeight(D, sels) {
    const hs = hbtnHeights(D);
    expect(hs.length).toBeGreaterThan(2);
    for (const h of hs) expect(h).toBe(hs[0]);
    for (const sel of sels) {
      const n = D.querySelector(sel);
      if (!shown(n)) continue;
      expect(sel + ' ' + Math.round(box(n).height)).toBe(sel + ' ' + hs[0]);
    }
  }
  const noSideScroll = (D) => expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(D.defaultView.innerWidth);

  describe('Slop Contacts: the look', () => {
    it('at 1440px: one header row, the shared buttons keep their labels and are as tall as the toolbar', async () => {
      try { localStorage.removeItem('slop-contacts.list-width'); } catch (e) { /* the default width */ }
      const D = await open(1440);
      expect(headers(D).length).toBe(1);
      expect(D.querySelector('header.slop-htight')).toBe(null);
      sameHeight(D, ['[data-cmd="contacts.new"]', '[data-cmd="contacts.dupes"]']);
      const t = D.getElementById('listTitle');
      expect(t.scrollWidth).toBeLessThanOrEqual(t.clientWidth);
    }, { timeout: 40000 });

    it('at 1024px the header stays one row', async () => {
      const D = await open(1024);
      noSideScroll(D);
      const h = headers(D)[0];
      expect(box(h).height).toBeLessThan(56);
    }, { timeout: 40000 });

    it('at 390px the header is two rows at most and nothing scrolls sideways', async () => {
      const D = await open(390);
      noSideScroll(D);
      expect(box(headers(D)[0]).height).toBeLessThan(100);
    }, { timeout: 40000 });
  });
  SlopTest.run({ name: 'Slop Contacts: the look' });
  </script>
</body>
</html>
