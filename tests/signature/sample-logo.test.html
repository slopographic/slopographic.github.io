<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Signature: Random with its seed, the logo maker, a dropped picture, the copy for each mail program and the Copy now bar</title>
  <style>body { margin: 0; background: #111; } iframe { border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" style="width:1280px;height:860px"></iframe>
  <script src="../harness.js"></script>
  <script>
  // Covers: signature/js/app.js, signature/js/logo-ui.js, signature/js/logo.js, signature/js/sample.js, signature/js/copy.js, signature/js/form.js, signature/js/layout.js, signature/js/ai-commands.js, signature/index.html, signature/css/signature.css, shared/apps.js
  const { describe, it, expect, waitFor, run, sleep } = SlopTest;
  let W, D, A, C, copied;
  const $ = (id) => D.getElementById(id);
  async function boot(width = 1280, height = 860) {
    try { localStorage.removeItem('slop-signature'); } catch (e) { /* none */ }
    const old = document.getElementById('app'), f = document.createElement('iframe');
    f.id = 'app'; f.style.cssText = `width:${width}px;height:${height}px`;
    old.replaceWith(f);
    f.src = '../../signature/index.html';
    await waitFor(() => f.contentWindow && f.contentWindow.SlopSignature && f.contentWindow.SlopSignature.app && f.contentWindow.document.querySelector('.smb-bar'), { timeout: 20000 });
    W = f.contentWindow; D = W.document; A = W.SlopSignature.app; C = W.SlopCmd; copied = null;
    W.SlopBuffer.writeSystem = async (rec) => { copied = rec.formats; return true; };
  }
  const snap = () => JSON.stringify(Object.assign({}, A.state, { image: A.state.image ? A.state.image.slice(0, 22) : '' }));

  describe('Slop Signature: samples, logos, pictures and copies', () => {
    it('Random fills a whole signature and shows its seed; the same seed makes the same one again', async () => {
      await boot();
      $('sgRandom').click();
      await waitFor(() => /^\d{4,5}$/.test($('sgSeed').value) && /Sample seed/.test($('sgMsg').textContent));
      const seed = $('sgSeed').value, first = snap();
      expect($('sgSig').textContent.length > 20).toBe(true);
      $('sgRandom').click();
      await waitFor(() => $('sgSeed').value !== seed);
      $('sgSeed').value = seed;
      $('sgSeedGo').click();
      await waitFor(() => snap() === first);
      $('sgSeedLang').value = 'sv';
      $('sgSeedGo').click();
      await waitFor(() => /\+46 /.test(A.state.phone));
    }, { timeout: 20000 });

    it('the logo maker draws initials in a shape, Use this logo puts a PNG in the signature', async () => {
      $('sgLogo').open = true;
      await waitFor(() => $('sgLogoPreview').querySelector('svg'));
      $('sgLogoText').value = 'QX'; $('sgLogoText').dispatchEvent(new W.Event('input', { bubbles: true }));
      $('sgLogoShape').value = 'rounded'; $('sgLogoShape').dispatchEvent(new W.Event('change'));
      expect($('sgLogoPreview').querySelector('svg rect') !== null).toBe(true);
      expect($('sgLogoPreview').textContent).toBe('QX');
      const look = $('sgLogoSeed').textContent;
      $('sgLogoAgain').click();
      expect($('sgLogoSeed').textContent !== look).toBe(true);
      A.state.template === 'compact' && D.querySelector('.sg-tpl[data-tpl="side"]').click();
      const before = A.state.image;
      $('sgLogoUse').click();
      await waitFor(() => /^data:image\/png/.test(A.state.image) && A.state.image !== before && /logo is kept/.test($('sgMsg').textContent));
      expect(($('sgSig').querySelector('img') || {}).src.startsWith('data:image/png')).toBe(true);
      expect($('sgPicNote').hidden).toBe(false);
      expect($('sgPicNote').textContent).toContain('Gmail does not show');
    }, { timeout: 20000 });

    it('Copy for Gmail leaves the inside picture out; Copy for Outlook keeps it', async () => {
      $('sgCopyGmail').click();
      await waitFor(() => copied && /Copied for Gmail/.test($('sgMsg').textContent));
      expect(copied['text/html'].includes('data:image')).toBe(false);
      expect($('sgMsg').textContent).toContain('picture is left out');
      copied = null;
      $('sgCopyOutlook').click();
      await waitFor(() => copied);
      expect(copied['text/html'].includes('data:image/png')).toBe(true);
    });

    it('a picture dropped on the email goes the one way in and is kept as a PNG', async () => {
      D.querySelector('.sg-tpl[data-tpl="side"]').click();
      const c = D.createElement('canvas'); c.width = 50; c.height = 50; c.getContext('2d').fillRect(0, 0, 50, 50);
      const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg'));
      const dt = new W.DataTransfer(); dt.items.add(new W.File([blob], 'dropped.jpg', { type: 'image/jpeg' }));
      const before = A.state.image;
      $('sgView').dispatchEvent(new W.DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dt }));
      $('sgView').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
      await waitFor(() => A.state.image !== before && /^data:image\/png/.test(A.state.image));
    });

    it('the assistant: random_signature with a seed, make_logo, and copy_signature shows Copy now without a click', async () => {
      await C.prepare();
      for (const t of ['random-signature', 'make-logo', 'copy-signature']) expect(`${t} ${C.get('signature.ai.' + t).destructive}`).toBe(`${t} false`);
      const r = await C.exec('signature.ai.random-signature', { seed: '4821' });
      expect(r.error || 'ok').toBe('ok');
      expect(r.value).toContain('sample seed 4821');
      expect(C.state().sample_seed).toBe('4821');
      const l = await C.exec('signature.ai.make-logo', { text: 'AB', kind: 'monogram', shape: 'circle', seed: '9' });
      expect(l.error || 'ok').toBe('ok');
      expect(A.state.image.slice(0, 14)).toBe('data:image/png');
      const cp = await C.exec('signature.ai.copy-signature', { client: 'gmail' });
      expect(cp.error || 'ok').toBe('ok');
      if (/Copy now/.test(cp.value)) {
        expect($('sgCopyNow').hidden).toBe(false);
        expect($('sgCopyNowBtn').textContent).toBe('Copy for Gmail now');
        copied = null;
        $('sgCopyNowBtn').click();
        await waitFor(() => copied);
        expect($('sgCopyNow').hidden).toBe(true);
      } else expect(cp.value).toContain('Copied for Gmail');
    }, { timeout: 30000 });

    it('at 390 px the seed row, the logo maker and the copy buttons fit; nothing scrolls sideways', async () => {
      await boot(390, 844);
      D.querySelector('.sf-foot-more').click();
      await waitFor(() => $('sgPanel').classList.contains('ssh-on'));
      await sleep(300);
      $('sgLogo').open = true;
      for (const id of ['sgSeed', 'sgRandom', 'sgCopyGmail', 'sgLogoUse']) {
        const b = $(id).getBoundingClientRect();
        expect(`${id} ${b.width > 0 && b.right <= 391}`).toBe(`${id} true`);
      }
      expect(D.documentElement.scrollWidth).toBe(390);
    });
  });
  run();
  </script>
</body>
</html>
