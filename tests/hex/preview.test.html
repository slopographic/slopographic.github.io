<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Hex: the empty page shows a file's bytes and three steps; the sample PDF opens in a tab</title>
  <style>body { margin: 0; background: #111; } iframe { border: 0; display: block; height: 860px; }</style>
</head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:convert', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script>
  // Covers: hex/js/main.js, hex/index.html, hex/css/hex.css, assets/shots/hex.jpg, shared/samples/docs.js
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D;
  /** The app in a fresh iframe of this width, once the app is ready. */
  async function boot(width) {
    for (const old of document.querySelectorAll('iframe')) old.remove();
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../hex/index.html';
    document.body.append(f);
    await waitFor(() => { const w = f.contentWindow; return w && w.document.readyState === 'complete' && !!(w.document.body.classList.contains('ready') && w.HexApp); }, { timeout: 30000 });
    W = f.contentWindow; D = W.document;
  }
  const $ = (sel) => D.querySelector(sel);

  describe('Slop Hex: the first visit', () => {
    it('the empty page shows what it makes and how, and Try it with a sample PDF fills it', async () => {
      await boot(1280);
      expect(D.querySelectorAll('#hx-empty .sd-steps li').length).toBe(3);
      const img = $('#hx-empty .sd-pic img');
      SlopTest.shot(img, '../assets/shots/hex.jpg');   // a build without media has no picture
      if (img) {
        expect(img.alt.length > 10).toBe(true);
        await waitFor(() => img.complete && img.naturalWidth > 300);
      }
      $('#hx-sample').click();
      await waitFor(() => { const d = W.HexApp.doc(); return d && d.size > 2000; }, { timeout: 20000 });
      await waitFor(() => $('.hx-row') && $('.hx-row').textContent.includes('%PDF-1.4'));
      expect($('#hx-empty').hidden).toBe(true);
      expect($('#hx-tabs').textContent).toContain('Invoice 2026-118.pdf');
      expect($('.hx-row').textContent).toContain('%PDF-1.4');
    }, { timeout: 60000 });
    it('at 390 px the preview fits: no sideways scroll', async () => {
      await boot(390);
      const p = $('#hx-empty .sd-preview').getBoundingClientRect();
      expect(p.width > 200 && p.right <= 391).toBe(true);
      expect(D.documentElement.scrollWidth <= 390).toBe(true);
    }, { timeout: 40000 });
  });
  run();
  </script>
</body>
</html>
