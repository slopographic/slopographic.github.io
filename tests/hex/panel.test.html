<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Hex: the inspector on the right with Save version at its foot (1280 and 390)</title>
<style>body { margin: 0; } iframe { border: 0; display: block; height: 844px; }</style></head>
<body>
  <!-- Covers: hex/js/panel.js, hex/js/main.js, hex/css/hex.css, hex/index.html -->
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  let F, W, D;
  async function open(width) {
    if (F) F.remove();
    F = document.createElement('iframe'); F.style.width = width + 'px'; F.src = '../../hex/index.html'; document.body.append(F);
    W = F.contentWindow;
    await waitFor(() => W.document.body && W.document.body.classList.contains('ready'), { timeout: 30000 });
    D = W.document;
    if (W.SlopBanner && W.SlopBanner.remove) W.SlopBanner.remove();
    await W.HexApp.openBlob(new Blob([new Uint8Array([0x4d, 0x5a, 0x90, 0])]), { name: 'tiny.exe' });
    await waitFor(() => D.getElementById('hx-name').textContent.includes('tiny.exe'));
    await sleep(50);
  }

  describe('Slop Hex: the inspector', () => {
    it('at 1280 the inspector is right of the bytes; Save version and Download are at its foot; Download saves the file', async () => {
      await open(1280);
      const save = D.getElementById('hx-save'), dl = D.getElementById('hx-dl'), side = D.getElementById('hx-side');
      expect(save.closest('.sf-p-foot').parentNode).toBe(side);
      expect(dl.closest('.sf-p-foot').parentNode).toBe(side);
      expect(save.disabled).toBe(false);
      expect(side.getBoundingClientRect().left).toBeGreaterThanOrEqual(D.getElementById('hx-main').getBoundingClientRect().right - 1);
      expect(save.getBoundingClientRect().bottom).toBeLessThanOrEqual(W.innerHeight + 0.5);
      let saved = null;
      W.SlopUI.download = (blob, name) => { saved = name; };
      const before = saved;
      dl.click();
      await waitFor(() => saved !== before, { timeout: 4000 });
      expect(saved).toBe('tiny.exe');
      expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(1280);
    }, { timeout: 60000 });

    it('at 390 the closed sheet shows Save version at the bottom; Inspector opens it; no sideways scroll', async () => {
      await open(390);
      const save = D.getElementById('hx-save'), r = save.getBoundingClientRect();
      expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(390);
      expect(r.height).toBeGreaterThan(0);
      expect(r.bottom).toBeLessThanOrEqual(844.5);
      expect(r.top).toBeGreaterThan(844 - 120);
      D.querySelector('#hx-side .sf-foot-more').click();
      await waitFor(() => D.getElementById('hx-side').classList.contains('ssh-on'));
    }, { timeout: 60000 });
  });
  SlopTest.run({ name: 'Slop Hex: the inspector' });
  </script>
</body>
</html>
