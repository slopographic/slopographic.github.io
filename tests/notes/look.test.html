<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Notes: the look (one header, New note as tall as the shared buttons, 1440 and 390 wide)</title>
<style>body { margin: 0; } iframe { border: 0; display: block; height: 800px; }</style></head>
<body>
  <!-- Covers: notes/css/notes.css -->
  <!-- Covers: notes/js/tabs.js -->
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  /** The page in a fresh iframe of this width, once it and the shell's header buttons are in. */
  async function open(width, src = '../../notes/index.html') {
    for (const old of document.querySelectorAll('iframe')) old.remove();
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = src;
    document.body.append(f);
    await waitFor(() => { const D = f.contentDocument; return D && D.readyState === 'complete' && D.querySelector('header .sh-hdr .slop-hbtn') && D.body.classList.contains('ready'); }, { timeout: 30000 });
    await sleep(400);   // the header fit (shared/ui/hbtn.js) runs on the next frame
    return f.contentDocument;
  }
  const box = (n) => n.getBoundingClientRect();
  const shown = (n) => !!n && box(n).width > 0 && box(n).height > 0;
  /** Every header on screen (the menu bar is a header too). */
  const headers = (D) => [...D.querySelectorAll('header')].filter((n) => shown(n) && !n.parentElement.closest('header'));
  /** The heights of the shared header buttons on screen. */
  const hbtnHeights = (D) => [...D.querySelectorAll('header .slop-hbtn')].filter(shown).map((n) => Math.round(box(n).height));
  /** The page's own buttons (selectors) are as tall as the shared ones. */
  function sameHeight(D, sels) {
    const hs = hbtnHeights(D);
    expect(hs.length).toBeGreaterThan(2);
    for (const h of hs) expect(h).toBe(hs[0]);
    for (const sel of sels) {
      const n = D.querySelector(sel);
      if (!shown(n)) continue;
      expect(sel + ' ' + Math.round(box(n).height)).toBe(sel + ' ' + hs[0]);
    }
  }
  const noSideScroll = (D) => expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(D.defaultView.innerWidth);

  describe('Slop Notes: the look', () => {
    it('one header, and New note is as tall as the shared header buttons', async () => {
      const D = await open(1440);
      expect(headers(D).length).toBe(1);
      sameHeight(D, ['#nt-new']);
      expect(D.querySelector('header .slop-htight')).toBe(null);
    }, { timeout: 40000 });

    it('with no notes, the empty line sits under the search, not at the bottom of the list', async () => {
      const D = await open(1440);
      const none = D.getElementById('nt-none');
      if (none.hidden) return;   // this origin already has notes from another test
      expect(box(none).top - box(D.getElementById('nt-q')).bottom).toBeLessThan(80);
    }, { timeout: 40000 });

    it('at 390px a blank tab shows the notes list (not an empty editor), with no sideways scroll', async () => {
      const D = await open(390);
      noSideScroll(D);
      expect(headers(D).length).toBe(1);
      if (!D.querySelector('.doctabs-host [aria-selected="true"]') || D.getElementById('nt-note').hidden === false) return;
      expect(D.getElementById('nt-app').dataset.pane).toBe('list');
      expect(shown(D.getElementById('nt-list'))).toBe(true);
    }, { timeout: 40000 });
  });
  SlopTest.run({ name: 'Slop Notes: the look' });
  </script>
</body>
</html>
