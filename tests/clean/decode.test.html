<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Clean: removal keeps the pixels</title></head>
<body>
  <script src="../harness.js"></script>
  <script src="../../clean/js/core/bytes.js"></script>
  <script src="../../clean/js/core/tags.js"></script>
  <script src="../../clean/js/core/xmp.js"></script>
  <script src="../../clean/js/core/tiff.js"></script>
  <script src="../../clean/js/core/jpeg.js"></script>
  <script src="../../clean/js/core/png.js"></script>
  <script src="../../clean/js/core/webp.js"></script>
  <script src="../../clean/js/core/index.js"></script>
  <script src="fixtures.js"></script>
  <script>
  const { describe, it, expect } = SlopTest;
  const C = window.SlopClean, F = window.CleanFixtures, cat = F.cat, ASCII = F.ASCII;

  /** A test picture with some structure, drawn on a canvas. */
  function picture(w = 96, h = 64) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, w, h); grd.addColorStop(0, '#d4ff3a'); grd.addColorStop(1, '#1a3a6e');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    g.fillStyle = '#ff4f6e'; g.beginPath(); g.arc(w / 3, h / 2, 14, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#111'; g.fillRect(w * 0.6, h * 0.2, 20, 10);
    return c;
  }
  const blobBytes = async (b) => new Uint8Array(await b.arrayBuffer());
  const toBlobOf = (c, type, q) => new Promise((r) => c.toBlob(r, type, q));
  /** FNV-1a over the decoded RGBA of a file: the same pixels give the same hash. */
  async function pixelHash(u8, type) {
    const bmp = await createImageBitmap(new Blob([u8], { type }));
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(bmp, 0, 0);
    const px = g.getImageData(0, 0, bmp.width, bmp.height).data;
    let h = 0x811c9dc5;
    for (let i = 0; i < px.length; i++) { h ^= px[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    return { hash: h, w: bmp.width, h: bmp.height, n: px.length };
  }
  const insertAfterSoi = (jpeg, segment) => cat(jpeg.subarray(0, 2), segment, jpeg.subarray(2));
  const gpsOnly = () => F.exifOf(F.buildTiff({ entries: [{ tag: 0x010f, type: 2, value: 'Acme' }, { tag: 0x8825, child: { entries: F.GPS_ENTRIES } }] }));

  let jpegIn, jpegOut, jpegPre, pngIn, pngOut, webpIn, webpOut, pngBlob;
  describe('JPEG: an EXIF GPS block goes, the pixels do not', () => {
    it('makes a real JPEG and injects an EXIF APP1 block with GPS and camera fields', async () => {
      const plain = new Uint8Array(await blobBytes(await toBlobOf(picture(), 'image/jpeg', 0.9)));
      jpegPre = plain;
      jpegIn = insertAfterSoi(plain, F.seg(0xe1, F.exifOf(F.buildTiff({ entries: F.SAMPLE_ENTRIES }))));
      const f = C.inspect(jpegIn).findings;
      expect(f.map((x) => x.label)).toContain('GPS position');
      expect(f.find((x) => x.label === 'Camera model').value).toBe('Acme Z9');
    });
    it('the file with metadata decodes to the same pixels as the plain picture', async () => {
      const a = await pixelHash(jpegPre, 'image/jpeg'), b = await pixelHash(jpegIn, 'image/jpeg');
      expect(b.hash).toBe(a.hash);
      expect(b.w).toBe(96);
    });
    it('after removal the GPS and camera fields are gone and the pixels are unchanged', async () => {
      const out = C.strip(jpegIn);
      jpegOut = out.bytes;
      expect(out.after.find((x) => x.label === 'GPS position')).toBe(undefined);
      expect(out.after.find((x) => x.label === 'Camera model')).toBe(undefined);
      const a = await pixelHash(jpegPre, 'image/jpeg'), b = await pixelHash(jpegOut, 'image/jpeg');
      expect(b.hash).toBe(a.hash);
      expect(jpegOut.length).toBeLessThan(jpegIn.length);
    });
    it('the picture bytes after the headers are identical to the input (no re-encoding)', () => {
      const scanStart = (u8) => { for (let i = 2; i < u8.length - 1; i++) if (u8[i] === 0xff && u8[i + 1] === 0xda) return i; return -1; };
      const a = jpegPre.subarray(scanStart(jpegPre)), b = jpegOut.subarray(scanStart(jpegOut));
      expect(b.length).toBe(a.length);
      expect(Array.from(b.subarray(0, b.length - 2))).toEqual(Array.from(a.subarray(0, a.length - 2)));
    });
  });

  describe('PNG: a tEXt chunk goes, the pixels do not', () => {
    it('adds tEXt and eXIf chunks to a real PNG', async () => {
      const plain = new Uint8Array(await blobBytes(await toBlobOf(picture(), 'image/png')));
      const cut = plain.length - 12;
      pngIn = cat(plain.subarray(0, cut), F.pngChunk('tEXt', cat(ASCII('Author'), ASCII('Ada Lovelace').subarray(0, 12))), F.pngChunk('eXIf', gpsOnly()), plain.subarray(cut));
      pngBlob = plain;
      expect(C.inspect(pngIn).findings.map((x) => x.label)).toContain('Text: Author');
    });
    it('the file with text chunks decodes to the same pixels as the plain PNG', async () => {
      expect((await pixelHash(pngIn, 'image/png')).hash).toBe((await pixelHash(pngBlob, 'image/png')).hash);
    });
    it('the tEXt author and the eXIf GPS are gone, the pixels are the same, and the CRCs are valid', async () => {
      const out = C.strip(pngIn).bytes;
      expect(C.inspect(out).findings.map((x) => x.label)).not.toContain('Text: Author');
      expect(C.inspect(out).findings.map((x) => x.label)).not.toContain('GPS position');
      expect((await pixelHash(out, 'image/png')).hash).toBe((await pixelHash(pngBlob, 'image/png')).hash);
      expect(C.png.chunks(out).map((c) => c.type).includes('tEXt')).toBe(false);
    });
  });

  describe('WebP: EXIF and XMP chunks go, the pixels do not', () => {
    it('adds EXIF and XMP chunks to a real WebP', async () => {
      const plain = new Uint8Array(await blobBytes(await toBlobOf(picture(), 'image/webp', 0.9)));
      const chunks = plain.subarray(12);
      webpIn = F.riffWebp([chunks, F.webpChunk('EXIF', F.exifOf(F.buildTiff({ entries: F.SAMPLE_ENTRIES })).subarray(6)),
        F.webpChunk('XMP ', new TextEncoder().encode('<x:xmpmeta dc:creator="Ada"/>'))]);
      webpOut = plain;
      expect(C.inspect(webpIn).findings.map((x) => x.label)).toContain('GPS position');
    });
    it('the file with metadata and the stripped file decode to the same pixels', async () => {
      const out = C.strip(webpIn).bytes;
      expect((await pixelHash(webpIn, 'image/webp')).hash).toBe((await pixelHash(webpOut, 'image/webp')).hash);
      expect((await pixelHash(out, 'image/webp')).hash).toBe((await pixelHash(webpOut, 'image/webp')).hash);
      const dv = new DataView(out.buffer);
      expect(dv.getUint32(4, true)).toBe(out.length - 8);
    });
  });
  SlopTest.run({ name: 'Slop Clean: pixels' });
  </script>
</body>
</html>
