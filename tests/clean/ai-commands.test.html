<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SlopClean: assistant commands</title></head>
<body>
  <script src="../harness.js"></script>
  <script src="../drive/util.js"></script>
  <script src="../../clean/js/core/bytes.js"></script>
  <script src="../../clean/js/core/tags.js"></script>
  <script src="../../clean/js/core/xmp.js"></script>
  <script src="../../clean/js/core/tiff.js"></script>
  <script src="../../clean/js/core/jpeg.js"></script>
  <script src="../../clean/js/core/png.js"></script>
  <script src="../../clean/js/core/webp.js"></script>
  <script src="../../clean/js/core/index.js"></script>
  <script src="fixtures.js"></script>
  <script>
  // Covers: clean/js/app/ai-commands.js, clean/js/app/main.js, clean/index.html
  // SlopCmd.prepare() loads the commands; new_batch, add_files (from Slop Drive), set_options, remove_file and
  // export_cleaned work through the app's own controller; state() and the checkpoint follow.
  const { describe, it, expect, waitFor } = SlopTest;
  let W, C, H;
  const downloads = [];
  const run = async (tool, args) => { const r = await C.exec('cl.ai.' + tool.replace(/_/g, '-'), args); if (!r.ok) throw new Error(tool + ': ' + r.error); return r.value; };
  const gps = (bytes) => window.SlopClean.inspect(bytes).findings.some((f) => f.cat === 'location');
  async function photo() {
    const F = window.CleanFixtures, c = document.createElement('canvas'); c.width = 48; c.height = 32;
    const g = c.getContext('2d'); g.fillStyle = '#1a3a6e'; g.fillRect(0, 0, 48, 32);
    const jpeg = new Uint8Array(await (await new Promise((r) => c.toBlob(r, 'image/jpeg', 0.9))).arrayBuffer());
    return new Blob([F.cat(jpeg.subarray(0, 2), F.seg(0xe1, F.exifOf(F.buildTiff({ entries: F.SAMPLE_ENTRIES }))), jpeg.subarray(2))], { type: 'image/jpeg' });
  }

  describe('SlopClean: assistant commands', () => {
    it('add_files takes Slop Drive pictures and cleans them; state lists them', async () => {
      W = await DT.frame('../../clean/', (w) => w.CL && w.CL.app && w.SlopCmd && w.document.getElementById('cl-stat'));
      C = W.SlopCmd; H = W.SlopHub;
      W.SlopUI.download = (blob, name) => downloads.push({ blob, name });
      await H.clear();
      await H.put(await photo(), { name: 'beach.jpg', from: 'upload' });
      await H.put(await photo(), { name: 'hike.jpg', from: 'upload' });
      await C.prepare();
      expect(C.ownState()).toBe(true);
      const v = await run('add_files', { files: ['beach.jpg', 'hike'] });
      expect(v).toMatch(/Added 2 pictures/);
      const s = C.state();
      expect(s.total).toBe(2);
      expect(s.cleaned).toBe(2);
      expect(s.pictures[0].fromDrive).toBe(true);
      expect(s.pictures[0].found.location).toBeGreaterThan(0);
      expect(s.remove).toContain('location');
      expect(gps(W.CL.app.state.items[0].out.bytes)).toBe(false);
      const bad = await C.exec('cl.ai.add-files', { files: ['nope.jpg'] });
      expect(bad.ok).toBe(false);
    }, { timeout: 30000 });

    it('set_options keeps the GPS when asked, and a preset brings the defaults back', async () => {
      await run('set_options', { keep: ['location'] });
      expect(C.state().keep).toContain('location');
      expect(gps(W.CL.app.state.items[0].out.bytes)).toBe(true);
      await run('set_options', { preset: 'location' });
      expect(C.state().remove).toEqual(['location']);
      expect(gps(W.CL.app.state.items[0].out.bytes)).toBe(false);
      const r = await C.exec('cl.ai.set-options', { remove: ['shoe-size'] });
      expect(r.ok).toBe(false);
      await run('set_options', { preset: 'defaults' });
      expect(C.state().keep).toContain('icc');
    }, { timeout: 30000 });

    it('export_cleaned saves copies to Slop Drive and downloads a zip', async () => {
      const v = await run('export_cleaned', { to: 'both' });
      expect(v).toMatch(/saved 2 cleaned copies/i);
      expect(downloads.pop().name).toBe('slop-clean.zip');
      const copy = (await H.list()).find((f) => f.name === 'beach (clean).jpg');
      expect(!!copy).toBe(true);
      expect(gps(new Uint8Array(await (await H.get(copy.id)).blob.arrayBuffer()))).toBe(false);
      await run('export_cleaned', { to: 'download', name: 'hike' });
      expect(downloads.pop().name).toBe('hike (clean).jpg');
    }, { timeout: 30000 });

    it('remove_file and new_batch empty the list; the checkpoint puts it back', async () => {
      const back = C.checkpoint();
      await run('remove_file', { name: 'hike' });
      expect(C.state().total).toBe(1);
      await run('new_batch', {});
      expect(C.state().total).toBe(0);
      expect((await C.exec('cl.ai.export-cleaned', { to: 'drive' })).ok).toBe(false);
      expect(back()).toBe(true);
      await waitFor(() => C.state().cleaned === 2, { timeout: 8000 });
    }, { timeout: 30000 });
  });
  SlopTest.run({ name: 'SlopClean: assistant commands' });
  </script>
</body>
</html>
