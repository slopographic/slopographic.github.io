<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Invoices: repeating invoices (Repeat…, the Repeating view, the due notice, making drafts)</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1100px; height: 800px; border: 0; }</style>
</head>
<body>
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script>
  // Covers: invoices/js/ui/repeat.js, invoices/js/ui/repeat-dialog.js, invoices/js/ui/app.js, invoices/js/ui/editor.js, invoices/index.html, shared/biz/app.css
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, inv;
  const $ = (id) => D.getElementById(id);
  const S = () => W.SlopData;
  const button = (text) => [...D.querySelectorAll('#eActions button, .ws-panel .sf-p-foot button')].find((b) => b.textContent === text);
  const dlg = () => SlopTest.topDialog(D);
  const rows = () => [...D.querySelectorAll('#rRows .sl-row')];
  async function boot(hash = '') {
    const f = document.getElementById('app');
    f.src = '../../invoices/index.html' + hash;
    await waitFor(() => f.contentWindow && f.contentWindow.SlopInvoices && f.contentWindow.SlopInvoices.app && f.contentWindow.document.getElementById('boot').hidden, { timeout: 20000 });
    W = f.contentWindow; D = W.document;
  }

  describe('repeating invoices in Slop Invoices', () => {
    it('Repeat… on an invoice makes a monthly schedule and shows it on the Repeating view', async () => {
      await boot();
      await S().store.erase(); await S().store.ready();
      const c = (await S().store.put('customers', { name: 'Ada Ltd', stage: 'customer' })).value;
      const today = S().ledger.today();
      inv = (await S().store.put('invoices', { customerId: c.id, date: S().ledger.addDays(today, -40), notes: 'Retainer', lines: [{ description: 'Retainer', qty: 1, unitPrice: 50000, taxRate: 0 }] })).value;
      await boot(`#i/${inv.id}`);
      await waitFor(() => !!button('Repeat…'));
      button('Repeat…').click();
      await waitFor(() => dlg() && dlg().textContent.includes('Repeat this invoice'));
      const inputs = dlg().querySelectorAll('input');
      expect(inputs[1].value).toBe(S().recurring.step(inv.date, 1, 'month'));
      [...dlg().querySelectorAll('button')].find((b) => b.textContent === 'Repeat').click();
      await waitFor(() => W.location.hash === '#repeat' && rows().length === 1);
      expect(rows()[0].textContent).toContain('Ada Ltd');
      expect(rows()[0].textContent).toContain('every month');
      expect(rows()[0].textContent).toContain('1 due');
      expect($('rMake').textContent).toBe('Make due drafts (1)');
    });
    it('the Invoices list shows the due notice; Make the drafts makes a dated draft and the schedule moves on', async () => {
      W.SlopInvoices.app.go('list');
      await waitFor(() => !$('iDue').hidden);
      expect($('iDue').textContent).toContain('1 repeating invoice is due.');
      $('iDueMake').click();
      await waitFor(async () => (await S().store.list('invoices')).value.length === 2);
      const made = (await S().store.list('invoices')).value.find((x) => x.scheduleId);
      expect([made.status, made.total, made.notes, made.date]).toEqual(['draft', 50000, 'Retainer', S().recurring.step(inv.date, 1, 'month')]);
      const s = (await S().store.list('schedules')).value[0];
      expect([s.made, s.lastInvoiceId]).toEqual([1, made.id]);
      await waitFor(() => $('iDue').hidden);   // the notice goes once the drafts are made
    });
    it('Pause stops a schedule and Resume starts it again, from the row menu', async () => {
      W.SlopInvoices.app.go('repeat');
      await waitFor(() => rows().length === 1);
      const s = (await S().store.list('schedules')).value[0];
      W.SlopInvoices.repeat.menuFor(s).find((m) => m.label === 'Pause').act();
      await waitFor(() => rows()[0] && rows()[0].textContent.includes('Stopped'));
      const p = (await S().store.list('schedules')).value[0];
      W.SlopInvoices.repeat.menuFor(p).find((m) => m.label === 'Resume').act();
      await waitFor(() => rows()[0] && !rows()[0].textContent.includes('Stopped'));
    });
  });
  run();
  </script>
</body>
</html>
