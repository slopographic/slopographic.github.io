<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Shared 3D I/O: every reader and writer in the browser</title>
<script src="../harness.js"></script>
<script src="../../shared/profile/profile.js"></script>
<script src="../../shared/i18n/i18n.js"></script></head>
<body>
<!-- Covers: shared/3d-io/read.js, shared/3d-io/write.js, shared/3d-io/convert.js, shared/3d-io/decoders.js, shared/3d-io/resources.js -->
<!-- Covers: shared/3d-io/textures.js, shared/3d-io/viewer.js, shared/3d-io/scene.js, shared/3d-io/mtl.js, shared/3d-io/formats.js -->
<script type="module">
import * as T from '../../vendor/three/three.module.min.js';
import { readModel } from '../../shared/3d-io/read.js';
import { writeModel } from '../../shared/3d-io/write.js';
import { convertModel } from '../../shared/3d-io/convert.js';
import { stats, bounds } from '../../shared/3d-io/scene.js';
import { view, describe as caption } from '../../shared/3d-io/viewer.js';
import * as decoders from '../../shared/3d-io/decoders.js';
import { readZip } from '../../shared/office/zip.js';
import { dae, fbxAscii, fbxBinary, threeMf, splitGltf, glbParts } from './fixtures.js';
const { describe, it, expect } = SlopTest;

/** A textured cube: 2 × 2 × 2, a 4 × 4 picture as its colour map, inside a named group. */
function cube({ texture = true } = {}) {
  const c = document.createElement('canvas');
  c.width = c.height = 4;
  const g = c.getContext('2d');
  g.fillStyle = '#ff0000'; g.fillRect(0, 0, 4, 4); g.fillStyle = '#00ff00'; g.fillRect(0, 0, 2, 2);
  const map = texture ? new T.CanvasTexture(c) : null;
  if (map) map.colorSpace = T.SRGBColorSpace;
  const root = new T.Group();
  root.name = 'Box';
  const m = new T.Mesh(new T.BoxGeometry(2, 2, 2), new T.MeshStandardMaterial({ name: 'Paint', color: 0xffffff, map }));
  m.name = 'Cube';
  root.add(m);
  return root;
}
const asFiles = (files) => files.map((f) => ({ name: f.name, blob: f.blob || f }));
const near = (a, b, eps = 1e-4) => a.every((v, i) => Math.abs(v - b[i]) < eps);
async function checkCube(files, { triangles = 12, textured = false } = {}) {
  const r = await readModel(asFiles(files));
  const s = stats(r.root);
  expect(s.triangles).toBe(triangles);
  const b = bounds(r.root);
  expect(near(b.size, [2, 2, 2])).toBeTruthy();
  if (textured) { let img = null; r.root.traverse((o) => { if (o.isMesh && o.material.map) img = o.material.map.image; }); expect(!!img && (img.width || img.naturalWidth) === 4).toBeTruthy(); }
  return r;
}

describe('glTF and GLB', () => {
  it('GLB: a valid container (magic, version 2, length, aligned JSON and BIN chunks) that reads back with its texture', async () => {
    const { files } = await writeModel(cube(), 'glb', { name: 'cube' });
    const buf = await files[0].blob.arrayBuffer();
    const g = glbParts(buf);
    expect(g.magic).toBe(0x46546c67);
    expect(g.version).toBe(2);
    expect(g.length).toBe(buf.byteLength);
    expect(g.end).toBe(buf.byteLength);
    expect(g.chunks.map((c) => c.type)).toEqual([0x4e4f534a, 0x004e4942]);
    for (const c of g.chunks) expect(c.length % 4).toBe(0);
    expect(g.json.asset.version).toBe('2.0');
    const prim = g.json.meshes[0].primitives[0], pos = g.json.accessors[prim.attributes.POSITION];
    expect(pos.count).toBe(24);
    expect(pos.min).toEqual([-1, -1, -1]);
    expect(pos.max).toEqual([1, 1, 1]);
    for (const v of g.json.bufferViews) expect(v.byteOffset + v.byteLength <= g.bin.length).toBeTruthy();
    expect(g.json.images.length).toBe(1);
    await checkCube(files, { textured: true });
  });
  it('glTF: one JSON file with embedded data, and the same model split into .gltf + .bin + a picture', async () => {
    const { files } = await writeModel(cube(), 'gltf', { name: 'cube' });
    expect(JSON.parse(await files[0].blob.text()).buffers[0].uri).toMatch(/^data:/);
    await checkCube(files, { textured: true });
    const split = await splitGltf(files[0].blob, 'cube');
    expect(split.map((f) => f.name)).toEqual(['cube.gltf', 'cube.bin', 'pic 0.png']);
    await checkCube(split, { textured: true });
    const quiet = console.error;
    console.error = () => {};   // the glTF reader logs the missing picture; the warning below is what the page shows
    const noPic = await readModel(asFiles(split.slice(0, 2))).finally(() => { console.error = quiet; });
    expect(noPic.warnings.join(' ')).toContain('pic 0.png');
    await expect(readModel(asFiles([split[0]]))).rejects(/cube\.bin/);
  });
  it('animations go into a GLB, and Merge leaves them out and says so', async () => {
    const root = cube({ texture: false });
    root.children[0].name = 'Spinner';
    const clip = new T.AnimationClip('spin', 1, [new T.NumberKeyframeTrack('Spinner.position[x]', [0, 1], [0, 3])]);
    const { files } = await writeModel(root, 'glb', { name: 'a', animations: [clip] });
    const r = await readModel(asFiles(files));
    expect(r.animations.length).toBe(1);
    const merged = await convertModel(asFiles(files), 'glb', { merge: true });
    expect(merged.info).toContain('1 animation');
    expect(glbParts(await merged.files[0].blob.arrayBuffer()).json.animations).toBe(undefined);
    const kept = await convertModel(asFiles(files), 'glb', {});
    expect(glbParts(await kept.files[0].blob.arrayBuffer()).json.animations.length).toBe(1);
  });
});

describe('OBJ with MTL and textures', () => {
  it('writes the OBJ, the MTL and the texture as PNG, and reads all three back with the picture', async () => {
    const { files } = await writeModel(cube(), 'obj', { name: 'cube' });
    expect(files.map((f) => f.name)).toEqual(['cube.obj', 'cube.mtl', 'cube_Paint.png']);
    expect(await files[1].blob.text()).toContain('map_Kd cube_Paint.png');
    const png = new Uint8Array(await files[2].blob.arrayBuffer());
    expect([...png.slice(1, 4)].map((c) => String.fromCharCode(c)).join('')).toBe('PNG');
    await checkCube(files, { textured: true });
  });
});

describe('3MF, Collada, FBX', () => {
  it('3MF (a zip with the core model) reads as the cube', async () => {
    await checkCube([new File([await threeMf()], 'cube.3mf')]);
  });
  it('Collada (DAE) reads as the cube', async () => {
    await checkCube([new File([dae()], 'cube.dae')]);
  });
  it('FBX, ASCII and binary, read as the cube', async () => {
    await checkCube([new File([fbxAscii()], 'cube.fbx')]);
    await checkCube([new File([fbxBinary()], 'cube-binary.fbx')]);
    await expect(readModel(asFiles([new File(['; FBX 6.1.0 project file\nFBXVersion: 6100\n'], 'old.fbx')]))).rejects(/version/i);
  });
  it('a read model goes to every writer that reads back: DAE to OBJ, STL, PLY, GLB and glTF', async () => {
    const src = [{ name: 'cube.dae', blob: new Blob([dae()]) }];
    for (const to of ['obj', 'stl', 'ply', 'glb', 'gltf']) {
      const r = await convertModel(src, to, {});
      expect(r.files[0].name).toBe(`cube.${to}`);
      await checkCube(r.files);
    }
  });
});

describe('USDZ', () => {
  it('writes a USDZ package: a zip whose first file is model.usda, with the mesh (24 corners) and the texture inside', async () => {
    const { files } = await writeModel(cube(), 'usdz', { name: 'cube' });
    const bytes = new Uint8Array(await files[0].blob.arrayBuffer());
    expect(bytes[0] === 0x50 && bytes[1] === 0x4b).toBeTruthy();
    const zip = await readZip(files[0].blob);
    const names = [...zip.keys()];
    expect(names[0]).toBe('model.usda');
    expect(names.some((n) => /^textures\/.+\.png$/.test(n))).toBeTruthy();
    const usda = new TextDecoder().decode(zip.get('model.usda'));
    expect(usda).toContain('#usda 1.0');
    expect(usda).toContain('def Material');
    const geo = names.find((n) => /^geometries\/.+\.usda$/.test(n));
    const mesh = new TextDecoder().decode(zip.get(geo));
    expect(mesh).toContain('def Mesh');
    expect((mesh.match(/point3f\[\] points = \[([^\]]*)\]/) || [, ''])[1].split('),').length).toBe(24);
  });
});

describe('the cdn decoders (network mocked)', () => {
  const draco = JSON.stringify({ asset: { version: '2.0' }, extensionsUsed: ['KHR_draco_mesh_compression'], extensionsRequired: ['KHR_draco_mesh_compression'], scenes: [{ nodes: [] }] });
  it('a plain model fetches nothing', async () => {
    const before = decoders.requested.length;
    const { files } = await writeModel(cube({ texture: false }), 'glb', { name: 'p' });
    await readModel(asFiles(files));
    expect(decoders.requested.length).toBe(before);
  });
  it('a Draco glTF asks for the decoder at the pinned release tag (jsDelivr first) and refuses bytes with the wrong SHA-256', async () => {
    const urls = [];
    decoders.setFetch(async (url) => { urls.push(url); return { ok: true, status: 200, arrayBuffer: async () => new TextEncoder().encode('not the decoder').buffer }; });
    try {
      await expect(readModel([{ name: 'd.gltf', blob: new Blob([draco]) }])).rejects(/Draco mesh decoder.*checksum/);
      expect(urls[0]).toBe(decoders.CDN_BASE + 'draco/three-0.170.0/draco_wasm_wrapper.js');
      expect(urls[0].startsWith(`https://cdn.jsdelivr.net/gh/${decoders.CDN_BASE.match(/gh\/(.+?)@/)[1]}@v`) && /@v\d+\.\d+\.\d+\//.test(urls[0])).toBe(true);
      expect(urls[1].startsWith(`https://raw.githubusercontent.com/${decoders.CDN_BASE.match(/gh\/(.+?)@/)[1]}/v`) && /cdn\/v\d+\.\d+\.\d+\//.test(urls[1])).toBe(true);   // wrong bytes: the fallback is tried too
      decoders.setFetch(async () => ({ ok: false, status: 404 }));
      await expect(readModel([{ name: 'd.gltf', blob: new Blob([draco]) }])).rejects(/HTTP 404/);
    } finally { decoders.setFetch(null); }
  });
});

describe('the preview view', () => {
  it('draws a model in WebGL and names its counts and size (or skips without WebGL)', async () => {
    const el = document.createElement('div');
    el.style.cssText = 'width:200px;height:150px';
    document.body.append(el);
    const root = cube({ texture: false });
    expect(caption(root)).toBe('1 mesh · 12 triangles · 2 × 2 × 2 units');
    let v;
    try { v = view(el, root); } catch (e) { return; }
    expect(el.querySelector('canvas')).toBeTruthy();
    const px = new Uint8Array(4), gl = v.canvas.getContext('webgl2');
    gl.readPixels(Math.floor(v.canvas.width / 2), Math.floor(v.canvas.height / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    expect(px[3]).toBeGreaterThan(0);
    v.dispose();
    el.remove();
  });
});

SlopTest.run({ name: 'Shared 3D I/O' });
</script>
</body>
</html>
