<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop AI: system check</title></head>
<body>
    <script>try { localStorage.setItem('slop-firstrun:aitools', '1'); } catch (e) { /* private window */ }</script>
<script src="../harness.js"></script>
  <script src="../../shared/profile/profile.js"></script>
  <script src="../../shared/i18n/i18n.js"></script>
  <script src="util.js"></script>
  <script src="../../shared/ai/catalog.js"></script>
  <script src="../../shared/storage/quota.js"></script>
  <script src="../../shared/ai/sysinfo.js"></script>
  <script src="../../shared/ai/bench.js"></script>
  <script>
  const { describe, it, expect } = SlopTest;
  const K = SlopAIKit, S = K.sysinfo, L = K.catalog.list, by = (id) => K.catalog.byId(id);
  const V = (sys, frag) => S.verdict(AT.SYS[sys], L.find((m) => m.id.includes(frag)));
  describe('verdicts from mocked adapters', () => {
    it('no WebGPU: every model is "won’t fit" with the reason', () => {
      for (const m of L) { const v = S.verdict(AT.SYS.none, m); expect(v.level).toBe('no'); expect(v.reason).toMatch(/WebGPU/); }
    });
    it('an 8 GB integrated laptop runs 1–3B well and refuses 7B', () => {
      expect(V('laptop', 'Llama-3.2-1B').level).toBe('good');
      expect(V('laptop', 'Qwen2.5-1.5B-Instruct').level).toBe('good');
      expect(V('laptop', 'Llama-3.2-3B').level).toBe('good');
      expect(V('laptop', 'Phi-3.5').level).toBe('slow'); // 3.6 GB on a 4 GB budget: tight
      expect(V('laptop', 'Qwen2.5-7B').level).toBe('no');
      expect(V('laptop', 'Qwen2.5-7B').reason).toMatch(/GPU memory/);
    });
    it('speed estimates follow bandwidth and model size', () => {
      const small = V('laptop', 'Qwen2.5-0.5B').tps, mid = V('laptop', 'Llama-3.2-3B').tps;
      expect(small).toBeGreaterThan(mid);
      expect(mid).toBeGreaterThan(5);
      expect(V('gamer', 'Llama-3.2-3B').tps).toBeGreaterThan(mid * 5);
    });
    it('a discrete GPU runs everything, including 7B', () => {
      for (const m of L) expect(S.verdict(AT.SYS.gamer, m).level).toBe('good');
    });
    it('no shader-f16: loads the q4f32 build with its larger memory need', () => {
      const v = V('noF16', 'Llama-3.2-1B');
      expect(v.id).toBe('Llama-3.2-1B-Instruct-q4f32_1-MLC');
      expect(v.vram).toBeCloseTo(1128.82, 0.01);
      expect(K.catalog.idFor(by('Llama-3.2-1B-Instruct-q4f16_1-MLC'), AT.SYS.noF16)).toBe('Llama-3.2-1B-Instruct-q4f32_1-MLC');
      expect(K.catalog.idFor(by('Llama-3.2-1B-Instruct-q4f16_1-MLC'), AT.SYS.laptop)).toBe('Llama-3.2-1B-Instruct-q4f16_1-MLC');
    });
    it('a 128 MB binding limit allows only the low-resource builds', () => {
      expect(V('tinyBind', 'gemma-2-2b').level).toBe('no');
      expect(V('tinyBind', 'gemma-2-2b').reason).toMatch(/buffer limit/);
      expect(V('tinyBind', 'Llama-3.2-1B').level).not.toBe('no');
    });
    it('a software adapter is slow and gets a 1 GB budget', () => {
      expect(S.budgetMB(AT.SYS.software)).toBe(1024);
      expect(V('software', 'Qwen2.5-0.5B').level).toBe('slow');
      expect(V('software', 'Llama-3.2-3B').level).toBe('no');
    });
    it('without a benchmark it assumes a typical laptop', () => {
      const s = JSON.parse(JSON.stringify(AT.SYS.laptop)); s.bench = null;
      expect(S.bandwidth(s)).toBe(30);
      s.bench = { gflops: 600 }; expect(S.bandwidth(s)).toBe(50);
    });
  });
  describe('recommendations and help', () => {
    it('recommends the biggest fast general model, and a Coder for code', () => {
      expect(S.recommend(AT.SYS.laptop, L)).toBe('Llama-3.2-3B-Instruct-q4f16_1-MLC');
      expect(S.recommend(AT.SYS.gamer, L)).toBe('Qwen2.5-7B-Instruct-q4f16_1-MLC');
      expect(S.recommend(AT.SYS.gamer, L, 'code')).toBe('Qwen2.5-Coder-7B-Instruct-q4f16_1-MLC');
      expect(S.recommend(AT.SYS.laptop, L, 'code')).toBe('Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC');
      expect(S.recommend(AT.SYS.software, L)).toBe('Qwen2.5-0.5B-Instruct-q4f16_1-MLC');
      expect(S.recommend(AT.SYS.none, L)).toBe(null);
    });
    it('never recommends the research-only licence for general use', () => {
      for (const k of Object.keys(AT.SYS)) expect(S.recommend(AT.SYS[k], L)).not.toBe('Qwen2.5-3B-Instruct-q4f16_1-MLC');
    });
    it('explains how to get WebGPU per browser', () => {
      expect(S.help(AT.SYS.none).join(' ')).toMatch(/Firefox Nightly|dom\.webgpu\.enabled/);
      expect(S.help({ gpu: { ok: false, reason: 'no-api' }, browser: { name: 'Safari' } }).join(' ')).toMatch(/Safari 26/);
      expect(S.help({ gpu: { ok: false, reason: 'no-api' }, browser: { name: 'Chrome', os: 'Linux' } }).join(' ')).toMatch(/chrome:\/\/flags/);
      expect(S.help({ gpu: { ok: false, reason: 'no-adapter' }, browser: { name: 'Chrome', os: 'Windows' } }).join(' ')).toMatch(/blocklisted|driver/);
      expect(S.help(AT.SYS.software).join(' ')).toMatch(/software GPU/);
      expect(S.help(AT.SYS.laptop)).toEqual([]);
    });
  });
  describe('collect on this browser', () => {
    it('returns a plain JSON snapshot', async () => {
      const s = await S.collect({ bench: false });
      expect(typeof s.gpu.ok).toBe('boolean');
      expect(s.browser.name.length).toBeGreaterThan(0);
      expect(JSON.parse(JSON.stringify(s)).gpu.ok).toBe(s.gpu.ok);
      if (s.gpu.ok) { expect(s.gpu.limits.maxBufferSize).toBeGreaterThan(0); expect(s.gpu.adapter).toBeTruthy(); expect(Object.keys(s.gpu)).not.toContain('adapter'); }
    });
    it('the micro-benchmark measures GFLOPS and bandwidth', async () => {
      const s = await S.collect({ bench: true });
      if (!s.gpu.ok) return; // no WebGPU in this runner
      expect(s.bench.gflops).toBeGreaterThan(0);
      expect(s.bench.bandwidthGBs).toBeGreaterThan(0);
    }, { timeout: 60000 });
  });
  SlopTest.run({ name: 'Slop AI: system check' });
  </script>
</body>
</html>
