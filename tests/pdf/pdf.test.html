<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop PDF tests</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; } #app2 { width: 640px; height: 400px; }</style>
</head>
<body>
  <!-- The real app runs in a same-origin iframe; tests drive window.SP inside it. The Slop PDF specs are split over four
       pages (pdf, pdf-view, pdf-text, pdf-workspace) so they run in parallel; this one: core, export, open and save, redact, OCR. -->
  <iframe id="app"></iframe>
  <iframe id="app2"></iframe>
  <script src="../harness.js"></script>
  <script src="pdf.helpers.js"></script>
  <script src="pdf.spec-core.js"></script>
  <script src="pdf.spec-export.js"></script>
  <script src="pdf.spec-io.js"></script>
  <script src="pdf.spec-redact.js"></script>
  <script src="pdf.spec-ocr-shared.js"></script>
  <script src="pdf.spec-ocr.js"></script>
  <script src="pdf.spec-ocr-edit.js"></script>
  <script src="pdf.spec-ocr-small.js"></script>
  <script>SlopTest.run({ name: 'Slop PDF' });</script>
</body>
</html>
