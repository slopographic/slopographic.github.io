<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop PDF: text in other writing systems (Arabic, Hebrew, Devanagari) is kept, laid out by direction and saved</title>
  <style>body { margin: 0; } iframe { width: 1280px; height: 800px; border: 0; }</style>
</head>
<body>
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script src="pdf.helpers.js"></script>
  <script>
  // Covers: pdf/js/core/text-intl.js, pdf/js/core/text.js, pdf/js/core/fonts-custom.js, pdf/js/io/export.js, pdf/js/editor/text.js,
  //   pdf/js/editor/edit-text.js, pdf/js/editor/view.js, pdf/js/io/edit-log.js, pdf/index.html, shared/offline/manifest.js,
  //   shared/fonts/pdf-runs.js, shared/fonts/bidi.js
  // The language fonts are the real Noto files (tests/pdf/fixtures, SIL OFL); only the download is stubbed: SlopFontJIT
  // (tested in tests/fonts/jit.test.html) hands them over as if they had just been installed.
  const { describe, it, expect } = SlopTest;
  const FILES = { 'noto-arabic': ['NotoSansArabic-Regular.ttf', 'Noto Sans Arabic'], 'noto-hebrew': ['NotoSansHebrew-Regular.ttf', 'Noto Sans Hebrew'],
    'noto-devanagari': ['NotoSansDevanagari-Regular.ttf', 'Noto Sans Devanagari'],
    // an OpenType/CFF font (a subset of Noto Sans JP, tests/docs/fixtures): its PDF subset is where fontkit writes a bad header
    'noto-jp': ['../../docs/fixtures/noto-jp-test.otf', 'Noto Sans JP'] };
  const TEXT = 'Total מחיר 45 مرحبا 123 नमस्ते';
  let asked = [];
  async function stubJit() {
    const J = PT.win.SlopFontJIT;
    await J.deps();
    J.ready = async (text) => { asked.push(text); return true; };
    J.bytes = async (pack) => (FILES[pack] ? (await PT.fixture(FILES[pack][0])).buffer : null);
    J.family = async (pack) => (FILES[pack] ? FILES[pack][1] : '');
    J.face = async () => null;
  }
  describe('Slop PDF: other writing systems', () => {
    it('before its font is ready, a character the font cannot set shows as "?"; after, it is kept', async () => {
      await PT.boot(); PT.reset();
      await PT.open(await PT.makePdf([{ w: 420, h: 300 }]));
      expect(PT.E.sanitize('שלום', 'Helvetica')).toBe('????');
      expect(PT.E.needsScripts(TEXT, 'Helvetica')).toBe(true);
      await stubJit();
      expect(await PT.E.ensureScripts(TEXT, 'Helvetica', false)).toBe(true);
      expect(asked).toEqual([TEXT]);
      expect(PT.E.needsScripts(TEXT, 'Helvetica')).toBe(false);
      expect(PT.E.sanitize(TEXT, 'Helvetica')).toBe(TEXT);
    }, { timeout: 60000 });
    it('a line is cut into runs in visual order, each in the font that sets it', async () => {
      const runs = PT.E.runsOf('Total מחיר 45', 'Helvetica').map((r) => [r.text, r.font]);
      expect(runs[0]).toEqual(['Total ', 'Helvetica']);
      expect(runs.some(([t, f]) => t.includes('מחיר') && f === 'lang:noto-hebrew|400')).toBe(true);
      expect(PT.E.runsOf('مرحبا', 'Helvetica')[0].font).toBe('lang:noto-arabic|400');
      expect(PT.E.measure('مرحبا', 'Helvetica', 20) > 20).toBe(true);
    });
    it('the saved file has the text in every script, with no "?" in place of a letter', async () => {
      const p = PT.E.state.pages[0];
      const a = PT.win.SlopPdfFind.textAnnot(p, 30, 200, 16, TEXT, { font: 'Helvetica' });
      PT.E.commit('Add text', (st) => { st.pages[0].annots.push(JSON.parse(JSON.stringify(a))); });
      const out = await PT.read(await PT.E.build());
      const pg = await out.doc.getPage(1), got = (await pg.getTextContent()).items.map((i) => i.str).join(' ');
      const squash = got.replace(/\s+/g, '');
      expect(got.includes('?')).toBe(false);
      for (const w of ['Total', 'מחיר', '45', '123']) expect(squash.includes(w)).toBe(true);
      expect(/[؀-ۿ]{4}/.test(squash)).toBe(true);    // the Arabic word, shaped and embedded
      expect(/[ऀ-ॿ]{3}/.test(squash)).toBe(true);    // the Hindi word
    }, { timeout: 60000 });
    it('Japanese (a CFF font), Arabic and Hindi: the font files load in a reader, marks sit where the shaper put them, and the text has no control codes', async () => {
      const MIX = 'こんにちは世界 مرحبا بالعالم नमस्ते';
      expect(await PT.E.ensureScripts(MIX, 'Helvetica', false)).toBe(true);
      const p = PT.E.state.pages[0];
      const a = PT.win.SlopPdfFind.textAnnot(p, 30, 120, 18, MIX, { font: 'Helvetica' });
      PT.E.commit('Add text', (st) => { st.pages[0].annots.push(JSON.parse(JSON.stringify(a))); });
      const bytes = await PT.E.build(), L = PT.win.PDFLib;
      // every embedded CFF font program has a header offSize of 1 to 4 (fontkit 1.1.1 alone writes 24)
      const doc = await L.PDFDocument.load(bytes);
      let cff = 0; const subs = [];
      for (const [, obj] of doc.context.enumerateIndirectObjects()) {
        if (!(obj instanceof L.PDFRawStream)) continue;
        const sub = obj.dict.get(L.PDFName.of('Subtype'));
        if (sub) subs.push(sub.toString());
        if (!sub || !/CIDFontType0C|Type1C|OpenType/.test(sub.toString())) continue;
        const data = L.decodePDFRawStream(obj).decode();
        if (/OpenType/.test(sub.toString())) continue;
        expect(data[3] >= 1 && data[3] <= 4).toBe(true);
        cff++;
      }
      if (!cff) throw new Error('subs ' + subs.join(','));
      const out = await PT.read(bytes), pg = await out.doc.getPage(1), items = (await pg.getTextContent()).items;
      const all = items.map((i) => i.str).join('');
      expect(/[\u0000-\u0008\u000b-\u001f]/.test(all)).toBe(false);
      const squash = all.replace(/[\s\u034f]+/g, '');
      for (const w of ['こんにちは世界', 'नमस्ते']) expect(squash.includes(w)).toBe(true);
      expect(squash.includes('مرحبا') || squash.includes([...'مرحبا'].reverse().join(''))).toBe(true);
      // the dots Noto Sans Arabic draws as separate glyphs map to U+034F, and are written where the shaper put them: off the
      // point where the glyph before them ends (pdf-lib's drawText would put them there)
      expect(all.includes('\u034f')).toBe(true);
      const OPS = (await PT.E.pdfjs()).OPS, ol = await pg.getOperatorList();
      let tm = null, size = 0, prevEnd = null, checked = 0;
      ol.fnArray.forEach((fn, k) => {
        const args = ol.argsArray[k];
        if (fn === OPS.setFont) size = args[1];
        else if (fn === OPS.setTextMatrix) tm = args[0] || args;
        else if (fn === OPS.showText && tm) {
          const gl = args[0], x = tm[4];
          if (gl[0] && gl[0].unicode === '\u034f' && prevEnd != null) { expect(Math.abs(x - prevEnd) > 0.2).toBe(true); checked++; }
          prevEnd = x + gl.reduce((w, g) => w + (g && g.width ? g.width : 0), 0) * size / 1000;
        }
      });
      expect(checked).toBeGreaterThan(0);
      // the reader can render the page with those fonts: Japanese ink where the Japanese text is
      const vp = pg.getViewport({ scale: 2 }), c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      const jp = items.find((i) => i.str.includes('こ')), [x, y] = vp.convertToViewportPoint(jp.transform[4], jp.transform[5]);
      const px = c.getContext('2d').getImageData(Math.round(x), Math.round(y - 18 * 2), Math.round(jp.width * 2), 18 * 2).data;
      let ink = 0; for (let k = 0; k < px.length; k += 4) if (px[k + 3] > 0 && px[k] < 128) ink++;
      expect(ink).toBeGreaterThan(50);
    }, { timeout: 60000 });
    it('the editors type right to left where the text does', async () => {
      expect(PT.SP.editor._.ta.getAttribute('dir')).toBe('auto');
    });
  });
  SlopTest.run({ name: 'Slop PDF: other writing systems' });
  </script>
</body>
</html>
