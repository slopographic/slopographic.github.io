<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop PDF · view tests</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; } #app2 { width: 640px; height: 400px; }</style>
</head>
<body>
  <!-- The real app runs in a same-origin iframe; tests drive window.SP inside it. The Slop PDF specs are split over four
       pages (pdf, pdf-view, pdf-text, pdf-workspace) so they run in parallel; this one: thumbnails, context menu, commands, navigation, history, view, zoom, notes, watermark, rename. -->
  <iframe id="app"></iframe>
  <iframe id="app2"></iframe>
  <script src="../harness.js"></script>
  <script src="pdf.helpers.js"></script>
  <!-- the specs of this page expect the app booted, as the specs before them did when they shared one page -->
  <script>SlopTest.describe('setup', () => SlopTest.it('boots the app', () => PT.boot(), { timeout: 60000 }));</script>
  <script src="pdf.spec-thumbs.js"></script>
  <script src="pdf.spec-context.js"></script>
  <script src="pdf.spec-cmds.js"></script>
  <script src="pdf.spec-nav.js"></script>
  <script src="pdf.spec-history.js"></script>
  <script src="pdf.spec-view.js"></script>
  <script src="pdf.spec-zoomcentre.js"></script>
  <script src="pdf.spec-notes.js"></script>
  <script src="pdf.spec-watermark.js"></script>
  <script src="pdf.spec-rename.js"></script>
  <script>SlopTest.run({ name: 'Slop PDF · view' });</script>
</body>
</html>
