<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop PDF: mark up a text block or a range of words</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
  <!-- The select tool's block selection keeps the markup tools: Highlight, Underline, Strikethrough, Colour, Comment and Redact
       for the whole block (folded into "Mark up" on a narrow screen), and a range of words (a drag, a second click on the
       block, Edit ▸ Select text in block, a long press with drag handles) gets the full markup row.
       Covers: pdf/js/editor/block-mark.js, pdf/js/editor/sel-handles.js, pdf/js/editor/para-bar.js, pdf/js/editor/sel-actions.js,
         pdf/css/selbar.css -->
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script src="pdf.helpers.js"></script>
  <script src="para.helpers.js"></script>
  <script src="select-edit.helpers.js"></script>
  <script src="pdf.spec-markup-bar.js"></script>
  <script>SlopTest.run({ name: 'Slop PDF: mark up a text block or a range of words' });</script>
</body>
</html>
