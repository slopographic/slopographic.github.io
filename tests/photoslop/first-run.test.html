<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhotoSlop first-run tour tests</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script src="fresh-app.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  const tourOpen = (win) => !!(win.SlopTour && win.SlopTour.isOpen && win.SlopTour.isOpen());

  // Covers: photoslop/js/app/first-run.js
  describe('PhotoSlop tour on the first run', () => {
    it('waits when an AI app opened the page to pair (?connect=1): the pairing dialog first, the tour next time', async () => {
      const { win } = await freshApp({ tour: true, query: '?connect=1' });
      await waitFor(() => win.document.querySelector('.sbr-dialog'), { timeout: 20000 });
      await new Promise((r) => setTimeout(r, 1500));
      expect(tourOpen(win)).toBe(false);
      expect(localStorage.getItem('photoslop.tourShown')).toBe(null);
      win.document.querySelector('.sbr-dialog .sui-x').click();
    }, { timeout: 40000 });

    it('opens the tour by itself on the first run and remembers it in localStorage', async () => {
      const { win } = await freshApp({ tour: true });
      await waitFor(() => tourOpen(win), { timeout: 20000 });
      expect(localStorage.getItem('photoslop.tourShown')).toBe('1');
      expect(win.document.querySelector('.stour-btn')).toBeTruthy();
      win.SlopTour.close();
    }, { timeout: 40000 });

    it('does not open the tour again once it has been shown', async () => {
      const { win } = await freshApp({ keep: true });
      await new Promise((r) => setTimeout(r, 1500));
      expect(tourOpen(win)).toBe(false);
      expect(win.document.querySelector('.stour-btn')).toBeTruthy();
    }, { timeout: 40000 });

    it('keeps the Tour button, which still starts the tour', async () => {
      const { win } = await freshApp({ keep: true });
      win.document.querySelector('.stour-btn').click();
      await waitFor(() => tourOpen(win), { timeout: 20000 });
      win.SlopTour.close();
    }, { timeout: 40000 });

    it('the tour opens on the New button, which starts a file', async () => {
      const { win } = await freshApp({ keep: true });
      win.document.querySelector('.stour-btn').click();
      await waitFor(() => tourOpen(win), { timeout: 20000 });
      await waitFor(() => win.document.body.textContent.includes('Start a file'), { timeout: 5000 });
      expect(win.document.body.textContent).toContain('New sets the size, preset and background');
      win.SlopTour.close();
    }, { timeout: 40000 });
  });

  SlopTest.run({ name: 'PhotoSlop first-run tour' });
  </script>
</body>
</html>
