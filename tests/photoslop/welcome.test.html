<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhotoSlop welcome card: what it makes and how, a sample photo, gone at the first stroke; at 1280 and 390 px</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <!-- Covers: photoslop/js/app/welcome.js, photoslop/js/app/main.js, photoslop/js/app/tabs.js, photoslop/css/layout.css,
       photoslop/index.html, assets/shots/photoslop.jpg -->
  <script src="../harness.js"></script>
  <script src="fresh-app.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  const card = (win) => win.document.getElementById('psWelcome');

  describe('PhotoSlop welcome card on a first blank canvas', () => {
    it('shows what PhotoSlop makes and how, over the blank canvas, with one drop zone', async () => {
      const { win } = await freshApp();
      expect(!!card(win)).toBe(true);
      expect(card(win).querySelectorAll('.sd-steps li').length).toBe(3);
      SlopTest.shot(card(win).querySelector('.sd-pic img'), '../assets/shots/photoslop.jpg');
      expect(win.document.querySelectorAll('.sd-zone').length).toBe(1);
    }, { timeout: 40000 });

    it('Try it with a sample photo opens the sample as a tab, and the card goes', async () => {
      const { win, W } = await freshApp();
      win.document.getElementById('psWelcomeSample').dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true }));
      win.document.getElementById('psWelcomeSample').click();
      await waitFor(() => W.D.name === 'Sample sunset', { timeout: 20000 });
      expect(W.D.w).toBe(1600);
      expect(W.D.h).toBe(1000);
      expect(card(win)).toBe(null);
    }, { timeout: 40000 });

    it('a stroke on the canvas closes the card, and Start with this blank canvas does too', async () => {
      let { win } = await freshApp();
      win.document.getElementById('view').dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, clientX: 300, clientY: 300 }));
      win.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, clientX: 300, clientY: 300 }));
      expect(card(win)).toBe(null);
      ({ win } = await freshApp());
      [...card(win).querySelectorAll('button')].find((b) => b.textContent === win.SlopI18n.t('photoslop.welcome.blank')).click();
      expect(card(win)).toBe(null);
    }, { timeout: 60000 });

    it('at 390 px the card fits the canvas area and nothing scrolls sideways', async () => {
      const { win, frame } = await freshApp();
      frame.style.width = '390px'; frame.style.height = '844px';
      await waitFor(() => win.innerWidth === 390);
      await new Promise((r) => setTimeout(r, 200));
      const r = card(win).querySelector('.ps-welcome-card').getBoundingClientRect();
      expect(r.left >= 0 && r.right <= 390).toBe(true);
      expect(win.document.documentElement.scrollWidth <= 390).toBe(true);
    }, { timeout: 40000 });
  });
  SlopTest.run({ name: 'PhotoSlop welcome card' });
  </script>
</body>
</html>
