<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PhotoSlop masks tests</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <iframe id="app" src="../../photoslop/index.html"></iframe>
  <script src="../harness.js"></script>
  <script src="masks-helpers.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  describe('PhotoSlop masks: the app', () => {
    it('boots', async () => {
      await bootApp();
      expect(typeof W.addMask).toBe('function');
      expect(typeof W.invertMask).toBe('function');
      expect(typeof W.setClipping).toBe('function');
      expect(typeof W.selectSubject).toBe('function');
    }, { timeout: 40000 });
  });
  describe('Select Subject and Layer via Cut', () => {
    /** A white page with a black disc at the centre (on its own layer, 'Scene'). */
    async function makeDisc() {
      await makeDoc('#ffffff');
      const c = W.mkCanvas(300, 200), g = W.cx(c); g.fillStyle = '#000'; g.beginPath(); g.arc(150, 100, 50, 0, Math.PI * 2); g.fill();
      W.addLayer({ name: 'Scene', canvas: c }, 'Add Scene');
    }
    it('Subject selects the disc (the vendored model), and Layer via Cut moves it to a new layer', async () => {
      await makeDisc();
      await W.selectSubject();
      expect(!!W.D.sel).toBe(true);
      expect(pixel(W.D.sel.mask, 150, 100)[3]).toBeGreaterThan(128);
      expect(pixel(W.D.sel.mask, 10, 10)[3]).toBeLessThan(128);
      const n = W.D.layers.length;
      run('Layer', 'Layer via Cut');
      expect(W.D.layers.length).toBe(n + 1);
      expect(pixel(layerNamed('Scene').canvas, 150 - layerNamed('Scene').x, 100 - layerNamed('Scene').y)[3]).toBe(0);
      expect(pixel(W.activeLayer().canvas, 150 - W.activeLayer().x, 100 - W.activeLayer().y)[3]).toBeGreaterThan(128);
    }, { timeout: 60000 });
    it('without the model, Subject falls back to the colour difference from the border', async () => {
      await makeDisc();
      const saved = win.SlopCutout; win.SlopCutout = null;
      try { await W.selectSubject(); } finally { win.SlopCutout = saved; }
      expect(!!W.D.sel).toBe(true);
      expect(pixel(W.D.sel.mask, 150, 100)[3]).toBeGreaterThan(128);
      expect(pixel(W.D.sel.mask, 10, 10)[3]).toBeLessThan(128);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Select Subject');
    }, { timeout: 30000 });
  });
  describe('Mask menus, panel button and live painting', () => {
    const doc = () => win.document;
    const menuLabels = () => [...doc().querySelectorAll('.sui-menu .sui-lbl')].map((x) => x.textContent);
    const clickRow = (label) => { const row = [...doc().querySelectorAll('.sui-menu .sui-row')].find((r) => r.querySelector('.sui-lbl').textContent === label); expect(!!row).toBe(true); row.click(); };
    const sel = (fn) => { W.selectShape(fn); };
    /** Doc point to viewport client point. */
    const at = (p) => { const el = W.eval('V.el'), r = el.getBoundingClientRect(), s = W.eval(`toScreen(${p.x}, ${p.y})`); return { el, x: r.left + s.x, y: r.top + s.y }; };
    const pe = (type, p) => new win.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 9, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: p.x, clientY: p.y });

    it('the Mask submenu lists Add (with the three options), Delete, Invert, Apply and Disable', async () => {
      await makeDoc();
      const mask = menuItem('Layer', 'Mask');
      expect(mask.sub.map((x) => x.label)).toEqual(['Add', 'Delete', 'Invert', 'Apply', 'Disable']);
      expect(mask.sub[0].sub.map((x) => x.label)).toEqual(['Reveal All', 'Hide All', 'From Selection']);
    });

    it('the right-click menu of a layer offers Add layer mask with the same options', async () => {
      await makeDoc();
      const row = doc().querySelector('.layers li.layer.active');
      const r = row.getBoundingClientRect();
      row.dispatchEvent(new win.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2, clientX: r.left + 5, clientY: r.top + 5 }));
      const top = [...doc().querySelectorAll('.sui-menu .sui-row')].find((x) => x.querySelector('.sui-lbl').textContent === 'Add layer mask');
      expect(!!top).toBe(true);
      top.dispatchEvent(new win.MouseEvent('pointerenter', { bubbles: true }));
      top.focus(); top.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
      const flyout = doc().querySelectorAll('.sui-menu')[1];
      expect(flyout ? [...flyout.querySelectorAll('.sui-lbl')].map((x) => x.textContent) : []).toEqual(['Reveal All', 'Hide All', 'From Selection']);
      win.SlopUI.closeMenu();
    });

    it('the panel mask button with a selection: From Selection makes the mask, one undo step, and the thumbnail appears', async () => {
      await makeDoc();
      sel((g) => g.fillRect(50, 50, 100, 60));
      const n = W.Hist.idx;
      doc().querySelector('button[aria-label="Add layer mask"]').click();
      clickRow('From Selection');
      expect(!!W.activeLayer().mask).toBe(true);
      expect(W.D.sel).toBe(null);
      expect(maskAt(W.activeLayer(), 100, 80)).toBe(255);
      expect(maskAt(W.activeLayer(), 10, 10)).toBe(0);
      expect(W.Hist.idx).toBe(n + 1);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Add Layer Mask');
      await sleep(30);
      expect(!!doc().querySelector('.layers .lp-thumb.mask')).toBe(true);
      W.undo(); expect(!!W.activeLayer().mask).toBe(false); W.redo();
      expect(!!W.activeLayer().mask).toBe(true);
    });

    it('From Selection needs a selection: the menu item is disabled without one', async () => {
      await makeDoc(); W.deselect && W.D.sel && W.deselect();
      W.D.sel = null;
      doc().querySelector('button[aria-label="Add layer mask"]').click();
      const row = [...doc().querySelectorAll('.sui-menu .sui-row')].find((r) => r.querySelector('.sui-lbl').textContent === 'From Selection');
      expect(row.disabled).toBe(true);
      win.SlopUI.closeMenu();
    });

    it('while the mask is edited with the overlay on, the viewport tints where it hides', async () => {
      await makeDoc('#000000'); W.addMask('hide'); W.UI.editMask = true; W.UI.maskOverlay = true; W.dirty(true);
      await sleep(80);
      const s = W.eval('toScreen(60, 60)'), dpr = W.V.dpr;
      const p = pixel(W.V.el.getContext ? W.V.el : W.V.el.querySelector('canvas'), Math.round(s.x * dpr), Math.round(s.y * dpr));
      expect(p[0] > p[1] + 60).toBe(true);
      W.UI.editMask = false; W.dirty(true);
      await sleep(60);
      const q = pixel(W.V.el.getContext ? W.V.el : W.V.el.querySelector('canvas'), Math.round(s.x * dpr), Math.round(s.y * dpr));
      expect(q[0] > q[1] + 60).toBe(false);
      W.UI.maskOverlay = false;
    });
    it('painting on the mask updates the canvas during the stroke, before the mouse is released', async () => {
      await makeDoc(); W.addMask('hide'); W.UI.editMask = true;
      W.selectTool('brush'); W.eval('T.brush.size = 30; T.brush.pressure = false; T.brush.hardness = 1');
      W.setColor('fg', '#ffffff');
      const a = at({ x: 60, y: 50 }), b = at({ x: 120, y: 50 }), c = at({ x: 150, y: 50 });
      a.el.dispatchEvent(pe('pointerdown', a));
      a.el.dispatchEvent(pe('pointermove', b));
      await sleep(80);
      // still held down: the viewport shows the stroke (the layer is revealed where it has been painted)
      expect(pixel(W.V.comp, 90, 50)[0]).toBe(0);
      expect(pixel(W.V.comp, 20, 100)[0]).toBe(255);
      a.el.dispatchEvent(pe('pointermove', c));
      a.el.dispatchEvent(pe('pointerup', c));
      await sleep(40);
      expect(maskAt(W.activeLayer(), 90, 50)).toBeGreaterThan(200);
      expect(colorAt(90, 50)[0]).toBe(0);
      expect(W.Hist.states[W.Hist.idx].label).toBe('Brush');
      W.UI.editMask = false;
    }, { timeout: 30000 });
  });
  describe('Menu bar submenus', () => {
    it('a menu-bar submenu opens beside its row, to the right of the menu, and Escape closes it first', async () => {
      await makeDoc();
      const bar = [...win.document.querySelectorAll('.mb-item')].find((b) => b.textContent === 'Layer');
      bar.dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true, cancelable: true, button: 0 }));
      const parent = win.document.querySelector('.menu'), row = [...parent.querySelectorAll('.menu-row')].find((r) => r.querySelector('.menu-label').textContent === 'Mask');
      expect(!!row).toBe(true);
      row.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
      const menus = win.document.querySelectorAll('.menu');
      expect(menus.length).toBe(2);
      expect(menus[1].getBoundingClientRect().left >= parent.getBoundingClientRect().right).toBe(true);
      menus[1].querySelector('.menu-row').dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      expect(win.document.querySelectorAll('.menu').length).toBe(1);
      win.SlopUI.closeMenu();
      win.document.querySelectorAll('.menu').forEach((m) => m.remove());
    });
  });
  SlopTest.run({ name: 'PhotoSlop masks: subject and menus' });
  </script>
</body>
</html>
