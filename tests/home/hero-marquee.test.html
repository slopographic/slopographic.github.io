<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="slop-test-needs" content="tone=playful">
  <title>Homepage · the capability strip links the apps and turns the globe</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; } iframe { display: block; border: 0; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="hero-boot.js"></script>
  <script>
  // Covers: home/marquee.js, tools/seo/marquee.mjs, shared/apps.js, home/hero.css, index.html
  /* Each label in the strip under the hero is a link to its app (from the registry); pointing at one or focusing it turns
   * the globe to that app, highlights it and shows its name, and the strip pauses. One tab stop, the arrow keys move; the
   * looping copy is aria-hidden and never focusable. A plain-names profile shows the registry's names (slopAppName). */
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  let win, doc;
  const ready = HeroTest.open({ width: 1280 }).then((w) => { win = w; doc = w.document; });
  const lists = () => doc.querySelectorAll('.hx-marquee .mq-list');
  const links = (i) => [...lists()[i].querySelectorAll('a')];
  const paused = () => doc.querySelector('.mq-track').getAnimations().every((a) => a.playState === 'paused');

  describe('the capability strip', () => {
    it('every label is a link to its app from the registry; the aria-hidden copy is out of the tab order', async () => {
      await ready;
      const one = links(0), two = links(1);
      expect(one.length).toBe(lists()[0].children.length);
      expect(one.length).toBeGreaterThan(20);
      for (const a of one) {
        const app = win.SLOP_APPS.find((x) => x.id === a.dataset.id);
        if (!app) throw new Error('no app for ' + a.dataset.id);
        expect(a.getAttribute('href')).toBe(app.path);
      }
      expect(two.map((a) => a.getAttribute('href'))).toEqual(one.map((a) => a.getAttribute('href')));
      expect(lists()[1].getAttribute('aria-hidden')).toBe('true');
      expect(two.every((a) => a.tabIndex === -1)).toBe(true);
      expect(doc.querySelectorAll('.hx-marquee a[tabindex="0"]').length).toBe(1);
      expect(one[0].tabIndex).toBe(0);
      // it starts with the lead apps (shared/apps.js SLOP_LEAD: the PDF family the globe opens on), in their order
      const lead = win.SLOP_LEAD || [];
      if (win.SLOP_APPS.some((x) => x.id === 'pdf')) expect(lead[0]).toBe('pdf');
      expect(one.slice(0, lead.length).map((a) => a.dataset.id)).toEqual(lead);
    }, { timeout: 60000 });

    it('focus turns the globe to the app, highlights it and shows its name; arrows move; the strip pauses', async () => {
      await ready;
      const [a, b] = links(0);
      a.focus();
      expect(win.SlopGlobe.view().focus).toBe(a.dataset.id);
      const ic = () => win.SlopGlobe.icons().find((i) => i.id === win.SlopGlobe.view().focus);
      expect(ic().el.classList.contains('is-hot')).toBe(true);
      await waitFor(() => win.getComputedStyle(ic().el.querySelector('.gx-name')).visibility === 'visible', { timeout: 3000 });   // after its short fade
      await waitFor(() => ic().z > 0.9, { timeout: 8000 });
      expect(paused()).toBe(true);
      a.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
      expect(doc.activeElement).toBe(b);
      expect(b.tabIndex).toBe(0);
      expect(a.tabIndex).toBe(-1);
      expect(win.SlopGlobe.view().focus).toBe(b.dataset.id);
      b.blur();
      await sleep(50);
      expect(win.SlopGlobe.view().focus).toBe(null);
      expect(doc.querySelectorAll('.gx-i.is-hot').length).toBe(0);
    }, { timeout: 60000 });

    it('pointing at a label does the same (the copy\'s labels too); leaving lets the globe go', async () => {
      await ready;
      if (doc.activeElement && doc.activeElement.blur) doc.activeElement.blur();
      const a = links(1)[3];
      a.dispatchEvent(new win.PointerEvent('pointerover', { bubbles: true }));
      expect(win.SlopGlobe.view().focus).toBe(a.dataset.id);
      a.dispatchEvent(new win.PointerEvent('pointerout', { bubbles: true, relatedTarget: doc.body }));
      expect(win.SlopGlobe.view().focus).toBe(null);
    }, { timeout: 30000 });

    it('reduced motion stands the strip still', async () => {
      await ready;
      const rules = [...doc.styleSheets].flatMap((s) => { try { return [...s.cssRules]; } catch (e) { return []; } });
      expect(rules.some((r) => r.media && /reduce/.test(r.media.mediaText) && [...r.cssRules].some((x) => x.selectorText === '.mq-track' && x.style.animationName === 'none'))).toBe(true);
    });

    it('a plain-names profile shows each app\'s registry name (slopAppName), in both lists', async () => {
      await ready;
      win.SLOP_NAMING = 'plain';
      win.dispatchEvent(new win.CustomEvent('slop-lang', { detail: { code: 'en' } }));
      for (const a of doc.querySelectorAll('.hx-marquee a')) expect(a.textContent).toBe(win.slopAppName(a.dataset.id));
      win.SLOP_NAMING = 'brand';
    });
  });

  ready.then(() => run({ name: 'Homepage · the capability strip links the apps and turns the globe' }));
  </script>
</body>
</html>
