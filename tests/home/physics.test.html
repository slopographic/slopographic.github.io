<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="slop-test-needs" content="mascot=builtin">
  <title>Homepage · Sloppo physics</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="boot.js"></script>
  <script>
  // Covers: shared/buddy/motion.js, shared/roam/path.js (the hop's arc and timing)
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  let win, doc, S, M;
  const ready = HomeTest.openHome().then(async (w) => {
    win = w; doc = w.document; S = w.SlopMascot; M = S.M;
    doc.documentElement.style.scrollBehavior = 'auto';
    await HomeTest.settled(win);
  });
  const calm = () => { M.nextIdle = performance.now() + 1e7; };   // no idle hops during a test
  async function standOn(el, frac = 0.5) {
    win.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + win.scrollY - 260));
    await sleep(60);
    calm();
    expect(await S.hopTo({ el, frac })).toBe(true);
    calm();
    expect(M.perch.el).toBe(el);
  }
  const landed = () => waitFor(() => M.mode === 'perched', { timeout: 8000 });

  describe('falling when the floor goes away', () => {
    it('removing the element under him makes him fall and land lower', async () => {
      await ready;
      // The intro ledge is absolutely positioned, so removing it does not move anything else.
      const h = doc.querySelector('.stage-ledge'), parent = h.parentNode, next = h.nextSibling;
      win.scrollTo(0, 0);
      await standOn(h);
      const y0 = M.y;
      h.remove();
      await waitFor(() => M.mode === 'air', { timeout: 1000, step: 5 });
      expect(S.face()).toEqual(['normal', 'o']);
      await landed();
      expect(M.y).toBeGreaterThan(y0);
      expect(M.perch === null || M.perch.el !== h).toBe(true);
      parent.insertBefore(h, next);
    });
    it('a blast hole under his feet drops him through the card', async () => {
      await ready;
      const card = doc.querySelector('.app-card');
      await standOn(card, 0.5);
      const y0 = M.y;
      const rnd = win.Math.random;
      win.Math.random = () => 0.9;               // a burn hole, not just a crack
      try { S.impact(card, M.x, M.y + 3); } finally { win.Math.random = rnd; }
      expect(S.perches.solidAt(card, M.x)).toBe(false);
      await waitFor(() => M.mode === 'air', { timeout: 1000, step: 5 });
      await landed();
      expect(M.y).toBeGreaterThan(y0);
    });
    it('Restore page puts him back on solid ground', async () => {
      await ready;
      S.restore();
      await landed();
      const pt = S.perches.point(M.perch);
      expect(!!pt).toBe(true);
      expect(S.perches.solidAt(M.perch.el, pt.x)).toBe(true);
      expect(S.journal).toBe(0);
    });
    it('eating the letters under his feet makes him fall', async () => {
      await ready;
      const h = doc.getElementById('business-title');   // the Slop 365 heading (was "Apps")
      await standOn(h, 0.5);
      for (let i = 0; i < 4 && M.mode === 'perched' && M.perch.el === h; i++) await S.act('eat');
      // Either he fell through a gap, or the letters under him are still there.
      if (M.mode === 'perched' && M.perch && M.perch.el === h) expect(S.perches.solidAt(h, M.x)).toBe(true);
      else await landed();
      S.restore();
      await landed();
    }, { timeout: 25000 });
  });

  describe('knocked cards are rigid bodies', () => {
    it('fall, bounce, come to rest on the page bottom, and can be ridden', async () => {
      await ready;
      await standOn(doc.querySelector('.app-card'), 0.5);
      expect(await S.act('knock')).toBe(true);   // knocks a card he hops onto
      expect(S.bodies()).toBe(1);
      expect(M.mode).toBe('air');                // he loses his footing too
      const card = [...doc.querySelectorAll('[data-perch="card"]')].find((c) => c.style.pointerEvents === 'none');
      const bottom = () => card.getBoundingClientRect().bottom + win.scrollY;
      const floor = doc.querySelector('body > footer').getBoundingClientRect().top + win.scrollY - 2;
      // Resting: on the footer and still there a moment later (it may bounce and tip over first).
      await waitFor(async () => { if (Math.abs(bottom() - floor) >= 30) return false; await sleep(400); return Math.abs(bottom() - floor) < 30; }, { timeout: 20000 });
      if (Math.abs(bottom() - floor) >= 30) throw new Error(`card bottom ${bottom()} vs floor ${floor}: ${card.style.transform} ${card.getBoundingClientRect().height}`);
      win.scrollTo(0, floor - win.innerHeight + 40);
      await sleep(60);
      calm();
      expect(await S.hopTo({ el: card, frac: 0.5 })).toBe(true);
      await sleep(300);
      expect(M.perch.el).toBe(card);
      S.restore();
      await sleep(60);
      expect(S.bodies()).toBe(0);
      expect(card.hasAttribute('style')).toBe(false);
      await landed();
    }, { timeout: 35000 });
    it('two knocked cards collide instead of overlapping', async () => {
      await ready;
      S.restore();
      await landed();
      await standOn(doc.querySelector('.app-card'), 0.5);
      await S.act('knock');
      await landed();
      for (let i = 0; i < 4 && S.bodies() < 2; i++) {
        await standOn([...doc.querySelectorAll('.app-card')].filter((c) => !c.style.transform)[0], 0.5);
        await S.act('knock');
      }
      expect(S.bodies()).toBe(2);
      const [a, b] = [...doc.querySelectorAll('[data-perch="card"]')].filter((c) => c.style.pointerEvents === 'none');
      // both at rest (neither moved 2 px in 400 ms), or 5 s on, as before: then they must not overlap
      const at = () => [a, b].map((c) => { const r = c.getBoundingClientRect(); return [r.left, r.top]; }).flat();
      await waitFor(async () => { const p = at(); await sleep(400); return at().every((v, i) => Math.abs(v - p[i]) < 2); }, { timeout: 5000 / (window.__SLOPTEST_SCALE__ || 1), step: 0 }).catch(() => {});
      const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
      const ox = Math.min(ra.right, rb.right) - Math.max(ra.left, rb.left), oy = Math.min(ra.bottom, rb.bottom) - Math.max(ra.top, rb.top);
      expect(ox > 20 && oy > 20).toBe(false);
      S.restore();
      await landed();
    }, { timeout: 40000 });
  });

  ready.then(() => sleep(100)).then(() => run());
  </script>
</body>
</html>
