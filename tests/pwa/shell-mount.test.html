<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The shell registers the offline worker on apps that do not themselves, so every app works offline after its first visit</title>
  <style>body { margin: 0; } iframe { width: 1000px; height: 600px; border: 0; }</style>
</head>
<body>
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script>
  // Covers: shell/shell.js, shared/pwa.js
  const { describe, it, expect, waitFor } = SlopTest;
  async function open(app) {
    const f = document.getElementById('app');
    f.src = `../../${app}/index.html`;
    await waitFor(() => f.contentWindow && f.contentWindow.document.readyState === 'complete' && f.contentWindow.SlopShell && f.contentWindow.SlopPWA, { timeout: 30000 });
    return f.contentWindow;
  }
  describe('The offline worker on every app', () => {
    for (const app of ['signature', 'sorter']) {
      it(`${app}: the page does not mount it, the shell does after load`, async () => {
        const W = await open(app);
        await waitFor(() => W.SlopPWA.mounted(), { timeout: 8000 });
        expect(W.SlopPWA.mounted()).toBe(true);
      }, { timeout: 45000 });
    }
    it('a page that mounts it itself keeps its own mount (the shell does not mount twice)', async () => {
      const W = await open('pdf');
      await waitFor(() => W.SlopPWA.mounted(), { timeout: 8000 });
      expect(W.SlopPWA.mount({})).toBe(false);   // already mounted once
    }, { timeout: 45000 });
  });
  SlopTest.run({ name: 'Offline worker on every app' });
  </script>
</body>
</html>
