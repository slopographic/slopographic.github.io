<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PWA · service worker</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect } = SlopTest;
  const ORIGIN = location.origin;
  let src = '';
  let sw = null;

  // Runs service-worker.js against fake self / caches / fetch so each rule can be checked directly.
  function fakeCaches() {
    const stores = {};
    return {
      stores,
      async open(name) { stores[name] = stores[name] || new Map(); const m = stores[name]; return { match: async (k) => m.get(k), put: async (k, v) => { m.set(k, v); }, }; },
      async keys() { return Object.keys(stores); },
      async delete(name) { delete stores[name]; return true; },
    };
  }
  function load({ fetchImpl } = {}) {
    const listeners = {};
    const self = { location: new URL(ORIGIN + '/service-worker.js'), addEventListener: (t, fn) => { listeners[t] = fn; }, skipWaiting: async () => {}, clients: { claim: async () => {} } };
    const caches = fakeCaches();
    const calls = [];
    const fetchFn = async (req) => { calls.push(typeof req === 'string' ? req : req.url); return fetchImpl ? fetchImpl(req) : { ok: true, status: 200, type: 'basic', clone() { return this; } }; };
    // importScripts() loads each sw-precache*.js part in the real worker; here their source is put in front of the worker source.
    const api = new Function('self', 'caches', 'fetch', 'Response', 'importScripts', src + '\nreturn { PRECACHE, CACHE, OFFLINE, STATIC };')(self, caches, fetchFn, { error: () => ({ error: true }) }, () => {});
    return { ...api, listeners, caches, calls };
  }
  function fetchEvent(url, { method = 'GET', mode = 'no-cors', accept = '' } = {}) {
    return { request: { url, method, mode, headers: { get: (h) => (h === 'accept' ? accept : null) } }, responded: null, respondWith(p) { this.responded = p; } };
  }
  const handle = (ev) => { sw.listeners.fetch(ev); return ev.responded; };

  describe('service-worker.js source', () => {
    it('loads and names a versioned cache', async () => {
      const mainSrc = await (await fetch('/service-worker.js')).text();
      const parts = [...mainSrc.matchAll(/'\/(sw-precache[^']*\.js)'/g)].map((m) => m[1]);
      src = (await Promise.all(parts.map(async (f) => (await fetch('/' + f)).text()))).join('\n') + '\n' + mainSrc;
      sw = load();
      expect(sw.CACHE).toMatch(/^slopographic-v-[0-9a-f]{12}$/); // VERSION is generated by tools/pwa-precache.mjs
      expect(sw.OFFLINE).toBe('/offline.html');
    });
    it('every precache entry exists on disk', async () => {
      // Batches: about 1,400 paths at once exhaust the browser's connections and fail with "Failed to fetch".
      const results = [];
      for (let i = 0; i < sw.PRECACHE.length; i += 32) {
        results.push(...(await Promise.all(sw.PRECACHE.slice(i, i + 32).map((p) => fetch(p).then((r) => [p, r.status])))));
      }
      expect(results.filter(([, s]) => s !== 200)).toEqual([]);
    }, { timeout: 60000 }); // about 1,600 files now; 15 s was too tight when the machine is busy
    it('the precache list has no duplicates and includes the boot pages', async () => {
      expect(new Set(sw.PRECACHE).size).toBe(sw.PRECACHE.length);
      for (const p of ['/index.html', '/drive/index.html', '/offline.html', '/manifest.webmanifest', '/shared/pwa.js', '/favicon.svg']) expect(sw.PRECACHE).toContain(p);
    });
    it('the precache covers every static file the homepage and Slop Drive load at boot', async () => {
      const refs = [];
      for (const page of ['/index.html', '/drive/index.html']) {
        const doc = new DOMParser().parseFromString(await (await fetch(page)).text(), 'text/html');
        doc.querySelectorAll('script[src], link[rel="stylesheet"][href], link[rel="manifest"][href]').forEach((el) => {
          const u = new URL(el.getAttribute('src') || el.getAttribute('href'), ORIGIN + page);
          if (u.origin === ORIGIN) refs.push(u.pathname);
        });
      }
      const missing = refs.filter((p) => !sw.PRECACHE.includes(p));
      expect(missing).toEqual([]);
    });
  });

  describe('fetch handling', () => {
    it('ignores cross-origin GET requests', () => {
      expect(handle(fetchEvent('https://example.com/lib.js', { mode: 'cors' }))).toBe(null);
      expect(handle(fetchEvent('https://fonts.googleapis.com/css2?family=Inter', { mode: 'no-cors' }))).toBe(null);
    });
    it('ignores non-GET same-origin requests', () => {
      expect(handle(fetchEvent(ORIGIN + '/shared/pwa.js', { method: 'POST' }))).toBe(null);
      expect(handle(fetchEvent(ORIGIN + '/drive/', { method: 'PUT', mode: 'navigate', accept: 'text/html' }))).toBe(null);
    });
    it('ignores data: and blob: URLs', () => {
      expect(handle(fetchEvent('data:text/plain,hi'))).toBe(null);
    });
    it('handles same-origin GET navigations and static files', () => {
      expect(handle(fetchEvent(ORIGIN + '/drive/', { mode: 'navigate', accept: 'text/html' }))).not.toBe(null);
      expect(handle(fetchEvent(ORIGIN + '/shared/pwa.js'))).not.toBe(null);
    });
    it('leaves same-origin requests that are neither pages nor static files to the network', () => {
      expect(handle(fetchEvent(ORIGIN + '/api/data', { mode: 'cors', accept: 'application/json' }))).toBe(null);
    });
    it('serves the offline page when a navigation fails and nothing is cached', async () => {
      const w = load({ fetchImpl: () => { throw new TypeError('offline'); } });
      w.caches.stores[w.CACHE] = new Map([[ORIGIN + '/offline.html', 'OFFLINE PAGE']]);
      const ev = fetchEvent(ORIGIN + '/nope/', { mode: 'navigate', accept: 'text/html' });
      w.listeners.fetch(ev);
      expect(await ev.responded).toBe('OFFLINE PAGE');
    });
    it('serves a saved copy of a folder page (/drive/ is stored as /drive/index.html)', async () => {
      const w = load({ fetchImpl: () => { throw new TypeError('offline'); } });
      w.caches.stores[w.CACHE] = new Map([[ORIGIN + '/drive/index.html', 'DRIVE PAGE']]);
      const ev = fetchEvent(ORIGIN + '/drive/?x=1', { mode: 'navigate', accept: 'text/html' });
      w.listeners.fetch(ev);
      expect(await ev.responded).toBe('DRIVE PAGE');
    });
    it('caches a successful same-origin navigation for later offline use', async () => {
      const w = load();
      const ev = fetchEvent(ORIGIN + '/photoslop/', { mode: 'navigate', accept: 'text/html' });
      w.listeners.fetch(ev);
      await ev.responded;
      expect(w.caches.stores[w.CACHE].has(ORIGIN + '/photoslop/index.html')).toBe(true);
    });
  });

  describe('install and activate', () => {
    it('precaches every entry and skips a file that fails', async () => {
      const w = load({ fetchImpl: (req) => (req.includes('slopvector/index.html') ? { ok: false, status: 404, type: 'basic' } : { ok: true, status: 200, type: 'basic', clone() { return this; } }) });
      let pending = null;
      w.listeners.install({ waitUntil: (p) => { pending = p; } });
      await pending;
      const stored = w.caches.stores[w.CACHE];
      expect(stored.size).toBe(w.PRECACHE.length - 1);
      expect(stored.has(ORIGIN + '/slopvector/index.html')).toBe(false);
      expect(stored.has(ORIGIN + '/index.html')).toBe(true);
    });
    it('deletes older slopographic caches on activate and leaves other caches alone', async () => {
      const w = load();
      w.caches.stores['slopographic-v0'] = new Map();
      w.caches.stores['other-app'] = new Map();
      let pending = null;
      w.listeners.activate({ waitUntil: (p) => { pending = p; } });
      await pending;
      expect(Object.keys(w.caches.stores)).toEqual(['other-app']);
    });
  });

  SlopTest.run();
  </script>
</body>
</html>
