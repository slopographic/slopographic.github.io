<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PWA · Slop Drive storage note</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style>
</head>
<body>
  <!-- Covers: drive/js/app/main.js, drive/js/ui/sidebar.js, shared/pwa.js -->
  <iframe id="drive" src="../../drive/index.html"></iframe>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  const frame = document.getElementById('drive');
  let win = null;
  const ready = new Promise((resolve) => frame.addEventListener('load', () => {
    win = frame.contentWindow;
    waitFor(() => win.document.body && win.document.body.classList.contains('ready'), { timeout: 30000 }).then(resolve);
  }));
  const stub = (value) => Object.defineProperty(win.navigator.storage, 'persist', { value, configurable: true, writable: true });
  const note = () => win.document.querySelector('#meter .persist-note');

  describe('Slop Drive storage note', () => {
    it('shows the install button hidden and the keep button when nothing is recorded yet', async () => {
      await ready;
      localStorage.removeItem('slop-pwa.persist');
      await waitFor(() => win.document.querySelector('#meter [data-act="persist"]'), { timeout: 10000 });
      expect(win.document.getElementById('pwa-install').hidden).toBe(true);
      expect(note()).toBe(null);
    });
    it('explains a denied answer and points to Backup & restore', async () => {
      await ready;
      stub(async () => false);
      await win.DR.requestPersist(false);
      await waitFor(() => note());
      expect(note().dataset.state).toBe('denied');
      expect(note().textContent).toContain('Export a copy with Backup & restore');
      expect(win.document.querySelector('#meter [data-act="persist"]').disabled).toBe(false);
    });
    it('explains a granted answer and disables the keep button', async () => {
      await ready;
      stub(async () => true);
      await win.DR.requestPersist(false);
      await waitFor(() => note() && note().dataset.state === 'granted');
      expect(note().textContent).toContain('Kept by the browser');
      expect(win.document.querySelector('#meter [data-act="persist"]').disabled).toBe(true);
    });
    it('an upload hands its size to SlopQuota.askIfBig, which asks only past 50 MB and once per visit', async () => {
      await ready;
      const seen = [], real = win.SlopQuota.askIfBig;
      win.SlopQuota.askIfBig = (n) => { seen.push(n); return Promise.resolve(null); };
      try {
        const file = new win.File(['x'.repeat(2048)], 'quota-probe.txt', { type: 'text/plain' });
        await win.DR.importFiles([{ file, path: file.name }]);
        expect(seen).toEqual([2048]);
      } finally { win.SlopQuota.askIfBig = real; }
      expect(win.SlopQuota.BIG).toBe(50 * 1024 * 1024);
    });
  });

  SlopTest.run();
  </script>
</body>
</html>
