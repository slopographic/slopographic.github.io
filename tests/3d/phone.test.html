<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop 3D on a phone: Scene and Properties are SlopSheets</title>
<style>body { margin: 0; } iframe { border: 0; display: block; width: 390px; height: 844px; }</style></head>
<body>
  <!-- Covers: 3d/js/app/layout.js, 3d/css/app.css, 3d/index.html, shared/frame/panel.js -->
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  let W, D;
  const esc = () => D.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  describe('Slop 3D at 390 × 844', () => {
    it('the viewport fills the screen; of the panels only the Properties foot (Save) shows; nothing scrolls sideways', async () => {
      const f = document.createElement('iframe'); f.src = '../../3d/index.html'; document.body.append(f);
      await waitFor(() => f.contentWindow.Slop3DSheets && f.contentDocument.querySelector('#snap option'), { timeout: 40000 });
      W = f.contentWindow; D = f.contentDocument;
      D.head.append(Object.assign(D.createElement('style'), { textContent: '* { transition: none !important; }' }));   // an offscreen frame stalls them
      expect(D.querySelector('.viewport').getBoundingClientRect().height).toBeGreaterThan(500);
      expect(D.documentElement.scrollWidth).toBeLessThanOrEqual(390);
      expect([W.Slop3DSheets.scene.isOpen(), W.Slop3DSheets.props.isOpen()]).toEqual([false, false]);
      const save = D.getElementById('btnSave');
      expect(save.closest('.sf-p-foot').parentNode).toBe(D.querySelector('.panel-right'));
      expect(save.getBoundingClientRect().top).toBeGreaterThan(740);
      expect(save.getBoundingClientRect().bottom).toBeLessThanOrEqual(844);
      expect(D.getElementById('inspector').getBoundingClientRect().height).toBe(0);
      expect(W.getComputedStyle(D.querySelector('.panel-left')).visibility).toBe('hidden');
    }, { timeout: 60000 });
    it('Properties: its button opens the bottom sheet, again closes it, × closes and refocuses, Escape closes', () => {
      const btn = D.getElementById('btnProps'), s = W.Slop3DSheets.props, panel = D.querySelector('.panel-right');
      btn.click();
      expect([s.isOpen(), btn.getAttribute('aria-expanded')]).toEqual([true, 'true']);
      expect(Math.round(panel.getBoundingClientRect().bottom)).toBe(844);
      btn.click(); expect(s.isOpen()).toBe(false);
      btn.focus(); btn.click();
      const x = panel.querySelector(':scope > .ssh-x');
      expect(x.getAttribute('aria-label')).toBe('Close properties');
      x.click(); expect([s.isOpen(), D.activeElement]).toEqual([false, btn]);
      btn.click(); esc(); expect(s.isOpen()).toBe(false);
    });
    it('Scene: a drawer from the left, the same way; a tap on the viewport closes it', () => {
      const btn = D.getElementById('btnScene'), s = W.Slop3DSheets.scene, panel = D.querySelector('.panel-left');
      btn.click();
      expect([s.isOpen(), Math.round(panel.getBoundingClientRect().left)]).toEqual([true, 0]);
      btn.click(); expect(s.isOpen()).toBe(false);
      btn.click(); panel.querySelector(':scope > .ssh-x').click(); expect([s.isOpen(), D.activeElement]).toEqual([false, btn]);
      btn.click(); esc(); expect(s.isOpen()).toBe(false);
      btn.click(); D.getElementById('view').dispatchEvent(new W.PointerEvent('pointerdown', { bubbles: true }));
      expect(s.isOpen()).toBe(false);
    });
  });
  SlopTest.run({ name: 'Slop 3D: phone sheets' });
  </script>
</body>
</html>
