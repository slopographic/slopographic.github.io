<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Data · billing, ledger, stock, export</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="../../shared/profile/profile.js"></script>
  <script src="../../shared/i18n/i18n.js"></script>   <!-- the records' messages (shared/i18n/ui/en/data.js) -->
  <script src="../../shared/data/money.js"></script>
  <script src="../../shared/data/barcode.js"></script>
  <script src="../../shared/data/schema-checks.js"></script><script src="../../shared/data/schema-defs.js"></script>
  <script src="../../shared/data/schema.js"></script>
  <script src="../../shared/data/currency.js"></script>
  <script src="../../shared/data/store.js"></script>
  <script src="../../shared/data/numbering.js"></script>
  <script src="../../shared/data/fx.js"></script>
  <script src="../../shared/data/ledger.js"></script>
  <script src="../../shared/data/stock.js"></script>
  <script src="../../shared/data/billing.js"></script>
  <script src="../../shared/data/bundle-check.js"></script>
  <script src="../../shared/data/export.js"></script>
  <script>
  const { describe, it, expect, beforeEach, run } = SlopTest;
  const S = window.SlopData;
  const st = S.store;
  const fresh = async () => { const r = await st.erase(); if (!r.ok) throw new Error(r.message); const q = await st.ready(); if (!q.ok) throw new Error(q.message); };
  const line = (o = {}) => ({ description: 'Bolt', qty: 2, unitPrice: 1050, taxRate: 2000, ...o });
  async function setup() {
    const c = (await st.put('customers', { name: 'Ada', stage: 'customer' })).value;
    const p = (await st.put('products', { sku: 'B-1', name: 'Bolt', price: 1050, taxRate: 2000, ean: '4006381333931' })).value;
    return { c, p };
  }
  async function draft(c, lines = [line()]) {
    return (await st.put('invoices', { customerId: c.id, date: '2026-10-11', lines })).value;
  }
  const tb = () => S.ledger.trialBalance();
  const acct = (sum, code) => sum.rows.find((r) => r.code === code);

  describe('invoices', () => {
    beforeEach(fresh);
    it('issuing a draft takes INV-0001, posts AR, revenue and tax, and keeps the books balanced', async () => {
      const { c } = await setup();
      const d = await draft(c);
      const r = await S.billing.issue(d.id);
      expect(r.ok).toBe(true);
      expect(r.value.number).toBe('INV-0001');
      expect(r.value.status).toBe('issued');
      const t = await tb();
      expect(t.ok).toBe(true);
      expect(acct(t.value, '1200').balance).toBe(2520);
      expect(acct(t.value, '4000').balance).toBe(2100);
      expect(acct(t.value, '2100').balance).toBe(420);
    });
    it('numbers are gapless across issue, void and a failed issue', async () => {
      const { c } = await setup();
      const a = (await S.billing.issue((await draft(c)).id)).value;
      const b = (await S.billing.issue((await draft(c)).id)).value;
      expect((await S.billing.voidInvoice(b.id)).ok).toBe(true);
      const cc = (await S.billing.issue((await draft(c)).id)).value;
      expect([a.number, b.number, cc.number]).toEqual(['INV-0001', 'INV-0002', 'INV-0003']);
      expect((await S.numbering.peek('invoice')).value).toBe('INV-0004');
    });
    it('an issued invoice cannot be edited, re-issued or deleted', async () => {
      const { c } = await setup();
      const d = (await S.billing.issue((await draft(c)).id)).value;
      expect((await st.put('invoices', { ...d, notes: 'x' })).code).toBe('invalid_transition');
      expect((await S.billing.issue(d.id)).code).toBe('invalid_transition');
      expect((await st.remove('invoices', d.id)).code).toBe('forbidden');
    });
    it('a draft can be deleted (soft) and does not use a number', async () => {
      const { c } = await setup();
      const d = await draft(c);
      expect((await st.remove('invoices', d.id)).value.soft).toBe(true);
      expect((await S.numbering.peek('invoice')).value).toBe('INV-0001');
    });
    it('issuing needs an existing customer', async () => {
      const { c } = await setup();
      const d = await draft(c);
      await st.remove('customers', c.id);
      expect((await S.billing.issue(d.id)).code).toBe('not_found');
    });
  });

  describe('payments and voids', () => {
    beforeEach(fresh);
    it('partial payments leave the invoice issued; the last one marks it paid', async () => {
      const { c } = await setup();
      const inv = (await S.billing.issue((await draft(c)).id)).value;
      expect((await S.billing.recordPayment({ invoiceId: inv.id, amount: 1000, method: 'cash' })).ok).toBe(true);
      expect((await st.get('invoices', inv.id)).value.status).toBe('issued');
      expect((await S.billing.recordPayment({ invoiceId: inv.id, amount: 1521 })).code).toBe('overpayment');
      expect((await S.billing.recordPayment({ invoiceId: inv.id, amount: 1520 })).ok).toBe(true);
      expect((await st.get('invoices', inv.id)).value.status).toBe('paid');
      const t = (await tb()).value;
      expect(acct(t, '1200').balance).toBe(0);
      expect(acct(t, '1000').balance).toBe(1000);
      expect(acct(t, '1010').balance).toBe(1520);
    });
    it('payments need an issued invoice and a positive amount', async () => {
      const { c } = await setup();
      const d = await draft(c);
      expect((await S.billing.recordPayment({ invoiceId: d.id, amount: 5 })).code).toBe('invalid_transition');
      const inv = (await S.billing.issue(d.id)).value;
      expect((await S.billing.recordPayment({ invoiceId: inv.id, amount: 0 })).code).toBe('invalid');
    });
    it('void reverses the issue entry and keeps the number; a paid invoice cannot be voided', async () => {
      const { c } = await setup();
      const inv = (await S.billing.issue((await draft(c)).id)).value;
      expect((await S.billing.voidInvoice(inv.id)).value.status).toBe('void');
      const t = (await tb()).value;
      expect(acct(t, '1200').balance).toBe(0);
      expect(acct(t, '4000').balance).toBe(0);
      expect((await st.get('invoices', inv.id)).value.number).toBe('INV-0001');
      const inv2 = (await S.billing.issue((await draft(c)).id)).value;
      await S.billing.recordPayment({ invoiceId: inv2.id, amount: 2520 });
      expect((await S.billing.voidInvoice(inv2.id)).code).toBe('invalid_transition');
    });
  });

  describe('ledger', () => {
    beforeEach(fresh);
    const entry = (source, amount = 500) => ({ date: '2026-10-11', memo: 'Sale', source, lines: [{ account: '1000', debit: amount }, { account: '4000', credit: amount }] });
    it('posts a balanced entry and refuses duplicates, unknown accounts and unbalanced entries', async () => {
      expect((await S.ledger.postJournal(entry('manual:1'))).ok).toBe(true);
      expect((await S.ledger.postJournal(entry('manual:1'))).code).toBe('duplicate_source');
      expect((await S.ledger.postJournal({ ...entry('manual:2'), lines: [{ account: '9999', debit: 5 }, { account: '4000', credit: 5 }] })).code).toBe('invalid');
      expect((await S.ledger.postJournal({ ...entry('manual:3'), lines: [{ account: '1000', debit: 5 }, { account: '4000', credit: 4 }] })).code).toBe('invalid');
      expect((await S.ledger.postJournal(entry('manual:4', 1.5))).code).toBe('invalid');
      expect((await tb()).value.balanced).toBe(true);
    });
    it('a posted entry cannot be changed; a correction is a reversing entry, reversed once', async () => {
      const j = (await S.ledger.postJournal(entry('manual:9'))).value;
      expect((await st.put('journal', { ...j, memo: 'changed' })).code).toBe('immutable');
      expect((await st.remove('journal', j.id)).code).toBe('immutable');
      const r = await S.ledger.reverseJournal(j.id);
      expect(r.ok).toBe(true);
      expect(r.value.reverses).toBe(j.id);
      expect((await S.ledger.reverseJournal(j.id)).code).toBe('duplicate_source');
      expect(acct((await tb()).value, '1000').balance).toBe(0);
    });
  });

  describe('stock', () => {
    beforeEach(fresh);
    it('stock on hand comes from movements; receipts add, sales are refused below zero', async () => {
      const { p } = await setup();
      await S.stock.move({ productId: p.id, location: 'main', qty: 10, reason: 'receipt' });
      expect((await S.stock.onHand(p.id)).value).toBe(10);
      expect((await S.stock.move({ productId: p.id, location: 'main', qty: -11, reason: 'sale' })).code).toBe('insufficient_stock');
      await S.stock.move({ productId: p.id, location: 'main', qty: -4, reason: 'sale' });
      expect((await S.stock.onHand(p.id)).value).toBe(6);
      expect((await S.stock.move({ productId: p.id, location: 'main', qty: 1, reason: 'sale' })).code).toBe('invalid');
    });
    it('transfers keep the total and move between locations', async () => {
      const { p } = await setup();
      await S.stock.move({ productId: p.id, location: 'main', qty: 10, reason: 'receipt' });
      expect((await S.stock.transfer({ productId: p.id, from: 'main', to: 'back', qty: 3 })).ok).toBe(true);
      const lv = (await S.stock.levels(p.id)).value;
      expect(lv.main).toBe(7);
      expect(lv.back).toBe(3);
      expect((await S.stock.onHand(p.id)).value).toBe(10);
    });
    it('a count posts one adjustment per difference and a count record, in one transaction', async () => {
      const { p } = await setup();
      const q = (await st.put('products', { sku: 'B-2', name: 'Nut', price: 10, taxRate: 0 })).value;
      await S.stock.move({ productId: p.id, location: 'main', qty: 10, reason: 'receipt' });
      await S.stock.move({ productId: q.id, location: 'main', qty: 5, reason: 'receipt' });
      const r = await S.stock.postCount({ location: 'main', date: '2026-10-11', counts: [{ productId: p.id, counted: 8 }, { productId: q.id, counted: 5 }] });
      expect(r.ok).toBe(true);
      expect(r.value.lines.find((l) => l.productId === p.id).diff).toBe(-2);
      expect((await S.stock.onHand(p.id)).value).toBe(8);
      expect((await st.list('stockCounts')).value.length).toBe(1);
      expect((await S.stock.postCount({ location: 'main', counts: [{ productId: p.id, counted: -1 }] })).code).toBe('invalid');
    });
    it('low stock and barcode lookup by EAN or SKU', async () => {
      const { p } = await setup();
      const low = (await S.stock.lowStock(5)).value;
      expect(low.length).toBe(1);
      expect(low[0].onHand).toBe(0);
      expect((await S.stock.lookupBarcode('4006381333931')).value.id).toBe(p.id);
      expect((await S.stock.lookupBarcode('B-1')).value.id).toBe(p.id);
      expect((await S.stock.lookupBarcode('0000000000000')).value).toBe(null);
    });
    it('a product with stock history cannot be deleted', async () => {
      const { p } = await setup();
      await S.stock.move({ productId: p.id, location: 'main', qty: 1, reason: 'receipt' });
      expect((await st.remove('products', p.id)).code).toBe('in_use');
    });
  });

  describe('export and import', () => {
    beforeEach(fresh);
    it('export then import restores the same records and keeps the numbering', async () => {
      const { c } = await setup();
      const inv = (await S.billing.issue((await draft(c)).id)).value;
      const file = (await S.exporter.exportFile()).value;
      const text = await file.blob.text();
      await st.erase();
      const r = await S.exporter.importBundle(text);
      expect(r.ok).toBe(true);
      expect((await st.get('invoices', inv.id)).value.number).toBe('INV-0001');
      expect((await S.numbering.peek('invoice')).value).toBe('INV-0002');
      expect((await tb()).value.balanced).toBe(true);
    });
    it('a bad file changes nothing: all or nothing', async () => {
      await setup();
      const bundle = (await S.exporter.exportBundle()).value;
      bundle.collections.customers.push({ id: 'bad', name: '', stage: 'won', version: 1 });
      const r = await S.exporter.importBundle(bundle);
      expect(r.code).toBe('invalid');
      expect(r.errors.length).toBeGreaterThan(0);
      expect((await st.list('customers')).value.length).toBe(1);
      expect((await S.exporter.importBundle('not json')).code).toBe('invalid');
    });
    it('a bundle with a broken total is refused', async () => {
      const { c } = await setup();
      await S.billing.issue((await draft(c)).id);
      const bundle = (await S.exporter.exportBundle()).value;
      bundle.collections.invoices[0].total += 1;
      expect((await S.exporter.importBundle(bundle)).code).toBe('invalid');
    });
  });
  run({ name: 'Data · billing, ledger, stock, export' });
  </script>
</body>
