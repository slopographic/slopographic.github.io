<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Clean: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: clean/js/app/main.js
  // Slop Clean on the one intake: Open pictures…, a drop on the page, a paste and ?drive=<id> (launch; the picture keeps
  // its Drive record, so Replace original works) reach the same reader with the same events.
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], events = [];
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function png(name) {
    const c = D.createElement('canvas'); c.width = 20; c.height = 20; c.getContext('2d').fillRect(0, 0, 20, 20);
    return new W.File([await new Promise((r) => c.toBlob(r, 'image/png'))], name, { type: 'image/png' });
  }
  async function through(source, start, n = 1) {
    seen = []; events = [];
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual([[source, n]]);
    expect(events.map((e) => e[0])).toEqual(['before', ...Array(n).fill('file'), 'after']);
    expect(events.every((e) => e[1] === 'clean' && e[2] === source)).toBe(true);
  }
  const items = () => W.CL.app.state.items;

  describe('Slop Clean: one way in', () => {
    it('Open pictures…', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../clean/index.html';
      await waitFor(() => { try { return fr.contentWindow.CL.app && fr.contentWindow.SlopIntake.spec('clean'); } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      const s = W.SlopIntake.spec('clean'), reader = s.processAll;
      s.processAll = (files, ctx) => { seen.push([ctx.source, files.length]); return reader(files, ctx); };
      for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
      const fs = [await png('a.png'), await png('b.png')];
      W.SlopUI.pickFiles = async () => fs;
      await through('picker', () => D.getElementById('cl-open').click(), 2);
      expect(items().length).toBe(2);
    }, { timeout: 40000 });
    it('a drop on the page', async () => {
      const f = await png('c.png');
      await through('drop', () => D.body.dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([f]) })));
    });
    it('a paste', async () => {
      const f = await png('d.png');
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf([f]) })));
    });
    it('?drive=<id> keeps the Drive record', async () => {
      const blob = await png('sent.png');
      W.SlopHub.consumeLaunch = async () => ({ id: 'x1', name: 'sent.png', type: 'image/png', blob });
      await through('launch', () => W.SlopIntake.launch({ to: 'clean' }));
      expect(items()[items().length - 1].driveId).toBe('x1');
    });
  });
  run({ name: 'Shared intake: Slop Clean' });
</script>
</body>
</html>
