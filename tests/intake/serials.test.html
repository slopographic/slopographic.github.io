<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in the Serial counter: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1000px; height: 700px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: serials/js/app.js
  // The Serial counter on the one intake: a click on the box (the picker), a drop on it and a paste reach the same reader
  // with the same events, after the first-use notice (once per batch).
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], events = [], notices = 0;
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function png(name) {
    const c = D.createElement('canvas'); c.width = 20; c.height = 10;
    return new W.File([await new Promise((r) => c.toBlob(r, 'image/png'))], name, { type: 'image/png' });
  }
  async function through(source, start, n = 1) {
    seen = []; events = []; notices = 0;
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual([[source, n]]);
    expect(events.map((e) => e[0])).toEqual(['before', ...Array(n).fill('file'), 'after']);
    expect(notices).toBe(1);
  }
  describe('Serial counter: one way in', () => {
    it('a click on the box', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../serials/index.html';
      await waitFor(() => { try { return fr.contentWindow.SlopIntake.spec('serials'); } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      D.getElementById('ui').hidden = false;
      const s = W.SlopIntake.spec('serials'), reader = s.processAll;
      s.processAll = (files, ctx) => { seen.push([ctx.source, files.length]); return reader(files, ctx); };
      W.SlopFirstRun = { once: async (id) => { expect(id).toBe('serials'); notices++; return true; } };
      for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
      const fs = [await png('a.png'), await png('b.png')];
      W.SlopIntake.pickFiles = async () => fs;
      await through('picker', () => D.getElementById('drop').click(), 2);
      expect(D.querySelectorAll('#photos li').length).toBe(2);
    }, { timeout: 40000 });
    it('a drop on the box', async () => {
      const f = await png('c.png');
      await through('drop', () => D.getElementById('drop').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([f]) })));
    });
    it('a paste', async () => {
      const f = await png('d.png');
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf([f]) })));
    });
  });
  run({ name: 'Shared intake: Serial counter' });
</script>
</body>
</html>
