<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Docs: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: docs/js/ui/intake.js, docs/js/ui/files.js, docs/js/ui/main.js, docs/js/ui/tabs.js, docs/js/ui/input.js
  // Slop Docs on the one intake: Open from Slop Drive (a .sdoc, linked), Import from Slop Drive (unlinked), a drop on the
  // page and ?drive=<id> (launch) reach the same reader with the same events. Send to is the SlopOuttake builder.
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, S, seen = [], events = [];
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function through(source, mode, start) {
    seen = []; events = [];
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual([[source, mode]]);
    expect(events.map((e) => e[0])).toEqual(['before', 'file', 'after']);
    expect(events.every((e) => e[1] === 'docs' && e[2] === source)).toBe(true);
  }

  describe('Slop Docs: one way in', () => {
    it('Open from Slop Drive opens a .sdoc linked to its record', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../docs/index.html';
      await waitFor(() => { try { return fr.contentWindow.SlopDocs.ready && fr.contentWindow.SlopIntake.spec('docs'); } catch (e) { return false; } }, { timeout: 30000 });
      W = fr.contentWindow; D = W.document; S = W.SlopDocs;
      const s = W.SlopIntake.spec('docs'), reader = s.process;
      s.process = (f, ctx) => { seen.push([ctx.source, ctx.mode || 'open']); return reader(f, ctx); };
      for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
      const blob = await S.exportBlob('sdoc');
      W.SlopHub.pickFromDrive = async () => ({ id: 'd1', name: 'Linked.sdoc', type: 'application/x-slop-doc', blob });
      await through('drive', 'open', () => S.openFromDrive());
      expect(S.driveId()).toBe('d1');
    }, { timeout: 40000 });
    it('Import from Slop Drive opens a Markdown file as a new, unlinked document', async () => {
      const blob = new Blob(['# Imported\n\nHello'], { type: 'text/markdown' });
      W.SlopHub.pickFromDrive = async () => ({ id: 'd2', name: 'notes.md', type: 'text/markdown', blob });
      await through('drive', 'import', () => S.importFromDrive());
      expect(S.driveId()).toBe(null);
      expect(S.displayName()).toBe('notes');
    });
    it('a drop on the page', async () => {
      const f = new W.File(['Dropped text'], 'dropped.txt', { type: 'text/plain' });
      await through('drop', 'open', () => D.getElementById('stage').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([f]) })));
      expect(S.displayName()).toBe('dropped');
    });
    it('?drive=<id> from another app (launch)', async () => {
      const blob = await S.exportBlob('sdoc');
      W.SlopHub.consumeLaunch = async () => ({ id: 'd3', name: 'Sent.sdoc', type: 'application/x-slop-doc', blob });
      await through('launch', 'open', () => S.launch());
      expect(S.driveId()).toBe('d3');
    });
  });
  describe('Slop Docs: one way out', () => {
    it('Send to is the SlopOuttake builder (the document as DOCX)', () => {
      const labels = S.sendItems().map((x) => x.label);
      expect(labels.some((l) => /^Send to /.test(l))).toBe(true);
      expect(labels.filter((l) => l === 'Run a workflow…').length).toBeLessThan(2);
    });
  });
  run({ name: 'Shared intake: Slop Docs' });
</script>
</body>
</html>
