<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Image to 3D: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: img3d/js/app/main.js, img3d/js/app/export.js
  // Slop Image to 3D on the one intake: Open image…, a drop on the view, From Slop Drive…, a paste and ?drive=<id>
  // (launch) reach the same reader with the same events, after the intake's first-use notice (once per batch). Open in
  // Slop 3D goes out through SlopOuttake.send.
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], events = [], notices = 0;
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function png(name) {
    const c = D.createElement('canvas'); c.width = 32; c.height = 24; c.getContext('2d').fillRect(0, 0, 32, 24);
    return new W.File([await new Promise((r) => c.toBlob(r, 'image/png'))], name, { type: 'image/png' });
  }
  async function through(source, start) {
    seen = []; events = []; notices = 0;
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual([source]);
    expect(events.map((e) => e[0])).toEqual(['before', 'file', 'after']);
    expect(events.every((e) => e[1] === 'img3d' && e[2] === source)).toBe(true);
    expect(notices).toBe(1);
  }

  describe('Slop Image to 3D: one way in', () => {
    it('Open image…', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../img3d/index.html';
      await waitFor(() => { try { return fr.contentWindow.SlopIntake.spec('img3d') && fr.contentDocument.getElementById('btnOpen'); } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      const s = W.SlopIntake.spec('img3d'), reader = s.process;
      s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
      W.SlopFirstRun = { once: async (id) => { expect(id).toBe('img3d'); notices++; return true; } };
      for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
      const f = await png('a.png');
      W.SlopUI.pickFiles = async () => [f];
      await through('picker', () => D.getElementById('btnOpen').click());
    }, { timeout: 40000 });
    it('a drop on the view', async () => {
      const f = await png('b.png');
      await through('drop', () => D.getElementById('vp').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([f]) })));
    });
    it('From Slop Drive…', async () => {
      const blob = await png('c.png');
      W.SlopHub.pickFromDrive = async () => ({ id: 'x1', name: 'c.png', type: 'image/png', blob });
      await through('drive', () => D.getElementById('btnDrive').click());
    });
    it('a paste', async () => {
      const f = await png('d.png');
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf([f]) })));
    });
    it('?drive=<id> (launch)', async () => {
      const blob = await png('e.png');
      W.SlopHub.consumeLaunch = async () => ({ id: 'x2', name: 'e.png', type: 'image/png', blob });
      await through('launch', () => W.SlopIntake.launch({ to: 'img3d' }));
    });
  });
  describe('Slop Image to 3D: one way out', () => {
    it('Open in Slop 3D is SlopOuttake.send', async () => {
      let sent = null;
      W.SlopOuttake.send = async (to, o) => { sent = [to, o.from, o.type]; };
      await waitFor(() => !D.getElementById('btnSend').disabled, { timeout: 15000 });
      D.getElementById('btnSend').click();
      await waitFor(() => sent);
      expect(sent[0]).toBe('3d'); expect(sent[1]).toBe('img3d');
    }, { timeout: 30000 });
  });
  run({ name: 'Shared intake: Slop Image to 3D' });
</script>
</body>
</html>
