<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Press: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: press/js/io/intake.js, press/js/io/hub.js, press/js/io/place.js, press/js/io/project.js, press/js/ui/main.js, press/js/edit/clipboard.js, press/js/edit/text.js, press/js/ui/pages-panel.js
  // Slop Press on the one intake: a drop on the stage, the zone's Choose files, File ▸ Open, File ▸ Place, a paste, Open
  // and Place from Slop Drive and ?drive=<id> (launch) all reach the same reader with the same events and one first-use
  // notice per batch; Open, Slop Drive's Open and launch open a document, the others place into the open one. File ▸ Send
  // to is the one builder (SlopOuttake).
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], notices = 0, events = [];
  async function boot() {
    const fr = document.getElementById('app');
    fr.src = '../../press/index.html?new';
    await waitFor(() => fr.contentWindow && fr.contentWindow.document.querySelector('#app.ready') && fr.contentWindow.SlopIntake.spec('press'), { timeout: 30000 });
    W = fr.contentWindow; D = W.document;
    W.PR.store.enabled = false;
    const s = W.SlopIntake.spec('press'), reader = s.process;
    s.process = (f, ctx) => { seen.push([ctx.source, ctx.mode || 'place']); return reader(f, ctx); };
    s.notice = { title: 'First use', lines: ['test'] };
    W.SlopFirstRun = { once: async () => { notices++; return true; } };
    for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
  }
  async function png(name) {
    const c = D.createElement('canvas'); c.width = 40; c.height = 30;
    c.getContext('2d').fillRect(0, 0, 40, 30);
    return new W.File([await new Promise((r) => c.toBlob(r, 'image/png'))], name, { type: 'image/png' });
  }
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  const images = () => Object.keys(W.PR.state.doc.assets).length;
  /** One source: its files reach the reader once each, with one notice and the events in order. */
  async function through(source, mode, start, n = 2) {
    seen = []; events = []; notices = 0;
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual(Array(n).fill([source, mode]));
    expect(events.map((e) => e[0])).toEqual(['before', ...Array(n).fill('file'), 'after']);
    expect(events.every((e) => e[1] === 'press' && e[2] === source)).toBe(true);
    expect(notices).toBe(1);
  }

  describe('Slop Press: one way in', () => {
    it('a drop on the stage places the pictures', async () => {
      await boot();
      const before = images(), files = [await png('a.png'), await png('b.png')];
      const st = D.getElementById('stage'), r = st.getBoundingClientRect();
      await through('drop', 'place', () => st.dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, clientX: r.left + 5, clientY: r.top + 5, dataTransfer: dtOf(files) })));
      expect(images()).toBe(before + 2);
    }, { timeout: 45000 });
    it("the zone's Choose files", async () => {
      const files = [await png('c.png'), await png('d.png')];
      await through('picker', 'place', () => { const i = D.querySelector('#pressDrop input[type=file]'); i.files = dtOf(files).files; i.dispatchEvent(new W.Event('change')); });
    });
    it('File ▸ Place…', async () => {
      const files = [await png('e.png'), await png('f.png')];
      W.SlopUI.pickFiles = async () => files;
      const before = images();
      await through('picker', 'add', () => W.PR.actions.run('file.place'));
      expect(images()).toBe(before + 2);
    });
    it('a paste places the picture (not the app clipboard as well)', async () => {
      const files = [await png('g.png')];
      const before = images();
      await through('paste', 'place', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf(files) })), 1);
      expect(images()).toBe(before + 1);
    });
    it('File ▸ Open… opens a new document', async () => {
      const f = await png('opened.png');
      W.SlopUI.pickFiles = async () => [f];
      await through('picker', 'new', () => W.PR.actions.run('file.open'), 1);
      await waitFor(() => W.PR.state.doc.name === 'opened');
    });
    it('Place from Slop Drive', async () => {
      const blob = await png('drive.png');
      W.SlopHub.pickFromDrive = async () => ({ id: 'x1', name: 'drive.png', type: 'image/png', blob });
      await through('drive', 'add', () => W.PR.hub.placeFromDrive(), 1);
    });
    it('Open from Slop Drive links a project, so Save writes back to it', async () => {
      const blob = await W.PR.io.projectBlob(W.PR.templates.make('card'));
      W.SlopHub.pickFromDrive = async () => ({ id: 'x2', name: 'Card.slpress', type: 'application/x-slop-press', blob });
      await through('drive', 'new', () => W.PR.hub.openFromDrive(), 1);
      await waitFor(() => W.PR.state.doc.name === 'Business Card');
      expect(W.PR.state.driveId).toBe('x2');
    });
    it('?drive=<id> from another app (launch)', async () => {
      const blob = await png('sent.png');
      W.SlopHub.consumeLaunch = async () => ({ id: 'x3', name: 'sent.png', type: 'image/png', blob });
      await through('launch', 'new', () => W.SlopIntake.launch({ to: 'press', mode: 'new' }), 1);
      await waitFor(() => W.PR.state.doc.name === 'sent');
    });
  });

  describe('Slop Press: one way out', () => {
    it('File ▸ Send to is the SlopOuttake builder: the PDF to the apps and Workflows once, the page PNG to the apps', async () => {
      const items = W.PR.hub.sendItems().filter((x) => x !== '-');
      const labels = items.map((x) => x.label);
      const names = (id) => { const a = W.SLOP_APPS.find((x) => x.id === id); return [a.name, W.slopAppName(a)]; };   // the build's names (here Slop PDF)
      expect(labels.some((l) => names('pdf').some((n) => l === `Send PDF to ${n}`))).toBe(true);
      expect(labels.some((l) => /^Send page PNG to /.test(l))).toBe(true);
      expect(labels.filter((l) => l === 'Run a workflow…').length).toBe(1);
      expect(labels.filter((l) => names('workflows').some((n) => l.endsWith(n))).length).toBe(0);
      expect(labels[labels.length - 1]).toBe('Save to Slop Drive…');
    });
  });
  run({ name: 'Shared intake: Slop Press' });
</script>
</body>
</html>
