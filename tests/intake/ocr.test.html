<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop OCR: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: ocr/js/app.js
  // Slop OCR on the one intake: a drop on the zone, its Choose files, a paste, ?drive=<id> (another app's Open in Slop OCR)
  // and the sample reach the same reader (addFiles, the whole batch) with the same events. A paste before the gate has
  // shown the page is not taken.
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], events = [];
  async function boot() {
    const fr = document.getElementById('app');
    fr.src = '../../ocr/index.html';
    await waitFor(() => { try { return fr.contentWindow.SlopIntake.spec('ocr') && fr.contentDocument.querySelector('#drop .sd-choose'); } catch (e) { return false; } }, { timeout: 20000 });
    W = fr.contentWindow; D = W.document;
    const s = W.SlopIntake.spec('ocr'), reader = s.processAll;
    s.processAll = (files, ctx) => { seen.push([ctx.source, files.length]); return reader(files, ctx); };
    for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
  }
  async function png(name) {
    const c = D.createElement('canvas'); c.width = 40; c.height = 30; c.getContext('2d').fillRect(0, 0, 40, 30);
    return new W.File([await new Promise((r) => c.toBlob(r, 'image/png'))], name, { type: 'image/png' });
  }
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function through(source, start, n = 2) {
    seen = []; events = [];
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual([[source, n]]);
    expect(events.map((e) => e[0])).toEqual(['before', ...Array(n).fill('file'), 'after']);
    expect(events.every((e) => e[1] === 'ocr' && e[2] === source)).toBe(true);
  }

  describe('Slop OCR: one way in', () => {
    it('no paste is taken before the gate; then a drop on the zone', async () => {
      await boot();
      const ui = D.getElementById('ui'), files = [await png('a.png'), await png('b.png')];
      ui.hidden = true;
      await W.SlopIntake.take(files, { to: 'ocr', source: 'paste' });
      expect(seen).toEqual([]);
      ui.hidden = false;
      await through('drop', () => D.getElementById('drop').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf(files) })));
    }, { timeout: 40000 });
    it("the zone's Choose files", async () => {
      const files = [await png('c.png'), await png('d.png')];
      await through('picker', () => { const i = D.querySelector('#drop input[type=file]'); i.files = dtOf(files).files; i.dispatchEvent(new W.Event('change')); });
    });
    it('a paste', async () => {
      const files = [await png('e.png')];
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf(files) })), 1);
    });
    it('?drive=<id> from another app (launch)', async () => {
      const blob = await png('sent.png');
      W.SlopHub.consumeLaunch = async () => ({ id: 'x1', name: 'sent.png', type: 'image/png', blob });
      await through('launch', () => W.SlopIntake.launch({ to: 'ocr' }), 1);
    });
  });
  run({ name: 'Shared intake: Slop OCR' });
</script>
</body>
</html>
