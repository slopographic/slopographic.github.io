<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake: a config file comes in one way</title>
  <style>body { margin: 0; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: shared/config/dialog.js
  // Import config (shared/config): From this computer…, From Slop Drive…, the dialog's zone and a .slop.json dropped
  // anywhere on the page are sources of the part 'config', whose reader checks and imports the file. Other files are
  // refused with the reason. (In SlopLabel, which has the intake.)
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [];
  const cfg = (name) => new W.File(['{"format":"slop-config","version":1,"kind":"nope"}'], name, { type: 'application/json' });
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  const closeDialogs = () => { for (const x of D.querySelectorAll('.sui-back .sui-x')) x.click(); };
  async function through(src, start) { const k = seen.length; await start(); await waitFor(() => seen.length === k + 1, { timeout: 10000 }); expect(seen[k]).toBe(src); }
  describe('Import config: one way in', () => {
    it('From this computer…, From Slop Drive…, the zone and a page-wide drop', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../label/index.html';
      await waitFor(() => { try { return fr.contentDocument.body.classList.contains('ready') && fr.contentWindow.SlopConfigDialog; } catch (e) { return false; } }, { timeout: 30000 });
      W = fr.contentWindow; D = W.document;
      W.SlopConfigDialog.open('import', { app: 'label' });
      await waitFor(() => W.SlopIntake.spec('config') && D.querySelector('.sd-config-zone'));
      const s = W.SlopIntake.spec('config'), reader = s.process;
      s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
      W.SlopUI.pickFiles = async () => [cfg('a.slop.json')];
      const btn = (t) => [...D.querySelectorAll('.sui-dlg button')].find((b) => b.textContent === t);
      await through('picker', () => btn('From this computer…').click());
      closeDialogs();
      W.SlopConfigDialog.open('import', { app: 'label' });
      await waitFor(() => btn('From Slop Drive…'));
      W.SlopHub.pickFromDrive = async () => ({ id: 'c1', name: 'b.slop.json', type: 'application/json', blob: cfg('b.slop.json') });
      await through('drive', () => btn('From Slop Drive…').click());
      closeDialogs();
      await through('drop', () => D.body.dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([cfg('c.slop.json')]) })));
      const r = await W.SlopIntake.take([cfg('plain.json')], { to: 'config' });
      expect(r.skipped[0].reason).toContain('is not a .slop.json file');
      closeDialogs();
    }, { timeout: 40000 });
  });
  run({ name: 'Shared intake: config files' });
</script>
</body>
</html>
