<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Transcribe: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: transcribe/js/app.js
  // Slop Transcribe on the one intake: a drop on the zone, its Choose files, a paste and ?drive=<id> (another app's Open
  // in Slop Transcribe) reach the same reader (the queue) with the same events. A paste before the gate has shown
  // the page is not taken. (A recording is a take with source 'record'.)
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], events = [];
  async function boot() {
    const fr = document.getElementById('app');
    fr.src = '../../transcribe/index.html';
    await waitFor(() => { try { return fr.contentWindow.SlopIntake.spec('transcribe') && fr.contentDocument.querySelector('#trDrop .sd-choose'); } catch (e) { return false; } }, { timeout: 20000 });
    W = fr.contentWindow; D = W.document;
    const s = W.SlopIntake.spec('transcribe'), reader = s.process;
    s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
    for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
  }
  async function png(name) { return new W.File([new Uint8Array(4000)], name.replace(/\.png$/, '.mp3'), { type: 'audio/mpeg' }); }
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function through(source, start, n = 2) {
    seen = []; events = [];
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual(Array(n).fill(source));
    expect(events.map((e) => e[0])).toEqual(['before', ...Array(n).fill('file'), 'after']);
    expect(events.every((e) => e[1] === 'transcribe' && e[2] === source)).toBe(true);
  }

  describe('Slop Transcribe: one way in', () => {
    it('no paste is taken before the gate; then a drop on the zone', async () => {
      await boot();
      const ui = D.getElementById('trUi'), files = [await png('a.png'), await png('b.png')];
      ui.hidden = true;
      await W.SlopIntake.take(files, { to: 'transcribe', source: 'paste' });
      expect(seen).toEqual([]);
      ui.hidden = false;
      await through('drop', () => D.getElementById('trDrop').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf(files) })));
    }, { timeout: 40000 });
    it("the zone's Choose files", async () => {
      const files = [await png('c.png'), await png('d.png')];
      await through('picker', () => { const i = D.querySelector('#trDrop input[type=file]'); i.files = dtOf(files).files; i.dispatchEvent(new W.Event('change')); });
    });
    it('a paste', async () => {
      const files = [await png('e.png')];
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf(files) })), 1);
    });
    it('?drive=<id> from another app (launch)', async () => {
      const blob = await png('sent.png');
      W.SlopHub.consumeLaunch = async () => ({ id: 'x1', name: 'sent.png', type: 'audio/mpeg', blob });
      await through('launch', () => W.SlopIntake.launch({ to: 'transcribe' }), 1);
    });
  });
  run({ name: 'Shared intake: Slop Transcribe' });
</script>
</body>
</html>
