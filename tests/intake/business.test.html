<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in the business apps: backups and the products CSV come in one way</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: inventory/js/ui/import.js, shared/biz/backup.js, admin/js/ui/data.js, admin/js/ui/commands.js
  // Slop Inventory: Import products from CSV (its Choose a CSV file… button is the intake's part 'inventory.csv') shows
  // the plan, and Restore from a backup file… is the shared part 'biz.backup', whose reader asks before replacing.
  const { describe, it, expect, waitFor, run } = SlopTest;
  describe('Slop Inventory: one way in', () => {
    it('the products CSV and the backup file', async () => {
      const f = document.getElementById('app');
      f.src = '../../inventory/index.html';
      await waitFor(() => { try { return f.contentWindow.SlopInv.state && f.contentDocument.getElementById('boot').hidden; } catch (e) { return false; } }, { timeout: 30000 });
      const W = f.contentWindow, D = W.document;
      W.SlopInv.dataActions.openImport();
      const btn = await waitFor(() => [...D.querySelectorAll('.sui-dlg button')].find((b) => b.textContent === 'Choose a CSV file…'));
      W.SlopUI.pickFiles = async () => [new W.File(['SKU,EAN,Name,Price,Reorder level\nA-1,,Pen,2.50,3\n'], 'products.csv', { type: 'text/csv' })];
      btn.click();
      await waitFor(() => D.querySelector('.sui-dlg .report-box').textContent.includes('products.csv'));
      [...D.querySelectorAll('.sui-dlg button')].find((b) => b.textContent === 'Cancel').click();
      let asked = 0;
      W.SlopUI.confirm = async () => { asked++; return false; };
      W.SlopUI.pickFiles = async () => [new W.File(['{}'], 'backup.json', { type: 'application/json' })];
      D.getElementById('dRestore').click();
      await waitFor(() => asked === 1);
      expect(W.SlopIntake.spec('biz.backup').paste).toBe(false);
    }, { timeout: 40000 });
  });
  run({ name: 'Shared intake: business apps' });
</script>
</body>
</html>
