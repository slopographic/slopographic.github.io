<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Ledger: SIE and statements come in one way</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: ledger/js/ui/sie.js, ledger/js/ui/bank.js, ledger/js/ui/commands.js
  // Slop Ledger: Import SIE… and Import a statement… are each a part of the one intake (ledger.sie, ledger.bank); a
  // pick reaches the part's reader, and neither takes a paste.
  const { describe, it, expect, waitFor, run } = SlopTest;
  describe('Slop Ledger: one way in', () => {
    it('Import SIE… and Import a statement…', async () => {
      const f = document.getElementById('app');
      f.src = '../../ledger/index.html';
      await waitFor(() => { try { return f.contentWindow.SlopLedger.sieView && f.contentDocument.getElementById('boot').hidden; } catch (e) { return false; } }, { timeout: 20000 });
      const W = f.contentWindow, D = W.document, got = [];
      const sie = W.SlopIntake.spec('ledger.sie'), bank = W.SlopIntake.spec('ledger.bank');
      sie.process = async (file) => { got.push(['sie', file.name]); return file.name; }; // the importers have their own tests
      bank.process = async (file) => { got.push(['bank', file.name]); return file.name; };
      expect([sie.paste, bank.paste]).toEqual([false, false]);
      W.SlopUI.pickFiles = async () => [new W.File(['#FLAGGA 0'], 'books.se')];
      D.getElementById('jImportSie').click();
      await waitFor(() => got.length === 1);
      W.SlopUI.pickFiles = async () => [new W.File(['Date,Amount\n'], 'statement.csv', { type: 'text/csv' })];
      D.getElementById('bkImport').click();
      await waitFor(() => got.length === 2);
      expect(got.map((x) => x[0])).toEqual(['sie', 'bank']);
    }, { timeout: 40000 });
  });
  run({ name: 'Shared intake: Slop Ledger' });
</script>
</body>
</html>
