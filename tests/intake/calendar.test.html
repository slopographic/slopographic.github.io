<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Calendar: an .ics file comes in one way</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: calendar/js/ui/ics-ui.js
  // Slop Calendar: Import .ics opens a dialog whose zone is the intake's; a drop on it and its Choose files reach the
  // same reader, which hands the file to the import preview. A file larger than 5 MB is refused with the reason.
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [];
  const ICS = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nUID:intake-1@test\r\nDTSTART;VALUE=DATE:20261101\r\nSUMMARY:Intake test\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n';
  const ics = (name) => new W.File([ICS], name, { type: 'text/calendar' });
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  const zone = () => D.querySelector('.sui-dlg .sd-zone') ? D.querySelector('.sui-dlg .sd-zone').closest('.sui-dlg') : null;
  async function preview() { return waitFor(() => [...D.querySelectorAll('.sui-dlg')].find((d) => d.querySelector('.ics-preview'))); }
  function closeAll() { for (const b of D.querySelectorAll('.sui-dlg button')) if (/Cancel/.test(b.textContent)) b.click(); }
  describe('Slop Calendar: one way in', () => {
    it('a drop on the Import dialog', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../calendar/index.html';
      await waitFor(() => { try { return fr.contentWindow.SlopCal.state && fr.contentDocument.getElementById('cBoot').hidden; } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      D.getElementById('cImport').click();
      await waitFor(() => W.SlopIntake.spec('calendar') && zone());
      const s = W.SlopIntake.spec('calendar'), reader = s.process;
      s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
      D.querySelector('.sui-dlg .sd-zone').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([ics('a.ics')]) }));
      const p = await preview();
      expect(p.textContent).toContain('a.ics');
      expect(seen).toEqual(['drop']);
      closeAll();
    }, { timeout: 40000 });
    it('the dialog’s Choose files; a file over 5 MB is refused', async () => {
      await waitFor(() => !D.querySelector('.ics-preview'));
      D.getElementById('cImport').click();
      await waitFor(() => zone());
      const big = new W.File([new Uint8Array(5 * 1024 * 1024 + 1)], 'big.ics', { type: 'text/calendar' });
      const r = await W.SlopIntake.take([big], { to: 'calendar', source: 'picker' });
      expect(r.skipped[0].reason).toContain('larger than');
      const input = D.querySelector('.sui-dlg input[type=file]');
      input.files = dtOf([ics('b.ics')]).files; input.dispatchEvent(new W.Event('change'));
      const p = await preview();
      expect(p.textContent).toContain('b.ics');
      expect(seen).toEqual(['drop', 'picker']);
      closeAll();
    });
  });
  run({ name: 'Shared intake: Slop Calendar' });
</script>
</body>
</html>
