<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shared intake in Slop Hex: every way in is the same path</title>
  <style>body { margin: 0; } iframe { width: 1200px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
<iframe id="app"></iframe>
<script src="../harness.js"></script>
<script>
  // Covers: hex/js/main.js, hex/js/actions.js
  // Slop Hex on the one intake: Open file…, a drop on the bytes, a paste, Open from Slop Drive (linked), ?drive=<id>
  // (launch) and the sample reach the same reader with the same events; a file already open is refused.
  const { describe, it, expect, waitFor, run } = SlopTest;
  let W, D, seen = [], events = [];
  const bin = (name, n = 4) => new W.File([new Uint8Array(n).map((_, i) => i + name.length)], name, { type: 'application/octet-stream' });
  const dtOf = (files) => { const dt = new W.DataTransfer(); files.forEach((f) => dt.items.add(f)); return dt; };
  async function through(source, start) {
    seen = []; events = [];
    await start();
    await waitFor(() => events.some((e) => e[0] === 'after'), { timeout: 15000 });
    expect(seen).toEqual([source]);
    expect(events.map((e) => e[0])).toEqual(['before', 'file', 'after']);
    expect(events.every((e) => e[1] === 'hex' && e[2] === source)).toBe(true);
  }
  const name = () => W.HexApp.app.doc && W.HexApp.app.doc.name;

  describe('Slop Hex: one way in', () => {
    it('Open file…', async () => {
      const fr = document.getElementById('app');
      fr.src = '../../hex/index.html';
      await waitFor(() => { try { return fr.contentDocument.body.classList.contains('ready') && fr.contentWindow.SlopIntake.spec('hex'); } catch (e) { return false; } }, { timeout: 20000 });
      W = fr.contentWindow; D = W.document;
      const s = W.SlopIntake.spec('hex'), reader = s.process;
      s.process = (f, ctx) => { seen.push(ctx.source); return reader(f, ctx); };
      for (const t of ['before', 'file', 'after']) W.SlopIntake.on(t, (d) => { events.push([t, d.app, d.source]); });
      W.SlopUI.pickFiles = async () => [bin('a.bin')];
      await through('picker', () => D.getElementById('hx-open').click());
      expect(name()).toBe('a.bin');
    }, { timeout: 40000 });
    it('a drop on the bytes; a file already open is refused', async () => {
      await through('drop', () => D.getElementById('hx-main').dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dtOf([bin('bb.bin', 6)]) })));
      expect(name()).toBe('bb.bin');
      const r = await W.SlopIntake.take([bin('bb.bin', 6)], { to: 'hex', source: 'drop' });
      expect(r.skipped.length).toBe(1);
    });
    it('a paste', async () => {
      await through('paste', () => D.body.dispatchEvent(new W.ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dtOf([bin('ccc.bin', 8)]) })));
    });
    it('Open from Slop Drive links the tab', async () => {
      W.SlopHub.pickFromDrive = async () => ({ id: 'x1', name: 'drive.bin', type: 'application/octet-stream', blob: bin('drive.bin', 9) });
      await through('drive', () => D.getElementById('hx-drive').click());
      expect(W.HexApp.app.driveId).toBe('x1');
    });
    it('?drive=<id> from another app (launch)', async () => {
      W.SlopHub.consumeLaunch = async () => ({ id: 'x2', name: 'sent.bin', type: 'application/octet-stream', blob: bin('sent.bin', 10) });
      await through('launch', () => W.SlopIntake.launch({ to: 'hex' }));
      expect(name()).toBe('sent.bin');
    });
  });
  run({ name: 'Shared intake: Slop Hex' });
</script>
</body>
</html>
