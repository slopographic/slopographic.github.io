<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consent fixture</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <!-- Loaded in an iframe by the consent tests. ?cfg=<json> overrides config, ?block=1 makes localStorage throw. -->
  <section id="donate-slot" data-donate hidden></section>
  <p id="tp-note" data-third-party>Analytics and ads stay off unless you switch them on.</p>
  <script>
    window.__errors = [];
    addEventListener('error', function (e) { window.__errors.push(String(e.message)); });
    (function () {
      var q = new URLSearchParams(location.search);
      try { window.SLOP_CONSENT_OVERRIDES = JSON.parse(q.get('cfg') || '{}'); } catch (e) { window.SLOP_CONSENT_OVERRIDES = {}; }
      if (q.get('block') === '1') {
        Object.defineProperty(window, 'localStorage', { configurable: true, get: function () { throw new DOMException('blocked', 'SecurityError'); } });
      }
      try { if (typeof window.parent.__stubLoader === 'function') window.SLOP_CONSENT_LOADER = window.parent.__stubLoader; } catch (e) { /* no parent */ }
    })();
  </script>
  <script src="../../shared/consent/config.js"></script>
  <script src="../../shared/consent/state.js"></script>
  <script src="../../shared/consent/consent-mode.js"></script>
  <script src="../../shared/consent/donate.js"></script>
  <script src="../../shared/consent/banner.js"></script>
</body>
</html>
