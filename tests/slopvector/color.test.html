<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SlopVector · colour tests</title>
<style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style></head>
<body>
  <iframe id="app" src="../../slopvector/index.html"></iframe>
  <script src="../harness.js"></script>
  <script src="boot.js"></script>
  <script>
  const { describe, it, expect, waitFor } = SlopTest;
  const S = () => SV.state;
  /** A pointer event at a document point, sent the way the stage listens (down on the stage, move/up on window). */
  function ptr(type, x, y, mods = {}) {
    const r = W.document.getElementById('stage').getBoundingClientRect(), v = S().view;
    const ev = new W.PointerEvent(type, Object.assign({ clientX: r.left + v.x + x * v.zoom, clientY: r.top + v.y + y * v.zoom, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 4, pointerType: 'mouse', bubbles: true, cancelable: true }, mods));
    (type === 'pointerdown' ? W.document.getElementById('stage') : W).dispatchEvent(ev);
  }
  const key = (code, k) => (W.document.body.dispatchEvent(new W.KeyboardEvent('keydown', { code, key: k, bubbles: true, cancelable: true })));
  /** Adds a rect to the active layer and returns its id. */
  function rect(x, y, w, h, style) {
    const o = SV.mk.rect(x, y, w, h, 0, style, 'Rect');
    SV.activeLayer().children.push(o); SV.commit('rect');
    return o.id;
  }
  const at = (el, fx, fy) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
  const fire = (el, type, p) => el.dispatchEvent(new W.PointerEvent(type, { clientX: p.x, clientY: p.y, button: 0, buttons: type === 'pointerup' ? 0 : 1, pointerId: 6, pointerType: 'mouse', bubbles: true, cancelable: true }));
  const picker = () => W.document.querySelector('.picker');
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  describe('SlopVector colour picker and eyedropper', () => {
    it('the eyedropper sets the fill of the selected object to the colour of the object under the pointer', async () => {
      blank();
      const src = rect(10, 10, 50, 50, { fill: '#00aa66', stroke: null });
      const dst = rect(200, 200, 50, 50, { fill: '#ffffff', stroke: null });
      SV.select([dst]);
      key('KeyI', 'i'); expect(S().tool).toBe('eyedropper');
      ptr('pointerdown', 30, 30); ptr('pointerup', 30, 30);
      expect(SV.getObj(dst).style.fill).toBe('#00aa66');
      expect(SV.getObj(src).style.fill).toBe('#00aa66');
    });

    it('Alt with the eyedropper sets the stroke instead, and a stroke-only object supplies its stroke', async () => {
      blank();
      const ink = rect(10, 10, 50, 50, { fill: null, stroke: '#ff0000', sw: 4 });
      const dst = rect(200, 200, 50, 50, { fill: '#ffffff', stroke: '#000000' });
      SV.select([dst]);
      key('KeyI', 'i');
      ptr('pointerdown', 10, 30, { altKey: true }); ptr('pointerup', 10, 30, { altKey: true });
      expect(SV.getObj(dst).style.stroke).toBe('#ff0000');
      expect(SV.getObj(dst).style.fill).toBe('#ffffff');
      expect(SV.getObj(ink).style.stroke).toBe('#ff0000');
    });

    it('the picker: the hex field and the hue bar update the paint live, and OK keeps it', async () => {
      blank();
      const dst = rect(200, 200, 50, 50, { fill: '#112233', stroke: null });
      SV.select([dst]); key('KeyV', 'v');
      UI.editPaint('fill', W.document.querySelector('.fs.fill'));
      await waitFor(() => picker() && picker().querySelector('.scp-hex'), { timeout: 5000 });
      const hex = picker().querySelector('.scp-hex');
      hex.value = 'abcdef'; hex.dispatchEvent(new W.Event('input', { bubbles: true }));
      expect(SV.currentPaint('fill')).toBe('#abcdef');
      expect(SV.getObj(dst).style.fill).toBe('#abcdef');
      const hue = picker().querySelector('.scp-hue');
      fire(hue, 'pointerdown', at(hue, 0.5, 0.5)); fire(hue, 'pointerup', at(hue, 0.5, 0.5));
      expect(SV.currentPaint('fill')).toBe(SV.getObj(dst).style.fill);
      expect(SV.getObj(dst).style.fill).toMatch(/^#[0-9a-f]{6}$/);
      expect(SV.getObj(dst).style.fill).not.toBe('#abcdef');
      UI.closePicker();
      await sleep(20);
      expect(picker()).toBe(null);
    });

    it('the alpha field writes an alpha colour into the paint (#rrggbbaa)', async () => {
      blank();
      const dst = rect(200, 200, 50, 50, { fill: '#112233', stroke: null });
      SV.select([dst]);
      UI.editPaint('fill', W.document.querySelector('.fs.fill'));
      await waitFor(() => picker() && picker().querySelector('.scp-hex'), { timeout: 5000 });
      const a = [...picker().querySelectorAll('input')].find((i) => i.getAttribute('aria-label') === 'Alpha');
      a.value = '50'; a.dispatchEvent(new W.Event('input', { bubbles: true }));
      expect(SV.currentPaint('fill')).toBe('#11223380');
      UI.closePicker();
    });

    it('an alpha fill exports as an SVG 1.1 colour plus fill-opacity', () => {
      blank();
      rect(10, 10, 50, 50, { fill: '#11223380', stroke: null });
      const svg = IO.exportSVG({});
      expect(svg).toMatch(/fill="#112233" fill-opacity="0\.50\d*"/);
    });

    it('the recent colours row keeps the colours used, newest first', async () => {
      SV.lsSet('slopvector.recentColors', '[]');
      blank();
      const dst = rect(200, 200, 50, 50, { fill: '#000000', stroke: null });
      SV.select([dst]);
      for (const c of ['#aa0011', '#00aa22']) {
        UI.editPaint('fill', W.document.querySelector('.fs.fill'));
        await waitFor(() => picker() && picker().querySelector('.scp-hex'), { timeout: 5000 });
        const hex = picker().querySelector('.scp-hex');
        hex.value = c.slice(1); hex.dispatchEvent(new W.Event('input', { bubbles: true }));
        UI.closePicker();
      }
      expect(JSON.parse(SV.lsGet('slopvector.recentColors'))).toEqual(['#00aa22', '#aa0011']);
      UI.editPaint('fill', W.document.querySelector('.fs.fill'));
      await waitFor(() => picker() && picker().querySelector('.scp-recent'), { timeout: 5000 });
      expect([...picker().querySelectorAll('.scp-recent')].map((b) => b.title)).toEqual(['#00aa22', '#aa0011']);
      UI.closePicker(true);
    });

    it('X swaps fill and stroke, D restores the defaults', () => {
      blank();
      S().style.fill = '#111111'; S().style.stroke = '#222222';
      key('KeyX', 'x');
      expect(S().style.fill).toBe('#222222'); expect(S().style.stroke).toBe('#111111');
      key('KeyD', 'd');
      expect(S().style.fill).toBe('#ffffff'); expect(S().style.stroke).toBe('#000000');
    });

    it('right-click on the fill chip opens the picker, and Window has the fill and stroke colour entries', async () => {
      blank();
      const chip = W.document.querySelector('.fs.fill');
      chip.dispatchEvent(new W.MouseEvent('contextmenu', { bubbles: true, cancelable: true, button: 2 }));
      await waitFor(() => picker(), { timeout: 5000 });
      UI.closePicker(true);
      const labels = UI.menuItems('Window').map((i) => i && i.label);
      expect(labels).toContain('Fill Colour…');
      expect(labels).toContain('Stroke Colour…');
    });
  });
  </script>
  <script>SlopTest.run({ name: 'SlopVector · colour' });</script>
</body>
</html>
