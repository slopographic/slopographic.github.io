<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SlopVector · restore original aspect ratio tests</title>
<style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; }</style></head>
<body>
  <iframe id="app" src="../../slopvector/index.html"></iframe>
  <script src="../harness.js"></script>
  <script src="boot.js"></script>
  <script>
  const { describe, it, expect } = SlopTest;
  /** Width over height of an image as drawn (its local box through its matrix). */
  const drawnRatio = (o) => (o.w * Math.hypot(o.m[0], o.m[1])) / (o.h * Math.hypot(o.m[2], o.m[3]));
  /** A 200 × 100 placed image whose source is 400 × 200 (ratio 2), on a blank artboard. */
  function placed() {
    blank();
    const o = SV.mk.image('a' + SV.uid(), 100, 100, 200, 100, 'Photo');
    o.src = { w: 400, h: 200 };
    SV.insertObj(o); SV.resetHistory(); SV.select([o.id]);
    return o;
  }

  describe('SlopVector: restore original aspect ratio', () => {
    it('boots', async () => { await bootVector(); expect(typeof SV.restoreAspect).toBe('function'); }, { timeout: 40000 });

    it('a stretched image gets its source ratio back, keeping the width and the top-left corner', () => {
      const o = placed();
      expect(SV.aspectTarget()).toBe(o);
      SV.transformObj(o, G.scale(0.5, 1, 100, 100)); // 100 × 100 now
      expect(drawnRatio(o)).toBeCloseTo(1, 3);
      const h0 = SV.state.hIdx;
      expect(SV.restoreAspect('w')).toBe(true);
      expect(drawnRatio(o)).toBeCloseTo(2, 3);
      const b = SV.objBBox(o);
      expect(b.x).toBeCloseTo(100, 3); expect(b.y).toBeCloseTo(100, 3); expect(b.w).toBeCloseTo(100, 3); expect(b.h).toBeCloseTo(50, 3);
      expect(SV.state.hIdx).toBe(h0 + 1);
    });

    it('keep height sets the width from the ratio instead', () => {
      const o = placed();
      SV.transformObj(o, G.scale(1, 0.5, 100, 100)); // 200 × 50
      SV.restoreAspect('h');
      const b = SV.objBBox(o);
      expect(b.h).toBeCloseTo(50, 3); expect(b.w).toBeCloseTo(100, 3);
    });

    it('a turned image is restored along its own sides', () => {
      const o = placed();
      o.m = G.mul(G.rotate(0.5, 0, 0), G.scale(0.5, 1, 0, 0)); // squeezed, then turned by 0.5 rad
      expect(drawnRatio(o) < 1.5).toBe(true);
      SV.restoreAspect('w');
      expect(drawnRatio(o)).toBeCloseTo(2, 3);
    });

    it('objects without a source ratio, and multiple selections, are not a target', () => {
      blank();
      const r = SV.mk.rect(0, 0, 50, 20, 0, { fill: '#f00', stroke: null, sw: 0 }, 'Rect');
      SV.insertObj(r); SV.select([r.id]);
      expect(SV.aspectTarget()).toBe(null);
      expect(SV.restoreAspect('w')).toBe(false);
      const o = placed(); const r2 = SV.mk.rect(0, 0, 50, 20, 0, { fill: '#f00', stroke: null, sw: 0 }, 'Rect2');
      SV.insertObj(r2); SV.select([o.id, r2.id]);
      expect(SV.aspectTarget()).toBe(null);
    });
  });
  SlopTest.run({ name: 'SlopVector restore aspect ratio' });
  </script>
</body>
</html>
