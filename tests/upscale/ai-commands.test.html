<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slop Upscale: the assistant's commands</title></head>
<body>
  <script>try { localStorage.setItem('slop-firstrun:upscale', '1'); } catch (e) { /* private window */ }</script>
  <script src="../harness.js"></script>
  <script>
  // Covers: upscale/js/app/ai-commands.js, upscale/js/app/commands.js, upscale/index.html, shared/commands/sources.js
  const { describe, it, expect, waitFor } = SlopTest;
  let win = null, Cmd = null;
  const run = async (id, args) => { const r = await Cmd.exec(id, args); if (!r.ok) throw new Error(id + ': ' + r.error); return r; };

  describe('Slop Upscale: assistant commands', () => {
    it('SlopCmd is on the page; prepare() loads the AI commands', async () => {
      const f = document.createElement('iframe');
      f.style.cssText = 'width:1200px;height:800px;border:0';
      f.src = '../../upscale/index.html';
      document.body.append(f);
      await new Promise((r) => f.addEventListener('load', r, { once: true }));
      win = f.contentWindow;
      await waitFor(() => win.SlopCmd && win.SlopCmd.get('up.run') && win.SlopUpscale.controller);
      Cmd = win.SlopCmd;
      expect(Cmd.get('up.ai.add-file')).toBe(null);
      await Cmd.prepare();
      expect(Cmd.get('up.ai.new-upscale').destructive).toBe(true);
      expect(Cmd.get('up.ai.upscale').tool).toBe('upscale');
    }, { timeout: 20000 });

    it('add_file from Slop Drive, set_upscale, upscale (Lanczos), save_result to Slop Drive, new_upscale', async () => {
      const c = document.createElement('canvas'); c.width = 60; c.height = 40;
      const g = c.getContext('2d'); g.fillStyle = '#20a040'; g.fillRect(0, 0, 60, 40);
      await win.SlopHub.put(await new Promise((r) => c.toBlob(r, 'image/png')), { name: 'leaf.png', from: 'test' });
      let r = await run('up.ai.add-file', { file: 'leaf.png' });
      expect(r.value).toMatch(/60 × 40/);
      r = await run('up.ai.set-upscale', { scale: '4', model: 'lanczos', format: 'png' });
      expect(r.value).toMatch(/4×/);
      expect((await Cmd.exec('up.ai.set-upscale', { scale: '2', model: 'quality' })).ok).toBe(false);
      r = await run('up.ai.upscale', {});
      expect(r.value).toMatch(/240 × 160/);
      r = await run('up.ai.save-result', { to: 'drive' });
      const id = /id ([^)\s]+)\)/.exec(r.value)[1], rec = await win.SlopHub.get(id);
      const bmp = await createImageBitmap(rec.blob);
      expect([bmp.width, bmp.height]).toEqual([240, 160]);
      expect(Cmd.state().file.result).toEqual({ width: 240, height: 160 });
      await run('up.ai.new-upscale', {});
      expect(Cmd.state().file).toBe(null);
    }, { timeout: 40000 });
  });
  SlopTest.run({ name: 'Slop Upscale: assistant commands' });
  </script>
</body>
</html>
