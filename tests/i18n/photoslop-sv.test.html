  <style>body { margin: 0; background: #111; color: #eee; font: 12px system-ui; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>

<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, beforeEach, afterEach, expect, waitFor, run } = SlopTest;
  // PhotoSlop in a same-origin iframe, so it shares this page's localStorage (the language choice); the tour is marked shown.
  const frames = [];
  function open(lang, width = 1280) {
    if (lang) localStorage.setItem('slop-profile', JSON.stringify({ v: 1, data: { lang: { mode: lang } } }));
    localStorage.setItem('photoslop.tourShown', '1');
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../photoslop/index.html';
    document.body.append(f);
    frames.push(f);
    return waitFor(() => f.contentDocument && f.contentDocument.body && f.contentDocument.body.classList.contains('ready') && f.contentDocument.querySelector('#menubar .mb-item') && f.contentDocument.querySelector('#toolbox .tool'), { timeout: 30000 }).then(() => f);
  }
  const KEY = /(^|[\s(“"'«”])(photoslop|ui|menu|shell|nav)\.[a-z0-9_]+\.[a-z0-9_.]*[a-z0-9_]/;
  /** Text a person sees or hears in the page: the body text and the labelling attributes. */
  function visible(doc) {
    const out = [doc.body.innerText];
    for (const el of doc.querySelectorAll('[title], [aria-label], [placeholder]')) out.push(el.getAttribute('title') || '', el.getAttribute('aria-label') || '', el.getAttribute('placeholder') || '');
    return out.join('\n');
  }
  const menuNames = (doc) => [...doc.querySelectorAll('#menubar .mb-item')].map((b) => b.textContent.trim());
  const toolNames = (doc) => [...doc.querySelectorAll('#toolbox .tool')].map((b) => b.getAttribute('aria-label'));
  async function fileMenu(f) {
    const b = f.contentDocument.querySelector('#menubar .mb-item');
    b.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    const m = await waitFor(() => f.contentDocument.querySelector('.menu'), { timeout: 20000 });
    const items = m.innerText;
    f.contentWindow.closeMenus();
    return items;
  }

  describe('PhotoSlop in Swedish', () => {
    beforeEach(() => { localStorage.clear(); });
    afterEach(() => { frames.splice(0).forEach((f) => f.remove()); localStorage.clear(); });

    it('shows Swedish menus, tools and File menu, with no key showing', async () => {
      const f = await open('sv');
      const doc = f.contentDocument;
      expect(doc.documentElement.getAttribute('lang')).toBe('sv');
      expect(menuNames(doc).slice(0, 4)).toEqual(['Arkiv', 'Redigera', 'Bild', 'Lager']);
      expect(toolNames(doc)).toContain('Penselverktyg');
      expect(toolNames(doc)).not.toContain('Brush Tool');
      const items = await fileMenu(f);
      expect(items).toContain('Öppna');
      expect(KEY.test(items)).toBe(false);
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('switching to English live switches back, then Swedish again', async () => {
      const f = await open('sv');
      const doc = f.contentDocument, I = f.contentWindow.SlopI18n;
      I.set('en');
      await waitFor(() => menuNames(doc)[0] === 'File' && toolNames(doc).includes('Brush Tool'), { timeout: 20000 });
      expect(doc.documentElement.getAttribute('lang')).toBe('en');
      I.set('sv');
      await waitFor(() => menuNames(doc)[0] === 'Arkiv' && toolNames(doc).includes('Penselverktyg'), { timeout: 20000 });
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('at 390 px the top bar fits in Swedish, with no sideways scroll', async () => {
      const f = await open('sv', 390);
      const doc = f.contentDocument;
      expect(doc.documentElement.scrollWidth <= f.contentWindow.innerWidth + 1).toBe(true);
      const bar = doc.querySelector('.topbar');
      expect(bar.scrollWidth <= bar.clientWidth + 1).toBe(true);
      expect(KEY.test(visible(doc))).toBe(false);
    });
  });
  run({ name: 'PhotoSlop in Swedish' });
  </script>
</body>
