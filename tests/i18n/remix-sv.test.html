<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reel Remix in Swedish</title>
  <!-- Covers: remix/i18n/index.js, remix/js/core.js, remix/js/ui.js, remix/js/panel.js, remix/js/fab.js, remix/js/side.js,
       remix/js/send.js, remix/js/export.js, remix/js/randomise.js, remix/js/drop.js, remix/js/moves.js, remix/js/auto.js,
       remix/js/config.js, remix/js/intake.js, shared/tour/tours/remix.js -->
  <style>body { margin: 0; background: #111; color: #eee; font: 12px system-ui; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, beforeEach, afterEach, expect, waitFor, run } = SlopTest;
  // Reel Remix in a same-origin iframe, so it shares this page's localStorage (the language choice).
  const frames = [];
  function open(lang, width = 1280) {
    if (lang) localStorage.setItem('slop-profile', JSON.stringify({ v: 1, data: { lang: { mode: lang } } }));
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../remix/index.html';
    document.body.append(f);
    frames.push(f);
    return waitFor(() => f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentWindow.RM && f.contentWindow.RM.ready && f.contentWindow.SlopShell && f.contentWindow.SlopShell.currentApp, { timeout: 30000 }).then(() => f);
  }
  const KEY = /(^|[\s(“"'«])(remix|ui|menu|shell|nav)\.[a-z0-9_]+\.?[a-z0-9_.]*[a-z0-9_]/;
  /** Text a person sees or hears in the page: the body text and the labelling attributes. */
  function visible(doc) {
    const out = [doc.body.innerText];
    for (const el of doc.querySelectorAll('[title], [aria-label], [placeholder]')) out.push(el.getAttribute('title') || '', el.getAttribute('aria-label') || '', el.getAttribute('placeholder') || '');
    for (const o of doc.querySelectorAll('option')) out.push(o.textContent);
    return out.join('\n');
  }
  const txt = (doc, sel) => doc.querySelector(sel).textContent.trim();
  /** The tour's words, read the way SlopTour reads them: keys <ns>.tour.title, <ns>.tour.<step>_title in the app tables. */
  function tour(f) {
    const w = f.contentWindow, got = [], keep = w.SlopTour;
    w.SlopTour = { define: (t) => got.push(t) };
    return new Promise((res, rej) => {
      const s = f.contentDocument.createElement('script');
      s.src = '../shared/tour/tours/remix.js';
      s.onload = () => { w.SlopTour = keep; const d = got[0], say = (k) => w.SlopI18n.t((d.ns || d.app) + '.tour.' + k); res({ title: say('title'), steps: d.steps.map((x) => ({ title: say(x.id.replace(/-/g, '_') + '_title') })) }); };
      s.onerror = rej;
      f.contentDocument.head.append(s);
    });
  }

  describe('Reel Remix in Swedish', () => {
    beforeEach(() => { localStorage.clear(); });
    afterEach(() => { frames.splice(0).forEach((f) => f.remove()); localStorage.clear(); });

    it('shows Swedish options, buttons, lists and the empty bin, with no key showing', async () => {
      const f = await open('sv');
      const doc = f.contentDocument;
      expect(doc.documentElement.getAttribute('lang')).toBe('sv');
      expect(txt(doc, '#rm-remix')).toBe('Remixa');
      expect(txt(doc, '#rm-reshuffle')).toBe('Blanda om');
      expect(txt(doc, '#rm-play')).toBe('Spela upp');
      expect(txt(doc, '#rm-export')).toBe('Exportera');
      expect(txt(doc, '.rm-side h2')).toBe('Alternativ');
      expect(txt(doc, '[data-i18n="remix.opt.target"]')).toBe('Mållängd (s)');
      expect(txt(doc, '#rm-bin .rm-empty')).toBe('Inga klipp eller foton än.');
      expect([...doc.querySelectorAll('#rm-pace option')].map((o) => o.textContent).join(' | ')).toContain('Snabbt');
      expect([...doc.querySelectorAll('#rm-fx option')].map((o) => o.textContent)).toContain('Filmkorn');
      expect(doc.getElementById('rm-target').closest('label').querySelector('input')).toBeTruthy();
      const t = await tour(f);
      expect(t.title).toBe('Rundtur i Reel Remix');
      expect(t.steps[0].title).toBe('Lägg till klipp');
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('switching to English live switches back, then Swedish again', async () => {
      const f = await open('sv');
      const doc = f.contentDocument, I = f.contentWindow.SlopI18n;
      I.set('en');
      await waitFor(() => txt(doc, '#rm-remix') === 'Remix' && txt(doc, '#rm-play') === 'Play', { timeout: 20000 });
      expect(doc.documentElement.getAttribute('lang')).toBe('en');
      expect(txt(doc, '.rm-side h2')).toBe('Options');
      expect(txt(doc, '#rm-bin .rm-empty')).toBe('No clips or photos yet.');
      expect([...doc.querySelectorAll('#rm-pace option')].map((o) => o.textContent).join(' | ')).toContain('Fast');
      I.set('sv');
      await waitFor(() => txt(doc, '#rm-remix') === 'Remixa' && txt(doc, '#rm-bin .rm-empty') === 'Inga klipp eller foton än.', { timeout: 20000 });
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('at 390 px Swedish fits with no sideways scroll', async () => {
      const f = await open('sv', 390);
      const doc = f.contentDocument;
      await waitFor(() => doc.documentElement.getAttribute('lang') === 'sv', { timeout: 20000 });
      expect(doc.documentElement.scrollWidth <= f.contentWindow.innerWidth + 1).toBe(true);
      expect(KEY.test(visible(doc))).toBe(false);
    });
  });
  run({ name: 'Reel Remix in Swedish' });
  </script>
</body>
</html>
