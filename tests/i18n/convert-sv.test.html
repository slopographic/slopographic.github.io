  <style>body { margin: 0; background: #111; color: #eee; font: 12px system-ui; } iframe { width: 1280px; height: 800px; border: 0; display: block; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, beforeEach, afterEach, expect, waitFor, run } = SlopTest;
  // File convert in a same-origin iframe, so it shares this page's localStorage (the language choice).
  const frames = [];
  function open(lang, page = 'convert/index.html', width = 1280) {
    if (lang) localStorage.setItem('slop-profile', JSON.stringify({ v: 1, data: { lang: { mode: lang } } }));
    const f = document.createElement('iframe');
    f.style.width = width + 'px';
    f.src = '../../' + page;
    document.body.append(f);
    frames.push(f);
    return waitFor(() => f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.querySelector('#cv-run'), { timeout: 30000 }).then(() => f);
  }
  const KEY = /(^|[\s(“"'«”])(convert|ui|menu|shell|nav)\.[a-z0-9_]+\.[a-z0-9_.]*[a-z0-9_]/;
  /** Text a person sees or hears in the page: the body text and the labelling attributes. */
  function visible(doc) {
    const out = [doc.body.innerText];
    for (const el of doc.querySelectorAll('[title], [aria-label], [placeholder]')) out.push(el.getAttribute('title') || '', el.getAttribute('aria-label') || '', el.getAttribute('placeholder') || '');
    return out.join('\n');
  }
  const runText = (doc) => doc.querySelector('#cv-run').textContent.trim();

  describe('File convert in Swedish', () => {
    beforeEach(() => { localStorage.clear(); });
    afterEach(() => { frames.splice(0).forEach((f) => f.remove()); localStorage.clear(); });

    it('the hub shows Swedish words and no key', async () => {
      const f = await open('sv');
      const doc = f.contentDocument;
      expect(doc.documentElement.getAttribute('lang')).toBe('sv');
      await waitFor(() => runText(doc) === 'Konvertera', { timeout: 20000 });
      expect(doc.querySelector('#all-h').textContent).toBe('Alla konverteringar');
      expect(doc.querySelector('#cv-search').getAttribute('placeholder')).toBe('Prova PDF, WebP eller CSV');
      await waitFor(() => doc.querySelector('[data-convert-cards] a, [data-convert-cards] li'), { timeout: 20000 });
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('switching to English live switches back, then Swedish again', async () => {
      const f = await open('sv');
      const doc = f.contentDocument, I = f.contentWindow.SlopI18n;
      await waitFor(() => runText(doc) === 'Konvertera', { timeout: 20000 });
      I.set('en');
      await waitFor(() => runText(doc) === 'Convert' && doc.querySelector('#all-h').textContent === 'All conversions', { timeout: 20000 });
      I.set('sv');
      await waitFor(() => runText(doc) === 'Konvertera', { timeout: 20000 });
      expect(KEY.test(visible(doc))).toBe(false);
    });

    it('a converter page at 390 px: the tool is Swedish, nothing scrolls sideways, no key shows', async () => {
      const f = await open('sv', 'convert/png-to-jpg/index.html', 390);
      const doc = f.contentDocument;
      await waitFor(() => runText(doc) === 'Konvertera', { timeout: 20000 });
      expect(doc.documentElement.scrollWidth <= f.contentWindow.innerWidth + 1).toBe(true);
      expect(KEY.test(visible(doc))).toBe(false);
    });
  });
  run({ name: 'File convert in Swedish' });
  </script>
</body>
</html>
