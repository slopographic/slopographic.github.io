<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Gallery assistant commands</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app"></iframe>
  <script src="../harness.js"></script>
  <script src="helpers.js"></script>
  <script>
  // Covers: gallery/js/ui/ai-commands.js, gallery/js/ui/commands.js, gallery/js/core/library.js, gallery/js/io/export.js, gallery/js/ui/actions.js
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  const T = GT;
  let W, G, C;
  const run = async (id, args) => { const r = await C.exec('gallery.ai.' + id, args); if (!r.ok) throw new Error(id + ': ' + r.error); return r; };

  async function boot() {
    const fr = document.getElementById('app');
    fr.src = 'about:blank';
    await sleep(40);
    fr.src = '../../gallery/index.html?db=' + T.dbName;
    await waitFor(() => fr.contentWindow && fr.contentWindow.SlopGallery && fr.contentWindow.SlopGallery.ready, { timeout: 30000 });
    W = fr.contentWindow; G = W.SlopGallery; C = W.SlopCmd;
    await G.db.destroy(); G.library._reset(); await G.library.load();
  }

  describe('Slop Gallery: the assistant imports, tags, orders and exports photos', () => {
    it('prepare() loads the commands; remove_photos and delete_album are the destructive ones', async () => {
      await boot();
      await C.prepare();
      for (const t of ['new-album', 'add-photos', 'set-tags', 'add-to-album', 'reorder-album', 'remove-from-album', 'remove-photos', 'delete-album', 'export-photos']) expect(!!C.get('gallery.ai.' + t)).toBe(true);
      expect(C.list().filter((c) => /^gallery\.ai\./.test(c.id) && c.destructive).map((c) => c.id).sort()).toEqual(['gallery.ai.delete-album', 'gallery.ai.remove-photos']);
    }, { timeout: 40000 });

    it('add_photos from Slop Drive into a new album; set_tags; reorder_album', async () => {
      for (const [n, c] of [['bee.jpg', '#ffcc00'], ['hive.jpg', '#aa6600']]) await W.SlopHub.put(await T.jpegFile(n, 120, 80, { colour: c }), { name: n, from: 'test' });
      const r = await run('add-photos', { files: ['bee.jpg', 'hive.jpg'], album: 'Bees' });
      expect(r.value.ids.length).toBe(2);
      expect(G.library.size).toBe(2);
      const al = G.library.albums().find((a) => a.name === 'Bees');
      expect(al.photoIds.length).toBe(2);
      await run('set-tags', { photos: ['bee.jpg'], add_tags: ['Summer', 'insects'], favourite: true, liked: 'liked' });
      const bee = G.library.list().find((p) => p.name === 'bee.jpg');
      expect([bee.tags, bee.fav, bee.liked]).toEqual([['summer', 'insects'], true, 'liked']);
      await run('reorder-album', { album: 'Bees', photos: ['hive.jpg'] });
      expect(G.library.photo(G.library.albums()[0].photoIds[0]).name).toBe('hive.jpg');
      expect((await C.exec('gallery.ai.set-tags', { photos: ['nope.jpg'], add_tags: ['x'] })).ok).toBe(false);
    }, { timeout: 30000 });

    it('export_photos: the album as a zip in Slop Drive', async () => {
      const e = await run('export-photos', { album: 'Bees' });
      const rec = await W.SlopHub.get(/id ([^)\s]+)\)/.exec(e.value)[1]);
      expect(rec.name).toBe('Bees.zip');
      const names = G.zip.read(await rec.blob.arrayBuffer()).map((x) => x.name).sort();
      expect(names).toEqual(['bee.jpg', 'hive.jpg']);
    }, { timeout: 20000 });

    it('the checkpoint takes back a new album and tags; remove_photos and delete_album', async () => {
      const back = C.checkpoint();
      await run('new-album', { name: 'Temp', photos: ['bee.jpg'] });
      await run('set-tags', { photos: ['bee.jpg'], tags: ['other'] });
      back();
      await waitFor(() => !G.library.albums().some((a) => a.name === 'Temp') && G.library.list().find((p) => p.name === 'bee.jpg').tags.includes('summer'), { timeout: 5000 });
      await run('remove-photos', { photos: ['hive.jpg'] });
      expect(G.library.size).toBe(1);
      await run('delete-album', { album: 'Bees' });
      expect(G.library.albums().length).toBe(0);
    }, { timeout: 20000 });
  });
  SlopTest.run({ name: 'Slop Gallery assistant commands' });
  </script>
</body>
</html>
