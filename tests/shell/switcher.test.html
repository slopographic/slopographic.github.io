<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shell · switcher (Ctrl+Space, search, keys)</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script src="../../shared/profile/profile.js"></script>   <!-- the language choice is kept in the profile (SlopI18n.set) -->
  <script src="../../shell/shell.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep, run } = SlopTest;
  const key = (k, o = {}) => document.body.dispatchEvent(new KeyboardEvent('keydown', { key: k, code: o.code || '', ctrlKey: !!o.ctrl, metaKey: !!o.meta, bubbles: true, cancelable: true }));
  const typeQuery = (q) => { const i = document.getElementById('sh-q'); i.value = q; i.dispatchEvent(new Event('input', { bubbles: true })); };
  const names = () => [...document.querySelectorAll('.sh-opt .sh-opt-name')].map((n) => n.textContent);
  // an app's name and a label as the page shows them: here Slop Music, Recent; a build's names in its start language
  const nm = (id) => window.slopAppName(id), said = (key, english) => SlopTest.said(window, key, english);
  const selected = () => document.querySelector('.sh-opt.sh-on');
  const closeIfOpen = () => { if (window.SlopSwitcher.isOpen()) key('Escape', { code: 'Escape' }); };
  const escapeFromInput = () => document.getElementById('sh-q').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));

  window.SlopShell.ready.then(() => {
    const S = window.SlopShell;
    let navigated = null;
    S.navigate = (url) => { navigated = url; };

    describe('SlopShell.esc', () => {
      // Covers: shell/shell.js, shell/drawer.js, shell/notify.js, shell/switcher.js
      it('is the one HTML escape of the shell modules: & < > " \' as entities, null as nothing', () => {
        expect(S.esc(`<b title="a">Q&A's</b>`)).toBe('&lt;b title=&quot;a&quot;&gt;Q&amp;A&#39;s&lt;/b&gt;');
        expect(S.esc(null)).toBe('');
      });
    });
    describe('switcher', () => {
      it('opens on Ctrl+Space and closes on Escape', async () => {
        closeIfOpen();
        key(' ', { code: 'Space', ctrl: true });
        expect(window.SlopSwitcher.isOpen()).toBe(true);
        expect(document.querySelector('.sh-back').hidden).toBe(false);
        await waitFor(() => document.activeElement && document.activeElement.id === 'sh-q');
        escapeFromInput();
        expect(window.SlopSwitcher.isOpen()).toBe(false);
        expect(document.querySelector('.sh-back').hidden).toBe(true);
      });

      it('Cmd+Space also opens it, and a second press closes it', () => {
        closeIfOpen();
        key(' ', { code: 'Space', meta: true });
        expect(window.SlopSwitcher.isOpen()).toBe(true);
        key(' ', { code: 'Space', meta: true });
        expect(window.SlopSwitcher.isOpen()).toBe(false);
      });

      it('ignores plain Space and Ctrl+other keys', () => {
        closeIfOpen();
        key(' ', { code: 'Space' });
        key('k', { code: 'KeyK', ctrl: true });
        expect(window.SlopSwitcher.isOpen()).toBe(false);
      });

      it('tags an app in development "Preview" and a beta app "Beta", short words from the tables, in the chosen language', async () => {
        // the tag read "In development" (long) and a lower-case "beta" (the language menu's word)
        const tagOf = (name) => { const o = [...document.querySelectorAll('.sh-opt')].find((b) => b.querySelector('.sh-opt-name').textContent === name); return o && o.querySelector('.sh-tag') ? o.querySelector('.sh-tag').textContent : ''; };
        closeIfOpen();
        key(' ', { code: 'Space', ctrl: true });
        typeQuery('Slop Docs');
        expect(tagOf('Slop Docs')).toBe('Preview');
        typeQuery('SlopLabel');
        expect(tagOf('SlopLabel')).toBe('Beta');
        const I = window.SlopI18n, swapped = () => new Promise((ok) => window.addEventListener('slopi18n', ok, { once: true }));
        let w = swapped(); I.set('sv'); await w;
        // the app's name in Swedish where the tables give one (sv-apps.js), as the switcher shows it
        const docs = window.SLOP_APPS.find((a) => a.id === 'docs'), svName = window.slopAppName ? window.slopAppName(docs) : docs.name;
        typeQuery(docs.name);   // the registry name finds it in any language
        expect(tagOf(svName) || tagOf(docs.name)).toBe('Förhandsversion');
        w = swapped(); I.set('en'); await w;
        closeIfOpen();
      });

      it('filters the registry by name', () => {
        closeIfOpen();
        key(' ', { code: 'Space', ctrl: true });
        typeQuery('music');
        expect(names()).toEqual([nm('music')]);
        typeQuery('PDF');
        expect(names()[0]).toBe(nm('pdf'));
        expect(names().includes(nm('music'))).toBe(false);
        typeQuery('zzqx');
        expect(document.querySelectorAll('.sh-opt').length).toBe(0);
        if (window.SlopI18n.get() === 'en') expect(document.querySelector('.sh-empty').textContent).toMatch(/No app matches/);
        else expect(document.querySelector('.sh-empty').textContent).toBe(window.SlopI18n.t('switcher.no_match', { query: 'zzqx' }));
        closeIfOpen();
      });

      it('Enter opens the app that is highlighted', () => {
        closeIfOpen();
        navigated = null;
        key(' ', { code: 'Space', ctrl: true });
        typeQuery('music');
        document.getElementById('sh-q').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
        expect(navigated).toBe(S.appUrl(S.apps().find((a) => a.id === 'music')));
        expect(window.SlopSwitcher.isOpen()).toBe(false);
      });

      it('arrow keys move the highlight and Enter opens it', () => {
        closeIfOpen();
        navigated = null;
        key(' ', { code: 'Space', ctrl: true });
        typeQuery('pdf');   // an id and a word in several apps of every build (a brand word would match nothing in a plain build)
        expect(document.querySelectorAll('.sh-opt').length >= 3).toBe(true);
        const q = document.getElementById('sh-q');
        const press = (k) => q.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
        press('ArrowDown'); press('ArrowDown');
        expect(selected().dataset.i).toBe('2');
        press('ArrowUp');
        expect(selected().dataset.i).toBe('1');
        press('ArrowUp'); press('ArrowUp');
        expect(selected().dataset.i).toBe(String(document.querySelectorAll('.sh-opt').length - 1));
        press('ArrowDown');
        press('Enter');
        expect(navigated).toBe(S.appUrl(window.SlopSwitcher.items()[0].app));
      });

      it('lists recently used apps first, from storage', () => {
        closeIfOpen();
        localStorage.setItem('slop.shell.recent.v1', JSON.stringify({ v: 1, data: ['music', 'pdf'] }));
        key(' ', { code: 'Space', ctrl: true });
        const heads = [...document.querySelectorAll('.sh-sec')].map((h) => h.textContent);
        expect(heads[0]).toBe(said('switcher.recent', 'Recent'));
        expect(names().slice(0, 2)).toEqual([nm('music'), nm('pdf')]);
        closeIfOpen();
        localStorage.removeItem('slop.shell.recent.v1');
      });
    });
    run({ name: 'Shell · switcher' });
  });
  </script>
</body>
</html>
