<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Paste: assistant commands</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1280px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script src="../../shared/commands/args.js"></script>
  <script>
  // Covers: paste/js/ai-commands.js, paste/js/commands.js
  const { describe, it, expect, waitFor } = SlopTest;
  const f = document.getElementById('app');
  let W, C;
  const run = async (id, args) => { const r = await C.exec('paste.ai.' + id, args); if (!r.ok) throw new Error(id + ': ' + r.error); return r; };
  const recs = async () => (await W.SlopHub.list({ trashed: 'any' })).filter((r) => r.meta && r.meta.type === 'paste');

  describe('Paste: assistant commands', () => {
    it('prepare() loads them; delete_paste is the only destructive one', async () => {
      f.src = '../../paste/index.html';
      await waitFor(() => f.contentWindow && f.contentWindow.document.body && f.contentWindow.document.body && f.contentWindow.document.body.classList.contains('ready') && f.contentWindow.SlopCmd, { timeout: 20000 });
      W = f.contentWindow; C = W.SlopCmd;
      await C.prepare();
      const ids = C.list().filter((c) => /^paste\.ai\./.test(c.id));
      expect(ids.map((c) => c.id).sort()).toEqual(['paste.ai.delete-paste', 'paste.ai.export-paste', 'paste.ai.insert-text', 'paste.ai.new-paste', 'paste.ai.set-paste']);
      expect(ids.filter((c) => c.destructive).map((c) => c.id)).toEqual(['paste.ai.delete-paste']);
    }, { timeout: 30000 });

    it('new_paste, insert_text, set_paste are saved to Slop Drive', async () => {
      await run('new-paste', { title: 'Snippet', text: 'let a = 1;', language: 'javascript' });
      await run('insert-text', { text: 'let b = 2;' });
      await run('set-paste', { title: 'Snippet 2', expiry: '1d' });
      let r;
      for (let i = 0; i < 40; i++) { r = (await recs()).find((x) => x.meta.title === 'Snippet 2'); if (r && (await r.blob.text()).includes('let b')) break; await new Promise((res) => setTimeout(res, 150)); }
      expect(await r.blob.text()).toBe('let a = 1;\nlet b = 2;');
      expect([r.meta.language, r.meta.expiry]).toEqual(['javascript', '1d']);
      expect(C.state().open.title).toBe('Snippet 2');
    }, { timeout: 20000 });

    it('export_paste writes a .js file to Slop Drive; delete_paste trashes; the rollback undoes', async () => {
      const e = await run('export-paste', {});
      const rec = await W.SlopHub.get(/id ([^)\s]+)\)/.exec(e.value)[1]);
      expect(rec.name).toBe('Snippet 2.js');
      expect(await rec.blob.text()).toContain('let b = 2;');
      const back = C.checkpoint();
      await run('new-paste', { title: 'Temp' });
      await run('delete-paste', { paste: 'Snippet 2' });
      expect(C.state().pastes.some((p) => p.title === 'Snippet 2')).toBe(false);
      expect(back()).toBe(true);
      expect(C.state().pastes.some((p) => p.title === 'Snippet 2')).toBe(true);
      expect(C.state().pastes.some((p) => p.title === 'Temp')).toBe(false);
    }, { timeout: 20000 });
  });
  SlopTest.run({ name: 'Paste: assistant commands' });
  </script>
</body>
</html>
