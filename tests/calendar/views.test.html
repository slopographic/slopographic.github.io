<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Calendar · year, month, week, day and split views render; split shows a clicked day; keys switch views</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, run } = SlopTest;
  const cal = document.createElement('iframe');
  cal.style.cssText = 'width:1100px;height:760px;border:0;position:fixed;left:0;top:0;background:#111';
  cal.src = '../../calendar/index.html#month';
  document.body.append(cal);
  const cw = () => cal.contentWindow, cd = () => cal.contentDocument;
  const booted = () => cw() && cw().SlopCal && cw().SlopCal.state && cd() && cd().getElementById('cBoot') && cd().getElementById('cBoot').hidden;
  const T = () => cw().SlopTime;
  const zone = () => cw().SlopCal.state.zone;
  const app = () => cw().SlopCal.app;
  const key = (k, opts = {}) => cd().dispatchEvent(new (cw().KeyboardEvent)('keydown', { key: k, bubbles: true, ...opts }));
  const view = () => cw().SlopCal.state.view;
  const pressed = (v) => cd().querySelector(`[data-view="${v}"]`).getAttribute('aria-pressed');
  const today = () => T().todayIn(zone());
  // A day in this month other than today, so the split view has a clicked day to show on the right.
  const otherDay = () => (T().addDays(today(), 1).slice(0, 7) === today().slice(0, 7) ? T().addDays(today(), 1) : T().addDays(today(), -1));

  describe('each view renders', () => {
    it('year: twelve mini months, and a day with something on it has a dot', async () => {
      await waitFor(booted, { timeout: 20000 });
      const ok = await cw().SlopEvents.save({ title: 'Year dot', allDay: true, startDay: today(), endDay: today(), tz: zone(), color: 'blue', kind: 'event', freq: 'none' });
      expect(ok.ok).toBe(true);
      await app().setView('year');
      await waitFor(() => cd().querySelectorAll('.yr-m').length === 12, { timeout: 8000 });
      expect(cd().querySelector(`.yr-d[data-day="${today()}"]`).classList.contains('has-dot')).toBe(true);
      expect(cd().querySelector(`.yr-d[data-day="${otherDay()}"]`).classList.contains('has-dot')).toBe(false);
      expect(cd().getElementById('cTitle').textContent).toBe(today().slice(0, 4));
    });

    it('month: a six-week grid with the event on its day', async () => {
      await app().setView('month');
      await waitFor(() => cd().querySelectorAll('.mo-cell').length === 42, { timeout: 8000 });
      expect(cd().querySelector(`.mo-cell[data-day="${today()}"] .chip[data-kind="event"]`)).toBeTruthy();
      expect(cd().getElementById('cTitle').textContent).toContain(today().slice(0, 4));
    });

    it('week: seven day columns with time slots and a title such as "3 to 9 March 2026"', async () => {
      await app().setView('week');
      await waitFor(() => cd().querySelectorAll('.tg-col').length === 7, { timeout: 8000 });
      expect(cd().querySelectorAll('.tg-hour').length).toBe(24);
      expect(cd().getElementById('cTitle').textContent).toMatch(/ to /);
    });

    it('day: one column with time slots, titled with the day', async () => {
      await app().setView('day');
      await waitFor(() => cd().querySelectorAll('.tg-col').length === 1, { timeout: 8000 });
      expect(cd().querySelector('.tg-col').dataset.day).toBe(today());
      expect(cd().getElementById('cTitle').textContent).toContain(String(Number(today().slice(8, 10))));
    });

    it('split: a month pane on the left and a day pane on the right', async () => {
      await app().setView('split');
      await waitFor(() => cd().querySelectorAll('.sp-pane').length === 2, { timeout: 8000 });
      expect(cd().querySelectorAll('.sp-pane[data-pane="month"] .mo-cell').length).toBe(42);
      expect(cd().querySelectorAll('.sp-pane[data-pane="day"] .tg-col').length).toBe(1);
      expect(cd().getElementById('cSplit').hidden).toBe(false);
    });
  });

  describe('the segmented control, keys and memory', () => {
    it('the segmented control switches views and marks the chosen one', async () => {
      cd().querySelector('[data-view="year"]').click();
      await waitFor(() => pressed('year') === 'true', { timeout: 8000 });
      expect(view()).toBe('year');
      expect(pressed('split')).toBe('false');
      expect(cd().getElementById('cSplit').hidden).toBe(true);
      expect(cw().localStorage.getItem('slop-calendar.view')).toBe('year');
    });

    it('keys Y, M, W, D, S and A switch views, and arrows move the period', async () => {
      const seen = [];
      for (const [k, v] of [['m', 'month'], ['w', 'week'], ['d', 'day'], ['s', 'split'], ['y', 'year'], ['a', 'agenda']]) {
        key(k);
        await waitFor(() => view() === v, { timeout: 8000 });
        seen.push(v);
      }
      expect(seen).toEqual(['month', 'week', 'day', 'split', 'year', 'agenda']);
      key('m');
      await waitFor(() => view() === 'month', { timeout: 8000 });
      const before = cw().SlopCal.state.anchor;
      key('ArrowRight');
      await waitFor(() => cw().SlopCal.state.anchor !== before, { timeout: 8000 });
      expect(cw().SlopCal.state.anchor.slice(0, 7) > before.slice(0, 7)).toBe(true);
      key('ArrowLeft');
      await waitFor(() => cw().SlopCal.state.anchor.slice(0, 7) === before.slice(0, 7), { timeout: 8000 });
    });

    it('the split pair chosen in the toolbar is remembered on this device', async () => {
      await app().setView('split');
      const sel = cd().getElementById('cSplit');
      sel.value = 'week-day';
      sel.dispatchEvent(new (cw().Event)('change', { bubbles: true }));
      await waitFor(() => cd().querySelector('.sp-pane[data-pane="week"]'), { timeout: 8000 });
      expect(cw().localStorage.getItem('slop-calendar.split')).toBe('week-day');
      expect(cd().querySelectorAll('.sp-pane[data-pane="week"] .tg-col').length).toBe(7);
      sel.value = 'month-day';
      sel.dispatchEvent(new (cw().Event)('change', { bubbles: true }));
      await waitFor(() => cd().querySelector('.sp-pane[data-pane="month"]'), { timeout: 8000 });
    });
  });

  describe('split view and the year', () => {
    it('split: clicking a day on the left shows that day on the right', async () => {
      await app().setView('split');
      await waitFor(() => cd().querySelector('.sp-pane[data-pane="month"] .mo-cell'), { timeout: 8000 });
      const target = otherDay();
      cd().querySelector(`.sp-pane[data-pane="month"] .mo-cell[data-day="${target}"]`).click();
      await waitFor(() => cd().querySelector(`.sp-pane[data-pane="day"] .tg-col[data-day="${target}"]`), { timeout: 8000 });
      expect(cw().SlopCal.state.anchor).toBe(target);
      expect(cd().querySelectorAll('.sp-pane[data-pane="day"] .tg-col').length).toBe(1);
      expect(view()).toBe('split');
    });

    it('year: clicking a month name opens that month in the month view', async () => {
      await app().setView('year');
      await waitFor(() => cd().querySelectorAll('.yr-m').length === 12, { timeout: 8000 });
      const target = otherDay();
      const m = Number(target.slice(5, 7));
      cd().querySelectorAll('.yr-name')[m - 1].click();
      await waitFor(() => view() === 'month' && cw().SlopCal.state.anchor.slice(0, 7) === target.slice(0, 7), { timeout: 8000 });
      await waitFor(() => cd().querySelector('.mo'), { timeout: 8000 });
    });
  });

  run({ name: 'Calendar · views, keys and split' });
  </script>
</body>
</html>
