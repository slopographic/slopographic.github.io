<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="slop-test-needs" content="mascot=none">
  <title>Buddy · a build without a mascot shows and loads none</title>
  <style>body { margin: 0; background: #111; color: #eee; font: 13px system-ui; }</style>
</head>
<body>
  <!-- The other side of the mascot switch (brand profile "mascot": false): the buddy's own pages need the engine
       (tests/buddy/app.test.html), a mascot of the build's own runs in the slot (tests/buddy/overlay.test.html). -->
  <script src="../harness.js"></script>
  <script>
  const { describe, it, expect, waitFor, sleep } = SlopTest;
  const loaded = (win, re) => win.performance.getEntriesByType('resource').some((e) => re.test(e.name));
  async function open() {
    const f = document.createElement('iframe');
    f.style.cssText = 'width:1100px;height:700px;border:0;display:block';
    f.src = 'fixture.html';
    document.body.prepend(f);
    await new Promise((r) => f.addEventListener('load', r, { once: true }));
    await waitFor(() => f.contentWindow.SlopBuddyBoot, { timeout: 10000 });
    await sleep(300);
    return f.contentWindow;
  }

  describe('mascot off', () => {
    it('the facts say so', () => {
      expect(BRAND_FACTS.mascot).toBe('none');
    });
    it('no toggle, nothing loaded, the shortcut does nothing', async () => {
      const win = await open();
      expect(win.document.querySelector('.buddy-toggle')).toBe(null);
      expect(win.SlopBuddyBoot.on).toBe(false);
      win.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'S', code: 'KeyS', altKey: true, shiftKey: true, bubbles: true }));
      await sleep(200);
      expect(win.SlopBuddyBoot.on).toBe(false);
      expect(win.SlopBuddyBoot.engine).toBe(null);
      expect(loaded(win, /shared\/buddy\/engine\.js|shared\/mascot\/slot\.js/)).toBe(false);
      expect(win.document.querySelector('.mascot-slot, .sloppo-layer')).toBe(null);
    });
  });

  SlopTest.run();
  </script>
</body>
</html>
