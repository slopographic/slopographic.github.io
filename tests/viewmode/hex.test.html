<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>View modes: Hex</title>
<style>html, body { margin: 0; height: 100%; } #app { display: block; width: 1280px; height: 800px; border: 0; }</style>
</head>
<body>
  <iframe id="app" title="Hex app"></iframe>
  <script>window.APP_MODES = { name: 'Hex', url: '../../hex/', workspace: '#hx-main', sidebar: [], panels: ['#hx-info'], grow: false,
    // a blank tab shows the empty state without the info strip, so open a few bytes first (once), then wait for the strip
    ready: (w, d) => { if (w.HexApp && !w.__opened) { w.__opened = true; w.HexApp.openBlob(new w.Blob([new w.Uint8Array(64)]), { name: 'a.bin' }); } return !!d.getElementById('hx-info') && !d.getElementById('hx-info').hidden; } };   // the menu bar stays as a strip: it holds the mode controls</script>
  <script src="../harness.js"></script>
  <script src="app-modes.js"></script>
</body>
</html>
