<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slop Reminders: assistant commands</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1100px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script src="../../shared/commands/args.js"></script>
  <script>
  // Covers: reminders/js/app.js, shared/data/ai-records-apps.js, shared/data/ai-records.js
  const { describe, it, expect, waitFor } = SlopTest;
  const f = document.getElementById('app');
  let W, C;
  const run = async (id, args) => { const r = await C.exec('reminders.ai.' + id, args); if (!r.ok) throw new Error(id + ': ' + r.error); return r; };

  describe('Slop Reminders: assistant commands', () => {
    it('create_record adds a custom reminder from an ISO time; the timeline shows it; export and rollback', async () => {
      f.src = '../../reminders/index.html';
      await waitFor(() => f.contentWindow && f.contentWindow.SlopReminderEngine && f.contentDocument.getElementById('rBoot') && f.contentDocument.getElementById('rBoot').hidden && f.contentWindow.SlopCmd, { timeout: 20000 });
      W = f.contentWindow; C = W.SlopCmd;
      await C.prepare();
      const at = new Date(Date.now() + 3 * 3600e3).toISOString();
      const r = await run('create-record', { collection: 'reminders', fields: { title: 'Check the hives', at } });
      const rec = (await W.SlopData.store.get('reminders', r.value.id)).value;
      expect([rec.source, rec.title, rec.at]).toEqual(['custom', 'Check the hives', Date.parse(at)]);
      await waitFor(() => f.contentDocument.getElementById('rList').textContent.includes('Check the hives'), { timeout: 8000 });
      const e = await run('export-records', { collection: 'reminders', format: 'json' });
      const json = JSON.parse(await (await W.SlopHub.get(/id ([^)\s]+)\)/.exec(e.value)[1])).blob.text());
      expect(json.some((x) => x.title === 'Check the hives')).toBe(true);
      const back = C.checkpoint();
      const r2 = await run('create-record', { collection: 'reminders', fields: { title: 'Temp', at } });
      back();
      let gone = false;
      for (let i = 0; i < 40 && !gone; i++) { await new Promise((res) => setTimeout(res, 100)); gone = !(await W.SlopData.store.get('reminders', r2.value.id)).value; }
      expect(gone).toBe(true);
    }, { timeout: 30000 });
  });
  SlopTest.run({ name: 'Slop Reminders: assistant commands' });
  </script>
</body>
</html>
