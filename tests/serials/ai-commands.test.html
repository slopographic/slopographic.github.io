<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Serial counter: assistant commands</title>
  <style>body { margin: 0; background: #111; } iframe { width: 1100px; height: 760px; border: 0; display: block; }</style>
</head>
<body>
  <iframe id="app" src="about:blank"></iframe>
  <script src="../harness.js"></script>
  <script src="../../shared/commands/args.js"></script>
  <script>
  // Covers: serials/js/ai-commands.js, serials/js/app.js
  const { describe, it, expect, waitFor } = SlopTest;
  const f = document.getElementById('app');
  let W, C;
  const run = async (id, args) => { const r = await C.exec('serials.ai.' + id, args); if (!r.ok) throw new Error(id + ': ' + r.error); return r; };
  const png = () => new Promise((res) => { const c = document.createElement('canvas'); c.width = c.height = 8; c.toBlob(res, 'image/png'); });

  describe('Serial counter: assistant commands', () => {
    it('add_photos from Slop Drive, add_text, add and remove serials, a pattern, the CSV to Slop Drive', async () => {
      f.src = '../../serials/index.html';
      await waitFor(() => f.contentWindow && f.contentWindow.SlopSerials && f.contentWindow.SlopCmd && f.contentWindow.SlopHub && f.contentDocument.readyState === 'complete', { timeout: 20000 });
      W = f.contentWindow; C = W.SlopCmd;
      if (W.SlopFirstRun) W.SlopFirstRun.once = async () => true;
      await C.prepare();
      expect(C.list().filter((c) => /^serials\.ai\./.test(c.id) && c.destructive).map((c) => c.id)).toEqual(['serials.ai.new-count', 'serials.ai.clear-photos']);
      await W.SlopHub.put(await png(), { name: 'shelf-1.png' });
      await W.SlopHub.put(await png(), { name: 'shelf-2.png' });
      await run('add-photos', { files: ['shelf-1.png', 'shelf-2.png'] });
      expect(C.state().photos.length).toBe(2);
      let r = await run('add-text', { photo: '1', text: 'S/N FOC2145X0AB\nS/N FOC2145X0CD' });
      expect(r.value).toMatch(/2 serial/);
      await run('add-text', { photo: 'shelf-2', text: 'FOC2145X0AB' });
      expect(C.state().totals.quantity).toBe(2);
      expect(C.state().unique.find((u) => u.serial === 'FOC2145X0AB').count).toBe(2);
      await run('add-serial', { photo: '2', serial: 'abc1234wxyz' });
      await run('remove-serial', { photo: '1', serial: 'FOC2145X0CD' });
      expect(C.state().unique.map((u) => u.serial).sort()).toEqual(['ABC1234WXYZ', 'FOC2145X0AB']);
      r = await run('export-serials', {});
      const csv = await (await W.SlopHub.get(/id ([^)\s]+)\)/.exec(r.value)[1])).blob.text();
      expect(csv).toContain('FOC2145X0AB');
      expect((await C.exec('serials.ai.set-pattern', { pattern: '([' })).ok).toBe(false);
      const back = C.checkpoint();
      await run('clear-photos', {});
      expect(C.state().photos.length).toBe(0);
      back();
      expect(C.state().photos.length).toBe(2);
    }, { timeout: 40000 });

    it('new_count clears the photos and sets the pattern (or the default); a bad pattern changes nothing; the rollback brings them back', async () => {
      expect(C.state().photos.length).toBe(2);
      const bad = await C.exec('serials.ai.new-count', { pattern: '([' });
      expect(bad.ok).toBe(false);
      expect(C.state().photos.length).toBe(2);
      const back = C.checkpoint();
      let r = await run('new-count', { pattern: '\\bSN\\d{4}\\b' });
      expect(r.value).toMatch(/cleared 2 photo/);
      expect(C.state().photos.length).toBe(0);
      expect(C.state().pattern).toBe('\\bSN\\d{4}\\b');
      await W.SlopHub.put(await png(), { name: 'box.png' });
      await run('add-photos', { files: ['box.png'] });
      await run('add-text', { text: 'SN1234 and SN5678, not FOC2145X0AB' });
      expect(C.state().unique.map((u) => u.serial).sort()).toEqual(['SN1234', 'SN5678']);
      back();
      expect(C.state().photos.length).toBe(2);
      r = await run('new-count', {});
      expect(C.state().pattern).toBe(W.SlopSerials.DEFAULT_PATTERN);
      expect(C.state().photos.length).toBe(0);
    }, { timeout: 30000 });
  });
  SlopTest.run({ name: 'Serial counter: assistant commands' });
  </script>
</body>
</html>
