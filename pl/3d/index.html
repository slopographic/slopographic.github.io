          <button type="button" class="vp-btn" data-cmd="3d.view.top" data-i18n="3d.app.view_top">2 Góra</button>

        <div class="vp-panels" role="toolbar" aria-label="Panele" data-i18n-attr="aria-label:3d.app.panels">
          <button type="button" class="vp-btn" id="btnScene" aria-expanded="false" data-i18n="3d.app.scene">Scena</button>
          <button type="button" class="vp-btn" id="btnProps" aria-expanded="false" data-i18n="3d.app.properties">Właściwości</button>
        </div>
        <p id="hint" class="vp-hint" data-i18n="3d.app.hint">Przeciągnij, aby obracać · Shift+przeciągnij, aby przesuwać · kółko, aby przybliżać · prawy przycisk, aby otworzyć menu · Tab, aby edytować siatkę</p>
        <div id="nogl" class="nogl" hidden role="alert"></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>

        <h2 class="panel-h" data-i18n="3d.app.properties">Właściwości</h2>
        <div id="inspector" class="panel-body"></div>
