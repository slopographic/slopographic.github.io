<body>
  <div class="sc-bar" id="sc-bar"></div>
  <main class="sc-main" id="sc-main">
    <aside class="sc-list" id="sc-list" aria-label="Pages" data-i18n-attr="aria-label:scan.list.label">
      <p class="sc-count" id="sc-count" aria-live="polite"></p>
      <ol class="sc-pages" id="sc-pages"></ol>
      <div class="sc-list-more">
        <button type="button" class="sui-btn sui-primary" id="sc-list-camera" data-i18n="scan.app.camera">Take photo</button>
        <button type="button" class="sui-btn" id="sc-list-add" data-i18n="scan.app.add">Add photos…</button>
      </div>
    </aside>

    <section class="sc-view" id="sc-view" aria-label="Page" data-i18n-attr="aria-label:scan.view.label">
      <div class="sc-empty" id="sc-empty">
        <h1 class="sc-hello" data-i18n="scan.app.hello">Photos of pages, made into a clean PDF</h1>
        <button type="button" class="sui-btn sui-primary sc-big" id="sc-empty-camera" data-i18n="scan.app.camera">Take photo</button>
        <div class="sc-drop" id="sc-drop"></div>
      </div>
      <div class="sc-work" id="sc-work" hidden>
        <div class="sc-tools" role="toolbar" aria-label="Page" data-i18n-attr="aria-label:scan.view.label">
          <button type="button" class="sui-btn sc-back" id="sc-back" data-i18n="scan.view.back">‹ Pages</button>
          <div class="sf-seg sc-modes" role="group" aria-label="Show" data-i18n-attr="aria-label:scan.view.mode">
            <button type="button" class="sui-btn" id="sc-mode-result" aria-pressed="true" data-i18n="scan.view.result">Result</button>
            <button type="button" class="sui-btn" id="sc-mode-corners" aria-pressed="false" data-i18n="scan.view.corners">Corners</button>
          </div>
          <span class="sc-pos" id="sc-pos"></span>
          <span class="sc-tools-end">
            <button type="button" class="sui-btn sc-icon" id="sc-prev" title="Previous page" aria-label="Previous page" data-i18n-attr="title:scan.view.prev;aria-label:scan.view.prev">‹</button>
            <button type="button" class="sui-btn sc-icon" id="sc-next" title="Next page" aria-label="Next page" data-i18n-attr="title:scan.view.next;aria-label:scan.view.next">›</button>
            <button type="button" class="sui-btn sc-icon" id="sc-rot-l" title="Turn left" aria-label="Turn left" data-i18n-attr="title:scan.view.turn_left;aria-label:scan.view.turn_left">⟲</button>
            <button type="button" class="sui-btn sc-icon" id="sc-rot-r" title="Turn right" aria-label="Turn right" data-i18n-attr="title:scan.view.turn_right;aria-label:scan.view.turn_right">⟳</button>
          </span>
        </div>
        <div class="sc-result-box" id="sc-result-box">
          <canvas class="sc-result" id="sc-result" role="img" aria-label="Page" data-i18n-attr="aria-label:scan.view.label"></canvas>
        </div>
        <div class="sc-crop" id="sc-crop" data-touch-surface hidden>
          <canvas class="sc-photo" id="sc-photo" aria-hidden="true"></canvas>
          <svg class="sc-handles" id="sc-handles" preserveAspectRatio="none" aria-label="The page's corners: drag them onto the corners of the page" data-i18n-attr="aria-label:scan.edit.label"></svg>
          <canvas class="sc-loupe" id="sc-loupe" aria-hidden="true" hidden></canvas>
        </div>
        <div class="sc-under">
          <p class="sc-note" id="sc-note" role="status"></p>
          <span class="sc-corner-tools" id="sc-corner-tools" hidden>
            <button type="button" class="sui-btn" id="sc-detect" data-i18n="scan.view.detect">Find edges</button>
            <button type="button" class="sui-btn" id="sc-whole" data-i18n="scan.view.whole">Whole photo</button>
            <button type="button" class="sui-btn sui-primary" id="sc-corners-done" data-i18n="scan.view.done">Done</button>
          </span>
        </div>
      </div>
    </section>

    <aside class="sc-panel" id="sc-panel" aria-label="Scan settings" data-i18n-attr="aria-label:scan.panel.label"></aside>
  </main>
