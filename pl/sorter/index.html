<body>
  <div class="smb-hold" hidden>
    <span class="local-badge" title="Twoje zdjęcia są sortowane w tej przeglądarce. Nic nie jest przesyłane ani zapisywane po zamknięciu strony." data-i18n-attr="title:sorter.app.local_tip"><span data-i18n="sorter.app.local">100% lokalnie</span></span>
  </div>
  <main class="so-app">
    <section class="so-intro">
      <h1 data-i18n="sorter.app.title">Sortuj zdjęcia: zachowaj najlepsze</h1>
      <p class="so-lede" data-i18n="sorter.app.lede">Upuść stos zdjęć albo cały folder, a potem przeglądaj je po jednym: polub, nie polub albo otaguj każde strzałkami lub przyciskami. Pobierz zachowane jako ZIP albo zapisz na Slop Drive.</p>
    </section>
    <!-- View · Panel (shared/frame): the photos; Start sorting and the downloads in the panel on the right -->
    <div class="so-frame" id="soFrame">
    <div class="so-view" id="soView">
    <div class="so-add">
      <div id="soDrop" class="so-drop"></div>
      <div class="so-or"><button type="button" class="so-btn" id="soFolder" data-i18n="sorter.app.folder">Wybierz folder…</button>
</div>
    </div>
    <p id="soMsg" class="so-msg" role="status" aria-live="polite"></p>
    <section id="soWork" class="so-work" hidden aria-label="Twoje zdjęcia" data-i18n-attr="aria-label:sorter.app.your_photos">
      <div class="so-bar">
        <div id="soFilters" class="so-filters" role="group" aria-label="Pokaż" data-i18n-attr="aria-label:sorter.app.show"></div>
      </div>
      <ul id="soGrid" class="so-grid" aria-label="Zdjęcia" data-i18n-attr="aria-label:sorter.app.photos"></ul>
      <p id="soNone" class="so-none" hidden data-i18n="sorter.app.none">Brak zdjęć w tym widoku.</p>
    </section>
    </div>
    <aside class="so-side" id="soSide" aria-label="Sortuj i zapisz" data-i18n-attr="aria-label:sorter.app.side">
      <button type="button" class="so-btn" id="soZip" data-i18n="sorter.app.zip">Pobierz polubione (ZIP)</button>
      <button type="button" class="so-btn" id="soDrive" data-i18n="sorter.app.drive">Zapisz polubione na Slop Drive</button>
      <button type="button" class="so-btn" id="soCsv" data-i18n="sorter.app.csv">Pobierz listę (CSV)</button>
      <button type="button" class="so-btn" id="soClear" data-i18n="sorter.app.clear">Wyczyść</button>
      <button type="button" class="so-btn primary" id="soStart">Start sorting</button>
    </aside>
    </div>
