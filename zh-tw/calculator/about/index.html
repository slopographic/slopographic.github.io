        <p>Slopculator 是一台會保留計算紙帶的計算機，會記下您算過的內容。支援括號、百分比、乘方、開方與單位，以及您自行輸入匯率的貨幣換算。也可以做日期與時間運算，例如 2026-01-31 + 1 個月。您可以把計算結果儲存到 Slop Drive，或把日期結果加入 Slop Calendar。不會上傳任何內容。</p>
