        <p>Slop Expenses 記錄您的企業支出：供應商、類別、付款金額，以及可沖抵的進項稅額。每筆支出都會直接過入與發票相同的帳冊，因此分類帳、試算表與報表都會包含它。摘要會顯示您本月與今年的支出，以及可沖抵的稅額，CSV 匯出檔可直接用於試算表或交給會計師。錯誤的紀錄會作廢而不會刪除，因此帳冊會保留完整的歷史。所有內容都留在此瀏覽器中，不會上傳。</p>
