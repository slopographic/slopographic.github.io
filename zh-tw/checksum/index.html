<body>
  <header class="ck-top">
    <a class="brand" href="/zh-tw/" title="Slopographic 首頁" aria-label="Slopographic 首頁" data-i18n-attr="title:checksum.app.home;aria-label:checksum.app.home"></a>
    <h1>Checksum</h1>
  </header>
  <!-- View · Panel (shared/frame): the file and its hash; the algorithm, the hash to check and Copy hash on the right -->
  <div class="ck-frame" id="ck-frame">
  <main class="ck" id="ck-view">
    <p class="ck-lede" data-i18n="checksum.app.lede">計算檔案的雜湊值，或與發布者提供的雜湊值比對。檔案只會在這台裝置上讀取，不會上傳。</p>

    <section class="ck-card" aria-labelledby="ck-pick">
      <h2 id="ck-pick" data-i18n="checksum.app.step_choose">1. 選擇檔案</h2>
      <button type="button" class="ck-drop" id="ck-drop" aria-describedby="ck-status">
        <span data-i18n="checksum.app.drop">選擇檔案，或將檔案拖放到這裡</span>
      </button>
      <p id="ck-status" class="ck-status" role="status" aria-live="polite"></p>
    </section>

    <section class="ck-card" aria-labelledby="ck-out">
      <h2 id="ck-out" data-i18n="checksum.app.step_hash">2. 雜湊值</h2>
      <output id="ck-hash" class="ck-hash" aria-label="檔案的雜湊值" data-i18n-attr="aria-label:checksum.app.hash_label"></output>
      <p id="ck-verdict" class="ck-verdict" role="status" aria-live="polite"></p>
    </section>
  </main>
  <aside class="ck-side" id="ck-side" aria-label="雜湊設定" data-i18n-attr="aria-label:checksum.app.settings_label">
    <div class="ck-group" data-title="Algorithm" data-key="checksum.app.algorithm">
      <label class="sf-field"><select id="ck-alg" aria-label="演算法" data-i18n-attr="aria-label:checksum.app.algorithm">
          <option value="SHA-256" selected>SHA-256</option>
          <option value="SHA-1">SHA-1</option>
          <option value="SHA-384">SHA-384</option>
          <option value="SHA-512">SHA-512</option>
        </select></label>
      <p class="sf-note" data-i18n="checksum.app.sha1_note">SHA-1 僅為了與舊的已發布雜湊值相符而保留。新的檢查請使用 SHA-256。</p>
    </div>
    <div class="ck-group" data-title="Check against a published hash" data-key="checksum.app.check_against">
      <label class="sf-field"><span class="sf-lab" data-i18n="checksum.app.expected">預期的雜湊值</span>
        <input type="text" id="ck-expect" autocomplete="off" spellcheck="false" placeholder="從下載頁面貼上雜湊值" data-i18n-attr="placeholder:checksum.app.expected_ph">
      </label>
    </div>
    <button type="button" id="ck-copy" class="sui-btn sui-primary" disabled data-i18n="checksum.app.copy">複製雜湊值</button>
  </aside>
  </div>
