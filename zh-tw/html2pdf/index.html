<body>
  <div class="h2p-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn" id="h2p-open" data-i18n="html2pdf.app.open">開啟 HTML…</button>
    </div>
    <span class="local-badge" title="HTML 會在此瀏覽器中讀取並列印。不會上傳任何內容。" data-i18n-attr="title:html2pdf.app.local_tip" data-i18n="html2pdf.app.local">100% 在本機處理</span>

    <!-- View · Panel (shared/frame): the preview, and the options with Print at the foot of the panel on the right -->
    <div class="h2p-main" id="h2p-main">
      <aside class="h2p-side" id="h2p-side" aria-label="選項" data-i18n-attr="aria-label:html2pdf.app.options">
        <button type="button" class="sui-btn sui-primary" id="h2p-print" disabled data-i18n="html2pdf.app.print">列印或另存為 PDF…</button>
        <section class="h2p-group" data-title="Source" data-key="html2pdf.group.source">
          <p class="h2p-note" data-i18n="html2pdf.source.note">遠端圖片和字型不會載入。檔案內的圖片（data: 和 blob:）可以載入。若要使用檔案旁的圖片，請在下方依檔名附加。</p>
          <label class="h2p-field"><span data-i18n="html2pdf.source.paste">貼上 HTML</span>
            <textarea class="h2p-input" id="h2p-paste" rows="5" spellcheck="false" placeholder="<h1>Paste HTML here</h1>" data-i18n-attr="placeholder:html2pdf.source.paste_ph"></textarea>
          </label>
          <button type="button" class="sui-btn" id="h2p-use-paste" data-i18n="html2pdf.source.use_paste">使用貼上的 HTML</button>
          <button type="button" class="sui-btn" id="h2p-images" data-i18n="html2pdf.source.attach">附加本機圖片…</button>
          <p class="h2p-note" id="h2p-image-list">No local images attached.</p>
        </section>

        <section class="h2p-group" data-title="Paper" data-key="html2pdf.group.paper">
          <label class="h2p-field"><span data-i18n="html2pdf.paper.size">紙張大小</span>
            <select class="h2p-input" id="h2p-paper">
              <option value="A4" selected>A4</option>
              <option value="Letter">Letter</option>
              <option value="A5">A5</option>
              <option value="Legal">Legal</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.orientation">方向</span>
            <select class="h2p-input" id="h2p-orient">
              <option value="portrait" selected data-i18n="html2pdf.paper.portrait">直向</option>
              <option value="landscape" data-i18n="html2pdf.paper.landscape">橫向</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.margins">邊界</span>
            <select class="h2p-input" id="h2p-margin">
              <option value="normal" selected data-i18n="html2pdf.paper.normal">一般（15 毫米）</option>
              <option value="narrow" data-i18n="html2pdf.paper.narrow">窄（6 毫米）</option>
              <option value="none" data-i18n="html2pdf.paper.none">無</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.scale">縮放</span>
            <select class="h2p-input" id="h2p-scale">
              <option value="fit" selected data-i18n="html2pdf.paper.fit">符合寬度</option>
              <option value="100" data-i18n="html2pdf.paper.full">100%</option>
            </select>
          </label>
          <label class="h2p-check"><input type="checkbox" id="h2p-bg"> <span data-i18n="html2pdf.paper.bg">背景圖形</span></label>
        </section>

        <section class="h2p-group" data-title="Page header" data-key="html2pdf.group.header">
          <label class="h2p-check"><input type="checkbox" id="h2p-header" checked> <span data-i18n="html2pdf.header.show">每頁都顯示</span></label>
          <label class="h2p-field"><span data-i18n="html2pdf.header.qr">QR 碼顯示</span>
            <select class="h2p-input" id="h2p-qr-mode">
              <option value="file" selected data-i18n="html2pdf.header.qr_file">檔案名稱</option>
              <option value="url" data-i18n="html2pdf.header.qr_url">我輸入的網址</option>
              <option value="text" data-i18n="html2pdf.header.qr_text">自訂文字</option>
            </select>
          </label>
          <label class="h2p-field"><span id="h2p-qr-label">Custom text</span>
            <input type="text" class="h2p-input" id="h2p-qr-text" autocomplete="off" disabled>
          </label>
        </section>
      </aside>

      <main class="h2p-stage" id="h2p-stage" aria-label="預覽" data-i18n-attr="aria-label:html2pdf.app.preview">
        <div class="h2p-empty" id="h2p-empty">
          <h2 data-i18n="html2pdf.app.drop_title">將 HTML 檔案拖放到這裡</h2>
          <p data-i18n="html2pdf.app.drop_text">或開啟一個檔案，或在「來源」下貼上 HTML。檔案會在此瀏覽器中讀取，不會上傳。</p>
          <button type="button" class="sui-btn sui-primary" id="h2p-open-empty" data-i18n="html2pdf.app.open">開啟 HTML…</button>
        </div>
        <div class="h2p-paper-box" id="h2p-paper-box" hidden>
          <iframe class="h2p-paper" id="h2p-paper-frame" title="列印預覽" data-i18n-attr="title:html2pdf.app.preview_title" sandbox="allow-same-origin"></iframe>
        </div>
      </main>
    </div>

    <p class="h2p-status" id="h2p-status" role="status" aria-live="polite"></p>
  </div>
