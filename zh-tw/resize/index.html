<body>
  <header class="rs-top">
    <div class="rs-brand">
      <a class="brand" href="/zh-tw/" title="Slopographic 首頁" aria-label="Slopographic 首頁" data-i18n-attr="title:resize.app.home;aria-label:resize.app.home"></a>
      <h1>Slop Resize</h1><span class="rs-tag" data-i18n="resize.app.tag">調整圖片與影片大小。不會上傳任何內容。</span>
    </div>
    <div class="rs-tools" role="toolbar" aria-label="開啟" data-i18n-attr="aria-label:resize.app.open_bar">
      <button type="button" class="sui-btn" id="rs-open" data-i18n="resize.app.open">開啟…</button>
      <button type="button" class="sui-btn" id="rs-drive" data-i18n="resize.app.from_drive">從 Slop Drive…</button>
    </div>
  </header>
  <div class="rs-stat" id="rs-stat" aria-live="polite"></div>
  <div class="rs-warning" id="rs-video-warning" role="note" hidden></div>
  <!-- View · Panel (shared/frame): the queue in the middle, the settings and the Resize button in the panel on the right -->
  <div class="rs-main" id="rs-main">
    <main class="rs-left" id="rs-left" aria-label="檔案" data-i18n-attr="aria-label:resize.app.files">
      <section class="rs-empty" id="rs-empty" aria-label="開啟檔案" data-i18n-attr="aria-label:resize.app.open_files">
        <div class="rs-drop-card">
          <div id="rs-drop" class="rs-dropzone"></div>
          <p class="rs-fine" data-i18n="resize.app.fine">原始檔案永遠不會被變更。結果為副本：您可以下載，或將它們儲存到 Slop Drive 中的 Slop Resize 資料夾。快速鍵：Ctrl+O 開啟、Ctrl+Enter 調整大小、Esc 取消、Ctrl+S 壓縮為 ZIP。</p>
        </div>
      </section>
      <div id="rs-queue-wrap" hidden>
        <ol class="rs-list" id="rs-list" aria-label="佇列" data-i18n-attr="aria-label:resize.app.queue"></ol>
      </div>
    </main>

    <aside class="rs-panel" id="rs-panel" aria-label="調整大小設定" data-i18n-attr="aria-label:resize.panel.label">
      <div class="rs-group" data-title="Size" data-key="resize.panel.g_size">
      <label class="rs-field"><span data-i18n="resize.panel.target">目標</span>
        <select id="rs-preset"></select>
      </label>
      <label class="rs-field"><span data-i18n="resize.panel.mode">調整方式</span>
        <select id="rs-mode">
          <option value="size" data-i18n="resize.panel.mode_size">寬度與高度</option>
          <option value="scale" data-i18n="resize.panel.mode_scale">百分比</option>
          <option value="long" data-i18n="resize.panel.mode_long">長邊</option>
          <option value="bytes" data-i18n="resize.panel.mode_bytes">最大檔案大小（圖片）</option>
        </select>
      </label>
      <div class="rs-pair" data-modes="size bytes">
        <label class="rs-field"><span data-i18n="resize.panel.width">寬度（px）</span><input type="number" id="rs-w" min="0" max="16384" step="1" inputmode="numeric"></label>
        <label class="rs-field"><span data-i18n="resize.panel.height">高度（px）</span><input type="number" id="rs-h" min="0" max="16384" step="1" inputmode="numeric"></label>
      </div>
      <p class="rs-fine" data-modes="size bytes" data-i18n="resize.panel.zero_side">保留為 0 的邊會跟隨圖片。</p>
      <label class="rs-check" data-modes="size bytes"><input type="checkbox" id="rs-keep" checked> <span data-i18n="resize.panel.keep_ratio">保持長寬比</span></label>
      <p class="rs-fine" id="rs-ratio-note" data-modes="size bytes"></p>
      <label class="rs-field" data-modes="size bytes"><span data-i18n="resize.panel.fill">填滿</span>
        <select id="rs-fill">
          <option value="fit" data-i18n="resize.panel.fill_fit">符合（加邊框）</option>
          <option value="cover" data-i18n="resize.panel.fill_cover">覆蓋（裁切）</option>
          <option value="stretch" data-i18n="resize.panel.fill_stretch">拉伸</option>
          <option value="within" data-i18n="resize.panel.fill_within">置於範圍內（不加邊）</option>
        </select>
      </label>
      <label class="rs-field" data-modes="size bytes"><span data-i18n="resize.panel.anchor">裁切時保留的位置</span>
        <select id="rs-anchor">
          <option value="center" data-i18n="resize.panel.a_center">置中</option>
          <option value="top" data-i18n="resize.panel.a_top">上方</option>
          <option value="bottom" data-i18n="resize.panel.a_bottom">下方</option>
          <option value="left" data-i18n="resize.panel.a_left">左側</option>
          <option value="right" data-i18n="resize.panel.a_right">右側</option>
          <option value="top-left" data-i18n="resize.panel.a_top_left">左上</option>
          <option value="top-right" data-i18n="resize.panel.a_top_right">右上</option>
          <option value="bottom-left" data-i18n="resize.panel.a_bottom_left">左下</option>
          <option value="bottom-right" data-i18n="resize.panel.a_bottom_right">右下</option>
        </select>
      </label>
      <div class="rs-field rs-colour">
        <span data-i18n="resize.panel.bg">背景色彩</span>
        <span class="rs-inline"><input type="color" id="rs-bg" value="#ffffff" aria-label="背景色彩" data-i18n-attr="aria-label:resize.panel.bg"><label class="rs-check"><input type="checkbox" id="rs-transparent" checked> <span data-i18n="resize.panel.transparent">透明</span></label></span>
      </div>
      <p class="rs-note" id="rs-alpha-note" hidden></p>
      <label class="rs-field" data-modes="scale"><span data-i18n="resize.panel.scale">比例</span>
        <span class="rs-range"><input type="range" id="rs-scale" min="1" max="400" value="50"><output id="rs-scale-out" for="rs-scale">50%</output></span>
      </label>
      <label class="rs-field" data-modes="long"><span data-i18n="resize.panel.long">長邊（px）</span>
        <input type="number" id="rs-long" min="1" max="16384" step="1" value="1920">
      </label>
      <label class="rs-field" data-modes="bytes"><span data-i18n="resize.panel.max_kb">最大檔案大小（KB）</span>
        <input type="number" id="rs-kb" min="1" step="1" value="500">
      </label>
      <p class="rs-fine" data-modes="bytes" data-i18n="resize.panel.bytes_note">僅適用於圖片。JPEG、WebP 與 AVIF 會降低品質以符合大小；PNG 無法。</p>
      <label class="rs-check"><input type="checkbox" id="rs-even" checked> <span data-i18n="resize.panel.even">四捨五入為偶數（影片需要）</span></label>
      <label class="rs-field"><span data-i18n="resize.panel.resample">重新取樣</span>
        <select id="rs-resample">
          <option value="best" data-i18n="resize.panel.r_best">平滑，逐步縮放（縮小時最佳）</option>
          <option value="nearest" data-i18n="resize.panel.r_nearest">硬像素（最近相鄰，適用於像素藝術）</option>
        </select>
      </label>
      </div>
      <div class="rs-group" data-title="Output" data-key="resize.panel.g_output">
      <label class="rs-field"><span data-i18n="resize.panel.pic_format">圖片格式</span>
        <select id="rs-mime">
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
          <option value="image/avif">AVIF</option>
        </select>
      </label>
      <label class="rs-field"><span data-i18n="resize.panel.pic_quality">圖片品質</span>
        <span class="rs-range"><input type="range" id="rs-quality" min="30" max="100" value="85"><output id="rs-quality-out" for="rs-quality">85%</output></span>
      </label>
      <label class="rs-field"><span data-i18n="resize.panel.vid_format">影片格式</span>
        <select id="rs-vformat">
          <option value="mp4">MP4 (H.264)</option>
          <option value="webm" data-i18n="resize.panel.webm">WebM（VP9 或 VP8）</option>
        </select>
      </label>
      <label class="rs-field"><span data-i18n="resize.panel.vid_quality">影片品質</span>
        <select id="rs-vquality">
          <option value="low" data-i18n="resize.panel.q_low">較小的檔案</option>
          <option value="medium" selected data-i18n="resize.panel.q_medium">平衡</option>
          <option value="high" data-i18n="resize.panel.q_high">最佳品質</option>
        </select>
      </label>
      <label class="rs-field"><span data-i18n="resize.panel.fps">影格率</span>
        <select id="rs-fps">
          <option value="24">24</option>
          <option value="25">25</option>
          <option value="30" selected>30</option>
          <option value="50">50</option>
          <option value="60">60</option>
        </select>
      </label>
      <label class="rs-check"><input type="checkbox" id="rs-audio" checked> <span data-i18n="resize.panel.audio">保留音軌</span></label>
      <p class="rs-note" id="rs-engine-note" hidden></p>
      </div>
      <div class="rs-group" data-title="Saved settings" data-key="resize.panel.g_saved">
      <label class="rs-field"><span class="sr-only" data-i18n="resize.panel.g_saved">已儲存的設定</span>
        <select id="rs-saved"></select>
      </label>
      <div class="rs-row3">
        <button type="button" class="sui-btn" id="rs-apply" data-i18n="resize.panel.apply">套用</button>
        <button type="button" class="sui-btn" id="rs-save-as" data-i18n="resize.panel.save_as">另存為…</button>
        <button type="button" class="sui-btn" id="rs-delete" data-i18n="resize.panel.delete">刪除</button>
      </div>
      <p class="rs-fine" data-i18n="resize.panel.saved_note">已儲存在 Slop Drive 的 Slop Resize 資料夾中。沒有 Slop Drive 時，設定會留在此瀏覽器中。</p>
      </div>
      <!-- the panel's buttons (app/layout.js puts them in its Results section and its foot; it sets their words) -->
      <button type="button" class="sui-btn" id="rs-zip" disabled title="將所有結果打包成一個 zip（Ctrl+S）" data-i18n-attr="title:resize.app.zip_tip">Download all (zip)</button>
      <button type="button" class="sui-btn" id="rs-save-all" disabled title="將結果儲存到 Slop Drive 中的 Slop Resize 資料夾" data-i18n-attr="title:resize.app.save_drive_tip">Save to Slop Drive</button>
      <button type="button" class="sui-btn" id="rs-clear" disabled>Clear</button>
      <button type="button" class="sui-btn sui-primary" id="rs-run" disabled title="調整清單中每個檔案的大小（Ctrl+Enter）" data-i18n-attr="title:resize.app.run_tip">Resize</button>
      <button type="button" class="sui-btn" id="rs-cancel" hidden title="在目前的檔案完成後停止（Esc）" data-i18n="resize.app.cancel" data-i18n-attr="title:resize.app.cancel_tip">取消</button>
    </aside>
  </div>
