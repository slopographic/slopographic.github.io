<body>
  <div class="rc-bar" id="rc-bar"></div>
  <main class="rc-main" id="rc-main">
    <section class="rc-view" id="rc-view" aria-label="錄製內容" data-i18n-attr="aria-label:recorder.app.view_aria">
      <div class="rc-stage" id="rc-stage">
        <video class="rc-live" id="rc-live" muted playsinline aria-label="正在錄製的內容" data-i18n-attr="aria-label:recorder.app.live_aria" hidden></video>
        <video class="rc-play" id="rc-play" controls playsinline aria-label="錄製的影片" data-i18n-attr="aria-label:recorder.app.play_aria" hidden></video>
        <div class="rc-empty" id="rc-empty">
          <svg class="rc-empty-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="9" width="38" height="26" rx="3"/><path d="M17 41h14M24 35v6"/><circle cx="24" cy="22" r="6"/></svg>
          <p class="rc-empty-title" data-i18n="recorder.app.empty_title">錄製您的螢幕、網路攝影機或麥克風</p>
          <p class="rc-empty-text" data-i18n="recorder.app.empty_text">在右側選擇要錄製的內容，然後按下「錄製」。在您儲存之前，錄製內容會留在此裝置上。</p>
        </div>
        <div class="rc-count" id="rc-count" role="status" aria-live="assertive" hidden></div>
        <div class="rc-badge" id="rc-badge" role="timer" aria-live="off" hidden><span class="rc-dot" aria-hidden="true"></span><span id="rc-time">00:00:00</span></div>
      </div>
      <section class="rc-trim" id="rc-trim" aria-labelledby="rc-trim-h" hidden>
        <h2 id="rc-trim-h" data-i18n="recorder.app.trim">裁剪</h2>
        <div class="rc-bar-wrap"><div class="rc-range" id="rc-trimbar" aria-hidden="true"></div></div>
        <div class="rc-trim-row">
          <label class="rc-trim-field"><span><span data-i18n="recorder.app.start">開始</span> <output id="rc-start-out">0:00.0</output></span>
            <input type="range" id="rc-start" min="0" max="1" step="0.1" value="0"></label>
          <label class="rc-trim-field"><span><span data-i18n="recorder.app.end">結束</span> <output id="rc-end-out">0:00.0</output></span>
            <input type="range" id="rc-end" min="0" max="1" step="0.1" value="1"></label>
        </div>
        <div class="rc-trim-acts">
          <button type="button" class="sui-btn" id="rc-start-here" data-i18n="recorder.app.start_here">從播放頭位置開始</button>
          <button type="button" class="sui-btn" id="rc-end-here" data-i18n="recorder.app.end_here">在播放頭位置結束</button>
          <button type="button" class="sui-btn" id="rc-trim-reset" data-i18n="recorder.app.keep_all">保留全部</button>
          <span class="rc-kept" id="rc-kept" aria-live="polite"></span>
        </div>
      </section>
      <p class="rc-note" id="rc-note" role="status" aria-live="polite"></p>
      <button type="button" class="sui-btn sui-primary rc-panel-open" id="rc-panel-open" aria-controls="rc-panel" data-i18n="recorder.app.settings">錄製設定</button>
      <section class="rc-support" id="rc-support" aria-labelledby="rc-support-who">
        <h2 id="rc-support-who">What this browser can record</h2>
        <table class="rc-table"><tbody id="rc-support-rows"></tbody></table>
        <details class="rc-other">
          <summary data-i18n="recorder.support.other">其他瀏覽器</summary>
          <table class="rc-table rc-grid">
            <thead><tr><th scope="col" data-i18n="recorder.support.col_browser">瀏覽器</th><th scope="col" data-i18n="recorder.support.col_screen">螢幕</th><th scope="col" data-i18n="recorder.support.col_system">螢幕聲音</th><th scope="col" data-i18n="recorder.support.col_camera">網路攝影機與麥克風</th></tr></thead>
            <tbody id="rc-other-rows"></tbody>
          </table>
          <p class="rc-fine" data-i18n="recorder.support.fine">瀏覽器在分享螢幕、攝影機或麥克風前一律會先詢問，並顯示正在錄製。不會上傳任何內容：錄製與儲存都在此裝置上完成。</p>
        </details>
      </section>
    </section>
    <aside class="rc-panel" id="rc-panel" aria-label="錄製設定" data-i18n-attr="aria-label:recorder.app.settings"></aside>
  </main>
  <div hidden>
    <div id="rc-settings">
      <div class="rc-group" data-title="Record" data-key="recorder.set.g_record">
        <div class="sf-seg rc-source" id="rc-source" role="group" aria-label="要錄製的內容" data-i18n-attr="aria-label:recorder.set.source_aria">
          <button type="button" class="sui-btn" data-v="screen" aria-pressed="true" data-i18n="recorder.set.src_screen">螢幕</button>
          <button type="button" class="sui-btn" data-v="camera" aria-pressed="false" data-i18n="recorder.set.src_camera">網路攝影機</button>
          <button type="button" class="sui-btn" data-v="pip" aria-pressed="false" data-i18n="recorder.set.src_pip">螢幕 + 網路攝影機</button>
          <button type="button" class="sui-btn" data-v="mic" aria-pressed="false" data-i18n="recorder.set.src_mic">麥克風</button>
        </div>
        <p class="sf-note" id="rc-source-note"></p>
      </div>
      <div class="rc-group" data-title="Sound" data-key="recorder.set.g_sound" id="rc-sound-group">
        <label class="rc-check" id="rc-sys-row"><input type="checkbox" id="rc-sys" checked> <span data-i18n="recorder.set.sys">來自螢幕或分頁的聲音</span></label>
        <label class="rc-check" id="rc-mic-row"><input type="checkbox" id="rc-mic" checked> <span data-i18n="recorder.set.mic">麥克風</span></label>
      </div>
      <div class="rc-group" data-title="Webcam" data-key="recorder.set.g_webcam" id="rc-pip">
        <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.corner">位置</span><select id="rc-corner">
          <option value="br" data-i18n="recorder.set.br">右下</option><option value="bl" data-i18n="recorder.set.bl">左下</option><option value="tr" data-i18n="recorder.set.tr">右上</option><option value="tl" data-i18n="recorder.set.tl">左上</option></select></label>
        <label class="sf-field"><span class="sf-lab"><span data-i18n="recorder.set.size">大小</span> <output id="rc-size-out">25%</output></span><input type="range" id="rc-size" min="10" max="50" step="1" value="25"></label>
      </div>
      <div class="rc-group" data-title="Countdown" data-key="recorder.set.g_countdown">
        <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.before">錄製前</span><select id="rc-countdown">
          <option value="0" data-i18n="recorder.set.cd_none">不倒數</option><option value="3" data-i18n="recorder.set.cd_3">3 秒</option><option value="5" data-i18n="recorder.set.cd_5">5 秒</option><option value="10" data-i18n="recorder.set.cd_10">10 秒</option></select></label>
      </div>
      <div class="rc-group" data-title="Save as" data-key="recorder.set.g_save" id="rc-save-group">
        <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.format">檔案格式</span><select id="rc-format">
          <option value="webm" data-i18n="recorder.set.fmt_webm">WebM（依錄製原樣）</option><option value="mp4" data-i18n="recorder.set.fmt_mp4">MP4（H.264）</option><option value="gif" data-i18n="recorder.set.fmt_gif">GIF（無聲音）</option><option value="wav" data-i18n="recorder.set.fmt_wav">WAV（聲音）</option></select></label>
        <div id="rc-gif" class="rc-gif">
          <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.gif_w">GIF 寬度（px）</span><input type="number" id="rc-gif-w" min="160" max="1920" step="10" value="640"></label>
          <label class="sf-field"><span class="sf-lab" data-i18n="recorder.set.fps">每秒影格數</span><input type="number" id="rc-gif-fps" min="2" max="30" step="1" value="10"></label>
        </div>
        <p class="sf-note" data-i18n="recorder.set.engine_note">MP4 與 GIF 由影片引擎在此裝置上製作，首次使用時會下載一次（約 32 MB）。</p>
      </div>
    </div>
  </div>
