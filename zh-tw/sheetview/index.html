<body>
  <div class="sv-app">
    <header class="sv-top">
      <div class="sv-brand"><a class="brand" href="/zh-tw/" title="Slopographic 首頁" aria-label="Slopographic 首頁" data-i18n-attr="title:sheetview.app.home;aria-label:sheetview.app.home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a><h1>Slop Sheets</h1></div>
      <div class="sv-name" id="sv-name" aria-live="polite"></div>
      <div class="sv-tools" role="toolbar" aria-label="檔案" data-i18n-attr="aria-label:menu.file">
        <button type="button" class="sv-btn sv-primary" id="sv-open" title="從這台電腦開啟試算表（Ctrl+O）" data-i18n="sheetview.app.open" data-i18n-attr="title:sheetview.app.open_title">開啟</button>
        <button type="button" class="sv-btn" id="sv-export" aria-haspopup="menu" title="匯出您看到的資料列，或全部資料列" data-i18n="sheetview.app.export" data-i18n-attr="title:sheetview.app.export_title">匯出</button>
        <button type="button" class="sv-btn" id="sv-hub" title="將目前的工作表傳送到 Slop Tables" data-i18n="sheetview.app.hub" data-i18n-attr="title:sheetview.app.hub_title">在 Slop Table 中開啟</button>
        <label class="sv-pick"><span data-i18n="sheetview.app.table_style">表格樣式</span>
          <select id="sv-style"></select>
        </label>
        <label class="sv-pick"><span data-i18n="sheetview.app.colours">色彩</span>
          <select id="sv-palette"></select>
        </label>
        <button type="button" class="sv-btn" id="sv-cmd" aria-label="命令（搜尋所有命令）" data-i18n="sheetview.app.commands" data-i18n-attr="aria-label:sheetview.app.commands_label">命令</button>
        <button type="button" class="sv-btn" id="sv-menu" aria-haspopup="menu" data-i18n="sheetview.app.menu">選單</button>
      </div>
    </header>

    <div class="sv-tabs sv-docs" id="sv-docs" role="tablist" aria-label="開啟的檔案" data-i18n-attr="aria-label:sheetview.app.open_files" hidden></div>
    <div class="sv-tabs sv-sheets" id="sv-sheets" role="tablist" aria-label="工作表" data-i18n-attr="aria-label:sheetview.app.sheets" hidden></div>
    <div id="sv-drop" class="sv-dropstrip"></div>

    <div class="sv-body" id="sv-body">
    <main class="sv-main" id="sv-main">
      <div class="sv-empty" id="sv-empty">
        <p class="sv-empty-t" data-i18n="sheetview.app.empty_title">開啟試算表以瀏覽。</p>
        <p class="sv-empty-s" data-i18n="sheetview.app.empty_text">將 .xlsx、.csv 或 .tsv 檔案拖放到這裡，或從這台電腦選擇一個檔案。不會上傳任何內容。不支援舊的 .xls 檔案：請先另存為 .xlsx。</p>
        <div class="sv-empty-b">
          <button type="button" class="sv-btn sv-primary" id="sv-open2" data-i18n="sheetview.app.open_one">開啟試算表</button>
        </div>
      </div>
      <section class="sv-view" id="sv-view" aria-label="工作表" data-i18n-attr="aria-label:sheetview.app.sheet" hidden>
        <div class="sv-bar" role="toolbar" aria-label="排序與篩選" data-i18n-attr="aria-label:sheetview.app.sort_filter">
          <span class="sv-status" id="sv-status" role="status" aria-live="polite"></span>
          <button type="button" class="sv-btn sv-mini" id="sv-clear" disabled data-i18n="sheetview.app.clear">清除排序與篩選</button>
        </div>
        <div class="sv-host" id="sv-grid"></div>
      </section>
    </main>
    <aside class="sv-side" id="sv-side" aria-label="工作表" data-i18n-attr="aria-label:sheetview.app.sheet"></aside>
    </div>
  </div>
