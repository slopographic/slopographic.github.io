<body>
  <div class="nt-app" id="nt-app" data-pane="list">
    <div class="nt-top">
    <div id="nt-tabs" class="doctabs-host"></div>
    <span class="nt-save" id="nt-save" role="status" aria-live="polite"></span>
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn nt-narrow" id="nt-side-btn" aria-label="顯示筆記本" data-i18n-attr="aria-label:notes.app.show_books" data-i18n="notes.app.notebooks">筆記本</button>
      <button type="button" class="sui-btn sui-primary" id="nt-new" title="新增筆記（Ctrl+Alt+N）" data-i18n-attr="title:notes.app.new_tip" data-i18n="notes.app.new_note">新增筆記</button>
      <button type="button" class="sui-btn nt-cmd" id="nt-cmd" aria-label="命令（搜尋所有命令）" data-i18n-attr="aria-label:notes.app.cmd_aria" data-i18n="notes.app.cmd">命令</button>
    </div>
    </div>


    <aside class="nt-side" id="nt-side" aria-label="筆記本" data-i18n-attr="aria-label:notes.app.notebooks">
      <div class="nt-head"><span data-i18n="notes.app.notebooks">筆記本</span><button type="button" class="sui-btn nt-mini" id="nt-nb-new" data-i18n="notes.app.new">新增</button></div>
      <div class="nt-books" id="nt-books"></div>
      <div class="nt-head"><span data-i18n="notes.app.folders">資料夾</span><button type="button" class="sui-btn nt-mini" id="nt-fd-new" data-i18n="notes.app.new">新增</button></div>
      <div class="nt-folders" id="nt-folders"></div>
      <div class="nt-head"><span data-i18n="notes.app.tags">標籤</span></div>
      <div class="nt-tags" id="nt-tags"></div>
    </aside>

    <section class="nt-list" id="nt-list" aria-label="筆記" data-i18n-attr="aria-label:notes.app.notes">
      <div class="nt-search"><input type="search" id="nt-q" placeholder="搜尋標題、內文與標籤" aria-label="搜尋筆記" data-i18n-attr="placeholder:notes.app.search_ph;aria-label:notes.app.search_aria"></div>
      <p class="nt-crumb" id="nt-crumb"></p>
      <div class="nt-notes" id="nt-notes"></div>
      <p class="nt-none" id="nt-none" hidden></p>
    </section>

    <main class="nt-main" id="nt-main">
      <p class="nt-empty" id="nt-empty-note" data-i18n="notes.app.empty">請選擇一則筆記，或使用「新增筆記」開始撰寫。</p>
      <div class="nt-editor" id="nt-note" hidden>
        <div class="nt-bar">
          <button type="button" class="sui-btn nt-narrow" id="nt-back" data-i18n="ui.back">上一步</button>
          <button type="button" class="sui-btn" id="nt-pin">Pin</button><!-- i18n-ignore: js/editor.js writes Pin or Unpin -->
          <div class="nt-seg" role="group" aria-label="檢視" data-i18n-attr="aria-label:menu.view">
            <button type="button" class="sui-btn" data-mode="write" data-i18n="notes.app.write">撰寫</button>
            <button type="button" class="sui-btn" data-mode="split" data-i18n="notes.app.split">分割</button>
            <button type="button" class="sui-btn" data-mode="preview" data-i18n="notes.app.preview">預覽</button>
          </div>
          <button type="button" class="sui-btn" id="nt-insert" aria-haspopup="menu" title="插入標題、表格、影片連結、圖片、程式碼區塊、核取清單、引言、分隔線、提示框或連結" data-i18n-attr="title:notes.app.insert_tip" data-i18n="notes.app.insert">插入區塊</button>
          <button type="button" class="sui-btn" id="nt-export" aria-haspopup="menu" data-i18n="menu.export">匯出</button>
          <button type="button" class="sui-btn nt-danger" id="nt-del" data-i18n="notes.app.trash">垃圾桶</button>
        </div>
        <input type="text" class="nt-title" id="nt-title" placeholder="未命名" aria-label="筆記標題" data-i18n-attr="placeholder:ui.untitled;aria-label:notes.app.title_aria">
        <input type="text" class="nt-tagsin" id="nt-tags-in" placeholder="標籤，以逗號分隔" aria-label="標籤" data-i18n-attr="placeholder:notes.app.tags_ph;aria-label:notes.app.tags">
        <div class="nt-panes" id="nt-panes" data-mode="split">
          <textarea class="nt-body" id="nt-body" spellcheck="true" aria-label="Markdown 原始碼" data-i18n-attr="aria-label:notes.app.source_aria"></textarea>
          <article class="nt-preview md" id="nt-preview" aria-label="預覽" data-i18n-attr="aria-label:notes.app.preview"></article>
        </div>
      </div>
    </main>
  </div>
