<body>
  <noscript><p class="em-noscript">Slop EML needs JavaScript. It runs entirely in your browser, and nothing is uploaded.</p></noscript>
  <div class="em-app" id="em-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn sui-primary" id="em-open" title="このコンピューターから .eml ファイルまたはメールボックス（.mbox）を開きます（Ctrl+O）" data-i18n="eml.app.open" data-i18n-attr="title:eml.app.open_tip">開く</button>
      <button type="button" class="sui-btn" id="em-cmd" aria-label="コマンド（すべてのコマンドを検索）" data-i18n="eml.app.commands" data-i18n-attr="aria-label:eml.app.commands_tip">コマンド</button>
    </div>
    <div id="em-drop" class="em-dropstrip"></div>
    <nav class="em-tabs" id="em-tabs" aria-label="ピン留めしたメッセージ" data-i18n-attr="aria-label:eml.app.pinned" hidden></nav>

    <div class="em-frame-root" id="em-frame">
      <aside class="em-list" id="em-list" aria-label="メッセージ" data-i18n-attr="aria-label:eml.app.messages">
        <div class="em-list-bar">
          <div class="em-list-row">
            <label class="em-all"><input type="checkbox" id="em-check-all" aria-label="表示されているすべてのメッセージを選択" data-i18n-attr="aria-label:eml.list.check_all"> <span id="em-count">0 messages</span></label>
            <select class="sui-input em-sort" id="em-sort" aria-label="メッセージを並べ替え" data-i18n-attr="aria-label:eml.list.sort"></select>
            <button type="button" class="sui-btn em-list-actions" id="em-list-actions" aria-haspopup="dialog" data-i18n="eml.app.actions">操作</button>
          </div>
          <input type="search" class="sui-input em-search" id="em-search" placeholder="送信者、件名、添付ファイルを検索" aria-label="メッセージを検索" data-i18n-attr="placeholder:eml.list.search_ph;aria-label:eml.list.search">
        </div>
        <ul class="em-rows" id="em-rows" aria-label="メッセージ" data-i18n-attr="aria-label:eml.app.messages"></ul>
        <p class="em-noresults" id="em-noresults" data-i18n="eml.list.no_results" hidden>検索に一致するメッセージはありません。</p>
      </aside>

      <main class="em-main" id="em-main">
        <section class="em-empty" id="em-empty">
          <h2 class="em-empty-t" data-i18n="eml.app.empty_title">読むにはメールファイルを開いてください。</h2>
          <p class="em-empty-s" data-i18n="eml.app.empty_text">ここに .eml ファイルまたはメールボックス（.mbox）をドロップするか、このコンピューターから開いてください。アップロードは一切ありません。ファイルはこのページ内で読み込まれ、外部に送信されることはありません。</p>
          <div class="em-empty-b">
            <button type="button" class="sui-btn sui-primary" id="em-open2" data-i18n="eml.app.open_files">メールファイルを開く</button>
          </div>
        </section>

        <article class="em-msg" id="em-msg" hidden>
          <div class="em-bar em-phonebar">
            <button type="button" class="sui-btn em-back" id="em-back">‹ <span data-i18n="eml.app.messages">メッセージ</span> (<span id="em-list-n">0</span>)</button>
            <button type="button" class="sui-btn" id="em-actions" aria-haspopup="dialog" data-i18n="eml.app.actions">操作</button>
          </div>
          <h2 class="em-subject" id="em-subject"></h2>
          <dl class="em-head" id="em-head"></dl>
          <div class="em-bar">
            <div class="em-seg" id="em-views" role="group" aria-label="本文の表示" data-i18n-attr="aria-label:eml.view.body_view" hidden>
              <button type="button" class="sui-btn" id="em-v-html" aria-pressed="true">HTML</button>
              <button type="button" class="sui-btn" id="em-v-text" aria-pressed="false" data-i18n="eml.view.plain">プレーンテキスト</button>
            </div>
            <button type="button" class="sui-btn em-chip" id="em-atts-chip" hidden>0 attachments</button>
          </div>
          <div class="em-notice" id="em-notice" role="status" hidden>
            <p class="em-notice-t" id="em-notice-t"></p>
            <button type="button" class="sui-btn" id="em-cid" aria-pressed="false" hidden>Show embedded images</button>
          </div>
          <div class="em-body" id="em-body"></div>
          <details class="em-warn" id="em-warn" hidden>
            <summary data-i18n="eml.view.warn">一部の内容を、記載どおりには読み込めませんでした</summary>
            <ul id="em-warn-list"></ul>
          </details>
        </article>
      </main>

      <aside class="em-side" id="em-side" aria-label="操作" data-i18n-attr="aria-label:eml.app.actions"></aside>
    </div>
  </div>
