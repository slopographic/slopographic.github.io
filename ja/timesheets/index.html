<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <button type="button" class="tb-btn" id="tMenuNew" data-cmd="time.new" data-i18n="timesheets.page.log">時間を記録</button>
      <button type="button" class="tb-btn" id="tMenuTimer" data-cmd="time.timer" data-i18n="timesheets.page.timer">タイマーを開始または停止</button>
      <button type="button" class="tb-btn" id="tMenuBill" data-cmd="view.bill" data-i18n="timesheets.page.bill_customer">顧客に請求</button>
      <button type="button" class="tb-btn" id="tMenuCsv" data-cmd="time.csv" data-i18n="timesheets.page.csv">CSV をダウンロード</button>
      <a id="tAbout" href="/ja/timesheets/about/" data-i18n="biz.app.about">About</a>
      <button type="button" class="tb-btn" id="tCmd" data-cmd="cmd.palette" aria-label="コマンドを検索" title="Search commands (Ctrl+K)" data-i18n-attr="aria-label:ui.cmd.search;title:biz.app.cmd_tip">⌘K</button>
    </div>

    <nav class="tabs" role="tablist" aria-label="タイムシートのセクション" data-i18n-attr="aria-label:timesheets.page.sections">
      <button type="button" role="tab" class="tab" id="tab-list" data-view="list" aria-controls="view-list" aria-selected="true" data-i18n="timesheets.page.time">時間</button>
      <button type="button" role="tab" class="tab" id="tab-edit" data-view="edit" aria-controls="view-edit" aria-selected="false" hidden data-i18n="timesheets.page.entry">入力</button>
      <button type="button" role="tab" class="tab" id="tab-bill" data-view="bill" aria-controls="view-bill" aria-selected="false" data-i18n="timesheets.page.bill">請求</button>
    </nav>

    <main class="main" id="main">
      <span class="local-badge" title="時間と帳簿はこのブラウザーに保存されます。アップロードは一切ありません。" data-i18n-attr="title:timesheets.page.local_tip"><span data-i18n="biz.app.local">100% local</span></span>
      <div id="boot" class="boot" role="status" data-i18n="timesheets.page.opening">タイムシートを開いています…</div>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="card timer" id="tmCard">
          <label class="tm-desc"><span class="sr" data-i18n="timesheets.page.working_on">何に取り組んでいますか？</span>
            <input id="tmDesc" maxlength="300" placeholder="何に取り組んでいますか？" autocomplete="off" data-i18n-attr="placeholder:timesheets.page.working_on"></label>
          <span class="tm-clock" id="tmClock" aria-live="off">0:00:00</span>
          <button type="button" class="btn primary" id="tmGo">Start timer</button> <!-- i18n-ignore -->
        </div>
        <div class="toolbar">
          <label class="search"><span class="sr" data-i18n="timesheets.page.search">時間を検索</span>
            <input id="tSearch" type="search" placeholder="説明、プロジェクト、顧客を検索" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:timesheets.page.search_ph"></label>
          <label><span data-i18n="timesheets.page.period">期間</span> <select id="tPeriod">
            <option value="week" data-i18n="timesheets.page.this_week">今週</option><option value="lastweek" data-i18n="timesheets.page.last_week">先週</option><option value="month" data-i18n="timesheets.page.this_month">今月</option>
            <option value="lastmonth" data-i18n="timesheets.page.last_month">先月</option><option value="all" data-i18n="timesheets.page.all_dates">すべての日付</option>
          </select></label>
          <label><span data-i18n="timesheets.page.customer">顧客</span> <select id="tCustomer"></select></label>
          <label><span data-i18n="timesheets.page.show">表示</span> <select id="tState"><option value="all" data-i18n="timesheets.page.all">すべて</option><option value="open" data-i18n="timesheets.page.to_bill">請求対象</option><option value="billed" data-i18n="timesheets.page.billed">請求済み</option><option value="internal" data-i18n="timesheets.page.internal">社内</option></select></label>
          <button type="button" class="btn primary" id="tNew" data-i18n="timesheets.page.log">時間を記録</button>
        </div>
        <div class="toolbar"><p class="note" id="tSummary" role="status"></p><span class="total" id="tTotal"></span></div>
        <div class="table" id="tRows"></div>
        <div class="toolbar"><button type="button" class="btn" id="tCsv" data-i18n="timesheets.page.csv_shown">表示中の内容を CSV でダウンロード</button></div>
      </section>

      <section class="view" id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
        <div class="head-row">
          <button type="button" class="btn small" id="eBack" data-i18n="timesheets.page.back">← 時間</button>
          <h2 class="h2" id="eTitle">Log time</h2> <!-- i18n-ignore -->
        </div>
        <p class="msg" id="eMsg" role="status"></p>
        <p class="note" id="eBilled" hidden></p>
        <form class="card" id="eForm" novalidate>
          <div class="form-grid">
            <label class="wide"><span data-i18n="timesheets.page.worked_on">作業内容</span> <input id="eDescription" maxlength="300" required autocomplete="off" placeholder="ホームページのデザイン レビュー" data-i18n-attr="placeholder:timesheets.page.desc_ph"></label>
            <label><span data-i18n="timesheets.page.date">日付</span> <input id="eDate" type="date" required></label>
            <label><span data-i18n="timesheets.page.time_worked">作業時間</span> <input id="eDuration" inputmode="decimal" placeholder="1:30、1.5、または 90m" required autocomplete="off" data-i18n-attr="placeholder:timesheets.page.duration_ph"></label>
            <label><span data-i18n="timesheets.page.customer">顧客</span> <select id="eCustomer"></select></label>
            <label><span data-i18n="timesheets.page.project">プロジェクト</span> <input id="eProject" list="eProjects" maxlength="80" autocomplete="off" placeholder="任意" data-i18n-attr="placeholder:timesheets.page.optional"></label>
            <datalist id="eProjects"></datalist>
            <label><span data-i18n="timesheets.page.rate">時給</span> <input id="eRate" inputmode="decimal" placeholder="80.00"></label>
            <label><span data-i18n="timesheets.page.currency">通貨</span> <input id="eCurrency" maxlength="3" autocomplete="off" spellcheck="false"></label>
            <label class="wide check"><input id="eBillable" type="checkbox"> <span data-i18n="timesheets.page.billable">請求対象：この時間を顧客に請求する</span></label>
          </div>
          <button type="submit" hidden data-i18n="timesheets.page.save">保存</button>
        </form>
        <div class="toolbar actions">
          <button type="button" class="btn primary" id="eSave" data-i18n="timesheets.page.save">保存</button>
          <button type="button" class="btn" id="eCopy" hidden data-i18n="timesheets.page.again">今日もう一度記録</button>
          <button type="button" class="btn danger" id="eDelete" hidden data-i18n="timesheets.page.delete">削除…</button>
        </div>
      </section>

      <section class="view" id="view-bill" role="tabpanel" aria-labelledby="tab-bill" hidden>
        <p class="note" id="bNone" hidden data-i18n="timesheets.page.none">請求対象の時間はありません。顧客の時間を記録し、「請求対象」をオンにしてください。</p>
        <p class="msg ok" id="bDone" hidden></p>
        <div id="bForm" class="card">
          <div class="toolbar">
            <label><span data-i18n="timesheets.page.customer">顧客</span> <select id="bCustomer"></select></label>
            <label><span data-i18n="timesheets.page.tax">税率 %</span> <input id="bTax" type="text" inputmode="decimal" maxlength="6" autocomplete="off"></label>
            <button type="button" class="btn small" id="bAll" data-i18n="timesheets.page.tick_all">すべて選択または選択解除</button>
          </div>
          <div class="bill-rows" id="bRows"></div>
          <p class="note" id="bEmpty" hidden data-i18n="timesheets.page.no_time">この顧客には請求待ちの時間がありません。</p>
          <div class="toolbar"><p class="note" id="bTotal" role="status"></p>
            <button type="button" class="btn primary" id="bMake" data-i18n="timesheets.page.make">下書きの請求書を作成</button></div>
          <p class="note" data-i18n="timesheets.page.bill_note">各入力は下書きの請求書の 1 行になり、お支払い条件に従った期限が設定されます。Slop Invoices で確認して発行してください。</p>
        </div>
      </section>
    </main>
  </div>
