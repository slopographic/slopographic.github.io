<body>
  <div class="app">
    <div class="smb-hold" hidden>
      <!-- File › Samples (the menu bar runs these; they are not in the toolbar) -->
      <button type="button" class="btn" id="oSample" data-i18n="biz.sample.one">Random sample</button>
      <button type="button" class="btn" id="oSamples" data-i18n="biz.sample.many">Random samples…</button>
      <button type="button" class="btn danger" id="oDelSamples" data-i18n="biz.sample.del_all">Delete all samples</button>
      <a id="ordAbout" href="/ja/orders/about/" data-i18n="biz.app.about">About</a>
      <button type="button" class="tb-btn" id="ordCmd" data-cmd="cmd.palette" aria-label="コマンドを検索" title="Search commands (Ctrl+K)" data-i18n-attr="aria-label:ui.cmd.search;title:biz.app.cmd_tip">⌘K</button>
    </div>


    <nav class="tabs" role="tablist" aria-label="注文書のセクション" data-i18n-attr="aria-label:orders.page.sections">
      <button type="button" role="tab" class="tab" id="tab-list" data-view="list" aria-controls="view-list" aria-selected="true" data-i18n="orders.app.name">注文書</button>
      <button type="button" role="tab" class="tab" id="tab-edit" data-view="edit" aria-controls="view-edit" aria-selected="false" hidden data-i18n="orders.page.order">注文書</button>
      <button type="button" role="tab" class="tab" id="tab-delivery" data-view="delivery" aria-controls="view-delivery" aria-selected="false" hidden data-i18n="orders.page.delivery">納品書</button>
      <button type="button" role="tab" class="tab" id="tab-data" data-view="data" aria-controls="view-data" aria-selected="false" data-i18n="biz.tab.data">Data</button>
    </nav>

    <main class="main" id="main">
      <span class="local-badge" title="顧客、注文書、在庫はこのブラウザーに保存されます。何もアップロードされません。" data-i18n-attr="title:orders.page.local_tip"><span data-i18n="biz.app.local">100% local</span></span>
      <div id="boot" class="boot" role="status" data-i18n="orders.page.opening">注文書を開いています…</div>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="toolbar">
          <label class="search"><span class="sr" data-i18n="orders.page.search">注文書を検索</span>
            <input id="oSearch" type="search" placeholder="番号、顧客、メモを検索" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:orders.page.search_ph"></label>
          <label><span data-i18n="orders.page.status">ステータス</span> <select id="oStatus">
            <option value="all" data-i18n="orders.page.all">すべて</option><option value="draft" data-i18n="orders.page.draft">下書き</option><option value="open" data-i18n="orders.page.confirmed">確定済み</option>
            <option value="fulfilled" data-i18n="orders.page.fulfilled">出荷済み</option><option value="cancelled" data-i18n="orders.page.cancelled">キャンセル済み</option>
          </select></label>
          <button type="button" class="btn primary" id="oNew" data-i18n="orders.page.new">新規注文書</button>
        </div>
        <p class="note" id="oSummary" role="status"></p>
        <div class="table" id="oRows"></div>
      </section>

      <section class="view" id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
        <div class="ws-stage">
        <div class="head-row">
          <button type="button" class="btn small" id="eBack" data-i18n="orders.page.back">← 注文書</button>
          <h2 class="h2" id="eTitle" data-i18n="orders.page.new">新規注文書</h2>
          <span class="chip" id="eStatus"></span>
        </div>
        <p class="msg" id="eMsg" role="status"></p>
        <div class="toolbar" id="eModes"></div>
        <div class="toolbar" id="eLayout"></div>
        <div id="ePage" class="page-wrap"></div>
        </div>
        <aside class="ws-panel" aria-label="注文書の詳細" data-i18n-attr="aria-label:orders.page.details">
        <form class="card" id="eForm" novalidate data-form-only>
          <div class="form-grid">
            <label class="wide"><span data-i18n="orders.page.customer">顧客</span>
              <span class="inline"><select id="eCustomer"></select><button type="button" class="btn" id="eNewCustomer" data-i18n="orders.page.new_customer">新規顧客</button></span>
            </label>
            <label><span data-i18n="orders.page.date">日付</span> <input id="eDate" type="date" required></label>
            <label><span data-i18n="orders.page.currency">通貨</span> <input id="eCurrency" type="text" readonly tabindex="-1"></label>
            <label class="wide"><span data-i18n="orders.page.notes">メモ</span> <textarea id="eNotes" rows="2" maxlength="5000"></textarea></label>
          </div>
        </form>
        <h2 class="h2" data-form-only data-i18n="orders.page.lines">明細</h2>
        <div id="eLines" class="lines" data-form-only></div>
        <div class="toolbar" data-form-only><button type="button" class="btn" id="eAddLine" data-i18n="orders.page.add_line">明細を追加</button></div>
        <div class="card totals" id="eTotals" aria-live="polite" data-form-only></div>
        <p class="note" id="eInvoice"></p>
        <div class="toolbar actions" id="eActions"></div>
        </aside>
      </section>

      <section class="view" id="view-delivery" role="tabpanel" aria-labelledby="tab-delivery" hidden></section>


      <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data" hidden>
        <div class="card">
          <h2 class="h2" data-i18n="orders.page.backup">完全バックアップ</h2>
          <p class="note" data-i18n="orders.page.backup_note">バックアップには、このブラウザーの共有業務データのすべて（顧客、商品、注文書、請求書、支払い、在庫、元帳）が含まれます。</p>
          <div class="toolbar"><button type="button" class="btn primary" id="dBackup" data-i18n="orders.page.dl_backup">完全バックアップをダウンロード</button></div>
          <div class="file"><button type="button" class="btn" id="dRestore" data-i18n="orders.page.restore">バックアップファイルから復元…</button></div>
          <ul class="report" id="dRestoreMsg" aria-live="polite"></ul>
        </div>
      </section>
    </main>
