<body>
  <div class="smb-hold" hidden>
    <span class="local-badge" title="録音とファイルは、このデバイスで文字に起こされます。アップロードは一切ありません。" data-i18n-attr="title:transcribe.app.local_tip"><span data-i18n="transcribe.app.local">100% ローカル</span></span>
  </div>
  <main class="tr-app">
    <section class="tr-intro">
      <div>
        <h1 data-i18n="transcribe.app.title">音声を文字に</h1>
        <p class="tr-lede" data-i18n="transcribe.app.lede">声を録音するか、MP3、WAV、M4A、動画ファイルを追加します。Whisper がこのデバイスで音声をテキストに変換します。修正してから、テキスト、Word、または字幕として保存できます。</p>
        <div id="trSteps" class="tr-steps"></div>
      </div>
      <div id="trFlow" class="tr-flow"></div>
    </section>

    <div id="gate" class="tr-gate" aria-live="polite"></div>

    <!-- View · Panel (shared/frame): the files and the transcript; recording, the language, saving and Transcribe on the right -->
    <section id="trUi" class="tr-ui" hidden>
      <div class="tr-main" id="trView">
      <div class="tr-add">
        <div id="trDrop" class="tr-drop"></div>
        <p id="trMsg" class="tr-msg" role="status" aria-live="polite"></p>
      </div>

      <div class="tr-work">
        <section class="tr-list" aria-labelledby="trListHead">
          <div class="tr-head"><h2 id="trListHead" data-i18n="transcribe.app.files">ファイル</h2><span id="trCount" class="tr-count"></span><button type="button" id="trClear" data-i18n="transcribe.app.clear">クリア</button></div>
          <ol id="trFiles" class="tr-files" aria-label="文字起こしするファイル" data-i18n-attr="aria-label:transcribe.app.files_aria"></ol>
          <p id="trEmpty" class="tr-empty" data-i18n="transcribe.app.empty">ファイルはまだありません。上にドロップするか、「録音」を押してください。</p>
        </section>
        <section class="tr-pane" aria-labelledby="trPaneTitle">
          <div class="tr-head"><h2 id="trPaneTitle">Transcript</h2></div>
          <p id="trPaneMeta" class="tr-meta"></p>
          <div class="tr-tools" role="toolbar" aria-label="文字起こし" data-i18n-attr="aria-label:transcribe.app.transcript">
            <label class="tr-check"><input type="checkbox" id="trTimes"><span data-i18n="transcribe.app.times"> 時間を表示</span></label>
          </div>
          <div id="trSuggest" class="tr-suggest" aria-live="polite" hidden></div>
          <p id="trEdited" class="tr-edited" hidden><span data-i18n="transcribe.app.edited">修正内容は「テキスト」と「Word」に保持されます。 </span><button type="button" id="trRevert" data-i18n="transcribe.app.revert">修正を元に戻す</button></p>
          <textarea id="trText" class="tr-text" spellcheck="true" aria-label="文字起こしのテキスト" placeholder="ここに文字起こしが表示されます。" data-i18n-attr="aria-label:transcribe.app.text_aria;placeholder:transcribe.app.text_ph"></textarea>
        </section>
      </div>
      </div>
      <aside class="tr-side" id="trSide" aria-label="録音、言語、保存" data-i18n-attr="aria-label:transcribe.app.side">
        <div class="tr-controls" id="trRecGroup">
          <button type="button" id="trRecord" class="tr-rec" data-i18n="transcribe.app.record">録音</button>
          <span id="trRecTime" class="tr-rectime" hidden>00:00:00</span>
        </div>
        <div class="tr-lang" id="trLangGroup"><span id="trLangHead" data-i18n="transcribe.app.lang">言語とモデル</span>
          <button type="button" id="trModel" class="tr-modelbtn" aria-haspopup="dialog" aria-describedby="trLangHead">Detect automatically · Whisper tiny</button>
        </div>
        <label class="sf-field" id="trFormatField"><span class="sf-lab" data-i18n="transcribe.app.format">ファイル形式</span><select id="trFormat"></select></label>
        <button type="button" id="trDownload" data-i18n="transcribe.app.download">ダウンロード</button>
        <button type="button" id="trCopy" data-i18n="transcribe.app.copy">コピー</button>
        <button type="button" id="trDrive" data-i18n="transcribe.app.drive">Slop Drive に保存</button>
        <button type="button" id="trDocs" data-i18n="transcribe.app.docs">Slop Docs で開く</button>
        <button type="button" id="trRun" class="ai-pri">Transcribe</button>
        <button type="button" id="trStop" hidden data-i18n="transcribe.app.stop">停止</button>
      </aside>
    </section>
