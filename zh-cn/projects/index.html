      <section class="view" id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline" hidden>

        </div>
        <div class="tl-wrap">
          <div class="tl" id="tl"></div>
          <aside class="tl-side" id="tlSide" aria-label="没有日期的任务" data-i18n-attr="aria-label:projects.page.undated"></aside>

        <p class="note pkeys" data-i18n="projects.page.tl_keys">拖动条形即可移动，拖动其两端即可更改日期。选中条形后：方向键移动一天，Shift 加方向键更改结束日期。</p>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
