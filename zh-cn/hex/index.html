<body>
  <div class="hx-app" id="hx-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn sui-primary" id="hx-open" title="从此计算机打开文件（Ctrl+O）" data-i18n-attr="title:hex.app.open_tip" data-i18n="hex.app.open">打开</button>
      <button type="button" class="sui-btn" id="hx-drive" title="从 Slop Drive 打开文件" data-i18n-attr="title:hex.app.drive_tip" data-i18n="hex.app.drive">从云端硬盘打开</button>
      <button type="button" class="sui-btn" id="hx-save" title="将新版本保存到 Slop Drive（Ctrl+S）" data-i18n-attr="title:hex.app.save_tip" data-i18n="hex.app.save">保存版本</button>
      <button type="button" class="sui-btn" id="hx-saveas" title="以新文件的形式保存到 Slop Drive" data-i18n-attr="title:hex.app.saveas_tip" data-i18n="hex.app.saveas">另存为新文件</button>
      <button type="button" class="sui-btn" id="hx-dl" title="下载到此计算机" data-i18n-attr="title:hex.app.dl_tip" data-i18n="ui.download">下载</button>
      <button type="button" class="sui-btn" id="hx-cmd" aria-label="命令（搜索所有命令）" data-i18n-attr="aria-label:hex.app.cmd_aria" data-i18n="hex.app.cmd">命令</button>
      <button type="button" class="sui-btn" id="hx-menu" aria-haspopup="menu" data-i18n="hex.app.menu">菜单</button>
    </div>

    <div id="hx-tabs" class="doctabs-host"></div>
    <div id="hx-drop" class="hx-dropstrip"></div>

    <div class="hx-bar" role="toolbar" aria-label="跳转和查找" data-i18n-attr="aria-label:hex.app.bar_aria">
      <form class="hx-go" id="hx-goform">
        <input type="text" id="hx-goto" placeholder="偏移量，例如 0x4D2" aria-label="跳转到偏移量" data-i18n-attr="placeholder:hex.app.goto_ph;aria-label:hex.app.goto_aria" autocomplete="off" spellcheck="false">
        <button type="submit" class="sui-btn" data-i18n="hex.app.go">转到</button>
      </form>
      <form class="hx-find" id="hx-findform">
        <select id="hx-mode" aria-label="查找方式" data-i18n-attr="aria-label:hex.app.find_as">
          <option value="hex" data-i18n="hex.app.mode_hex">十六进制字节</option>
          <option value="text" data-i18n="hex.app.mode_text">文本</option>
        </select>
        <input type="text" id="hx-q" placeholder="4D 5A 或 文本" aria-label="查找" data-i18n-attr="placeholder:hex.app.find_ph;aria-label:hex.app.find_aria" autocomplete="off" spellcheck="false">
        <button type="button" class="sui-btn" id="hx-prev" title="查找上一个（Shift+F3）" data-i18n-attr="title:hex.app.prev_tip" data-i18n="hex.app.prev">上一个</button>
        <button type="submit" class="sui-btn" id="hx-next" title="查找下一个（F3）" data-i18n-attr="title:hex.app.next_tip" data-i18n="hex.app.next">下一个</button>
      </form>
      <span class="hx-status" id="hx-status" role="status" aria-live="polite"></span>
    </div>

    <dl class="hx-info" id="hx-info" hidden>
      <div class="hx-file"><dt data-i18n="hex.app.i_file">文件</dt><dd class="hx-name" id="hx-name" aria-live="polite"></dd></div>
      <div><dt data-i18n="hex.app.i_size">大小</dt><dd id="hx-size"></dd></div>
      <div><dt data-i18n="hex.app.i_type">类型</dt><dd id="hx-type"></dd></div>
      <div class="hx-wide"><dt>SHA-256</dt><dd><span id="hx-sha" class="hx-mono"></span> <button type="button" class="sui-btn hx-mini" id="hx-sha-btn" hidden data-i18n="hex.app.recalc">重新计算</button></dd></div>
      <div><dt data-i18n="hex.app.i_sel">选区</dt><dd id="hx-sel"></dd></div>
    </dl>

    <div class="hx-body" id="hx-body">
    <main class="hx-main" id="hx-main">
      <div class="hx-empty" id="hx-empty">
        <p class="hx-empty-t" data-i18n="hex.app.empty_t">打开任意文件以查看其字节。</p>
        <p class="hx-empty-s" data-i18n="hex.app.empty_s">将文件拖放到此处，从此计算机打开文件，或从 Slop Drive 中选择文件。不会上传任何内容。</p>
        <div class="hx-empty-b">
          <button type="button" class="sui-btn sui-primary" id="hx-open2" data-i18n="hex.app.open2">打开文件</button>
          <button type="button" class="sui-btn" id="hx-drive2" data-i18n="hex.app.drive2">从 Slop Drive 打开</button>
        </div>
      </div>
      <div class="hx-scroll" id="hx-scroll" tabindex="0" role="region" aria-label="文件字节" data-i18n-attr="aria-label:hex.app.bytes_aria" hidden>
        <div class="hx-spacer" id="hx-spacer"></div>
        <div class="hx-rows" id="hx-rows"></div>
      </div>
    </main>
    <aside class="hx-side" id="hx-side" aria-label="检查器" data-i18n-attr="aria-label:hex.app.inspector"></aside>
    </div>
  </div>
