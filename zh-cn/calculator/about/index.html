        <p>Slopculator 是一款会保留计算纸带的计算器，记录你算过的每一步。它支持括号、百分比、幂、根和单位，以及你自行输入汇率的货币换算。它还能进行日期和时间计算，例如 2026-01-31 + 1 个月。你可以将计算结果保存到 Slop Drive，或将日期结果添加到 Slop Calendar。不上传任何内容。</p>
