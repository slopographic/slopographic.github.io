  <div class="cd-app" id="cd-app">
    <header class="cd-top">
      <button type="button" class="sui-btn cd-files-btn" id="cd-files" aria-controls="cd-tree" aria-expanded="false" data-i18n="code.app.files">文件</button>
      <div class="cd-brand"><a class="brand" href="/zh-cn/" title="Slopographic 首页" aria-label="Slopographic 首页" data-i18n-attr="title:ui.mb.home;aria-label:ui.mb.home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a><h1>Slop Code</h1></div>
      <div class="cd-tools" role="toolbar" aria-label="文件和运行" data-i18n-attr="aria-label:code.app.bar_aria">
        <button type="button" class="sui-btn" id="cd-open" title="从 Slop Drive 打开（Ctrl+O）" data-i18n-attr="title:code.app.open_tip" data-i18n="menu.open">打开</button>
        <button type="button" class="sui-btn" id="cd-new" title="新建文件（Ctrl+Alt+N）" data-i18n-attr="title:code.app.new_tip" data-i18n="code.app.new">新建</button>
        <button type="button" class="sui-btn sui-primary" id="cd-save" title="保存到同一个 Slop Drive 文件（Ctrl+S）" data-i18n-attr="title:code.app.save_tip" data-i18n="menu.save" disabled>保存</button>
        <button type="button" class="sui-btn" id="cd-saveas" title="另存为（Ctrl+Shift+S）" data-i18n-attr="title:code.app.saveas_tip" data-i18n="code.app.saveas" disabled>另存为</button>
        <button type="button" class="sui-btn" id="cd-md" title="显示渲染后的 Markdown 预览" data-i18n-attr="title:code.app.md_tip" aria-pressed="false" hidden>Preview</button><!-- i18n-ignore: js/ui.js writes Preview or Edit -->
        <button type="button" class="sui-btn" id="cd-run" title="运行预览（Ctrl+Enter）" data-i18n-attr="title:code.app.run_tip" data-i18n="code.app.run" disabled>运行</button>
        <button type="button" class="sui-btn cd-cmd" id="cd-cmd" aria-label="命令（搜索所有命令）" data-i18n-attr="aria-label:code.app.cmd_aria" data-i18n="code.app.cmd">命令</button>
      </div>
    </header>

    <aside class="cd-tree" id="cd-tree" aria-label="资源管理器" data-i18n-attr="aria-label:code.app.explorer">
      <section class="cd-sec cd-sec-grow" data-sec="explorer" id="cd-sec-explorer">
        <div class="cd-sec-head">
          <button type="button" class="cd-sec-toggle" data-sec-toggle="explorer" aria-controls="cd-sec-explorer-body" aria-expanded="true" data-i18n="code.app.explorer">资源管理器</button>
          <span class="cd-sec-tools">
            <button type="button" class="sui-btn cd-mini" id="cd-tree-new" title="新建文件（Ctrl+Alt+N）" data-i18n-attr="title:code.app.new_tip" data-i18n="code.app.file">文件</button>
            <button type="button" class="sui-btn cd-mini" id="cd-tree-folder" title="新建文件夹（Ctrl+Alt+Shift+N）" data-i18n-attr="title:code.app.folder_tip" data-i18n="code.app.folder">文件夹</button>
          </span>
        </div>
        <div class="cd-sec-body" id="cd-sec-explorer-body"><div class="cd-tree-list" id="cd-tree-list" aria-label="Slop Drive 文件" data-i18n-attr="aria-label:code.app.drive_files"></div></div>
      </section>
      <section class="cd-sec" data-sec="open" id="cd-sec-open">
        <div class="cd-sec-head"><button type="button" class="cd-sec-toggle" data-sec-toggle="open" aria-controls="cd-sec-open-body" aria-expanded="true" data-i18n="code.app.open_editors">已打开的编辑器</button></div>
        <div class="cd-sec-body" id="cd-sec-open-body"><ul class="cd-open-list" id="cd-open-list" aria-label="已打开的编辑器" data-i18n-attr="aria-label:code.app.open_editors"></ul></div>
      </section>
      <section class="cd-sec" data-sec="ext" id="cd-sec-ext">
        <div class="cd-sec-head"><button type="button" class="cd-sec-toggle" data-sec-toggle="ext" aria-controls="cd-sec-ext-body" aria-expanded="true" data-i18n="code.app.extensions">扩展</button></div>
        <div class="cd-sec-body" id="cd-sec-ext-body"><ul class="cd-ext-list" id="cd-ext-list" aria-label="内置辅助工具" data-i18n-attr="aria-label:code.app.helpers"></ul></div>
      </section>
      <div class="cd-resize" id="cd-resize" data-touch-hit role="separator" aria-orientation="vertical" aria-label="调整资源管理器大小" aria-valuemin="160" aria-valuemax="480" aria-valuenow="232" tabindex="0" title="拖动或使用方向键调整大小" data-i18n-attr="aria-label:code.app.resize;title:code.app.resize_tip"></div>
    </aside>

    <main class="cd-main">
      <div class="cd-tabs" id="cd-tabs" role="tablist" aria-label="已打开的文件" data-i18n-attr="aria-label:code.app.open_files"></div>
      <section class="cd-empty" id="cd-empty" aria-label="开始使用" data-i18n-attr="aria-label:code.app.get_started">
        <h2 data-i18n="code.app.empty_h">从 Slop Drive 打开文件</h2>
        <p data-i18n="code.app.empty_p">选择要编辑的文件，或新建一个。编辑内容会在保存前自动保存在此设备上；“保存”会写回同一个 Slop Drive 文件。</p>
        <div class="cd-empty-actions">
          <button type="button" class="sui-btn sui-primary" id="cd-empty-open" data-i18n="code.cmd.open">从 Slop Drive 打开…</button>
          <button type="button" class="sui-btn" id="cd-empty-new" data-i18n="code.cmd.new">新建文件…</button>
        </div>
        <p class="cd-fine" data-i18n="code.app.keys">Ctrl+O 打开 · Ctrl+S 保存 · Ctrl+F 查找 · Ctrl+Enter 运行 · Ctrl+Space 补全</p>
      </section>
      <div class="cd-editor" id="cd-editor" hidden></div>
      <div class="cd-viewer" id="cd-viewer" hidden></div>
      <div class="cd-status" id="cd-status" aria-live="polite"></div>
    </main>

    <section class="cd-preview" id="cd-preview" aria-label="预览" data-i18n-attr="aria-label:code.app.preview" hidden>
      <div class="cd-pv-head">
        <b data-i18n="code.app.preview">预览</b><span class="cd-pv-note" data-i18n="code.app.sandboxed">沙盒运行，无网络</span>
        <button type="button" class="sui-btn" id="cd-pv-close" data-i18n="menu.close">关闭</button>
      </div>
      <iframe class="cd-frame" id="cd-frame" sandbox="allow-scripts" title="预览输出" data-i18n-attr="title:code.app.pv_output"></iframe>
      <div class="cd-console-head" data-i18n="code.app.console">控制台</div>
      <ol class="cd-console" id="cd-console" aria-live="polite" aria-label="控制台输出" data-i18n-attr="aria-label:code.app.console_out"></ol>
    </section>
  </div>
