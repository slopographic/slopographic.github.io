<body>
  <div class="qr-app">
    <div class="qr-bar" id="qr-bar"></div>

    <!-- View · Panel (shared/frame): the live preview, and the editor with PNG at the panel's foot on the right -->
    <div class="qr-work" id="qr-work">
      <aside class="qr-left" id="qr-edit" aria-label="编辑二维码" data-i18n-attr="aria-label:qr.app.edit_label">
        <div class="qr-tabs" role="tablist" aria-label="编辑部分" data-i18n-attr="aria-label:qr.app.sections_label" id="qr-tabs">
          <button type="button" role="tab" class="qr-tab" id="qr-tab-templates" data-view="templates" aria-controls="qr-panel-templates" aria-selected="false" tabindex="-1"></button>
          <button type="button" role="tab" class="qr-tab" id="qr-tab-content" data-view="content" aria-controls="qr-panel-content" aria-selected="true" tabindex="0"></button>
          <button type="button" role="tab" class="qr-tab" id="qr-tab-design" data-view="design" aria-controls="qr-panel-design" aria-selected="false" tabindex="-1"></button>
          <button type="button" role="tab" class="qr-tab" id="qr-tab-logo" data-view="logo" aria-controls="qr-panel-logo" aria-selected="false" tabindex="-1"></button>
          <button type="button" role="tab" class="qr-tab" id="qr-tab-raw" data-view="raw" aria-controls="qr-panel-raw" aria-selected="false" tabindex="-1"></button>
          <button type="button" role="tab" class="qr-tab qr-tab-batch" id="qr-tab-batch" data-view="batch" aria-controls="qr-panel-batch" aria-selected="false" tabindex="-1"></button>
        </div>

        <div class="qr-panel" role="tabpanel" id="qr-panel-templates" aria-labelledby="qr-tab-templates" hidden>
          <p class="qr-note" data-i18n="qr.app.tpl_note">选择一个模板以填写其字段。每个模板都使用标准卡片或公开链接格式。请替换其中的占位内容。</p>
          <div class="qr-tpls" id="qr-templates"></div>
        </div>

        <div class="qr-panel" role="tabpanel" id="qr-panel-content" aria-labelledby="qr-tab-content">
          <label class="sui-field"><span class="sui-label" data-i18n="qr.app.name_label">名称（用于文件名和打印页面）</span>
            <input class="sui-input" id="qr-name" type="text" maxlength="80" placeholder="前门" data-i18n-attr="placeholder:qr.app.name_ph" autocomplete="off"></label>
          <div class="qr-kinds" id="qr-kinds" role="group" aria-label="二维码类型" data-i18n-attr="aria-label:qr.app.kinds_label"></div>
          <div class="qr-form" id="qr-form"></div>
        </div>

        <div class="qr-panel" role="tabpanel" id="qr-panel-design" aria-labelledby="qr-tab-design" hidden>
          <div id="qr-design"></div>
        </div>

        <div class="qr-panel" role="tabpanel" id="qr-panel-logo" aria-labelledby="qr-tab-logo" hidden>
          <div id="qr-logo"></div>
        </div>

        <div class="qr-panel" role="tabpanel" id="qr-panel-raw" aria-labelledby="qr-tab-raw" hidden>
          <label class="qr-label" for="qr-raw" data-i18n="qr.app.raw_label">编码文本</label>
          <textarea class="sui-input qr-raw" id="qr-raw" rows="8" spellcheck="false" aria-describedby="qr-raw-note"></textarea>
          <p class="qr-note" id="qr-raw-note"></p>
          <div class="qr-row">
            <button type="button" class="sui-btn" id="qr-raw-reset" data-i18n="qr.app.raw_reset">重新使用表单</button>
            <button type="button" class="sui-btn" id="qr-copy" disabled data-i18n="qr.app.copy_text">复制文本</button>
          </div>
        </div>

        <div class="qr-panel" role="tabpanel" id="qr-panel-batch" aria-labelledby="qr-tab-batch" hidden>
          <label class="qr-label" for="qr-batch-in" data-i18n="qr.app.batch_label">每行一段文本</label>
          <textarea class="sui-input qr-batch-in" id="qr-batch-in" rows="6" spellcheck="false" placeholder="https://example.com
票号 0001
票号 0002" data-i18n-attr="placeholder:qr.app.batch_ph"></textarea>
          <div class="qr-row">
            <button type="button" class="sui-btn sui-primary" id="qr-batch-go" data-i18n="qr.app.batch_go">生成二维码</button>
            <span class="qr-note" id="qr-batch-note" role="status" aria-live="polite"></span>
          </div>
          <div class="qr-grid" id="qr-grid"></div>
        </div>
      </aside>

      <main class="qr-right" id="qr-view" aria-label="实时预览" data-i18n-attr="aria-label:qr.app.preview_label">
        <div class="qr-stage" id="qr-stage">
          <img class="qr-img" id="qr-img" alt="二维码预览" data-i18n-attr="alt:qr.app.preview_alt" hidden>
          <p class="qr-off" id="qr-off" data-i18n="qr.app.empty">填写表单，或选择一个模板。输入时二维码会显示在此处。</p>
        </div>
        <p class="qr-meta" id="qr-meta" aria-live="polite"></p>
        <p class="qr-err" id="qr-err" role="alert"></p>
        <p class="qr-note qr-hint" data-i18n="qr.app.hint">将图片拖到其他应用中，或使用页眉中的“复制到剪贴板”。保存到 Slop Drive 会保留设置，因此可通过“从 Slop Drive 打开”再次编辑该二维码。</p>
      </main>
    </div>
  </div>
