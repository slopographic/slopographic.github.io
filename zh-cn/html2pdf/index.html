<body>
  <div class="h2p-app">
    <div class="smb-hold" hidden>
      <button type="button" class="sui-btn" id="h2p-open" data-i18n="html2pdf.app.open">打开 HTML…</button>
    </div>
    <span class="local-badge" title="HTML 在此浏览器中读取和打印。不会上传任何内容。" data-i18n-attr="title:html2pdf.app.local_tip" data-i18n="html2pdf.app.local">100% 本地处理</span>

    <!-- View · Panel (shared/frame): the preview, and the options with Print at the foot of the panel on the right -->
    <div class="h2p-main" id="h2p-main">
      <aside class="h2p-side" id="h2p-side" aria-label="选项" data-i18n-attr="aria-label:html2pdf.app.options">
        <button type="button" class="sui-btn sui-primary" id="h2p-print" disabled data-i18n="html2pdf.app.print">打印或另存为 PDF…</button>
        <section class="h2p-group" data-title="Source" data-key="html2pdf.group.source">
          <p class="h2p-note" data-i18n="html2pdf.source.note">远程图片和字体不会加载。文件内的图片（data: 和 blob:）可以加载。若要加载文件旁的图片，请在下方按文件名附加。</p>
          <label class="h2p-field"><span data-i18n="html2pdf.source.paste">粘贴 HTML</span>
            <textarea class="h2p-input" id="h2p-paste" rows="5" spellcheck="false" placeholder="<h1>Paste HTML here</h1>" data-i18n-attr="placeholder:html2pdf.source.paste_ph"></textarea>
          </label>
          <button type="button" class="sui-btn" id="h2p-use-paste" data-i18n="html2pdf.source.use_paste">使用已粘贴的 HTML</button>
          <button type="button" class="sui-btn" id="h2p-images" data-i18n="html2pdf.source.attach">附加本地图片…</button>
          <p class="h2p-note" id="h2p-image-list">No local images attached.</p>
        </section>

        <section class="h2p-group" data-title="Paper" data-key="html2pdf.group.paper">
          <label class="h2p-field"><span data-i18n="html2pdf.paper.size">纸张尺寸</span>
            <select class="h2p-input" id="h2p-paper">
              <option value="A4" selected>A4</option>
              <option value="Letter">Letter</option>
              <option value="A5">A5</option>
              <option value="Legal">Legal</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.orientation">方向</span>
            <select class="h2p-input" id="h2p-orient">
              <option value="portrait" selected data-i18n="html2pdf.paper.portrait">纵向</option>
              <option value="landscape" data-i18n="html2pdf.paper.landscape">横向</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.margins">页边距</span>
            <select class="h2p-input" id="h2p-margin">
              <option value="normal" selected data-i18n="html2pdf.paper.normal">普通（15 毫米）</option>
              <option value="narrow" data-i18n="html2pdf.paper.narrow">窄（6 毫米）</option>
              <option value="none" data-i18n="html2pdf.paper.none">无</option>
            </select>
          </label>
          <label class="h2p-field"><span data-i18n="html2pdf.paper.scale">缩放</span>
            <select class="h2p-input" id="h2p-scale">
              <option value="fit" selected data-i18n="html2pdf.paper.fit">适合宽度</option>
              <option value="100" data-i18n="html2pdf.paper.full">100%</option>
            </select>
          </label>
          <label class="h2p-check"><input type="checkbox" id="h2p-bg"> <span data-i18n="html2pdf.paper.bg">背景图形</span></label>
        </section>

        <section class="h2p-group" data-title="Page header" data-key="html2pdf.group.header">
          <label class="h2p-check"><input type="checkbox" id="h2p-header" checked> <span data-i18n="html2pdf.header.show">显示在每一页上</span></label>
          <label class="h2p-field"><span data-i18n="html2pdf.header.qr">二维码显示</span>
            <select class="h2p-input" id="h2p-qr-mode">
              <option value="file" selected data-i18n="html2pdf.header.qr_file">文件名</option>
              <option value="url" data-i18n="html2pdf.header.qr_url">我输入的网址</option>
              <option value="text" data-i18n="html2pdf.header.qr_text">自定义文本</option>
            </select>
          </label>
          <label class="h2p-field"><span id="h2p-qr-label">Custom text</span>
            <input type="text" class="h2p-input" id="h2p-qr-text" autocomplete="off" disabled>
          </label>
        </section>
      </aside>

      <main class="h2p-stage" id="h2p-stage" aria-label="预览" data-i18n-attr="aria-label:html2pdf.app.preview">
        <div class="h2p-empty" id="h2p-empty">
          <h2 data-i18n="html2pdf.app.drop_title">将 HTML 文件拖放到此处</h2>
          <p data-i18n="html2pdf.app.drop_text">或打开一个文件，或将 HTML 粘贴到“源”下。文件在此浏览器中读取，从不上传。</p>
          <button type="button" class="sui-btn sui-primary" id="h2p-open-empty" data-i18n="html2pdf.app.open">打开 HTML…</button>
        </div>
        <div class="h2p-paper-box" id="h2p-paper-box" hidden>
          <iframe class="h2p-paper" id="h2p-paper-frame" title="打印预览" data-i18n-attr="title:html2pdf.app.preview_title" sandbox="allow-same-origin"></iframe>
        </div>
      </main>
    </div>

    <p class="h2p-status" id="h2p-status" role="status" aria-live="polite"></p>
  </div>
