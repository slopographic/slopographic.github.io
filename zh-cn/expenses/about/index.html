        <h2 id="about-title">关于 Slop Expenses</h2>
        <p>Slop Expenses 记录你的企业支出：供应商、类别、已付金额和可抵扣的税费。每笔支出都直接进入与发票相同的账簿，因此总账、试算平衡表和报表都会包含它。摘要会显示本月和本年的支出以及可抵扣的税费，CSV 导出可直接用于电子表格或会计。错误记录只会作废，不会删除，因此账簿会保留其历史。所有内容都保留在此浏览器中，不上传任何内容。</p>
