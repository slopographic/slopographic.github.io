      <div id="boot" class="boot" role="status" data-i18n="quotes.page.opening">正在打开你的报价单…</div>

      <section class="view" id="view-list" role="tabpanel" aria-labelledby="tab-list" hidden>
        <div class="toolbar">
          <label class="search"><span class="sr" data-i18n="quotes.page.search">搜索报价单</span>

          <label><span data-i18n="quotes.page.status">状态</span> <select id="qStatus">

            <option value="expired" data-i18n="quotes.page.expired">已过期</option><option value="accepted" data-i18n="quotes.page.accepted">已接受</option><option value="declined" data-i18n="quotes.page.declined">已拒绝</option>
          </select></label>
          <button type="button" class="btn primary" id="qNew" data-i18n="quotes.page.new">新建报价单</button>

        <p class="note" id="qSummary" role="status"></p>
        <div class="table" id="qRows"></div>
      </section>

      <section class="view" id="view-edit" role="tabpanel" aria-labelledby="tab-edit" hidden>
        <div class="ws-stage">

          <button type="button" class="btn small" id="eBack" data-i18n="quotes.page.back">← 报价单</button>

          <span class="chip" id="eStatus"></span>
        </div>
        <p class="msg" id="eMsg" role="status"></p>
        <div class="toolbar" id="eModes"></div>
        <div class="toolbar" id="eLayout"></div>
        <div id="ePage" class="page-wrap"></div>
        </div>
        <aside class="ws-panel" aria-label="报价单详情" data-i18n-attr="aria-label:quotes.page.details">
        <form class="card" id="eForm" novalidate data-form-only>
          <div class="form-grid">
            <label class="wide"><span data-i18n="quotes.page.customer">客户</span>
              <span class="inline"><select id="eCustomer"></select><button type="button" class="btn" id="eNewCustomer" data-i18n="quotes.page.new_customer">新建客户</button></span>
            </label>
            <label><span data-i18n="quotes.page.date">日期</span> <input id="eDate" type="date" required></label>
            <label><span data-i18n="quotes.page.valid_until">有效期至</span> <input id="eValid" type="date"></label>
            <label><span data-i18n="quotes.page.currency">货币</span> <input id="eCurrency" type="text" readonly tabindex="-1"></label>
            <label class="wide"><span data-i18n="quotes.page.notes">备注</span> <textarea id="eNotes" rows="2" maxlength="5000" placeholder="范围、条款、不包括的内容" data-i18n-attr="placeholder:quotes.page.notes_ph"></textarea></label>
          </div>
        </form>
        <h2 class="h2" data-form-only data-i18n="quotes.page.lines">明细</h2>
        <div id="eLines" class="lines" data-form-only></div>
        <div class="toolbar" data-form-only><button type="button" class="btn" id="eAddLine" data-i18n="quotes.page.add_line">添加明细</button></div>
        <div class="card totals" id="eTotals" aria-live="polite" data-form-only></div>
        <p class="note" id="eLinks"></p>
        <div class="toolbar actions" id="eActions"></div>
        </aside>
      </section>

      <section class="view" id="view-data" role="tabpanel" aria-labelledby="tab-data" hidden>
        <div class="card">
          <h2 class="h2" data-i18n="quotes.page.backup">完整备份</h2>
          <p class="note" data-i18n="quotes.page.backup_note">备份包含此浏览器中共享业务数据的全部记录：客户、产品、报价单、订单、发票、付款、费用、库存和账簿。</p>
          <div class="toolbar"><button type="button" class="btn primary" id="dBackup" data-i18n="quotes.page.dl_backup">下载完整备份</button></div>
          <div class="file"><button type="button" class="btn" id="dRestore" data-i18n="quotes.page.restore">从备份文件恢复…</button></div>
          <ul class="report" id="dRestoreMsg" aria-live="polite"></ul>
        </div>
      </section>
