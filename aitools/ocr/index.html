    <a class="ai-crumb" href="../" data-i18n="aitools.page.crumb">AI Tools</a><span class="ai-sep" aria-hidden="true">/</span><h1 data-i18n="aitools.tool.ocr_name">OCR</h1>
  </header>
  <div class="ai-tool">
    <div id="gate" class="ai-stack" aria-live="polite"></div>
    <section id="ui" class="ai-stack" hidden>
      <div id="drop" class="ai-drop" tabindex="0"><span data-i18n="aitools.ocr.drop">Drop an image or a PDF here, or </span><button type="button" id="chooseFile" class="ai-choose" data-i18n="aitools.page.choose_file">choose a file</button></div>
      <div class="ai-field" data-side="settings"><label for="page" data-i18n="aitools.ocr.page">PDF page (PDFs only)</label><input id="page" type="number" min="1" value="1"></div>
      <p id="fileName" class="ai-meta"></p>
      <div><button id="run" class="ai-pri" type="button" disabled data-side="main" data-i18n="aitools.ocr.run">Read text</button> <button id="lang" type="button" data-side="settings" data-i18n="aitools.ocr.lang">Language and model</button></div>
      <progress id="prog" class="ai-progress" value="0" max="1" hidden></progress>
      <p id="msg" class="ai-meta" role="status"></p>
      <div id="suggest"></div>
      <textarea id="out" class="ai-out" aria-label="Recognised text" placeholder="The text appears here. You can edit it before you copy or save it." data-i18n-attr="aria-label:aitools.ocr.out;placeholder:aitools.ocr.out_ph"></textarea>
      <div class="ai-act">
        <button id="copy" type="button" disabled data-side="save" data-i18n="aitools.ocr.copy">Copy</button>
        <button id="dl" type="button" disabled data-side="save" data-i18n="aitools.page.download_txt">Download .txt</button>
        <button id="docs" type="button" disabled data-side="save" data-i18n="aitools.ocr.docs">Send to Slop Docs</button>
      </div>
    </section>
  </div>
