<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex, nofollow"><script data-robots-guard>(function(h){if(["slopographic.com","www.slopographic.com","localhost","127.0.0.1","[::1]",""].indexOf(h)<0){var m=document.createElement('meta');m.name='robots';m.content='noindex';document.head.appendChild(m)}})(location.hostname)</script>
  <script src="../../shared/profile/profile.js" data-src="shared/profile/profile.js"></script>
  <script src="../../shared/theme/theme.js" data-app="aitools" data-src="shared/theme/theme.js"></script>
  <link rel="expect" href="#slop-built" blocking="render">
  <script src="../../shared/i18n/i18n.js" data-src="shared/i18n/i18n.js"></script>
  <script src="../i18n/index.js" data-src="aitools/i18n/index.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Denoise · Slop AI Tools</title>
  <meta name="description" content="Remove speckle and grain from a photo with median and bilateral filters. Compare before and after. Nothing uploaded.">
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../aitools.css">
  <link rel="stylesheet" href="../../shared/frame/frame.css">
  <link rel="stylesheet" href="../frame.css">
</head>
<body>
  <header class="ai-top">
    <a class="brand" href="../../" title="Slopographic home" aria-label="Slopographic home" data-i18n-attr="title:aitools.hub.home;aria-label:aitools.hub.home"><svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><path d="M16 2C16 2 6 13.5 6 20a10 10 0 0 0 20 0C26 13.5 16 2 16 2z"/></svg></a>
    <a class="ai-crumb" href="../" data-i18n="aitools.page.crumb">AI Tools</a><span class="ai-sep" aria-hidden="true">/</span><h1 data-i18n="aitools.tool.denoise_name">Denoise</h1>
  </header>
  <div class="ai-tool">
    <div id="gate" class="ai-stack" aria-live="polite"></div>
    <section id="ui" class="ai-stack" hidden>
      <div id="drop" class="ai-drop"><span data-i18n="aitools.denoise.drop">Drop a photo here, or </span><button type="button" id="chooseFile" class="ai-choose" data-i18n="aitools.page.choose_file">choose a file</button><br><span class="ai-meta" data-i18n="aitools.denoise.note">Classic filters, no model. Large photos are reduced to 2048 px for the preview and the download.</span></div>
      <div class="ai-grid2">
        <div class="ai-field" data-side="settings"><label for="mode" data-i18n="aitools.denoise.filter">Filter</label>
          <select id="mode"><option value="both" data-i18n="aitools.denoise.both">Median, then bilateral</option><option value="median" data-i18n="aitools.denoise.median">Median (speckle and dust)</option><option value="bilateral" data-i18n="aitools.denoise.bilateral">Bilateral (grain, keeps edges)</option></select></div>
        <div class="ai-field" data-side="settings"><label for="strength"><span data-i18n="aitools.denoise.strength">Strength: </span><span id="sv">50</span></label><input id="strength" type="range" min="0" max="100" value="50"></div>
      </div>
      <div><button id="run" class="ai-pri" type="button" disabled data-side="main" data-i18n="ui.apply">Apply</button> <span id="msg" class="ai-meta" role="status"></span></div>
      <div id="compare" class="ai-panel" hidden>
        <div class="ai-cmp" id="cmp">
          <canvas id="before" class="ai-img"></canvas>
          <canvas id="after" class="ai-img"></canvas>
        </div>
        <div class="ai-field"><label for="split" data-i18n="aitools.denoise.compare">Before and after. Drag to compare.</label><input id="split" type="range" min="0" max="100" value="50"></div>
      </div>
      <div class="ai-act"><button id="dl" type="button" disabled data-side="save" data-i18n="aitools.page.download_png">Download PNG</button></div>
    </section>
  </div>
  <style>.ai-cmp{position:relative}.ai-cmp #after{position:absolute;left:0;top:0;width:100%;height:auto;clip-path:inset(0 50% 0 0)}</style>
  <script src="../model-registry.js"></script>
  <script src="../support.js"></script>
  <script src="../common.js"></script>
  <script src="filters.js"></script>
  <script src="../../shared/intake/rules.js"></script>
  <script src="../../shared/intake/normalize.js"></script>
  <script src="../../shared/intake/pipeline.js"></script>
  <script src="../../shared/intake/intake.js"></script>
  <script src="../../shared/intake/sources.js"></script>
  <script src="../intake.js"></script>
  <script src="denoise.js"></script>
  <script src="../../shared/ui/sheet.js"></script>
  <script src="../../shared/ui/menubutton.js"></script>
  <script src="../../shared/ui/resize-panel.js"></script>
  <script src="../../shared/frame/frame.js"></script>
  <script src="../../shared/frame/panel.js"></script>
  <script src="../frame.js"></script>
  <script src="../../shell/shell.js"></script>
<i id="slop-built" hidden></i>
</body>
</html>
