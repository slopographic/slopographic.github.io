  <!-- View · Panel (shared/frame, js/layout.js): the report in the middle; the report picker, its definition and Export CSV (i18n-ignore)
       in the panel on the right (a bottom sheet on a phone, its footer always on screen; i18n-ignore) -->
  <main class="rp-main" id="rpMain">
    <div class="rp-view" id="rpView">
      <p class="rp-lead" data-i18n="reports.page.lead">Berichte über Kontakte, Rechnungen, Ausgaben, das Hauptbuch und CRM. Nur lesend: Hier wird nichts an den Datensätzen geändert.</p>
      <p id="data-note" class="rp-note" hidden></p>
      <p id="report-note" class="rp-sub"></p>
      <section id="results" class="rp-results" aria-live="polite"></section>
    </div>
    <aside class="rp-panel" id="rpPanel" aria-label="Bericht" data-i18n-attr="aria-label:reports.page.report">
      <section class="rp-bar rp-pick" id="rpPick" aria-label="Bericht" data-i18n-attr="aria-label:reports.page.report">
        <label for="report" data-i18n="reports.page.report">Bericht</label>
        <select id="report"></select>
        <button id="new" type="button" data-i18n="reports.page.new">Neuer Bericht</button>
        <button id="edit" type="button" data-i18n="reports.page.edit">Bearbeiten</button>
        <button id="delete" type="button" hidden data-i18n="reports.page.delete">Löschen</button>
      </section>
      <section id="editor" class="rp-editor" aria-label="Berichtsdefinition" hidden data-i18n-attr="aria-label:reports.page.definition">
        <label for="json" data-i18n="reports.page.json">Berichtsdefinition (JSON)</label>
        <textarea id="json" spellcheck="false" rows="16"></textarea>
        <p id="err" class="rp-err" role="alert"></p>
        <div class="rp-bar">
          <button id="save" type="button" data-i18n="reports.page.save">Bericht speichern</button>
          <button id="cancel" type="button" data-i18n="reports.page.cancel">Abbrechen</button>
        </div>
      </section>
      <button id="csv" type="button" class="sui-btn" data-i18n="reports.page.csv">CSV exportieren</button>
    </aside>
  </main>
