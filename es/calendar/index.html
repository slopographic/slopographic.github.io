  <div class="app">
    <div class="smb-hold" hidden>
      <a id="cAbout" href="/es/calendar/about/" data-i18n="biz.app.about">About</a>
      <button type="button" class="tb-btn" id="cCmd" data-cmd="cmd.palette" aria-label="Buscar comandos" title="Search commands (Ctrl+K)" data-i18n-attr="aria-label:ui.cmd.search;title:biz.app.cmd_tip">⌘K</button>
    </div>


    <div class="toolbar" role="toolbar" aria-label="Calendario" data-i18n-attr="aria-label:calendar.app.name">
      <span class="local-badge" title="Tu calendario se queda en este navegador. No se sube nada." data-i18n-attr="title:calendar.page.local_tip"><span data-i18n="biz.app.local">100% local</span></span>
      <button type="button" class="btn" id="cPrev" aria-label="Periodo anterior" title="Anterior (flecha izquierda)" data-i18n-attr="aria-label:calendar.page.prev;title:calendar.page.prev_tip">‹</button>
      <button type="button" class="btn" id="cToday" title="Hoy (T)" data-i18n-attr="title:calendar.page.today_tip" data-i18n="calendar.page.today">Hoy</button>
      <button type="button" class="btn" id="cNext" aria-label="Periodo siguiente" title="Siguiente (flecha derecha)" data-i18n-attr="aria-label:calendar.page.next;title:calendar.page.next_tip">›</button>
      <h2 id="cTitle" aria-live="polite"></h2>
      <div class="seg" role="group" aria-label="Vista" data-i18n-attr="aria-label:calendar.page.view">
        <button type="button" data-view="year" aria-pressed="false" title="Año (Y)" data-i18n-attr="title:calendar.page.year_tip" data-i18n="calendar.page.year">Año</button>
        <button type="button" data-view="month" aria-pressed="true" title="Mes (M)" data-i18n-attr="title:calendar.page.month_tip" data-i18n="calendar.page.month">Mes</button>
        <button type="button" data-view="week" aria-pressed="false" title="Semana (W)" data-i18n-attr="title:calendar.page.week_tip" data-i18n="calendar.page.week">Semana</button>
        <button type="button" data-view="day" aria-pressed="false" title="Día (D)" data-i18n-attr="title:calendar.page.day_tip" data-i18n="calendar.page.day">Día</button>
        <button type="button" data-view="split" aria-pressed="false" title="Dividida (S)" data-i18n-attr="title:calendar.page.split_tip" data-i18n="calendar.page.split">Dividida</button>
        <button type="button" data-view="agenda" aria-pressed="false" title="Agenda (A)" data-i18n-attr="title:calendar.page.agenda_tip" data-i18n="calendar.page.agenda">Agenda</button>
      </div>
      <select id="cSplit" hidden aria-label="Paneles de la vista dividida" title="Los dos paneles de la vista dividida" data-i18n-attr="aria-label:calendar.page.panes;title:calendar.page.panes_tip">
        <option value="month-day" data-i18n="calendar.page.month_day">Mes y día</option>
        <option value="month-week" data-i18n="calendar.page.month_week">Mes y semana</option>
        <option value="week-day" data-i18n="calendar.page.week_day">Semana y día</option>
      </select>
      <label><input type="checkbox" id="cTasks"> <span data-i18n="calendar.page.todos">Pendientes</span></label>
      <label><span class="tb-lbl" data-i18n="calendar.page.show_in">Mostrar las horas en</span> <select id="cZone" aria-label="Mostrar las horas en esta zona horaria" data-i18n-attr="aria-label:calendar.page.zone_aria"></select></label>
      <button type="button" class="btn primary" id="cNew" title="Nuevo evento (N)" data-i18n-attr="title:calendar.page.new_tip" data-i18n="calendar.page.new">Nuevo evento</button>
      <button type="button" class="btn" id="cImport" data-i18n="calendar.page.import">Importar .ics</button>
      <button type="button" class="btn" id="cExport" data-i18n="calendar.page.export">Exportar .ics</button>
      <button type="button" class="btn" id="cConfig" aria-haspopup="menu" data-i18n="calendar.page.config">Ajustes</button>
    </div>

    <div class="cal-body" id="cBody">
    <main class="main" id="main">
      <p id="cNote" class="note" role="status"></p>
      <div id="cBoot" class="empty" role="status" data-i18n="calendar.page.opening">Abriendo tu calendario…</div>
      <div id="cView"></div>
    </main>
    <aside class="cal-side" id="cSide" aria-label="Día" data-i18n-attr="aria-label:calendar.page.day"></aside>
    </div>
